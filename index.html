<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 ADP Board &mdash; Sleeper vs Winks / Yahoo / ESPN</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#242c38;--txt:#e6edf3;--dim:#8b949e;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{padding:11px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
h1{margin:0 0 4px;font-size:17px;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.srcbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}
.src{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.src b{font-weight:800}
.src.ok{background:#10241a;border-color:#1f5138;color:#79d69f}
.src.warn{background:#2a2113;border-color:#5a4620;color:#e0b060}
.src.pend{background:#141a22;color:#6e7681}
.src.stat{background:#151a26;border-color:#2f3a52;color:#9aa8c4}
#refresh{padding:3px 10px;font-size:11px}
#refresh:disabled{opacity:.45;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px}
input[type=search]{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;width:180px;font-size:13px}
button{background:#0b0f14;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:hover{color:var(--txt)}
.legend{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11px;color:var(--dim)}
.ramp{width:190px;height:12px;border-radius:6px;background:linear-gradient(90deg,#d0342c,#e8736a,#2b323d,#54c47f,#0f9d4f)}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
/* The two-tab strip is gone: Sleeper publishes one metric, so there is one view. A static
   caption naming the baseline sits where the tabs used to. */
.tabnote{padding:9px 16px 8px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
     background:var(--bg);color:var(--txt);font-size:12.5px;font-weight:700;letter-spacing:.2px;
     position:relative;top:1px}
.tabnote span{display:block;font-weight:500;font-size:10.5px;opacity:.75;letter-spacing:0;color:var(--dim)}
/* The table takes whatever height the header leaves. This used to be
   calc(100vh - 152px), which silently broke every time the header wrapped to a
   different number of lines - i.e. exactly as the window got squished. dvh also
   keeps mobile browser chrome from cropping the last row. */
.wrap{overflow:auto;flex:1 1 auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th{position:sticky;top:0;background:#1b222c;z-index:20;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
   padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
th.l{text-align:left}
th .hd{cursor:pointer}
th .hd:hover{color:var(--txt)}
th .ar{opacity:.5;font-size:9px}
.dbtn{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;cursor:pointer;
      font-size:10px;color:#6e7681;background:#0b0f14}
.dbtn:hover{color:var(--txt);border-color:#3d4756}
.dbtn.act{background:#1f6feb;border-color:#1f6feb;color:#fff}
td{padding:5px 10px;text-align:right;border-bottom:1px solid #1a212b;white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
tbody tr[data-n]{cursor:pointer}
tr:hover td{background:#1a2029}
#unhide,#undo{border-color:#3d4756;color:#9aa8c4}
#unhide:hover,#undo:hover{color:#fff;border-color:#5a6a80}
#undo{background:#1b2430;border-color:#48566b;color:#d6e2f2}
#undo i{font-style:normal;font-weight:700;color:#9dc4ff;margin-left:3px}
.ply{display:flex;align-items:center;gap:9px}
/* Square and frameless: no circle crop and no ring, so the headshot reads as sitting on the
   row rather than in a chip. The transparent PNG blends into the row background. */
.av{width:40px;height:40px;border-radius:4px;flex:0 0 40px;overflow:hidden}
/* ESPN headshots are 600x436 with transparent margins; crop to the face, not the empty top */
.av img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.av.lg img{object-fit:contain;padding:3px}
.nm{font-weight:600;display:block;line-height:1.25}
/* name on top, then team and the position pill on their own line */
.who{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.sub{display:flex;align-items:center;gap:6px}
.meta{color:var(--dim);font-size:11px}
.slot{color:#6e7681;font-size:11px}
.pos{display:inline-block;min-width:30px;text-align:center;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700}
.QB{background:#4a1f36;color:#ff9ecb}   /* pink   */
.RB{background:#4a2c12;color:#ffb066}   /* orange */
.WR{background:#12324d;color:#79c0ff}   /* blue   */
.TE{background:#123f39;color:#5fe0c0}   /* teal   */
.K{background:#362a52;color:#c2a8ff}    /* purple */
.DST{background:#453f0f;color:#f2d75e}  /* yellow */
.stack{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.cell{display:inline-block;min-width:76px;padding:4px 8px;border-radius:5px;font-weight:700;font-size:13px}
.d{font-size:11px;opacity:.95;margin-left:5px;font-weight:700}
.pr{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;color:#7d8794;margin-top:2px;
    padding:1px 5px;border-radius:4px;min-width:38px;text-align:center}
.hl{color:#fff}
.hl .alt{color:#e2ecff;opacity:.85}
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;color:#fff}
/* one hue per consensus score, evenly stepped on the wheel: blue - indigo - purple */
.chip.c2{background:rgb(31,111,235)}
.chip.c3{background:rgb(138,74,226)}
.ramp2{width:80px;height:12px;border-radius:6px}
.na{color:#4d5560}
.alt{color:#6e7681;font-size:11px;margin-left:5px}
/* column order: Avg of 3 | Player | Sleeper | [Winks Yahoo ESPN]
   dividers close the average, the player block and the ESPN block */
th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2),
th:nth-child(3), td:nth-child(3){border-right:2px solid #34404f}
/* ESPN sits against the player column, so read it left-aligned */
th:nth-child(3), td:nth-child(3){text-align:left}
th.c, td.c{text-align:center;white-space:nowrap}
.stack.ctr{align-items:center}
.rd{font-size:9.5px;font-weight:700;letter-spacing:.3px;color:#6e7681;margin-left:5px;vertical-align:middle}
/* the pick on the clock: a tall blue block that runs down to the top of the table */
.pickbox{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:104px;margin-right:10px;padding:5px 14px 7px;border-radius:8px 8px 0 0;
  background:#1f6feb;position:relative;top:1px;line-height:1.1}
.pickbox b{font-size:30px;font-weight:800;letter-spacing:-.5px;color:#fff}
.pickbox span{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#cfe0ff;margin-top:1px}
.pickbox i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.4px;color:#9dc4ff;margin-top:2px}
/* the # + round.pick that used to be its own column now leads the player cell */
.seq{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:34px;line-height:1.15;margin-right:2px}
.seq b{font-size:12.5px}
.seq i{font-style:normal;font-size:10px;color:#6e7681}
/* the three site columns are reference, not the headline: dial them back and pack them tight,
   pinning their width so the slack goes to the player column instead of between them */
th.site{color:#6b7482;font-size:10px;width:72px;padding-left:5px;padding-right:5px;text-align:center}
td.site{padding-left:5px;padding-right:5px;text-align:center}
/* Full column width, as it always was - shrinking it to content made the chips tiny. The
   centring lives inside the chip instead: it fills the cell and the number sits centred in it.
   Still dialled back a touch: these columns are reference, not the headline. */
td.site .cell{font-weight:600;font-size:12px;min-width:0;width:100%;padding:3px 5px;opacity:.88;text-align:center}
td.site .d{font-size:10px;font-weight:600;margin-left:3px}
td.site .pr{font-size:9px;opacity:.75;min-width:0;padding:1px 3px}
td.site .stack{width:100%}
th .sm{display:none}
.rndsep td{border-bottom:2px solid #3d4b5c}
tr.rd td{background:#111721;border-top:2px solid #3d4b5c;border-bottom:1px solid #1f2732;
  padding:5px 10px;text-align:left;font-size:10px;font-weight:800;letter-spacing:1.1px;color:#8fa3bd;text-transform:uppercase}
tr.rd:hover td{background:#111721}
tr.rd .pk{color:#5c6675;font-weight:600;letter-spacing:.4px;margin-left:8px;text-transform:none}
tr.rd.first td{border-top:none}
tr.rd.soft td{background:#0f141b;color:#5c6675;letter-spacing:.4px}
tr.rd.soft:hover td{background:#0f141b}
tr.rd.bare td{padding:0;height:0;background:none;border-bottom:none}
tr.rd.tierband td{background:#141c17;color:#8fbd9f;border-top-color:#3f5a49}
tr.rd.tierband:hover td{background:#141c17}
.cliff{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:3px;font-size:9.5px;font-weight:700;
   letter-spacing:.3px;background:#3a2a12;color:#f0b45f;text-transform:uppercase;white-space:nowrap}
tfoot td{color:var(--dim);font-size:11px;text-align:left;padding:12px 10px;white-space:normal;line-height:1.65}

/* ------------------------------------------------------------- narrow ---
   Below 1024px the board drops to three columns: the consensus average, the
   player, and Winks. ESPN gives up its slot here rather than Winks doing so -
   Winks is the closest full-PPR read available, and the ESPN baseline is still
   in every number on screen because each site cell shows its gap to it. The
   chrome condenses so as much of the board as possible is on screen at once
   with no sideways scrolling. A tighter phone layout follows below. */
@media (max-width: 1024px){
  th.site, td.site{display:none}
  /* ...except Winks, which takes ESPN's slot rather than being dropped alongside the
     other three. It is the closest full-PPR read on the board, and ESPN has not really
     left: the +/- on the Winks cell IS the gap to ESPN, and the consensus hue that used
     to sit on the baseline cell moves to the Avg cell's left edge (see --hl on each row). */
  th.site.wk, td.site.wk{display:table-cell}
  th.base, td.base{display:none}
  th.c, td.c{width:132px}
  td.c{border-left:3px solid var(--hl,transparent)}
  table{min-width:0}
  th:nth-child(3), td:nth-child(3){border-right:none}

  header{padding:8px 12px 0}
  .bar{margin-top:8px;gap:6px}
  input[type=search]{width:150px;padding:5px 9px;font-size:12px}
  button{padding:5px 9px;font-size:11.5px}
  .legend{font-size:10px;gap:6px}
  .tabs{margin-top:8px}
  .tabnote{padding:6px 12px 5px;font-size:12px}
  .tabnote span{display:none}
  .pickbox{min-width:86px;margin-right:8px;padding:3px 12px 5px}
  .pickbox b{font-size:23px}
  .pickbox span{font-size:9px;letter-spacing:1px}
  .pickbox i{font-size:10px}

  /* tighter rows so more of the board is visible per screen */
  th{padding:5px 8px;font-size:10px}
  td{padding:2px 8px;font-size:12px}
  .av,.av img{width:34px;height:34px;flex-basis:34px}
  .ply{gap:7px}
  .nm{font-size:12.5px}
  .meta{font-size:10px}
  .pos{min-width:26px;font-size:9.5px}
  .seq{min-width:30px}
  .seq b{font-size:11.5px}
  .seq i{font-size:9px}
  .cell{padding:2px 7px;font-size:12px;min-width:62px}
  .d{font-size:10px}
  .pr{font-size:9px;min-width:32px}
  .rd{font-size:9px;margin-left:4px}
  .cliff{display:none}
  tr.rd td{padding:2px 8px;font-size:9px}
}

/* --------------------------------------------------------------- phone ---
   At this width the board is three columns: the consensus average, the player,
   and Winks. Everything else is chrome, so the chrome gives up its space first.
   Target is no sideways scrolling at 360px with the name still readable. */
@media (max-width: 640px){
  header{padding:7px 10px 0}
  .bar{gap:5px;margin-top:7px}
  /* search takes a row of its own so the seven position filters get a clean one */
  input[type=search]{flex:1 1 100%;width:auto;min-width:0;padding:6px 9px;font-size:12px}
  button{padding:5px 8px;font-size:11px}
  .legend{margin-left:0;gap:5px;font-size:10px}
  .legend > span:not([class]){display:none}   /* keep the chips, drop the caption */
  .tabs{margin-top:7px;gap:3px}
  .tabnote{padding:6px 10px 5px;font-size:11.5px}
  .pickbox{min-width:64px;margin-right:6px;padding:3px 9px 5px}
  .pickbox b{font-size:20px}
  .pickbox span{font-size:8px;letter-spacing:.7px}
  .pickbox i{font-size:9px}

  /* the short header labels finally earn their keep: "AVG" not "Avg rank (3)" */
  th .lg{display:none}
  th .sm{display:inline}

  th{padding:5px 6px;font-size:9.5px}
  td{padding:3px 6px;font-size:12px}
  th.site, td.site{width:62px;padding-left:3px;padding-right:3px}
  th.c, td.c{width:auto}
  /* The player block is two lines now, so it sets the row height and the average column no
     longer has to stack to stay short. The round readout sits beside the number again (it
     inherits the inline .rd from the block above) and the number box is wider. The extra
     width comes out of the player column, which has slack since the name moved to its own
     line and stopped clipping. */
  .cell{min-width:38px;padding:2px 6px;font-size:12px}
  .dbtn{margin-left:4px;padding:0 4px}
  .av,.av img{width:30px;height:30px;flex-basis:30px}
  .ply{gap:6px;min-width:0}
  .seq{min-width:24px;margin-right:0}
  .pos{min-width:22px;font-size:9px;padding:1px 3px}
  .nm{font-size:12px}
  .meta{font-size:9.5px}
  /* let the player column shrink and ellipsis instead of widening the table */
  td.l{max-width:0;width:100%}
  .who{min-width:0;max-width:100%}
  .who .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style></head><body>

</table></div>

let DATA = FALLBACK;
const CAP = 25;
const DEAD = 3;               // gaps under 3 picks count as 0 (no lean either way)
// Sleeper is the baseline; these three are what it gets compared against.
const KEYS = ["winks","yahoo","espn"];
let sortK="seq", asc=true, q="", filt="ALL";
const HIDDEN = new Set();     // players clicked off the board, keyed by name so they stay
                              // hidden across re-renders and live refreshes

function recompute(){
  DATA.forEach(r=>{
    // One view, keyed to Sleeper ADP. Yahoo and ESPN are ADP too, so those three are
    // apples-to-apples. Winks publishes rankings only - same scale, different thing - which
    // is why his column is labelled a rank and rendered as an integer.
    r.base = r.sleeper; r.basePr = r.slPr;
    r.v_winks = r.winks ?? null;
    r.v_yahoo = r.yahoo;
    r.v_espn  = r.espn;
    KEYS.forEach(k=>{ const v=r["v_"+k]; r["g_"+k] = (v===null||v===undefined) ? null : +(v-r.base).toFixed(1); });
    const ds = KEYS.map(k=>r["g_"+k]).filter(x=>x!==null);
    r.avgd = ds.length ? +(ds.reduce((a,b)=>a+b,0)/ds.length).toFixed(1) : null;
    r.g_avg = r.avgd;
    // market consensus: mean of the three sites' own numbers (= ESPN base + avg gap)
    const vs = KEYS.map(k=>r["v_"+k]).filter(x=>x!==null&&x!==undefined);
    r.avgV = vs.length ? +(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1) : null;
    // consensus score 0-3: how many of the three sites take him EARLIER than ESPN by at
    // least DEAD picks. Sites inside the dead zone, or later than ESPN, simply don't count.
    r.score = KEYS.reduce((s,k)=>{
      const g=r["g_"+k];
      return s + ((g !== null && g <= -DEAD) ? 1 : 0);
    }, 0);
    // positional-rank gaps
    const bp = prNum(r.basePr);
    r.pg_yahoo = prGap(bp, r.yaPr); r.pg_espn = prGap(bp, r.espnPr);
    r.pg_winks = prGap(bp, r.wkPr);
    const ps = [r.wkPr, r.yaPr, r.espnPr].map(prNum).filter(x=>x!==null);
    if(ps.length){
      const m = ps.reduce((a,b)=>a+b,0)/ps.length;
      r.avgPr = (r.pos==="DST"?"DEF":r.pos) + Math.round(m);
      r.pg_avgv = bp===null ? null : +(m-bp).toFixed(1);
    } else { r.avgPr = null; r.pg_avgv = null; }
  });
}
const prNum = s => s ? parseInt(String(s).replace(/[^0-9]/g,""),10) : null;
const prGap = (b,s) => { const v=prNum(s); return (b===null||v===null)?null:v-b; };

// ---- positional tiers -------------------------------------------------------
// Within each position, cut a new tier wherever the gap to the next player is large
// relative to where you are on the board: 4 picks between two RBs matters at pick 20
// and means nothing at pick 140, so the threshold scales with ADP. Any block that ends
// up bigger than MAXTIER is then split at its widest internal gap, so no "tier" is a
// 20-man blob you can't act on.
const TIER_THR = b => Math.max(3.5, Math.min(16, 0.10*b));
const MAXTIER = 7;
function computeTiers(){
  const byPos={};
  DATA.forEach(r=>{(byPos[r.pos]=byPos[r.pos]||[]).push(r);});
  Object.values(byPos).forEach(list=>{
    list.sort((a,b)=>a.base-b.base);
    const cuts = new Set();
    for(let i=1;i<list.length;i++)
      if(list[i].base-list[i-1].base >= TIER_THR(list[i-1].base)) cuts.add(i);
    for(let guard=0; guard<300; guard++){
      const bd=[0,...[...cuts].sort((a,b)=>a-b),list.length];
      let did=false;
      for(let b=0;b<bd.length-1;b++){
        const st=bd[b], en=bd[b+1];
        if(en-st > MAXTIER){
          let bi=-1,bg=-1;
          for(let i=st+1;i<en;i++){const g=list[i].base-list[i-1].base; if(g>bg){bg=g;bi=i;}}
          if(bi>0){cuts.add(bi); did=true;}
        }
      }
      if(!did) break;
    }
    let t=1;
    list.forEach((r,i)=>{ if(cuts.has(i)) t++; r.tier=t; });
    list.forEach((r,i)=>{
      const nxt = list[i+1];
      r.tierEnd  = !nxt || nxt.tier!==r.tier;
      r.tierDrop = (r.tierEnd && nxt) ? +(nxt.base-r.base).toFixed(1) : null;
      r.tierSize = list.filter(x=>x.tier===r.tier).length;
    });
  });
}
// gap = other site - ESPN. LOWER number there (goes earlier, market wants him more) => GREEN.
// Kept in one place because the sign convention is shared across the colour functions and has
// been inverted by accident before. This is what the site columns show BEFORE the draft starts,
// when a clock reading would be meaningless.
const GAP_RGB = d => d < 0 ? "15,157,79" : "208,52,44";
function color(d){
  if(d===null) return "";
  const t = Math.max(-1, Math.min(1, d/CAP));
  if(Math.abs(d) < DEAD) return "background:#2b323d;color:#c9d1d9";   // inside the dead zone
  const a = (0.30 + 0.70*Math.abs(t)).toFixed(3);
  return `background:rgba(${GAP_RGB(d)},${a});color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)`;
}
// ---- draft slot: turn any pick number or rank into round.pick for a 12-team board ----
const TEAMS = 12;
function slotOf(v){
  const rv = Math.max(1, Math.round(v));
  const r = Math.floor((rv-1)/TEAMS) + 1;
  const p = ((rv-1) % TEAMS) + 1;
  return {r, p, label: r + "." + String(p).padStart(2,"0")};
}
// round deltas are small integers, so they get their own tight scale
const PCAP = 3;
function pcolor(d){
  if(d===null) return "";
  const t = Math.max(-1, Math.min(1, d/PCAP));
  if(d===0) return "background:#2b323d;color:#c9d1d9";
  const a = (0.28 + 0.62*Math.abs(t)).toFixed(3);
  return `background:rgba(${t<0?"15,157,79":"208,52,44"},${a});color:#fff`;
}
// ESPN cell highlight, one hue per consensus score. With three comparison sites the top
// score is 3, so it takes the strongest hue: 2 is blue (216 deg), 3 is purple (265 deg).
// The indigo in between was the middle rung of a four-site scale and has nothing to sit on.
// Hue says how many sites agree; brightness says by how much. Intensity ramps from the dead-zone
// edge (3 picks, dim) to full saturation at CAP (25 picks), driven by the average gap.
// Scores 0 and 1 get no highlight - a single site disagreeing with ESPN isn't a signal.
const SCORE_RGB = {2:"31,111,235", 3:"138,74,226"};
function hlColor(r){
  const rgb = SCORE_RGB[r.score];
  if(!rgb) return null;
  const mag = r.avgd===null ? 0 : Math.abs(r.avgd);
  const t = Math.max(0, Math.min(1, (mag - DEAD) / (CAP - DEAD)));
  const a = (0.26 + 0.74*t).toFixed(3);
  const edgeA = Math.max(.62, +a).toFixed(3);   // 3px of colour needs a floor to read
  return {bg:`rgba(${rgb},${a})`, edge:`rgba(${rgb},${edgeA})`, rgb, a:+a};
}
// ADP reads to a decimal. Winks is an integer ranking, and rendering it as "3.0"
// implies a precision he never published.
const fmt  = v => v.toFixed(1);
const fmtR = v => String(Math.round(v));
// Site columns run the same draft-clock colour as the Avg column, each off its own number, so
// a green Sleeper cell means Sleeper's market has already passed him at the current pick. The
// small signed number stays the static gap to ESPN - that is the one thing these cells say
// that the colour does not. No round.pick line here; only the Avg column carries that.
function cell(r, v, cls, f){
  const td = `<td class="site${cls ? " " + cls : ""}">`;
  if(v===null||v===undefined) return td + '<span class="na">&mdash;</span></td>';
  const d = +(v - r.base).toFixed(1);
  const s = (d > 0 ? "+" : "") + d.toFixed(1);
  // Two states, and the handover is TAKEN going above zero. Before the draft starts a clock
  // reading says nothing - every number is ahead of pick 1 - so the cell shows its static gap
  // to Sleeper and the whole market is readable at a glance. Once players start coming off,
  // draftColor takes over and the column goes live. draftColor returns null while TAKEN is 0,
  // which is exactly the handover, so the order of this || chain IS the behaviour.
  const live = draftColor(r, v) || color(d) || "background:#2b323d;color:#c9d1d9";
  const tip = TAKEN === 0 ? `${s} vs Sleeper` : `vs pick ${PICK} &middot; ${s} vs Sleeper`;
  return `${td}<span class="cell" style="${live}" title="${tip}">${(f||fmt)(v)}<span class="d">${s}</span></span></td>`;
}
// ---- live draft position -> EVERY number column ----------------------------
// Once the draft is under way all five number columns carry the same live read, worked off the
// pick on the clock: PICK = players you've taken off the board + 1. The Avg column clocks the
// consensus average; each site column clocks its own number. So a green Sleeper cell and a red
// Yahoo cell on the same row means Sleeper's market has passed him and Yahoo's has not.
//
// Before the first pick the site columns show their static gap to ESPN instead, so the board is
// fully readable while you prep. The Avg column stays neutral there: its gap is the consensus-
// vs-ESPN number, which was tried as a dot and then as the column divider and read as noise
// both times. It is in the tooltip.
//   below the pick        -> GREEN   he has slid past his market price, he's there for you
//   pick .. pick+7        -> grey    going about on schedule
//   pick+8 and beyond     -> RED     not due yet
//
// YELLOW overrides green/grey when ESPN's own number is still more than WAIT picks away. Those
// are the players the consensus says are due now but that ESPN's room won't touch for a while -
// buried far enough down ESPN's board that nobody there is reaching for them. You can wait. Once
// the clock gets within WAIT of his ESPN number the override lifts and grey/green resume.
// Red is left alone: if the consensus doesn't have him due either, "wait" is not the message.
// Neutral until the draft is underway, since at pick 1 almost everything would be red.
let TAKEN = 0, PICK = 1;
const GREY_END = 8, WAIT = 10;
// v is the number being clocked - the consensus average for the Avg column, that site's own
// number for each of the three site columns. Everything else is identical, so all four number
// columns answer the same question: is he due yet, against the pick actually on the clock.
function draftColor(r, v){
  const val = v === undefined ? r.avgV : v;
  if(TAKEN === 0 || val === null || val === undefined) return null;
  const d = val - PICK;                    // clock for whichever number this is
  if(d >= GREY_END){
    const a = (0.45 + 0.55*Math.min(1, (d-GREY_END)/CAP)).toFixed(3);
    return `background:rgba(208,52,44,${a})`;
  }
  // Measured against SLEEPER's own number, because Sleeper is the room you are drafting in:
  // how far down its board a player sits is what decides whether anyone there reaches for him.
  // This read ESPN back when ESPN was the platform.
  if(r.base - PICK > WAIT) return "background:rgba(230,180,40,.92)";
  if(d < 0){
    const a = (0.45 + 0.55*Math.min(1, -d/CAP)).toFixed(3);
    return `background:rgba(15,157,79,${a})`;
  }
  return "background:#4a5464";
}
function avgCell(r){
  if(r.avgV===null) return '<td class="c"><span class="na">&mdash;</span></td>';
  const shown = r.avgV.toFixed(1);
  const sl = slotOf(r.avgV);
  // number = live draft position; the static gap to ESPN is in the tooltip
  const live = draftColor(r) || "background:#2b323d;color:#c9d1d9";
  const gapT = r.avgd===null ? "" : " · " + (r.avgd>0?"+":"") + r.avgd.toFixed(1) + " vs ESPN";
  return `<td class="c">`
       + `<span class="cell" style="${live}" title="vs pick ${PICK}${gapT}">${shown}</span>`
       + `<span class="rd">rd ${sl.r}</span></td>`;
}
function render(){
  TAKEN = HIDDEN.size;                    // how deep into the draft we are
  PICK  = TAKEN + 1;                      // the pick actually on the clock
  const pe = document.getElementById("pick"), ps = document.getElementById("picksl");
  const pr = document.getElementById("pickrd");
  if(pe) pe.textContent = PICK;
  if(pr) pr.textContent = "Round " + slotOf(PICK).r;
  if(ps) ps.textContent = slotOf(PICK).label;
  const rows = DATA.filter(r=>!HIDDEN.has(r.name) &&
      (filt==="ALL" || r.pos===filt) &&
      (q===""||r.name.toLowerCase().includes(q)||r.team.toLowerCase().includes(q)));
  const s = rows.slice().sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    if(x===null||x===undefined) return 1;
    if(y===null||y===undefined) return -1;
    if(typeof x==="string") return asc?x.localeCompare(y):y.localeCompare(x);
    return asc?x-y:y-x;
  });
  // Set preserves insertion order, so the last entry is the most recent pick
  const last = HIDDEN.size ? [...HIDDEN][HIDDEN.size-1] : null;
  const un = document.getElementById("undo");
  if(un){
    un.style.display = last ? "" : "none";
    un.innerHTML = last ? "&#8630; Undo <i>" + last + "</i>" : "";
    un.title = last ? "Put " + last + " back on the board" : "";
  }
  const ub = document.getElementById("unhide");
  if(ub){
    ub.style.display = HIDDEN.size ? "" : "none";
    ub.innerHTML = "<b>" + HIDDEN.size + "</b> off the board &middot; restore all";
  }
  // header labels are static now that there is only one view
  // bands of 12 always. In true draft order they are real rounds and get labelled as such;
  // once sorted or filtered they are just groups of 12 in the current view, labelled honestly.
  const natural = (sortK==="seq" && asc && filt==="ALL" && q==="");
  // one position selected and in board order => the meaningful bands are tiers, not rounds
  const tierView = (filt!=="ALL" && sortK==="seq" && asc && q==="");
  document.getElementById("b").innerHTML = s.map((r,i)=>{
    let div = "";
    if(tierView){
      if(i===0 || s[i-1].tier!==r.tier){
        const n = s.filter(x=>x.tier===r.tier).length;
        div = `<tr class="rd tierband${i===0?" first":""}"><td colspan="7">`
            + `${r.pos==="DST"?"DEF":r.pos} &middot; Tier ${r.tier}`
            + `<span class="pk">${n} player${n===1?"":"s"} &middot; ${fmt(r.base)}&ndash;${fmt(s.filter(x=>x.tier===r.tier).slice(-1)[0].base)}</span></td></tr>`;
      }
    } else if(i % 12 === 0){
      // Rounds are read off the CURRENT view: in draft order these are the real rounds, and once
      // you sort, the sorted list is itself a board, so rows 1-12 are its round 1 and so on.
      const rd = i/12 + 1;
      div = `<tr class="rd${i===0?" first":""}${natural?"":" soft"}"><td colspan="7">Round ${rd}`
          + `<span class="pk">picks ${i+1}&ndash;${Math.min(i+12, s.length)}</span></td></tr>`;
    }
    const sep = tierView ? (r.tierEnd ? ' class="rndsep"' : '')
                         : (((i+1) % 12 === 0) ? ' class="rndsep"' : '');
    const hl = hlColor(r);
    return `${div}<tr${sep} data-n="${r.name}" style="--hl:${hl ? hl.edge : "transparent"}">
      ${avgCell(r)}
      <td class="l"><div class="ply">
          <span class="seq"><b>${r.seq}</b><i>${r.slot}</i></span>
          <span class="av${r.pos==="DST"?" lg":""}"><img src="${r.img}" alt="" decoding="async"
                onerror="this.style.visibility='hidden'"></span>
          <span class="who"><span class="nm">${r.name}</span>
          <span class="sub"><span class="meta">${r.team}</span><span class="pos ${r.pos}">${r.pos==="DST"?"DEF":r.pos}</span>
          ${r.tierEnd&&r.tierDrop!==null?`<span class="cliff">cliff &middot; next ${r.pos==="DST"?"DEF":r.pos} +${r.tierDrop}</span>`:""}</span></span>
        </div></td>
      <td class="base"><span class="cell${hl?" hl":""}" style="${hl?`background:${hl.bg}`:"background:none;padding-left:0"}"
            >${fmt(r.base)}</span></td>
      ${cell(r,r.v_winks,"wk",fmtR)}${cell(r,r.v_yahoo)}${cell(r,r.v_espn)}</tr>`;
  }).join("");
  document.querySelectorAll("th .ar").forEach(a=>a.remove());
  document.querySelectorAll("th .hd").forEach(hd=>{
    if(hd.dataset.k===sortK) hd.insertAdjacentHTML("beforeend",
      `<span class="ar"> ${asc?"&#9650;":"&#9660;"}</span>`);
  });
  document.querySelectorAll(".dbtn").forEach(d=>
    d.classList.toggle("act", sortK==="g_"+d.dataset.d));
}
document.querySelectorAll("th .hd").forEach(hd=>hd.onclick=()=>{
  const k=hd.dataset.k;
  if(k===sortK) asc=!asc; else {sortK=k; asc=true;}
  render();
});
// delta sort: first click = biggest EARLIER-elsewhere (most negative) on top, second = biggest LATER
document.querySelectorAll(".dbtn").forEach(d=>d.onclick=()=>{
  const k="g_"+d.dataset.d;
  if(sortK===k) asc=!asc; else {sortK=k; asc=true;}
  render();
});
document.querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("button[data-f]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filt=b.dataset.f; render();
});

// click a player row to take him off the board
document.getElementById("b").addEventListener("click", e=>{
  const tr = e.target.closest("tr");
  if(!tr || tr.classList.contains("rd")) return;
  const n = tr.dataset.n;
  if(!n) return;
  HIDDEN.add(n);
  render();
});
const unhide = document.getElementById("unhide");
unhide.onclick = ()=>{ HIDDEN.clear(); render(); };
// put the most recently taken player back; everything downstream recomputes in render()
const undoBtn = document.getElementById("undo");
undoBtn.onclick = ()=>{
  const arr = [...HIDDEN];
  if(!arr.length) return;
  HIDDEN.delete(arr[arr.length-1]);
  render();
};
// ctrl/cmd+Z does the same, since a misclick mid-draft wants the reflex to work
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && document.activeElement.tagName!=="INPUT"){
    e.preventDefault(); undoBtn.onclick();
  }
});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase().trim(); render();};

// ---------------------------------------------------------------------------
// live data
// ---------------------------------------------------------------------------
const norm = s => (s||"").toLowerCase().replace(/ d\/st$/,"").replace(/\./g,"").replace(/'/g,"")
  .replace(/\s+(jr|sr|ii|iii|iv|v)$/,"").replace(/[^a-z \-]/g,"").replace(/\s+/g," ").trim();
// Winks writes defenses as "Houston Texans", ESPN as "Texans D/ST", so DSTs key off the last word
const WTEAMS = new Set(["texans","rams","seahawks","broncos","eagles","jaguars","steelers","vikings",
  "patriots","ravens","chargers","packers","chiefs","cowboys","lions","giants","bengals","ers","titans",
  "bills","buccaneers","falcons","browns","saints","panthers","jets","dolphins","raiders","commanders",
  "cardinals","colts","bears"]);
function wkey(n){ const k=norm(n); const last=k.split(" ").pop(); return WTEAMS.has(last)?last:k; }

// Source state is still tracked (and logged) even though the status chips were removed from the
// header, so a fallback is still discoverable from the console rather than silently invisible.
const SRC = {sleeper:"pending", yahoo:"pending", espn:"pending",
             winks:"static Winks' published FULL-PPR top 300, updated 8/26"};
function setStatus(){
  const el = document.getElementById("srcs");
  if(el){
    const label = {live:"live", snapshot:"snapshot", pending:"…", static:"8/26"};
    const cls   = {live:"ok", snapshot:"warn", pending:"pend", static:"stat"};
    el.innerHTML = Object.keys(SRC).map(k=>{
      const v = SRC[k];
      const st = v.startsWith("live") ? "live" : v.startsWith("static") ? "static"
               : (v==="pending" ? "pending" : "snapshot");
      const name = k==="espn" ? "ESPN" : k[0].toUpperCase()+k.slice(1);
      return `<span class="src ${cls[st]}" title="${v}">${name} <b>${label[st]}</b></span>`;
    }).join("");
  }
  const stale = Object.keys(SRC).filter(k=>SRC[k].startsWith("snapshot"));
  if(stale.length) console.warn("ADP board: fell back to snapshot for", stale.join(", "), SRC);
}
async function grab(path){
  const r = await fetch(path, {cache:"no-store"});
  const j = await r.json();
  if(j.error || !j.players) throw new Error(j.error || "bad payload");
  return j;
}
async function loadLive(){
  const btn = document.getElementById("refresh");
  if(btn) btn.disabled = true;
  Object.keys(SRC).forEach(k=>{ if(k!=="winks") SRC[k]="pending"; }); setStatus();

  const [espn, sleeper, yahoo] = await Promise.all(
    ["/api/espn","/api/sleeper","/api/yahoo"].map(p=>grab(p).catch(e=>({error:String(e.message||e)})))
  );

  // Sleeper defines who is on the board, so without it we keep the snapshot entirely
  if(sleeper.error || !sleeper.players){
    Object.keys(SRC).forEach(k=>{ if(k!=="winks") SRC[k]="snapshot ("+(sleeper.error||"sleeper unavailable")+")"; });
    setStatus(); if(btn) btn.disabled=false; return;
  }
  SRC.sleeper = "live "+sleeper.pulled;

  const idx = j => { const m={}; if(j && j.players) j.players.forEach(p=>{const n=norm(p.name); if(!(n in m)) m[n]=p;}); return m; };
  const EI = idx(espn), Y = idx(yahoo);
  SRC.espn      = espn.error    ? "snapshot ("+espn.error+")"    : "live "+espn.pulled;
  SRC.yahoo     = yahoo.error   ? "snapshot ("+yahoo.error+")"   : "live "+yahoo.pulled;

  // fall back per-source, keyed by player name, so one dead source doesn't blank a column
  const FB = {}; FALLBACK.forEach(r=>FB[norm(r.name)]=r);

  // Sleeper also ranks defensive backs, fullbacks, linebackers and punters. Filter to the
  // positions this league actually drafts, or they take slots on the board.
  const POS = {QB:1, RB:1, WR:1, TE:1, K:1, DST:1};
  const board = sleeper.players.filter(x=>POS[x.pos]).slice(0,DEPTH).map(sp=>{
    const n = norm(sp.name), f = FB[n] || {};
    const P = sp.pos==="DST" ? "DEF" : sp.pos;
    const e = EI[n], y = Y[n];
    // This Sleeper endpoint publishes no player id, so headshots still come from the ESPN CDN,
    // keyed by ESPN id and joined on the normalised name. The baked id covers an ESPN outage;
    // a player ESPN does not carry at all gets no headshot and the img onerror hides it.
    const pid = e ? e.id : f.espnId;
    return {
      name:sp.name, pos:sp.pos, team:sp.team,
      img: sp.pos==="DST" ? `https://a.espncdn.com/i/teamlogos/nfl/500/${sp.team.toLowerCase()}.png`
                          : (pid ? `https://a.espncdn.com/i/headshots/nfl/players/full/${pid}.png` : ""),
      // the spine. Sleeper is live by definition here, or we returned above.
      sleeper: sp.adp, slPr: P+sp.pr, espnId: pid,
      // Winks is a published article, not a feed: always the baked top 300, keyed by name
      winks:   WINKS_MAP[wkey(sp.name)] ?? null,
      wkPr:    null,   // filled in below, once the whole board is known
      yahoo:   y ? y.adp : (yahoo.error ? (f.yahoo  ?? null) : null),
      yaPr:    y ? P+y.pr: (yahoo.error ? (f.yaPr   ?? null) : null),
      espn:    e ? e.adp : (espn.error  ? (f.espn   ?? null) : null),
      espnPr:  e ? P+e.prByAdp : (espn.error ? (f.espnPr ?? null) : null),
    };
  });

  // Winks positional rank, derived from his ordering across the players on this board
  const wc = {};
  board.filter(r=>r.winks).sort((a,b)=>a.winks-b.winks).forEach(r=>{
    wc[r.pos] = (wc[r.pos]||0) + 1;
    r.wkPr = (r.pos==="DST"?"DEF":r.pos) + wc[r.pos];
  });

  // the board arrives in Sleeper ADP order, so the sequence is just the index
  board.forEach((r,i)=>{ r.seq=i+1; r.slot=slotOf(i+1).label; });

  DATA = board;
  const pulledEl = document.getElementById("pulled");
  if(pulledEl) pulledEl.textContent = new Date(sleeper.pulled).toLocaleString();
  setStatus();
  recompute(); computeTiers(); render();
  if(btn) btn.disabled = false;
}
const rb = document.getElementById("refresh"); if(rb) rb.onclick = loadLive;

setStatus();
recompute(); computeTiers(); render();   // snapshot first, so the board is usable immediately
loadLive();
</script></body></html>
