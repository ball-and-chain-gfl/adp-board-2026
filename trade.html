<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#11161d;--line:#2a3340;--txt:#f0f4f8;--dim:#9ba8b6;--soft:#c5cfda;--blue:#2f81f7;
  --good:#4cc77f;--bad:#f0736a;--warn:#e6b450;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{padding:11px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);z-index:30;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.bar h1{margin:0;font-size:18px;letter-spacing:.2px}
.bar .rec{color:var(--dim);font-size:13.5px;font-weight:700}
.bar .dl{margin-left:auto;color:var(--dim);font-size:12.5px}
.bar .dl b{color:var(--txt)}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
.tab{padding:9px 16px 8px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;position:relative;top:1px;text-decoration:none}
.tab.on{background:var(--bg);color:var(--txt)}
a.tab{background:#0b0f14;color:var(--dim)}
a.tab:hover{color:var(--txt)}

/* section switch */
.sub{display:flex;gap:8px;padding:12px 20px 0;flex:none}
.sub button{font-size:14px;font-weight:700;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:#0b0f14;color:var(--dim);cursor:pointer;white-space:nowrap}
.sub button:hover{color:var(--txt)}
.sub button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sub button span{font-weight:600;opacity:.8;margin-left:4px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 16px;overflow-y:auto}
#msg{color:var(--dim);padding:40px 0;text-align:center;font-size:15px}

/* shared bits */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px;flex:none}
.view > .tools:first-child{margin-top:0}
select,input[type=search]{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13.5px}
select{cursor:pointer}
option,optgroup{background:#0b0f14;color:var(--txt)}
input[type=search]{width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:#0b0f14;border:0;border-right:1px solid var(--line);color:var(--dim);padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:#223a5e;color:#fff}
button.b{background:#0b0f14;border:1px solid var(--line);color:var(--soft);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
button.b:hover{color:var(--txt);border-color:#4a5d7a}
button.b.go{background:#17294a;border-color:#2a5590;color:#cfe0ff}
.count{color:var(--dim);font-size:12.5px;margin-left:auto}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:#0b0f14;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.d img{object-fit:contain;padding:3px}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta > *{white-space:nowrap}
.pos{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.QB{background:#43235a;color:#e2b8fb}.RB{background:#134030;color:#86e2ae}.WR{background:#15365f;color:#a3c9fb}
.TE{background:#553a13;color:#f7c57c}.K,.DST{background:#2d3440;color:#b7c0cc}
.inj{font-size:10.5px;font-weight:800;color:#fff;background:#b93a32;border-radius:4px;padding:0 5px;white-space:nowrap}
.inj.Q{background:#96741f}
.inj.man{background:#1f5fbf}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:#6f7b88}
.own{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--soft)}
.own.fa{color:#6f7b88}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tag.core{background:#15365f;border-color:#2a5590;color:#a3c9fb}
.tag.sell{background:#4a1f1c;border-color:#7a332d;color:#ffa59c}
.tag.buy,.tag.up{background:#12382a;border-color:#22604a;color:#7fe0aa}
.tag.down{background:#3b2f14;border-color:#6b5420;color:var(--warn)}
.need{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#232c38;color:var(--soft);white-space:nowrap}
.need.g{background:#12382a;color:#7fe0aa}.need.r{background:#4a1f1c;color:#ffa59c}
.needs{display:flex;flex-wrap:wrap;gap:5px}
.gain{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:4px 9px;text-align:center;line-height:1.15;flex:none}
.gain b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.gain span{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gains{display:flex;gap:8px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#0b0f14;border:1px solid var(--line);color:var(--soft)}
.chip.g{border-color:#22604a;color:#7fe0aa}.chip.b{border-color:#2a5590;color:#a3c9fb}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:54px;padding:4px 6px;border-radius:7px;line-height:1.2;flex:none}
.wkc em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
.wkc b{font-size:12px;font-weight:700}
.wkc i{font-style:normal;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.wkc.bye b,.wkc.out b{color:#66717e}
.wkc.out i{color:var(--bad);font-weight:800;font-size:10.5px}
select.st{padding:5px 6px;font-size:12.5px;font-weight:700;border-radius:7px;color:var(--soft);max-width:176px}
select.st.Q{border-color:#96741f;color:var(--warn)}
select.st.D,select.st.O,select.st.IR,select.st.SUS{border-color:#8f2f29;color:#ffa59c}
select.st.man{border-color:var(--blue);background:#12233d;color:#a3c9fb}
.lab{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
/* my own lineup calls: starter / bench / handcuff */
.rtag{font-size:10px;font-weight:800;letter-spacing:.3px;border-radius:4px;padding:0 5px;white-space:nowrap}
.rtag.S{background:#15365f;color:#a3c9fb}.rtag.B{background:#2d3440;color:#c5cfda}.rtag.C{background:#3b2f14;color:var(--warn)}
select.rl{padding:5px 6px;font-size:12.5px;font-weight:700;border-radius:7px;color:var(--soft);max-width:176px}
select.rl.on{border-color:#6b5420;background:#2a2312;color:var(--warn)}
.pc-role{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;font-weight:800;letter-spacing:.5px;color:var(--dim);text-transform:uppercase}
.pc-role select{flex:1;max-width:none}

/* targets */
.market{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;flex:none}
.mk{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#232c38;color:var(--soft);white-space:nowrap}
.mk.r{background:#4a1f1c;color:#ffa59c}.mk.g{background:#12382a;color:#7fe0aa}
.tgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-content:start}
.tg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tg .top{display:flex;gap:10px;align-items:center;min-width:0}
.tg .top .who{flex:1;min-width:0}
.tg .nm{font-size:15px}
.grade{flex:none;width:54px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.grade b{font-size:21px;font-weight:800}
.grade.n b{font-size:16px}
.grade span{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-top:3px;opacity:.9}
.grade.a{background:#1f8a4c;color:#fff}.grade.b{background:#6f8f1f;color:#fff}.grade.c{background:#9a6b12;color:#fff}
.grade.d{background:#2d3440;color:var(--soft)}.grade.s{background:#a8362e;color:#fff}
.mts{display:flex;flex-direction:column;gap:5px}
.mt{display:grid;grid-template-columns:62px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:11.5px;font-weight:700;color:var(--dim)}
.mt .bar{height:11px;border-radius:6px;background:#232c38;overflow:hidden}
.mt .bar i{display:block;height:100%;border-radius:6px}
.mt b{color:var(--txt);font-size:12.5px;text-align:right}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.ht{border-radius:7px;padding:5px 2px 6px;text-align:center;min-width:0}
.ht span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.2px;color:var(--soft);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht b{font-size:14px;font-variant-numeric:tabular-nums}
.chip.g{background:#12382a;border-color:#22604a;color:#7fe0aa}
.chip.r{background:#3a1d1b;border-color:#7a332d;color:#ffa59c}
.chip.a{background:#3b2f14;border-color:#6b5420;color:var(--warn)}
.ahead{display:flex;gap:4px;flex-wrap:wrap}
.mini{font-size:10.5px;font-weight:700;padding:3px 5px;border-radius:5px;min-width:38px;text-align:center}
.mini.po{box-shadow:inset 0 0 0 1px #9dc4ff}
.tg .foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:auto}
.fit{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:baseline;font-size:13.5px;font-weight:800}
.fit b{color:var(--txt)}
.acts{display:flex;gap:6px}

/* roster need tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;border-top:3px solid #3a4658;min-width:0}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tile .k em{font-style:normal;font-size:10.5px;letter-spacing:.5px;padding:1px 7px;border-radius:999px;background:#232c38;color:var(--soft)}
.tile.g .k em{background:#12382a;color:#7fe0aa}.tile.r .k em{background:#4a1f1c;color:#ffa59c}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
.strip{display:flex;gap:3px;margin:6px 0 7px}
.strip i{flex:1;height:5px;border-radius:3px;background:#27303c}
.strip i.me{background:var(--txt)}
.tile.g .strip i.me{background:var(--good)}.tile.r .strip i.me{background:var(--bad)}
.tile .s{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s b{font-weight:700;color:var(--soft)}
.tile .s2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* player table (wide screens) */
.scroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:#10151c;position:sticky;top:0;z-index:3;padding:9px 10px;user-select:none}
th.sort{cursor:pointer}
th.sort:hover{color:var(--txt)}
th.on{color:#fff}
th .ar{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}
th.l,td.l{text-align:left;position:sticky;left:0;z-index:2;background:var(--panel)}
th.l{z-index:4;background:#10151c}
th.po{color:#9dc4ff}
th.c,td.c{text-align:center}
.sep{border-left:1px solid var(--line)}
tbody tr:hover td{background:#1a212b}
tr.me td.l{box-shadow:inset 3px 0 0 var(--blue)}
.ply{display:flex;align-items:center;gap:10px;min-width:0}
.spk{display:block;margin-left:auto}
td.wk{padding:5px 4px;text-align:center}

/* player cards (phones) */
.cards{display:none}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.pc.me{box-shadow:inset 3px 0 0 var(--blue)}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-top .who{flex:1;min-width:0}
.pc-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}
.cx{background:var(--panel2);border-radius:7px;padding:5px 2px 6px;text-align:center;min-width:0}
.cx span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.3px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.cx b{font-size:15px;font-variant-numeric:tabular-nums}
.pc-wk{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.pc-wk::-webkit-scrollbar{display:none}
.pc-wk .wkc{min-width:50px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.pc-foot .spk{margin:0}
.pc-x{display:none;margin-top:8px}
.pc.open .pc-x{display:grid}

/* packages */
.pkscroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;align-content:start}
.grp-h{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:15px;font-weight:800;margin-top:8px}
.grp-h:first-child{margin-top:0}
.grp-h > span{font-size:12.5px;font-weight:600;color:var(--dim)}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;text-align:left;color:var(--txt);width:100%;min-width:0;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pk:hover{border-color:#4a5d7a}
.pk .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pk .tm{font-weight:800;font-size:14.5px;min-width:0}
.pk .tm > div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .tm > div span{color:var(--dim);font-weight:600;font-size:12.5px;margin-left:6px}
.will{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-top:3px}
.will.likely{background:#12382a;color:#7fe0aa}.will.maybe{background:#3b2f14;color:var(--warn)}.will.long{background:#3a1d1b;color:#ffa59c}
.will.three{background:#2a2350;color:#c9bdff;margin-left:4px}
.legs{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:11px}
.legs .side{display:grid;grid-template-columns:112px minmax(0,1fr);column-gap:8px;align-items:center}
.legs .side .h{grid-row:1/span 2}
.legs .side .pill{grid-column:2}
.legs .side .pill:first-of-type{margin-top:0}
.legs .side .h{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:100%;padding:12px;margin-top:12px}
.pkgrid-more{grid-column:1/-1}
.pk .sides{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:8px;margin-top:11px;align-items:center}
.pk .arrow{color:var(--dim);font-size:18px;text-align:center}
.pk .side{min-width:0;background:var(--panel2);border-radius:8px;padding:7px 9px 8px}
.pk .side .h{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.pill{display:flex;align-items:center;gap:7px;margin-top:6px;min-width:0}
.pill .av{width:28px;height:28px;flex-basis:28px}
.pill .nm{font-size:13px;min-width:0}
.pill .x{margin-left:auto;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;padding-left:4px}
.pk .chips{margin-top:10px}
.pk .them{margin-top:9px;font-size:12.5px;color:var(--dim)}
.pk .them b{color:var(--soft);font-weight:700}

/* builder: my players | the deal | their players, each scrolling on its own */
.bseg{display:none;margin-bottom:10px;flex:none}
.bgrid{flex:1 0 auto;height:0;min-height:min(520px,78vh);display:grid;grid-template-columns:minmax(270px,360px) minmax(300px,540px) minmax(270px,360px);gap:12px;justify-content:center}
.rcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.rcol .pane{flex:1}
.bmode{margin-bottom:10px;flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bmode .hint{font-size:12.5px;color:var(--dim)}
.dsides.three{grid-template-columns:1fr 1fr 1fr}
@container (max-width:420px){ .dsides.three{grid-template-columns:1fr} }
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{padding:9px 10px;background:#10151c;border-bottom:1px solid var(--line);flex:none}
.ph .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b.h{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.ph select{flex:1;min-width:0;padding:6px 8px;font-weight:700}
.ph .cap{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);white-space:nowrap}
.ph .needs{margin-top:7px}
.plist{flex:1;min-height:0;overflow:auto}
.grp{padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--dim);background:#131920;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;color:var(--txt);text-align:left}
.row:hover{background:#1a212b}
.row.sel{background:#17294a;box-shadow:inset 3px 0 0 var(--blue)}
.row .av{width:30px;height:30px;flex-basis:30px}
.row .who{min-width:0;flex:1}
.row .nm{font-size:13.5px;display:block}
.row .meta{gap:3px 6px;margin-top:1px}
.row .tag{font-size:9.5px;padding:1px 6px}
.row .n2{display:flex;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;flex:none}
.row .n2 span{width:42px;text-align:right}
.row .n2 span + span{color:#9dc4ff}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;min-height:0;container-type:inline-size}
@container (max-width:330px){ .dsides,.dgrid{grid-template-columns:1fr} }
.dsum{display:none}
.dsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--panel2);border-radius:8px;padding:8px 10px 10px;min-height:74px;min-width:0}
.dchips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.dchip{display:flex;align-items:center;gap:7px;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;min-width:0;color:var(--txt);text-align:left}
.dchip:hover{border-color:#7a332d}
.dchip .nm{font-size:13.5px;flex:1;min-width:0}
.dchip .x{color:var(--dim);font-weight:800;font-size:14px}

   injuries and depth are all priced in: a bench player only counts in weeks he would start.
   With `floor` on, every starting spot is worth at least what the waiver wire offers at
   that position - nobody actually starts an empty slot - so a trade is measured against
   the free alternative, not against zero. */
/* Each entry is tier + points, so one numeric sort orders by tier first: my starter calls
   (3000), everyone else (2000), the waiver floor (2000, so it still beats a regular who would
   score less), my bench calls (1000), and anyone not playing that week (0). A handcuff moves up
   to 2000 in a week his starter is out. `mine` applies my calls - only to my own roster. */
const PI = {QB:0,RB:1,WR:2,TE:3,K:4,DST:5};
let NS = [0,0,0,0,0,0], NF = 0, FLOOR = [0,0,0,0];
const BUF = [[],[],[],[],[],[]], FLX = [], desc = (x,y) => y - x;
// p.ko / p.km hold each week as tier + points (built in recompute); a handcuff is -1 in p.km
function cuffKey(p, wi, ids){
  const v = p.eff[wi], c = (roleOf(p.id) || {}).c, q = P[c];
  return q && q.eff[wi] === 0 && q.wk[wi].o !== "BYE" && ids.includes(c) ? 2000 + v : 1000 + v;
}
function lineup(ids, wi, floor, mine){
  for(let k = 0; k < 6; k++) BUF[k].length = 0;
  for(let i = 0; i < ids.length; i++){
    const p = P[ids[i]];
    let v = mine ? p.km[wi] : p.ko[wi];
    if(v < 0) v = cuffKey(p, wi, ids);
    BUF[p.pi].push(v);
  }
  if(floor) for(let k = 0; k < 4; k++) for(let j = 0; j < NS[k]; j++) BUF[k].push(FLOOR[k]);
  let tot = 0; FLX.length = 0;
  for(let k = 0; k < 6; k++){
    const a = BUF[k], n = NS[k];
    if(a.length > 1) a.sort(desc);
    for(let i = 0; i < a.length; i++){
      if(i < n) tot += a[i] % 1000;
      else if(k >= 1 && k <= 3) FLX.push(a[i]);
    }
  }
  if(NF){ if(FLX.length > 1) FLX.sort(desc); for(let i = 0; i < NF && i < FLX.length; i++) tot += FLX[i] % 1000; }
  return tot;
}
function worth(ids, floor = true, mine = false){
  let reg = 0, po = 0;
  for(const wi of REG) reg += lineup(ids, wi, floor, mine);
  for(const wi of PO) po += lineup(ids, wi, floor, mine);
  return {reg, po};
}
// season-level ordering with my calls applied: starters first, bench calls last
const rk = (p, mine) => (mine ? TIER(roleOf(p.id)) : 2000) + p.adj;
const swap = (ids, out, inn) => ids.filter(id => !out.has(id)).concat([...inn]);
function delta(before, after){
  return { reg: REG.length ? (after.reg - before.reg) / REG.length : 0,
           po: PO.length ? (after.po - before.po) / PO.length : 0,
           score: (after.reg - before.reg) + 1.5 * (after.po - before.po) };
}
// where every team's starters rank at each position; `over` swaps in hypothetical rosters
function posRanks(over){
  const out = {};
  for(const pos of SKILL){
    const n = spots(pos) || 1;
    D.teams.map(t => {
      const ids = (over && over[t.id]) || t.players;
      const a = ids.map(id => P[id]).filter(p => p.pos === pos).map(p => p.adj).sort((x,y) => y - x).slice(0, n);
      return {id:t.id, v:a.reduce((s,x) => s + x, 0)};
    }).sort((a,b) => b.v - a.v).forEach((x, i) => ((out[x.id] = out[x.id] || {})[pos] = i + 1));
  }
  return out;
}
// how many startable players a roster holds at each position
// a player I have called bench doesn't count as startable depth for me
const counts = (p, mine) => p.ok && !(mine && (roleOf(p.id) || {}).r === "B");
function depthOf(ids, mine){
  const d = {QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
  for(const id of ids){ const p = P[id]; if(counts(p, mine)) d[p.pos]++; }
  return d;
}
// what each player is to his team: S starter, F flex, B bench
function rolesOf(ids, mine){
  const out = {}, spill = [];
  for(const pos of SKILL){
    ids.map(id => P[id]).filter(p => p.pos === pos).sort((a,b) => rk(b, mine) - rk(a, mine)).forEach((p, i) => {
      if(i < spots(pos) && !(mine && (roleOf(p.id) || {}).r === "B")) out[p.id] = "S";
      else { out[p.id] = "B"; if(pos !== "QB" && !(mine && (roleOf(p.id) || {}).r === "B")) spill.push(p); }
    });
  }
  spill.sort((a,b) => rk(b, mine) - rk(a, mine)).slice(0, spots("FLEX")).forEach(p => (out[p.id] = "F"));
  return out;
}
/* Trade value is points over what the waiver wire gives you at the SAME position, so scarcity
   is built in: where free agents are thin a starter is worth more than an equal scorer at a
   position you can replace for free. It also climbs faster than the points do - one player
   12 over the wire is worth more than two who are 6 over - because a lineup has only so many
   spots and everyone values the players in theirs far above the ones on the bench.
   Scaled by how much of the rest of the season he will actually play. */
const val = p => { const v = Math.max(0, p.base - (REPL[p.pos] || 0)); return (v * (1 + v / 15) + 0.5) * p.af; };
// the starting lineup a roster would field on season rates, slot by slot, and who is left over
function lineupOf(ids, mine){
  const by = {QB:[],RB:[],WR:[],TE:[]}, rows = [], spill = [], bench = [];
  const benched = p => mine && (roleOf(p.id) || {}).r === "B";
  for(const id of ids){ const p = P[id]; if(by[p.pos]){ if(benched(p)) bench.push(p); else by[p.pos].push(p); } }
  for(const pos of SKILL){
    const a = by[pos].sort((x,y) => rk(y, mine) - rk(x, mine));
    for(let i = 0; i < Math.max(a.length, spots(pos)); i++){
      if(i < spots(pos)) rows.push({slot:pos, p:a[i] || null});
      else (pos === "QB" ? bench : spill).push(a[i]);
    }
  }
  spill.sort((x,y) => rk(y, mine) - rk(x, mine));
  for(let i = 0; i < spots("FLEX"); i++) rows.push({slot:"FLEX", p:spill[i] || null});
  return {rows, bench:spill.slice(spots("FLEX")).concat(bench)};
}

/* ---- availability + the league view -------------------------------------------------------
   The feed sends a HEALTHY projection per week. This applies ESPN's status, or my own call
   when I have made one, then rebuilds everything that depends on it. */
// when ESPN's status says he plays again: `back` is the week (99 = not this fantasy season),
// `first` is how much of his first game back to count on
function autoOut(p){
  const w0 = D.weeks[0], hurt = p.inj === "O" || p.inj === "IR" || p.inj === "SUS";
  const first = p.inj === "D" ? 0.25 : p.inj === "Q" ? 0.8 : hurt ? 0.85 : 1;
  if(!p.inj) return {back:w0, first:1};
  if(p.ret != null) return {back:p.ret, first};
  // no return date published. On IR or suspended and not playing, or out two games running: treat
  // him as gone until I say otherwise. A stale tag on someone who played last week is ignored.
  if(hurt && (p.miss || 0) >= (p.inj === "O" ? 2 : 1)) return {back:99, first, unknown:true};
  return {back:p.inj === "O" ? w0 + 1 : w0, first};
}
function recompute(){
  for(const p of Object.values(P)){
    const o = OV[p.id], au = (p.au = autoOut(p)); let tot = 0, raw = 0, back = false;
    p.eff = p.wk.map(w => {
      if(w.o === "BYE") return 0;
      let a = 1;
      if(o){ if(o.t === "O" && w.w <= o.thru) a = 0; }
      else if(w.w < au.back) a = 0;
      else if(!back){ a = au.first; back = true; }
      raw += w.p; tot += w.p * a;
      return w.p * a;
    });
    p.af = raw ? tot / raw : 1;          // share of his remaining value he is actually there for
    p.adj = p.base * p.af;
    p.ros = avg(p.eff, REG); p.po = avg(p.eff, PO);
    p.ko = p.eff.map(v => (v > 0 ? 2000 + v : 0));
    const role = roleOf(p.id);
    p.km = !role ? p.ko : p.eff.map(v => (v <= 0 ? 0 : role.r === "B" && role.c ? -1 : TIER(role) + v));
  }
  // the startable line is a rank at the position across every player: QB12, RB24, WR24, TE12,
  // K12, DEF12. Depth is how many of THOSE a team holds, not how many bodies it has.
  for(const pos of Object.keys(STARTN)){
    const a = Object.values(P).filter(p => p.pos === pos).sort((x,y) => y.adj - x.adj), N = STARTN[pos];
    a.forEach((p, i) => (p.ok = i < N && p.adj > 0));
    START[pos] = (a[Math.min(a.length, N) - 1] || {adj:0}).adj;
    if(!SKILL.includes(pos)) continue;
    const fa = a.filter(p => !p.t).slice(1, 4);                            // 2nd-4th best free agents: the best one goes fast
    REPL[pos] = fa.length ? fa.reduce((s,p) => s + p.adj, 0) / fa.length : START[pos] * 0.75;
    const byX = a.filter(p => p.g >= (D.minG || 3)).sort((x,y) => y.xfp - x.xfp);
    XSTART[pos] = (byX[Math.min(byX.length, N) - 1] || {xfp:0}).xfp;      // a starter's workload
    RANK[pos] = a.filter(p => p.t).map(p => p.id);
  }
  FLOOR = SKILL.map(pos => 2000 + (REPL[pos] || 0));
  for(const p of Object.values(P)) p.v = val(p);
  ROLE0 = {};
  for(const t of D.teams){ const m = t.id === ME; DEPTH[t.id] = depthOf(t.players, m); Object.assign(ROLE0, rolesOf(t.players, m)); W0[t.id] = worth(t.players, true, m); }
  BASE = posRanks();
  for(const p of Object.values(P)) p.sg = signals(p);
  buildTargets();
  buildWaivers();
}

/* ---- the read on a player: is the box score ahead of, or behind, what he is being given? ----
   owed   workload says more than he has scored (xFP - PPG)
   tdl    the part of that gap that is touchdowns: expected from his carries and targets vs scored.
          Touchdown luck evens out, so it counts most
   eff    the rest of the gap, yardage efficiency: part luck, part the player
   grow   his role over the last three games against the season
   sched  how soft the defences ahead are next to the ones he has already played
   E      what all of it is worth, in points a game against what he has been scoring */
function signals(p){
  if(p.g == null || !p.l3 || p.g < (D.minG || 3) || !SKILL.includes(p.pos)) return null;
  const s = {};
  s.owed = p.xfp - p.ppg;
  s.tdl = p.xtd != null ? (p.xtd - p.td) / p.g * 6 : 0;
  s.eff = s.owed - s.tdl;
  s.grow = p.g >= 4 ? p.l3.xfp - p.xfp : 0;
  s.cold = p.g >= 4 ? p.l3.xfp - p.l3.ppg : 0;
  s.ahead = avgRk(p, ALLW);
  s.sched = s.ahead != null && p.fsos != null ? s.ahead - p.fsos : 0;
  s.po = avgRk(p, PO);
  s.E = 0.75 * s.tdl + 0.35 * s.eff + 0.6 * s.grow + Math.max(-1.5, Math.min(1.5, p.base * 0.004 * s.sched));
  return s;
}
function pq(p, k){
  const a = (PCT[p.pos] || {})[k], v = p[k];
  if(!a || a.length < 8 || v == null) return 0;
  let lo = 0, hi = a.length;
  while(lo < hi){ const m = (lo + hi) >> 1; a[m] <= v ? (lo = m + 1) : (hi = m); }
  return lo / a.length;
}
// the same read, cut down to a few words for a chip
function tagLine(p){
  const s = p.sg;
  if(!s) return "";
  if(s.E >= 0.8){
    if(s.tdl >= 0.8) return `${(p.xtd - p.td).toFixed(1)} TDs owed`;
    if(s.owed >= 1.5) return `${f1(p.xfp)} workload, ${f1(p.ppg)} scored`;
    if(s.grow >= 1.5) return `role up ${sgn(s.grow)}`;
    if(s.sched >= 4) return "softer schedule ahead";
  } else if(s.E <= -0.8){
    if(s.tdl <= -0.8) return `${(p.td - p.xtd).toFixed(1)} TDs over expected`;
    if(s.owed <= -2) return `${f1(p.ppg)} scored on ${f1(p.xfp)} workload`;
    if(s.grow <= -1.5) return `role down ${sgn(s.grow)}`;
    if(s.sched <= -4) return "tougher schedule ahead";
  }
  return "";
}
/* Three lists.
   BUYS    everyone healthy on another roster who would make my lineup better from here on,
           ranked by how much. Upside is part of the grade, no longer a gate
   DEPTHS  free agents, for the bench - or a straight upgrade when one would start
   SELLS   my own startable players running ahead of their workload */
function buildTargets(){
  const mine = TEAMS[ME].players, denom = (REG.length + 1.5 * PO.length) || 1, bare = worth(mine, false, true);
  BUYS = []; SELLS = []; DEPTHS = [];
  for(const p of Object.values(P)){
    if(!SKILL.includes(p.pos) || p.g == null) continue;
    if(p.t === ME){
      if(p.sg && -p.sg.E >= 0.8 && p.ok) SELLS.push({p, grade:Math.round(99 * Math.min(1, -p.sg.E / 4))});
      continue;
    }
    // hurt players are nobody's target: anyone out, doubtful, on IR or suspended is left off
    // until I overrule ESPN's status myself, however soon he is due back
    if(p.af < 0.9 || (!OV[p.id] && ["O","IR","SUS","D"].includes(p.inj))) continue;
    const after = mine.concat([p.id]), role = rolesOf(after, true)[p.id];
    if(!p.t){
      const d = delta(bare, worth(after, false, true));
      DEPTHS.push({p, role, d, fit:d.score / denom});
      continue;
    }
    const d = delta(W0[ME], worth(after, true, true)), fit = d.score / denom;
    if(fit < 0.25) continue;                       // a quarter-point a week or more, byes and injuries counted
    const E = p.sg ? p.sg.E : 0, po = p.sg ? p.sg.po : null;
    const soft = po == null ? 0.5 : Math.max(0, Math.min(1, (po - 8) / 16));
    const g = 0.5 * Math.min(1, fit / 4) + 0.25 * Math.max(0, Math.min(1, E / 4)) + 0.15 * pq(p, "xfp") + 0.1 * soft;
    const slot = mine.filter(id => P[id].pos === p.pos && rk(P[id], true) > p.adj + 2000).length + 1;
    BUYS.push({p, role, d, fit, slot, grade:Math.round(99 * g)});
  }
}

function verdictTag(p){
  if(p.g == null) return "";
  const mine = p.t === ME, rankAt = (RANK[p.pos] || []).indexOf(p.id) + 1, coreN = {QB:6,RB:12,WR:12,TE:5}[p.pos];
  const E = p.sg ? p.sg.E : 0;
  if(mine && E <= -1.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag sell">Sell high</span>`;
  if(!mine && E >= 1.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag buy">Buy low</span>`;
  if(p.tr >= 2) return `<span class="tag up">Rising</span>`;
  if(p.tr <= -2) return `<span class="tag down">Fading</span>`;
  if(rankAt && rankAt <= coreN) return `<span class="tag core">Core</span>`;
  return `<span class="tag">Hold</span>`;
}
function injBadge(p){
  const o = OV[p.id], w0 = D.weeks[0], last = D.weeks[D.weeks.length - 1];
  if(o) return o.t === "O" ? `<span class="inj man">OUT${o.thru >= last ? " season" : o.thru === w0 ? " wk " + o.thru : " thru " + o.thru}</span>` : "";
  if(!p.inj) return "";
  const b = p.au.back;
  return `<span class="inj ${p.inj}">${p.inj}${b > last ? " · season" : b > w0 ? " · back wk " + b : ""}</span>`;
}
function roleBadge(p){
  const r = roleOf(p.id);
  if(!r) return "";
  if(r.r === "S") return `<span class="rtag S">STARTER</span>`;
  return r.c && P[r.c] ? `<span class="rtag C">CUFF · ${esc(short(P[r.c]).toUpperCase())}</span>` : `<span class="rtag B">BENCH</span>`;
}
function who(p, extra){
  return `<div class="who"><div class="nm">${esc(p.n)}</div>
    <div class="meta"><span class="pos ${p.pos}">${p.pos}</span><span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${roleBadge(p)}${extra || ""}</div></div>`;
}
// my lineup call for one of my players: automatic, always start, bench, or handcuff to a teammate
function roleSel(p){
  if(p.t !== ME || !SKILL.includes(p.pos)) return "";
  const r = roleOf(p.id), cur = !r ? "" : r.r === "S" ? "S" : r.c ? "C:" + r.c : "B";
  let opts = `<option value=""${cur === "" ? " selected" : ""}>Lineup: auto</option>
    <option value="S"${cur === "S" ? " selected" : ""}>Always start</option>
    <option value="B"${cur === "B" ? " selected" : ""}>Bench: never start</option>`;
  for(const id of TEAMS[ME].players){
    const q = P[id];
    if(id === p.id || q.pos !== p.pos) continue;
    opts += `<option value="C:${id}"${cur === "C:" + id ? " selected" : ""}>Handcuff: starts if ${esc(short(q))} out</option>`;
  }
  return `<select class="rl${r ? " on" : ""}" data-id="${p.id}" aria-label="Lineup call for ${esc(p.n)}">${opts}</select>`;
}
const plyCell = p => `<div class="ply">${img(p)}${who(p)}</div>`;
function spark(p){
  if(!p.pl) return "";
  const bw = 5, gap = 2, H = 26, max = Math.max(32, ...p.pl.map(x => x || 0));
  const hot = new Set(p.pl.map((x, i) => (x != null ? i : -1)).filter(i => i >= 0).slice(-3));
  let s = "";
  p.pl.forEach((x, i) => {
    const X = i * (bw + gap);
    if(x == null) s += `<rect x="${X}" y="${H - 2}" width="${bw}" height="2" fill="#39424e"/>`;
    else { const h = Math.max(2, Math.round(x / max * H));
      s += `<rect x="${X}" y="${H - h}" width="${bw}" height="${h}" rx="1" fill="${hot.has(i) ? "#58a6ff" : "#3d5a80"}"><title>Wk ${i + 1}: ${x}</title></rect>`; }
  });
  return `<svg class="spk" width="${p.pl.length * (bw + gap) - gap}" height="${H}">${s}</svg>`;
}
function wkChip(p, i, lab){
  const w = p.wk[i], top = lab ? `<em>Wk ${w.w}</em>` : "";
  if(w.o === "BYE") return `<span class="wkc bye" style="background:#1f2732">${top}<b>BYE</b><i>&nbsp;</i></span>`;
  const out = p.eff[i] === 0 && w.p > 0;
  return `<span class="wkc${out ? " out" : ""}" style="${out ? "background:#1f2732" : rkBg(w.rk)}" title="${w.rk ? ord(w.rk) + " vs " + p.pos + " (32nd = softest)" : ""}">${top}<b>${w.o}</b><i>${out ? "OUT" : f1(p.eff[i])}</i></span>`;
}
// the rule-out control: ESPN's call, or mine
function stSel(p){
  const o = OV[p.id], cur = o ? (o.t === "H" ? "H" : "O:" + o.thru) : "";
  const nm = {"":"Active", Q:"Questionable", D:"Doubtful", O:"Out", IR:"On IR", SUS:"Suspended"}[p.inj || ""];
  const bk = p.au.back, auto = !p.inj ? nm : bk > D.weeks[D.weeks.length - 1] ? nm + (p.au.unknown ? ", no return date" : " for season") : bk > D.weeks[0] ? `${nm}, back wk ${bk}` : nm;
  const last = D.weeks[D.weeks.length - 1];
  let opts = `<option value=""${cur === "" ? " selected" : ""}>${auto}</option>`;
  if(p.inj) opts += `<option value="H"${cur === "H" ? " selected" : ""}>Healthy</option>`;
  D.weeks.forEach((w, i) => {
    const v = "O:" + w;
    opts += `<option value="${v}"${cur === v ? " selected" : ""}>${i === 0 ? "Out wk " + w : w === last ? "Out for season" : "Out thru wk " + w}</option>`;
  });
  return `<select class="st ${o ? "man" : (p.inj || "")}" data-id="${p.id}" aria-label="Status for ${esc(p.n)}">${opts}</select>`;
}
// short / set / deep at each position, by how many startable players a team holds
function needsHtml(teamId){
  return Object.keys(STARTN).map(pos => { const c = DEPTH[teamId][pos], n = spots(pos) || 1;
    return `<span class="need ${c < n ? "r" : c > n ? "g" : ""}" title="${c} startable for ${plural(n, "spot")}">${pos === "DST" ? "DEF" : pos} ${c < n ? "short" : c > n ? "deep" : "set"}</span>`; }).join("");
}

/* ---- percentile shading: how a number stacks up at his position across the whole pool ----*/
function buildPct(){
  const keys = ["ppg","xfp","snap","ts","cs","ays","wopr","doc","tps","cr","ypt","yacr","opp","rzg","rz","ypc","yaco","bt","fdg"];
  for(const pos of SKILL){
    PCT[pos] = {};
    const pool = Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3));
    for(const k of keys) PCT[pos][k] = pool.map(p => p[k]).filter(v => v != null).sort((a,b) => a - b);
  }
}
function tint(p, k){
  const a = (PCT[p.pos] || {})[k];
  if(!a || a.length < 8 || p[k] == null) return "";
  const q = pq(p, k);
  return q >= 0.6 || q <= 0.4 ? "background:" + heat(q, 0.6) : "";
}

/* ---- targets -------------------------------------------------------------------------------
   Colour does the talking. A bar or tile is green when the number is high for the position and
   red when it is low, so a wall of green over a short yellow scoring bar is the whole story:
   the workload of a good player, without the points yet. */
const TILES = {
  QB: [["xfp","Workload"],["cs","Rushing"],["rz","Red zone"],["fdg","1st downs"]],
  RB: [["snap","Snaps"],["cs","Carries"],["ts","Targets"],["rz","Red zone"],["yaco","Contact"]],
  WR: [["snap","Snaps"],["ts","Targets"],["tps","Tgt/snap"],["wopr","WOPR"],["rz","Red zone"]],
};
TILES.TE = TILES.WR;
const heat = (q, a = 0.55) => q >= 0.5 ? `rgba(34,170,95,${((q - 0.5) * 2 * a).toFixed(2)})` : `rgba(220,64,54,${((0.5 - q) * 2 * a).toFixed(2)})`;
const solid = q => `hsl(${Math.round(q * 125)},62%,45%)`;
// the read on a player as a few coloured words: green is in his favour from here, red against
function sigChips(p){
  const s = p.sg, out = [];
  if(!s) return out;
  if(s.tdl >= 0.8) out.push([`${(p.xtd - p.td).toFixed(1)} TDs owed`, "g"]);
  else if(s.tdl <= -0.8) out.push([`${(p.td - p.xtd).toFixed(1)} TDs over`, "r"]);
  if(s.eff >= 1.5) out.push(["yards owed", "g"]); else if(s.eff <= -2) out.push(["hot efficiency", "r"]);
  if(s.grow >= 1.5) out.push(["role growing", "g"]); else if(s.grow <= -1.5) out.push(["role shrinking", "r"]);
  if(p.g >= 4 && s.cold >= 3 && p.l3.ppg <= p.ppg - 1.5) out.push(["cold last 3", "g"]);
  if(s.sched >= 4) out.push(["easier schedule", "g"]); else if(s.sched <= -4) out.push(["tougher schedule", "r"]);
  if(PO.length && s.po != null){ if(s.po >= 21) out.push(["soft playoffs", "g"]); else if(s.po <= 11) out.push(["tough playoffs", "r"]); }
  return out.sort((a,b) => (a[1] === "g" ? 0 : 1) - (b[1] === "g" ? 0 : 1));
}
/* ---- row tables -------------------------------------------------------------------------
   Targets, Waivers and Packages are all one row per item. A column is
   {k, h, t (header tip), v (sort value), html (cell), c (centre), l (sticky player column), sep, nosort}.
   Clicking a sortable header sorts by it; clicking again flips the order. */
function gridHtml(cols, rows, sk, dir, rowAttr){
  const th = c => `<th class="${c.l ? "l" : ""}${c.nosort || !c.v ? "" : " sort"}${sk === c.k ? " on" : ""}${c.sep ? " sep" : ""}${c.c ? " c" : ""}${c.po ? " po" : ""}" data-k="${c.k}"${c.t ? ` title="${esc(c.t)}"` : ""}>${c.h}${sk === c.k ? `<span class="ar">${dir < 0 ? "▾" : "▴"}</span>` : ""}</th>`;
  const body = rows.map(r => `<tr${rowAttr ? rowAttr(r) : ""}>${cols.map(c => `<td class="${c.l ? "l" : c.c ? "c" : "num"}${c.sep ? " sep" : ""}"${c.style ? ` style="${c.style(r)}"` : ""}>${c.html(r)}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${cols.map(th).join("")}</tr></thead><tbody>${body}</tbody></table>`;
}
function sortRows(rows, cols, sk, dir){
  const c = cols.find(x => x.k === sk);
  if(!c || !c.v) return rows;
  return rows.slice().sort((a, b) => {
    const x = c.v(a), y = c.v(b);
    if(x == null && y == null) return 0;
    if(x == null) return 1;
    if(y == null) return -1;
    return typeof x === "string" ? x.localeCompare(y) * dir : (x - y) * dir;
  });
}
// header clicks on a row table: the same column flips, a new one sorts high-to-low (names A-Z)
function onSort(el, get, set, render){
  el.addEventListener("click", e => {
    const th = e.target.closest("th.sort"); if(!th) return;
    const k = th.dataset.k, cur = get();
    set(cur.k === k ? {k, dir:-cur.dir} : {k, dir:k === "name" ? 1 : -1});
    render();
  });
}
/* Stats that mean something for the position, and only those. A QB's red-zone carries or snap
   share say nothing; a back's air yards don't exist. In a mixed list each column is blank for the
   positions it doesn't apply to. Hidden until "Stats" is picked. */
const REL = {
  QB: ["xfp","fpoe","trend","up","cs","fdg"],
  RB: ["xfp","fpoe","trend","up","snap","cs","ts","opp","rzg","rz","td","xtd","ypc","yaco","bt","fdg"],
  WR: ["xfp","fpoe","trend","up","snap","ts","ays","wopr","tps","doc","cr","ypt","yacr","rz","td","xtd","fdg"],
};
REL.TE = REL.WR;
const STATORDER = ["xfp","fpoe","trend","up","snap","cs","ts","opp","rzg","rz","td","xtd","ays","wopr","tps","doc","cr","ypt","yacr","ypc","yaco","bt","fdg"];
const statKeys = pos => (pos === "ALL" ? STATORDER : STATORDER.filter(k => (REL[pos] || []).includes(k)));
const relevant = (p, k) => !STATORDER.includes(k) || (REL[p.pos] || []).includes(k);
// one stat cell, tinted by where it sits at the position
function statCell(p, k){
  const c = COLS[k];
  if(!relevant(p, k)) return "";
  const t = cellText(c, p);
  if(t == null) return `<span class="dimn">–</span>`;
  return `<span class="${c.cl ? c.cl(c.v(p)) : ""}">${t}</span>`;
}
const statCols = (pos, P_) => statKeys(pos).map((k, i) => ({k:"s_" + k, h:COLS[k].h, t:COLS[k].t, sep:i === 0,
  v:r => { const p = P_(r); return relevant(p, k) ? COLS[k].v(p) : null; },
  html:r => statCell(P_(r), k),
  style:r => { const p = P_(r); return COLS[k].tint && relevant(p, k) ? tint(p, k) : ""; }}));
const plyX = (p, extra) => `<div class="ply">${img(p)}${who(p, extra)}</div>`;
const gainCell = v => `<b class="${cls(v)}">${sgn(v)}</b>`;
const readCell = p => sigChips(p).slice(0, 2).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ");
const gradeCell = (g, kind) => `<span class="gr ${kind || (g >= 70 ? "a" : g >= 50 ? "b" : g >= 35 ? "c" : "d")}">${g}</span>`;

/* ---- targets ------------------------------------------------------------------------------*/
function renderTargets(){
  // how hard each position is to replace: the league's last starter against the waiver wire
  $("market").innerHTML = SKILL.map(pos => { const gap = START[pos] ? (START[pos] - REPL[pos]) / START[pos] : 0;
    return `<span class="mk ${gap >= 0.2 ? "r" : gap <= 0.1 ? "g" : ""}" title="${pos}${STARTN[pos]} projects ${f1(START[pos])} a game, the waiver wire ${f1(REPL[pos])}">${pos} ${gap >= 0.2 ? "scarce" : gap <= 0.1 ? "easy to replace" : "average"}</span>`; }).join("");
  const mode = S.tgMode;
  let list = (mode === "buy" ? BUYS : mode === "sell" ? SELLS : DEPTHS).slice();
  if(S.tgPos !== "ALL") list = list.filter(x => x.p.pos === S.tgPos);
  if(mode === "buy" && S.tgSrc) list = list.filter(x => x.p.t === +S.tgSrc);
  if(mode === "depth") list = list.filter(x => x.fit > 0.05 || S.tgPos !== "ALL");
  $("tgsrc").hidden = mode !== "buy";
  $("tgcount").textContent = plural(list.length, "player");
  if(!list.length){
    $("tgscroll").innerHTML = `<div class="chip" style="margin:12px">${mode === "buy" ? "Nobody healthy on another roster would make my lineup better" : mode === "sell" ? "None of my starters is running ahead of his workload" : "No free agent would make my lineup better"}</div>`;
    return;
  }
  const P_ = x => x.p, fits = x => (x.role === "F" ? "My flex" : x.role === "S" ? "My " + x.p.pos + (spots(x.p.pos) > 1 ? x.slot : "") : "Bench");
  const cols = [{k:"name", h:"Player", l:true, v:x => x.p.n, html:x => plyX(x.p, x.p.t && x.p.t !== ME ? `<span class="own">${esc(ownAb(x.p))}</span>` : "")}];
  if(mode === "buy") cols.push(
    {k:"grade", h:"Grade", t:"Half what he adds to my lineup, a quarter his upside, the rest workload and playoff schedule", c:true, v:x => x.grade, html:x => gradeCell(x.grade)},
    {k:"fits", h:"Fits", t:"Where he would play for me", v:x => x.fit, html:x => `<span class="fitc">${fits(x)}</span>`, c:true});
  if(mode === "depth") cols.push({k:"fits", h:"Fits", v:x => x.fit, html:x => `<span class="fitc">${x.role !== "B" ? "Starts for me" : "Bench depth"}</span>`, c:true});
  if(mode === "sell") cols.push(
    {k:"grade", h:"Sell", t:"How far he is running ahead of his workload", c:true, v:x => x.grade, html:x => gradeCell(x.grade, "s")},
    {k:"val", h:"Value", t:"Trade value: points over the waiver wire at his position", v:x => val(x.p), html:x => f1(val(x.p))});
  if(mode !== "sell"){
    if(REG.length) cols.push({k:"reg", h:"+/wk", t:"What he adds to my lineup a week, weeks " + wkSpan(REG), sep:true, v:x => x.d.reg, html:x => gainCell(x.d.reg)});
    if(PO.length) cols.push({k:"pog", h:"+PO", t:"What he adds a week in the playoffs, weeks " + wkSpan(PO), po:true, v:x => x.d.po, html:x => gainCell(x.d.po)});
  }
  if(REG.length) cols.push({k:"ros", h:"ROS", t:COLS.ros.t, sep:true, v:x => x.p.ros, html:x => `<b>${f1(x.p.ros)}</b>`});
  if(PO.length) cols.push({k:"po", h:"PO", t:COLS.po.t, po:true, v:x => x.p.po, html:x => `<b>${f1(x.p.po)}</b>`});
  if(S.tgCols === "stats") cols.push(...statCols(S.tgPos, P_));
  cols.push({k:"read", h:"Read", t:"What his workload, touchdown luck, role and schedule say", sep:true, nosort:true, html:x => readCell(x.p)});
  if(mode === "buy") cols.push({k:"act", h:"", nosort:true, c:true, html:x => `<button class="b go sm" data-a="deal" data-id="${x.p.id}">Deals</button>`});
  if(mode === "sell") cols.push({k:"act", h:"", nosort:true, c:true, html:x => `<button class="b go sm" data-a="shop" data-id="${x.p.id}">Shop</button>`});
  const sk = S.tgSort[mode] || {k:mode === "sell" ? "grade" : "reg", dir:-1};
  if(!cols.some(c => c.k === sk.k)) sk.k = mode === "sell" ? "grade" : "reg";
  $("tgscroll").innerHTML = gridHtml(cols, sortRows(list, cols, sk.k, sk.dir), sk.k, sk.dir);
}

/* ---- waivers --------------------------------------------------------------------------------*/
function renderWaivers(){
  const F = D.faab;
  if(!F){ $("wvscroll").innerHTML = `<div class="chip" style="margin:12px">This league doesn't use FAAB</div>`; return; }
  const left = F.left || {};
  const rivals = D.teams.filter(t => t.id !== ME).sort((a,b) => (left[b.id] || 0) - (left[a.id] || 0));
  $("faab").innerHTML = `<span class="mk g">My FAAB $${left[ME] || 0} of $${F.budget}</span>` +
    rivals.map(t => `<span class="mk" title="${esc(t.name)}">${esc(t.abbrev || t.name)} $${left[t.id] || 0}</span>`).join("");
  let list = WAIV.slice();
  if(S.wvPos !== "ALL") list = list.filter(x => x.p.pos === S.wvPos);
  if(S.wvQ){ const q = S.wvQ.toLowerCase(); list = list.filter(x => (x.p.n + " " + x.p.tm).toLowerCase().includes(q)); }
  if(!S.wvAll) list = list.filter(x => x.bid > 0 || x.p.xp);
  $("wvcount").textContent = plural(list.length, "free agent");
  $("wvall").textContent = S.wvAll ? "Only ones worth a bid" : "Show every free agent";
  const top = WAIV.length ? Math.max(1, ...WAIV.map(x => x.bid)) : 1;
  const lvl = x => (!x.bid ? "d" : x.bid >= top * 0.6 ? "a" : x.bid >= top * 0.3 ? "b" : "c");
  const denom = (REG.length + 1.5 * PO.length) || 1;
  const P_ = x => x.p;
  const cols = [
    {k:"name", h:"Player", l:true, v:x => x.p.n, html:x => plyX(x.p, x.p.xp ? `<span class="xpb" title="Named in ${esc(x.p.xp.join(" and "))}'s waiver show this week; projected on his recent role">EXPERT</span>` : "")},
    {k:"bid", h:"Bid", t:"What beats the rival who wants him most, never more than he is worth to me", c:true, v:x => x.bid, html:x => `<span class="gr ${lvl(x)}">${x.bid ? "$" + x.bid : "–"}</span>`},
    {k:"cap", h:"Max", t:"The most he is worth to me: my FAAB left times his share", v:x => x.cap, html:x => (x.cap ? "$" + x.cap : "–")},
    {k:"rival", h:"Top rival", t:"The team that wants him most, and about what it would pay", v:x => x.rv, html:x => (x.rival ? `${esc(TEAMS[x.rival].abbrev || TEAMS[x.rival].name)} <span class="dimn">~$${x.rv}</span>${x.outbid ? ` <span class="warn" title="Can outbid what he's worth to me">!</span>` : ""}` : `<span class="dimn">–</span>`)},
    {k:"users", h:"Rivals", t:"How many other teams would start him", v:x => x.users, html:x => String(x.users)},
    {k:"fits", h:"Fits", sep:true, v:x => x.g, html:x => `<span class="fitc">${x.role === "B" ? "Bench" : x.role === "F" ? "My flex" : "Starts"}</span>`, c:true},
  ];
  if(REG.length) cols.push({k:"reg", h:"+/wk", t:"What he adds to my lineup a week, weeks " + wkSpan(REG), v:x => x.d.reg, html:x => gainCell(x.d.reg)});
  if(PO.length) cols.push({k:"pog", h:"+PO", t:"What he adds a week in the playoffs", po:true, v:x => x.d.po, html:x => gainCell(x.d.po)});
  if(REG.length) cols.push({k:"ros", h:"ROS", t:COLS.ros.t, sep:true, v:x => x.p.ros, html:x => `<b>${f1(x.p.ros)}</b>`});
  if(PO.length) cols.push({k:"po", h:"PO", t:COLS.po.t, po:true, v:x => x.p.po, html:x => `<b>${f1(x.p.po)}</b>`});
  if(S.wvCols === "stats") cols.push(...statCols(S.wvPos, P_));
  cols.push({k:"drop", h:"Drop", t:"The player whose loss costs my lineup least once he is in (never a starter call or a handcuff)", sep:true, nosort:true,
    html:x => { if(!x.drop || !x.bid) return ""; const dd = x.drop.d.score / denom;
      return `${esc(short(P[x.drop.id]))} <span class="${Math.abs(dd) < 0.05 ? "dimn" : cls(dd)}">${Math.abs(dd) < 0.05 ? "0.0" : sgn(dd)}</span>`; }});
  const sk = S.wvSortK;
  $("wvscroll").innerHTML = gridHtml(cols, sortRows(list, cols, sk.k, sk.dir), sk.k, sk.dir);
}

/* ---- packages -----------------------------------------------------------------------------*/
function renderPackages(){
  const forP = S.pkFor && P[S.pkFor];
  $("pkFor").hidden = !forP;
  if(forP) $("pkFor").textContent = `Deals for ${forP.n}  ×`;
  $("pkTeam").hidden = !!forP;
  if(!forP && SEARCHING){ $("pkscroll").innerHTML = `<div class="chip" style="margin:12px">${SEARCHING}</div>`; $("pkCount").textContent = ""; return; }
  let list = (forP ? FORPK : ALLPK).map((pk, i) => ({pk, i}));
  if(!forP && S.pkTeam) list = list.filter(x => x.pk.teams.includes(+S.pkTeam));
  if(S.pkPos) list = list.filter(x => x.pk.get.some(id => P[id].pos === S.pkPos));
  if(S.pkWill) list = list.filter(x => WORST[x.pk.will] <= WORST[S.pkWill]);
  if(S.pkKind) list = list.filter(x => (S.pkKind === "3") === x.pk.three);
  if(S.pkQ){
    const q = S.pkQ.toLowerCase();
    list = list.filter(x => (x.pk.teams.map(id => TEAMS[id].name + " " + TEAMS[id].abbrev).join(" ") + " " + x.pk.legs.flatMap(l => l.ids).map(id => P[id].n).join(" ")).toLowerCase().includes(q));
  }
  const tier = x => (2 - WORST[x.pk.will]) * 1e5;
  const by = {gain:x => tier(x) + x.pk.me.score, raw:x => x.pk.me.score, po:x => x.pk.me.po, reg:x => x.pk.me.reg, team:x => tier(x) + x.pk.me.score}[S.pkSort];
  list.sort((a,b) => by(b) - by(a));
  if(S.pkSort === "team" && !forP) list.sort((a,b) => TEAMS[a.pk.teams[0]].name.localeCompare(TEAMS[b.pk.teams[0]].name) || by(b) - by(a));
  const total = list.length;
  $("pkCount").textContent = plural(total, "package");
  if(!total){ $("pkscroll").innerHTML = `<div class="chip" style="margin:12px">${forP ? `Nothing for ${esc(forP.n)} makes my lineup better` : "No deal here makes my lineup better"}${S.pkWill || S.pkKind ? " with these filters" : ""}</div>`; return; }
  list = list.slice(0, S.pkLimit);
  const ppl = ids => ids.map(id => { const p = P[id]; return `<div class="pl1"><span class="pos ${p.pos}">${p.pos}</span><span class="pn" title="${esc(p.n)}">${esc(initial(p))}</span>${injBadge(p)}<i>${f1(p.adj)}</i></div>`; }).join("");
  const ab = id => esc(tName(id));
  const cols = [
    {k:"team", h:"Deal", l:true, html:({pk}) => `<div class="dl1">${pk.three ? pk.teams.map(ab).join(" + ") : esc(TEAMS[pk.teams[0]].name)}</div>
      <span class="will ${pk.will}">${WORD[pk.will]}</span>${pk.three ? `<span class="will three">3-team</span>` : ""}`},
    ...(REG.length ? [{k:"reg", h:"+/wk", t:"My lineup, a week, weeks " + wkSpan(REG), html:({pk}) => gainCell(pk.me.reg)}] : []),
    ...(PO.length ? [{k:"pog", h:"+PO", t:"My lineup, a week, playoffs", po:true, html:({pk}) => gainCell(pk.me.po)}] : []),
    {k:"give", h:"I give", sep:true, html:({pk}) => (pk.three ? `<div class="dimn tiny">to ${ab(pk.legs[0].to)}</div>` : "") + ppl(pk.give)},
    {k:"get", h:"I get", html:({pk}) => (pk.three ? `<div class="dimn tiny">from ${ab(pk.legs[2].from)}</div>` : "") + ppl(pk.get)},
    {k:"mid", h:"Middle leg", t:"Three-team deals: what C sends B to make it work", html:({pk}) => (pk.three ? `<div class="dimn tiny">${ab(pk.legs[1].from)} → ${ab(pk.legs[1].to)}</div>${ppl(pk.legs[1].ids)}` : "")},
  ];
  cols.push({k:"why", h:"Why", sep:true, html:({pk}) => pkChips(pk).slice(0, 3).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ")},
    {k:"them", h:"Their lineups", t:"Each other team's lineup a week, rest of season / playoffs", html:({pk}) => pk.sides.map(s => `<div class="tiny">${ab(s.id)} <b class="${cls(s.them.reg)}">${sgn(s.them.reg)}</b> / <b class="${cls(s.them.po)}">${sgn(s.them.po)}</b></div>`).join("")});
  if(!list.some(x => x.pk.three)){ const i = cols.findIndex(c => c.k === "mid"); cols.splice(i, 1); }
  cols.forEach(c => (c.nosort = true));
  $("pkscroll").innerHTML = gridHtml(cols, list, null, -1, ({i}) => ` class="click" data-i="${i}"`) +
    (total > list.length ? `<button class="b more" id="pkmore">Show ${Math.min(40, total - list.length)} more of ${total - list.length}</button>` : "");
}

/* ---- the player table ------------------------------------------------------------------*/

/* ---- judging a trade ---------------------------------------------------------------------
   A deal is read from both rosters, not from two price tags:
   1. Holes. If it leaves either team with fewer startable players at a position than it has
      spots to fill, and it had them before, that side says no. A team with two backs does not
      give one up unless one comes back.
   2. What it is worth TO THEM. A player's value is cut when he would not start for the team
      getting him: full if he starts, 70% if he is their flex, 25% if he would sit. A third
      good back is not worth to them what he is worth on the open market. Their own starters
      cost a premium to pry loose; their bench is cheap. And a starter only moves for a
      starter: if they give up someone in their lineup, someone coming back has to go into it.
   3. Their lineup has to come out ahead too, against the waiver-wire alternative.
   `quick` is the package search: bail at the first failed test. */
const USE = {S:1, F:0.7, B:0.25}, KEEP = {S:1.15, F:0.9, B:0.5};

const WILLF = {likely:1, maybe:0.85, long:0.5};
const tName = id => (id === ME ? "Me" : TEAMS[id].abbrev || TEAMS[id].name);
// one other team's side of a deal: what it gives up, what comes back, and whether it says yes
function sideJudge(tid, out, inn){
  const t = TEAMS[tid], d0 = DEPTH[tid], d = Object.assign({}, d0);
  for(const id of out){ const p = P[id]; if(p.ok) d[p.pos]--; }
  for(const id of inn){ const p = P[id]; if(p.ok) d[p.pos]++; }
  const holes = SKILL.filter(pos => d[pos] < d0[pos] && d[pos] < spots(pos));
  const after = swap(t.players, new Set(out), new Set(inn));
  const them = delta(W0[tid], worth(after));
  const ra = rolesOf(after);
  const inV = inn.reduce((s,id) => s + val(P[id]) * (USE[ra[id]] || 0.45), 0);
  const outV = out.reduce((s,id) => s + val(P[id]) * (KEEP[ROLE0[id]] || 0.75), 0);
  const ratio = outV ? inV / outV : 9;
  const starterBack = !out.some(id => ROLE0[id] === "S") || inn.some(id => ra[id] === "S" || ra[id] === "F");
  const top = a => (a.length ? Math.max(...a.map(id => val(P[id]))) : 0);
  const fairTop = top(inn) >= 0.6 * top(out);          // no pile of lesser players for the best one in the deal
  let will = "long";
  if(!holes.length && starterBack && fairTop){
    if(ratio >= 1.08 && them.score >= 1 && them.reg >= -0.5 && them.po >= -0.5) will = "likely";
    else if(ratio >= 0.88 && them.score >= 0 && them.reg >= -0.75 && them.po >= -0.75) will = "maybe";
  }
  return {id:tid, out, inn, after, d, holes, them, ra, inV, outV, ratio, starterBack, fairTop, will};
}
/* A deal is a list of legs, {from, to, ids}. Two teams: me -> them, them -> me. Three teams is
   a rotation: me -> C, C -> B, B -> me. Every other team is judged on its own roster; the deal's
   answer is the worst of theirs. `quick` drops it early when it does nothing for me. */
function judgeDeal(legs, quick){
  const io = {}, at = id => (io[id] = io[id] || {out:[], inn:[]});
  for(const l of legs){ at(l.from).out.push(...l.ids); at(l.to).inn.push(...l.ids); }
  const m = at(ME), mine = TEAMS[ME].players;
  const mineAfter = swap(mine, new Set(m.out), new Set(m.inn));
  const me = delta(W0[ME], worth(mineAfter, true, true));
  if(quick && me.score < 1) return null;
  const dm = Object.assign({}, DEPTH[ME]);
  for(const id of m.out){ const p = P[id]; if(counts(p, true)) dm[p.pos]--; }
  for(const id of m.inn){ const p = P[id]; if(p.ok) dm[p.pos]++; }
  const holesMe = SKILL.filter(pos => dm[pos] < DEPTH[ME][pos] && dm[pos] < spots(pos));
  const sides = Object.keys(io).map(Number).filter(id => id !== ME).map(id => sideJudge(id, io[id].out, io[id].inn));
  const will = sides.reduce((w, s) => (WORST[s.will] > WORST[w] ? s.will : w), "likely");
  return {legs, sides, teams:sides.map(s => s.id), me, mineAfter, holesMe, dm, rm:rolesOf(mineAfter, true), will,
          give:m.out, get:m.inn, three:sides.length > 1, rank:me.score * WILLF[will]};
}
function sets(ids){
  const out = ids.map(a => [a]);
  for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++) out.push([ids[i], ids[j]]);
  return out;
}
// nobody deals for the injured list: hurt players stay out of the search unless I asked for one
const tradeable = (t, keep) => t.players.filter(id => id === keep || (SKILL.includes(P[id].pos) && P[id].base >= 5 && P[id].af >= 0.75 && (OV[id] || !["O","IR","SUS","D"].includes(P[id].inj))));
const sumV = ids => ids.reduce((s,id) => s + P[id].v, 0);
const maxV = ids => ids.reduce((m,id) => Math.max(m, P[id].v), 0);
const keepV = ids => ids.reduce((s,id) => s + P[id].v * (KEEP[ROLE0[id]] || 0.75), 0);
// would this team be left short anywhere? (the same test sideJudge makes, without the lineup maths)
function holed(tid, out, inn){
  const d0 = DEPTH[tid], d = Object.assign({}, d0);
  for(const id of out){ const p = P[id]; if(p.ok) d[p.pos]--; }
  for(const id of inn){ const p = P[id]; if(p.ok) d[p.pos]++; }
  return SKILL.some(pos => d[pos] < d0[pos] && d[pos] < spots(pos));
}
const key2 = (t, g, r) => t + "|" + g.slice().sort().join() + ">" + r.slice().sort().join();
/* Every deal that makes my lineup better, with every team - no caps. 1-for-1 up to 2-for-2 with
   one team, and three-team rotations where I send one or two players to C, C sends one to B and
   B sends one or two to me. The only thing skipped is the absurd: asking for a player while
   offering under half his value. Returns a list of tasks so the page can run them in slices. */
function packageTasks(only, out){
  const tasks = [], mineT = tradeable(TEAMS[ME]), mySets = sets(mineT), others = D.teams.filter(t => t.id !== ME);
  // what a swap does for my lineup, worked out once per pair and shared by both searches
  const memo = new Map(), mine = TEAMS[ME].players;
  const meGain = (mg, tg) => { const k = mg.join() + ">" + tg.join(); let v = memo.get(k);
    if(v === undefined){ v = delta(W0[ME], worth(swap(mine, new Set(mg), new Set(tg)), true, true)).score; memo.set(k, v); } return v; };
  const onlyT = only ? P[only].t : null;
  // two teams
  for(const t of others){
    if(only && onlyT !== t.id) continue;
    tasks.push(() => {
      let theirs = sets(tradeable(t, only));
      if(only) theirs = theirs.filter(s => s.includes(only));
      for(const tg of theirs){
        const getV = sumV(tg);
        for(const mg of mySets){
          if(sumV(mg) < 0.45 * getV || meGain(mg, tg) < 1) continue;
          const j = judgeDeal([{from:ME, to:t.id, ids:mg}, {from:t.id, to:ME, ids:tg}], true);
          if(j) out.push(j);
        }
      }
    });
  }
  // three teams: for each thing I could send and each thing B could send me, find a C in the
  // middle that wants mine and has what B wants
  for(const B of others){
    if(only && onlyT !== B.id) continue;
    let fromB = sets(tradeable(B, only));
    if(only) fromB = fromB.filter(s => s.includes(only));
    for(const bg of fromB) tasks.push(() => {
      const bV = sumV(bg);
      for(const mg of mySets){
        const mV = sumV(mg);
        if(mV < 0.45 * bV) continue;
        if(meGain(mg, bg) < 1) continue;
        const bKeep = keepV(bg), bTop = maxV(bg), mTop = maxV(mg);
        for(const C of others){

          for(const a of tradeable(C)){
            // exact bounds on what judgeDeal would say, so nothing that could pass is skipped:
            // value only shrinks on the receiving end, and a hole or a lopsided top piece is a no
            const aV = P[a].v;
            if(aV < 0.88 * bKeep || mV < 0.88 * keepV([a]) || aV < 0.6 * bTop || mTop < 0.6 * aV) continue;
            if(holed(B.id, bg, [a]) || holed(C.id, [a], mg)) continue;
            const j = judgeDeal([{from:ME, to:C.id, ids:mg}, {from:C.id, to:B.id, ids:[a]}, {from:B.id, to:ME, ids:bg}], true);
            if(j && j.will !== "long") out.push(j);           // a three-way only earns its place when everyone can say yes

}
/* Drop a deal only when a simpler one is at least as good: the same team, a subset of the same
   players, as big a gain for me and an answer at least as likely. A three-way goes when the
   straight deal with B (same players out, same back) already works as well. */
function prune(list){
  const two = {};
  for(const j of list) if(!j.three) two[key2(j.teams[0], j.give, j.get)] = j;
  const subs = a => (a.length === 2 ? [[a[0]], [a[1]], a] : [a]);
  return list.filter(j => {
    if(j.three){
      const k = two[key2(j.legs[2].from, j.give, j.get)];
      return !(k && WORST[k.will] <= WORST[j.will] && k.me.score >= j.me.score - 0.5);
    }
    for(const g of subs(j.give)) for(const r of subs(j.get)){
      if(g === j.give && r === j.get) continue;
      const k = two[key2(j.teams[0], g, r)];
      if(k && WORST[k.will] <= WORST[j.will] && k.me.score >= j.me.score - 0.5) return false;
    }

function findPackages(only){

function searchPackages(){
  const run = ++SEARCH, out = [], tasks = packageTasks(null, out), n = tasks.length;
  ALLPK = []; SEARCHING = "Searching every team…";
  $("pkn").textContent = ""; if(S.view === "packages" && !S.pkFor) renderPackages();
  if(S.pkFor) FORPK = P[S.pkFor] ? findPackages(S.pkFor) : [];
  const step = () => {
    if(run !== SEARCH) return;
    const t0 = performance.now();
    while(tasks.length && performance.now() - t0 < 25) tasks.shift()();
    if(tasks.length){
      SEARCHING = `Searching every team… ${Math.round(100 * (n - tasks.length) / n)}%`;
      if(S.view === "packages" && !S.pkFor) $("pkscroll").innerHTML = `<div class="chip" style="margin:12px">${SEARCHING}</div>`;
      setTimeout(step, 0); return;
    }
    ALLPK = prune(out); SEARCHING = "";
    $("pkn").textContent = ALLPK.length; renderPackages();
  };

}
// why a deal reads the way it does, as a few coloured words
function pkChips(pk){
  const out = [], seen = new Set();
  const add = (txt, k) => { if(!seen.has(txt)){ seen.add(txt); out.push([txt, k]); } };
  for(const s of pk.sides){
    const ab = tName(s.id);
    for(const pos of s.holes) add(`Leaves ${ab} short at ${pos}`, "r");
    if(!s.starterBack) add(`${ab} loses a starter, gets none`, "r");
    if(!s.fairTop) add(`${ab} gives the best player for less`, "r");
    if(s.holes.length === 0 && s.starterBack && s.fairTop && s.will === "long") add(`Light for ${ab}`, "r");
  }
  for(const s of pk.sides){
    const ab = tName(s.id);
    for(const id of s.inn){ const p = P[id];
      if(p.ok && DEPTH[s.id][p.pos] < spots(p.pos)) add(`Fills ${ab}'s ${p.pos} hole`, "g");
      else if(s.ra[id] === "S") add(`${short(p)} starts for ${ab}`, "g"); }
    for(const id of s.out){ const pos = P[id].pos; if(DEPTH[s.id][pos] > spots(pos)) add(`${ab} deep at ${pos}`, "g"); }
  }
  for(const id of pk.get){ const p = P[id], l = p.sg && p.sg.E >= 0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, "b"); }
  for(const id of pk.give){ const p = P[id], l = p.sg && p.sg.E <= -0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, ""); }
  return out.slice(0, 6);
}

// the legs of whatever is picked in the builder
function builderLegs(){

  const C = +$("partnerA").value;

function renderDeal(){

  const names = ids => ids.map(id => short(P[id])).join(", ");

  const any = legs.some(l => l.ids.length), ready = legs.every(l => l.ids.length);

    for(const s of j.sides){
      const ab = esc(tName(s.id));
      for(const pos of s.holes) line("r", `Leaves ${ab} short at ${pos}: ${s.d[pos]} startable for ${plural(spots(pos), "spot")}`);
      if(!s.fairTop) line("r", `${ab} gives up the best player in its end of the deal for lesser pieces`);
      if(!s.starterBack) line("r", `${ab} gives up a starter and gets none back`);
      if(s.holes.length === 0 && s.starterBack && s.fairTop && s.will === "long") line("r", `${ab} would want more: it gets ${f1(s.inV)} of value for ${f1(s.outV)}`);
      for(const id of s.inn){ const p = P[id], r = s.ra[id];
        if(p.ok && DEPTH[s.id][p.pos] < spots(p.pos)) line("", `${esc(short(p))} fills a hole for ${ab} at ${p.pos}`);
        else if(r === "S") line("", `${esc(short(p))} starts for ${ab}`);
        else if(r === "F") line("a", `${esc(short(p))} would be ${ab}'s flex`);
        else line("r", `${esc(short(p))} would sit on ${ab}'s bench, they don't need him`); }
    }
    for(const pos of j.holesMe) line("r", `Leaves me short at ${pos}: ${j.dm[pos]} startable for ${plural(spots(pos), "spot")}`);
    for(const id of j.get){ const p = P[id], r = j.rm[id];
      line(r === "S" ? "" : "a", `${esc(short(p))} ${r === "S" ? "starts for me" : r === "F" ? "would be my flex" : "would sit on my bench"}`); }
    for(const id of j.give){ const r = roleOf(id); if(r && r.r === "B") line("", `${esc(short(P[id]))} is a bench call for me: losing him costs my lineup nothing`); }
    const over = {[ME]:j.mineAfter}; for(const s of j.sides) over[s.id] = s.after;
    const after = posRanks(over);
    const card = (name, d) => `<div class="dcard"><div class="lab" title="${esc(name)}">${esc(name)}</div>
      ${REG.length ? `<div class="dnum"><b class="${cls(d.reg)}">${sgn(d.reg)}</b><span>wk ${wkSpan(REG)}</span></div>` : ""}
      ${PO.length ? `<div class="dnum"><b class="${cls(d.po)}">${sgn(d.po)}</b><span>wk ${wkSpan(PO)}</span></div>` : ""}</div>`;
    // the lineup after the trade, slot by slot, for whichever team is picked
    const pvTeams = [ME, ...j.teams];
    if(!pvTeams.includes(S.pvSide === "me" ? ME : +S.pvSide)) S.pvSide = "me";
    const pid = S.pvSide === "me" ? ME : +S.pvSide, pvMine = pid === ME;
    const L0 = lineupOf(TEAMS[pid].players, pvMine), L1 = lineupOf(over[pid], pvMine);
    const cellP = p => (p ? `${esc(short(p))}<i>${f1(p.adj)}</i>` : "empty");
    const sum = {}, was = new Set(L0.rows.filter(r => r.p).map(r => r.p.id)), now = new Set(L1.rows.filter(r => r.p).map(r => r.p.id));
    const outs = L0.rows.filter(r => r.p && !now.has(r.p.id));
    L1.rows.forEach((r, i) => { const b = L0.rows[i]; sum[r.slot] = (sum[r.slot] || 0) + (r.p ? r.p.adj : 0) - (b.p ? b.p.adj : 0); });
    const rows = L1.rows.map(r => {
      const chg = !r.p || !was.has(r.p.id);
      let b = {p:r.p};
      if(chg){ const k = outs.findIndex(o => o.slot === r.slot); b = outs.splice(k >= 0 ? k : 0, 1)[0] || {p:null}; }
      const dv = (r.p ? r.p.adj : 0) - (b.p ? b.p.adj : 0);
      return `<div class="lr ${!chg ? "same" : dv >= 0 ? "up" : "dn"}"><span class="sl">${r.slot}</span>${chg ? `<span class="was">${cellP(b.p)}</span>` : ""}<span class="now"${chg ? "" : ' style="grid-column:span 2"'}>${cellP(r.p)}</span><b class="${cls(dv)}">${Math.abs(dv) > 0.05 ? sgn(dv) : ""}</b></div>`;
    }).join("");
    const diff = ["QB","RB","WR","TE","FLEX"].map(k => {
      const a = k === "FLEX" ? null : BASE[pid][k], b = k === "FLEX" ? null : after[pid][k], dv = sum[k] || 0;
      return `<span class="rk ${dv > 0.05 ? "up" : dv < -0.05 ? "dn" : ""}">${k}${a != null ? ` ${ord(a)}${a !== b ? `<i>→</i>${ord(b)}` : ""}` : ""}${Math.abs(dv) > 0.05 ? ` <span class="${cls(dv)}">${sgn(dv)}</span>` : ""}</span>`;
    }).join("");
    const pvBtns = pvTeams.map(id => `<button data-pv="${id === ME ? "me" : id}"${id === pid ? ' class="on"' : ""}>${esc(id === ME ? "Mine" : tName(id))}</button>`).join("");
    const vbars = j.sides.map(s => `<div class="lab" style="margin-top:14px">What it is worth to ${esc(tName(s.id))} &middot; ${WORD[s.will]}</div>
      <div class="vbar"><i style="width:${(s.inV / ((s.inV + s.outV) || 1) * 100).toFixed(0)}%"></i></div>
      <div class="vlab"><span>they get <b>${f1(s.inV)}</b></span><span>they give <b>${f1(s.outV)}</b></span></div>`).join("");
    full += `<div class="call" style="color:${color}">${call}</div>
      <div class="sig">${fl.join("")}</div>
      <div class="pvh"><div class="lab">Lineup after the trade</div>
        <div class="seg pvseg">${pvBtns}</div></div>
      <div class="ranks">${diff}</div>
      <div class="pv">${rows}</div>
      <div class="bench">Bench: ${L1.bench.map(p => esc(short(p))).join(", ") || "nobody"}</div>
      <div class="lab">Lineup points a week, byes and injuries counted</div>
      <div class="dgrid">${card("Mine", j.me)}${j.sides.map(s => card(TEAMS[s.id].name, s.them)).join("")}</div>
      ${vbars}`;
    sumV = `<b style="color:${color}">${call}</b>${REG.length ? `<span class="${cls(j.me.reg)}">${sgn(j.me.reg)}</span>` : ""}${PO.length ? `<span class="${cls(j.me.po)}">${sgn(j.me.po)} PO</span>` : ""}`;
  }
  if(any) full += `<div class="dfoot"><button class="b" id="clear">Clear</button></div>`;
  $("deal").classList.toggle("open", S.dealOpen);
  $("deal").innerHTML = `<button class="dsum" id="dsum"><div class="mid"><div class="who">${sumWho}</div><div class="v">${sumV}</div></div><span class="tog">${S.dealOpen ? "Hide" : "Details"}</span></button>
    <div class="dfull">${full}</div>`;
}

  }

  if(third) $("bseg").querySelector('[data-s="via"]').textContent = `${third.abbrev || "C"} → ${partner.abbrev || "B"}`;

  $("p-theirs").querySelector(".cap").innerHTML = (S.three ? "→ ME &nbsp; " : "") + "ROS &nbsp;&nbsp; PO";
  if(third) $("p-via").querySelector(".cap").innerHTML = `→ ${esc(partner.abbrev || "B")} &nbsp; ROS &nbsp;&nbsp; PO`;
  $("mine").innerHTML = listHtml(TEAMS[ME], give);
  $("theirs").innerHTML = listHtml(partner, get);
  if(third) $("via").innerHTML = listHtml(third, via);
  $("myneed").innerHTML = needsHtml(ME);
  $("pneed").innerHTML = needsHtml(partner.id);
  if(third) $("aneed").innerHTML = needsHtml(third.id);
  r1(); r2(); r3();
  renderDeal();
}
function setSide(side){
  $("bgrid").dataset.side = side;
  $("bseg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.s === side));
}
function setThree(on){
  S.three = on;
  $("bmode").querySelectorAll("button").forEach(x => x.classList.toggle("on", (x.dataset.n === "3") === on));
  if(!on){ via.clear(); if($("bgrid").dataset.side === "via") setSide("theirs"); }
