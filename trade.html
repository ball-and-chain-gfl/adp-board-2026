<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#242c38;--txt:#e6edf3;--dim:#8b949e;--blue:#1f6feb;
  --good:#3fb96f;--bad:#e5645b;--warn:#e0b060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{padding:11px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);z-index:30}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.bar h1{margin:0;font-size:17px;letter-spacing:.2px}
.bar .rec{color:var(--dim);font-size:12.5px;font-weight:600}
.bar .dl{margin-left:auto;color:var(--dim);font-size:11.5px}
.bar .dl b{color:var(--txt)}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
.tab{padding:9px 16px 8px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;position:relative;top:1px;text-decoration:none}
.tab.on{background:var(--bg);color:var(--txt)}
a.tab{background:#0b0f14;color:var(--dim)}
a.tab:hover{color:var(--txt)}
.wrap{flex:1;min-height:0;overflow:auto;padding:16px 20px 40px}
h2{margin:22px 0 9px;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
h2:first-child{margin-top:0}
#msg{color:var(--dim);padding:30px 0;text-align:center}

/* need tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px 10px;border-left-width:3px}
.tile .k{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-top:1px}
.tile .v small{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:3px}
.tile .s{font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.g{border-left-color:var(--good)}.tile.r{border-left-color:var(--bad)}.tile.m{border-left-color:#3a4658}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
th{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);background:#11161d;position:sticky;top:0}
th.l,td.l{text-align:left}
td.l,th.l{position:sticky;left:0;background:var(--panel);z-index:2}
th.l{background:#11161d}
th.sep,td.sep{border-left:1px solid var(--line)}
th.po{color:#9dc4ff}
.ply{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;background:#0b0f14;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.d img{object-fit:contain;padding:3px}
.nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10.5px;color:var(--dim);display:flex;gap:5px;align-items:center}
.pos{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:3px;letter-spacing:.3px}
.QB{background:#3b1f4d;color:#d7a6f5}.RB{background:#12382a;color:#79d69f}.WR{background:#132f52;color:#8fbcf7}
.TE{background:#4a3312;color:#f0b866}.K,.DST{background:#2a303a;color:#aab3c0}
.inj{font-size:9.5px;font-weight:800;color:#fff;background:#b3362f;border-radius:3px;padding:0 4px}
.inj.Q{background:#8a6a1c}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:var(--dim)}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:44px;padding:2px 4px;border-radius:5px;line-height:1.15}
.wkc b{font-size:10.5px;font-weight:700}
.wkc i{font-style:normal;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.wkc.bye b{color:#5b6572}
td.wk{padding:4px 3px;text-align:center}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.tag.core{background:#132f52;border-color:#234a7c;color:#9dc4ff}
.tag.sell{background:#3a1d1b;border-color:#6b2e2a;color:#f09a92}
.tag.buy{background:#10241a;border-color:#1f5138;color:#79d69f}
.tag.up{background:#10241a;border-color:#1f5138;color:#79d69f}
.tag.down{background:#2a2113;border-color:#5a4620;color:var(--warn)}

/* packages */
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--txt);font:inherit;display:block;width:100%}
.pk:hover{border-color:#3a4a63}
.pk .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pk .tm{font-weight:800;font-size:13px}
.pk .tm span{color:var(--dim);font-weight:600;font-size:11px;margin-left:5px}
.pk .gain{font-size:11.5px;font-weight:700;white-space:nowrap}
.pk .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.pk .side .h{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pill{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.pill .av{width:24px;height:24px;flex-basis:24px}
.pill .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pk .side{min-width:0}
.pill .x{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:10px;background:#0b0f14;border:1px solid var(--line);color:#b6c0cc}
.pk .them{margin-top:8px;font-size:11px;color:var(--dim)}

/* builder */
.bhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:9px}
select,button.b{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13px;font-family:inherit}
button.b{cursor:pointer;color:var(--dim);font-weight:600;font-size:12px}
button.b:hover{color:var(--txt)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.col .ch{padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:#11161d;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;color:var(--txt);font:inherit;text-align:left}
.row:last-child{border-bottom:none}
.row:hover{background:#1a212b}
.row.sel{background:#16263f;box-shadow:inset 3px 0 0 var(--blue)}
.row .who{min-width:0;flex:1}
.row .st{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .st b{color:var(--txt);font-size:12.5px}
#verdict{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 22px;align-items:center}
#verdict .call{font-size:15px;font-weight:800;grid-row:span 2;padding-right:6px}
#verdict .lab{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
#verdict .big{font-size:13px;font-weight:700}
#verdict .big span{margin-right:14px;white-space:nowrap}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  header{padding:8px 12px 0}
  .bar h1{font-size:15px}
  .bar .dl{margin-left:0;width:100%}
  .tabs{margin-top:8px}
  .tab{padding:6px 12px 5px;font-size:12px}
  .wrap{padding:12px 12px 40px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pks{grid-template-columns:minmax(0,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
  #verdict{grid-template-columns:1fr}
  #verdict .call{grid-row:auto}
  .nm{max-width:130px}
}
</style></head><body>
<header>
<div class="bar">
  <h1 id="tname">Trade Analyzer</h1><span class="rec" id="trec"></span>
  <span class="dl" id="dl"></span>
</div>
<div class="tabs">
  <a class="tab" href="/">ADP Board</a>
  <div class="tab on">Trade Analyzer</div>
</div>
</header>
<div class="wrap">
<div id="msg">Loading league&hellip;</div>
<div id="app" hidden>
  <h2>Roster need</h2>
  <div class="tiles" id="tiles"></div>

  <h2>My roster</h2>
  <div class="scroll"><table id="rt"><thead></thead><tbody></tbody></table></div>

  <h2>Packages</h2>
  <div class="pks" id="pks"></div>

  <h2 id="bh">Builder</h2>
  <div class="bhead">
    <select id="partner"></select>
    <button class="b" id="clear">Clear</button>
  </div>
  <div class="cols">
    <div class="col"><div class="ch"><span>I give</span><span>PPG &middot; xFP &middot; ROS &middot; PO</span></div><div id="mine"></div></div>
    <div class="col"><div class="ch"><span>I get</span><span>PPG &middot; xFP &middot; ROS &middot; PO</span></div><div id="theirs"></div></div>
  </div>
  <div id="verdict" hidden></div>
</div>
</div>
<script>
let D, P, ME, TEAMS = {}, REG = [], PO = [], REPL = {};
const SKILL = ["QB","RB","WR","TE"];
const give = new Set(), get = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = x => (x == null ? "–" : x.toFixed(1));
const pct = x => (x == null ? "–" : Math.round(x * 100) + "%");
const sgn = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const cls = x => (x > 0.05 ? "pos-n" : x < -0.05 ? "neg-n" : "dimn");
const ord = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);

function img(p){
  const dst = p.pos === "DST";
  const src = dst ? `https://a.espncdn.com/i/teamlogos/nfl/500/${p.tm.toLowerCase()}.png`
                  : `https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png`;
  return `<span class="av${dst ? " d" : ""}"><img src="${src}" alt="" loading="lazy" onerror="this.style.display='none'"></span>`;
}
// opponent colour: ESPN convention, 1 = stingiest defence (red), 32 = softest (green)
function rkBg(rk){
  if(rk == null) return "";
  if(rk <= 10) return `background:rgba(208,52,44,${(0.12 + (11 - rk) * 0.045).toFixed(2)})`;
  if(rk >= 23) return `background:rgba(15,157,79,${(0.12 + (rk - 22) * 0.045).toFixed(2)})`;
  return "background:#1b222c";
}

/* ---- lineup maths ---------------------------------------------------------------------
   A roster's worth is what its best legal lineup scores each remaining week, so byes,
   injuries and depth are all priced in: a bench player only counts in weeks he would start. */
function lineup(ids, wi){
  const by = {QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  for(const id of ids){ const p = P[id]; by[p.pos].push(p.wk[wi].p); }
  let tot = 0; const flex = [];
  for(const pos in by){
    const a = by[pos].sort((x,y) => y - x), n = D.slots[pos] || 0;
    for(let i = 0; i < a.length; i++){
      if(i < n) tot += a[i];
      else if(pos === "RB" || pos === "WR" || pos === "TE") flex.push(a[i]);
    }
  }
  flex.sort((x,y) => y - x);
  for(let i = 0; i < (D.slots.FLEX || 0) && i < flex.length; i++) tot += flex[i];
  return tot;
}
function worth(ids){
  let reg = 0, po = 0;
  for(const wi of REG) reg += lineup(ids, wi);
  for(const wi of PO) po += lineup(ids, wi);
  return {reg, po};
}
const swap = (ids, out, inn) => ids.filter(id => !out.has(id)).concat([...inn]);
// what a deal does to one side, in points per week
function delta(before, after){
  return { reg: REG.length ? (after.reg - before.reg) / REG.length : 0,
           po: PO.length ? (after.po - before.po) / PO.length : 0,
           score: (after.reg - before.reg) + 1.5 * (after.po - before.po) };
}
const avgP = (p, idx) => idx.length ? idx.reduce((s,i) => s + p.wk[i].p, 0) / idx.length : 0;
const avgRk = (p, idx) => { const r = idx.map(i => p.wk[i].rk).filter(x => x != null); return r.length ? r.reduce((a,b)=>a+b,0)/r.length : null; };
// trade-market value: points over the last startable player at the position
function mv(p){
  const v = Math.max(0, p.base - (REPL[p.pos] || 0)) + 1.5;
  return v * (p.inj === "O" || p.inj === "IR" ? 0.6 : p.inj === "D" ? 0.85 : 1);
}
const trend = p => (p.l3 && p.g >= 4 ? p.l3.xfp - p.xfp : 0);

function verdictTag(p, mine){
  if(p.g == null) return "";
  const rankAt = D._rank[p.pos].indexOf(p.id) + 1, coreN = {QB:6,RB:12,WR:12,TE:5}[p.pos];
  if(mine && p.fpoe >= 3 && trend(p) < 1 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag sell">Sell high</span>`;
  if(!mine && p.fpoe <= -2.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag buy">Buy low</span>`;
  if(trend(p) >= 2) return `<span class="tag up">Rising</span>`;
  if(trend(p) <= -2) return `<span class="tag down">Fading</span>`;
  if(rankAt && rankAt <= coreN) return `<span class="tag core">Core</span>`;
  return `<span class="tag">Hold</span>`;
}

function plyCell(p){
  return `<div class="ply">${img(p)}<div style="min-width:0"><div class="nm">${esc(p.n)}</div>
    <div class="meta"><span class="pos ${p.pos}">${p.pos}</span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}${p.inj ? ` <span class="inj ${p.inj}">${p.inj}</span>` : ""}</div></div></div>`;
}

function renderTiles(){
  const myIds = TEAMS[ME].players;
  const html = [];
  // whole-lineup standing, rest of season and playoffs
  const all = D.teams.map(t => ({id:t.id, w:worth(t.players)}));
  const place = (key) => all.slice().sort((a,b) => b.w[key] - a.w[key]).findIndex(x => x.id === ME) + 1;
  const mine = all.find(x => x.id === ME).w;
  const tile = (k, rank, v, s) => `<div class="tile ${rank <= 4 ? "g" : rank >= 9 ? "r" : "m"}"><div class="k">${k}</div>
    <div class="v">${ord(rank)}<small>of ${D.teams.length}</small></div><div class="s">${s}</div></div>`;
  if(REG.length) html.push(tile(`Lineup wk ${D.weeks[REG[0]]}–${D.weeks[REG[REG.length-1]]}`, place("reg"), 0, f1(mine.reg / REG.length) + " / wk"));
  if(PO.length) html.push(tile("Lineup wk 15–17", place("po"), 0, f1(mine.po / PO.length) + " / wk"));
  // by position: my starters' rate against every other team's
  for(const pos of SKILL){
    const n = D.slots[pos] || 1;
    const top = ids => ids.map(id => P[id]).filter(p => p.pos === pos).sort((a,b) => b.base - a.base);
    const val = ids => top(ids).slice(0, n).reduce((s,p) => s + p.base, 0);
    const ranks = D.teams.map(t => ({id:t.id, v:val(t.players)})).sort((a,b) => b.v - a.v);
    const r = ranks.findIndex(x => x.id === ME) + 1;
    const mineTop = top(myIds), next = mineTop[n];
    html.push(tile(pos, r, 0, mineTop.slice(0, n).map(p => p.n.split(" ").slice(-1 - (/ (Jr|Sr|II|III|IV)\.?$/.test(p.n) ? 1 : 0))[0]).join(", ")
      + (next ? ` · next ${f1(next.base)}` : " · no depth")));
  }
  $("tiles").innerHTML = html.join("");
}

function renderRoster(){
  const wkHead = D.weeks.map((w, i) => `<th class="${w >= 15 ? "po" : ""}${i === 0 || w === 15 ? " sep" : ""}">${w}</th>`).join("");
  $("rt").tHead.innerHTML = `<tr><th class="l">Player</th>
    <th title="Points per game, full PPR">PPG</th>
    <th title="Expected points per game from workload: carries, red-zone carries, targets, red-zone targets, air yards">xFP</th>
    <th title="Scored minus expected. Positive = running hot on his workload">+/−</th>
    <th class="sep" title="Share of team offensive snaps">Snap</th>
    <th title="Share of team targets">Tgt</th>
    <th title="Share of team carries">Rush</th>
    <th title="Weighted opportunity rating: 1.5 × target share + 0.7 × air-yard share">WOPR</th>
    <th title="Share of team red-zone carries and targets">RZ</th>
    <th title="Last three games' xFP against the season">Trend</th>
    ${wkHead}
    <th class="sep" title="Projected points per week, rest of regular season">ROS</th>
    <th class="po" title="Projected points per week, weeks 15–17">PO</th><th></th></tr>`;
  const order = {QB:0,RB:1,WR:2,TE:3,K:4,DST:5};
  const rows = TEAMS[ME].players.map(id => P[id]).sort((a,b) => order[a.pos] - order[b.pos] || b.base - a.base);
  $("rt").tBodies[0].innerHTML = rows.map(p => {
    const s = p.g != null, tr = trend(p);
    const wk = p.wk.map((w, i) => `<td class="wk${i === 0 || w.w === 15 ? " sep" : ""}">${
      w.o === "BYE" ? `<span class="wkc bye"><b>BYE</b><i>&nbsp;</i></span>`
      : `<span class="wkc" style="${rkBg(w.rk)}" title="${w.rk ? ord(w.rk) + " vs " + p.pos + " (32nd = softest)" : ""}"><b>${w.o}</b><i>${f1(w.p)}</i></span>`}</td>`).join("");
    return `<tr><td class="l">${plyCell(p)}</td>
      <td class="num">${f1(s ? p.ppg : p.espn)}</td>
      <td class="num">${s ? f1(p.xfp) : "–"}</td>
      <td class="num ${s ? cls(p.fpoe) : "dimn"}">${s ? sgn(p.fpoe) : "–"}</td>
      <td class="num sep">${s ? pct(p.snap) : "–"}</td>
      <td class="num">${s && p.pos !== "QB" ? pct(p.ts) : "–"}</td>
      <td class="num">${s && p.pos !== "QB" && p.cs >= 0.02 ? pct(p.cs) : "–"}</td>
      <td class="num">${s && (p.pos === "WR" || p.pos === "TE") ? p.wopr.toFixed(2) : "–"}</td>
      <td class="num">${s ? pct(p.rz) : "–"}</td>
      <td class="num ${cls(Math.abs(tr) >= 1 ? tr : 0)}" title="${s && p.l3 ? `last 3: ${f1(p.l3.ppg)} PPG, ${f1(p.l3.xfp)} xFP, ${pct(p.l3.snap)} snaps` : ""}">${s && p.g >= 4 ? (tr >= 1 ? "▲ " : tr <= -1 ? "▼ " : "") + sgn(tr) : "–"}</td>
      ${wk}
      <td class="num sep"><b>${f1(avgP(p, REG))}</b></td>
      <td class="num"><b>${f1(avgP(p, PO))}</b></td>
      <td>${verdictTag(p, true)}</td></tr>`;
  }).join("");
}

/* ---- package search --------------------------------------------------------------------
   Every 1-for-1, 2-for-1, 1-for-2 and 2-for-2 with every team. A deal is kept only if the
   other side's lineup gets no worse AND they are not giving up clearly more market value -
   otherwise it is a trade nobody accepts. Ranked by what it adds to my lineup, playoffs 1.5x. */
function sets(ids){
  const out = ids.map(a => [a]);
  for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++) out.push([ids[i], ids[j]]);
  return out;
}
function findPackages(){
  const tradeable = t => t.players.filter(id => SKILL.includes(P[id].pos) && P[id].base >= 5);
  const mine = TEAMS[ME].players, myBase = worth(mine), mySets = sets(tradeable(TEAMS[ME]));
  const found = [];
  for(const t of D.teams){
    if(t.id === ME) continue;
    const tBase = worth(t.players), best = [];
    for(const tg of sets(tradeable(t))){
      const getV = tg.reduce((s,id) => s + mv(P[id]), 0), G = new Set(tg);
      for(const mg of mySets){
        const giveV = mg.reduce((s,id) => s + mv(P[id]), 0);
        if(giveV < 0.85 * getV || giveV > 1.6 * getV) continue;      // lopsided on market value either way
        const O = new Set(mg);
        const me = delta(myBase, worth(swap(mine, O, G)));
        if(me.score < 2) continue;
        const them = delta(tBase, worth(swap(t.players, G, O)));
        // they have to come out ahead overall, and not pay for it in either stretch
        if(them.score < 1 || them.reg < -0.5 || them.po < -0.5) continue;
        best.push({team:t.id, give:mg, get:tg, me, them});
      }
    }
    best.sort((a,b) => b.me.score - a.me.score);
    // two per team, and not the same headline player twice
    const seen = new Set(); let n = 0;
    for(const b of best){
      const head = b.get.slice().sort((x,y) => mv(P[y]) - mv(P[x]))[0];
      if(seen.has(head)) continue;
      seen.add(head); found.push(b);
      if(++n === 2) break;
    }
  }
  found.sort((a,b) => b.me.score - a.me.score);
  return found.slice(0, 12);
}
function chipsFor(pk){
  const out = [];
  for(const id of pk.get){
    const p = P[id], last = p.n.split(" ")[1] || p.n, rk = avgRk(p, PO);
    if(p.fpoe <= -2) out.push(`${last}: ${f1(p.xfp)} xFP vs ${f1(p.ppg)} scored`);
    else if(trend(p) >= 2) out.push(`${last}: usage up ${sgn(trend(p))}`);
    else if(rk != null && rk >= 21) out.push(`${last}: soft wk 15–17`);
    else if(p.snap != null) out.push(`${last}: ${pct(p.snap)} snaps${p.pos === "RB" ? ", " + pct(p.cs) + " carries" : p.pos !== "QB" ? ", " + pct(p.ts) + " tgts" : ""}`);
  }
  for(const id of pk.give){
    const p = P[id], last = p.n.split(" ")[1] || p.n, rk = avgRk(p, PO);
    if(p.fpoe >= 3) out.push(`${last}: ${sgn(p.fpoe)} over xFP`);
    else if(trend(p) <= -2) out.push(`${last}: usage down ${sgn(trend(p))}`);
    else if(rk != null && rk <= 11) out.push(`${last}: tough wk 15–17`);
  }
  return out;
}
function renderPackages(){
  const list = findPackages();
  D._pk = list;
  if(!list.length){ $("pks").innerHTML = `<div class="chip">No deal on the board helps both sides right now</div>`; return; }
  const pill = id => { const p = P[id]; return `<div class="pill">${img(p)}<span class="nm">${esc(p.n)}</span><span class="pos ${p.pos}">${p.pos}</span><span class="x">${f1(avgP(p, REG.concat(PO)))}</span></div>`; };
  $("pks").innerHTML = list.map((pk, i) => {
    const t = TEAMS[pk.team];
    return `<button class="pk" data-i="${i}">
      <div class="top"><div class="tm">${esc(t.name)}<span>${t.w}-${t.l}</span></div>
        <div class="gain"><span class="${cls(pk.me.reg)}">${sgn(pk.me.reg)}/wk</span> &middot; <span class="${cls(pk.me.po)}">${sgn(pk.me.po)} wk 15–17</span></div></div>
      <div class="sides"><div class="side"><div class="h">Give</div>${pk.give.map(pill).join("")}</div>
        <div class="side"><div class="h">Get</div>${pk.get.map(pill).join("")}</div></div>
      <div class="chips">${chipsFor(pk).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      <div class="them">${esc(t.abbrev || "They")} ${sgn(pk.them.reg)}/wk &middot; ${sgn(pk.them.po)} wk 15–17</div>
    </button>`;
  }).join("");
}

/* ---- builder ---------------------------------------------------------------------------*/
function rowHtml(p, on, mine){
  return `<button class="row${on ? " sel" : ""}" data-id="${p.id}">${img(p)}
    <div class="who"><div class="nm">${esc(p.n)}</div><div class="meta"><span class="pos ${p.pos}">${p.pos}</span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}${p.inj ? ` <span class="inj ${p.inj}">${p.inj}</span>` : ""} ${verdictTag(p, mine)}</div></div>
    <div class="st"><b>${f1(p.g != null ? p.ppg : p.espn)}</b> &middot; ${p.g != null ? f1(p.xfp) : "–"} &middot; ${f1(avgP(p, REG))} &middot; ${f1(avgP(p, PO))}</div></button>`;
}
function renderBuilder(){
  const order = {QB:0,RB:1,WR:2,TE:3,K:4,DST:5};
  const list = t => t.players.map(id => P[id]).filter(p => SKILL.includes(p.pos)).sort((a,b) => order[a.pos] - order[b.pos] || b.base - a.base);
  const partner = TEAMS[+$("partner").value];
  $("mine").innerHTML = list(TEAMS[ME]).map(p => rowHtml(p, give.has(p.id), true)).join("");
  $("theirs").innerHTML = list(partner).map(p => rowHtml(p, get.has(p.id), false)).join("");
  const v = $("verdict");
  if(!give.size || !get.size){ v.hidden = true; return; }
  const mine = TEAMS[ME].players;
  const me = delta(worth(mine), worth(swap(mine, give, get)));
  const them = delta(worth(partner.players), worth(swap(partner.players, get, give)));
  const gv = [...give].reduce((s,id) => s + mv(P[id]), 0), tv = [...get].reduce((s,id) => s + mv(P[id]), 0);
  let call, color;
  if(me.score >= 2 && them.score >= 1 && them.reg >= -0.5 && them.po >= -0.5 && gv >= 0.85 * tv){ call = "Send it"; color = "var(--good)"; }
  else if(me.score >= 2){ call = "Good for me, hard sell"; color = "var(--warn)"; }
  else if(me.score > -2){ call = "A wash"; color = "var(--dim)"; }
  else { call = "Pass"; color = "var(--bad)"; }
  const line = d => `<span class="${cls(d.reg)}">${sgn(d.reg)} / wk</span><span class="${cls(d.po)}">${sgn(d.po)} wk 15–17</span>`;
  v.hidden = false;
  v.innerHTML = `<div class="call" style="color:${color}">${call}</div>
    <div class="lab">My lineup</div><div class="lab">${esc(partner.name)}</div>
    <div class="big">${line(me)}</div><div class="big">${line(them)}</div>`;
}

function boot(d){
  D = d; P = d.players; ME = d.me;
  d.teams.forEach(t => (TEAMS[t.id] = t));
  d.weeks.forEach((w, i) => (w >= 15 ? PO : REG).push(i));
  // replacement level and league-wide rank at each position, among rostered players
  D._rank = {};
  for(const pos of SKILL){
    const pool = Object.values(P).filter(p => p.pos === pos).sort((a,b) => b.base - a.base);
    D._rank[pos] = pool.map(p => p.id);
    const n = d.teams.length * ((d.slots[pos] || 1) + (pos === "RB" || pos === "WR" ? 0.5 : 0));
    REPL[pos] = (pool[Math.min(pool.length - 1, Math.round(n))] || {base:0}).base;
  }
  const me = TEAMS[ME];
  $("tname").textContent = me.name;
  $("trec").textContent = `${me.w}-${me.l}`;
  if(d.deadline){
    const days = Math.ceil((d.deadline - Date.now()) / 864e5);
    $("dl").innerHTML = days >= 0 ? `Trade deadline <b>${new Date(d.deadline).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</b> &middot; ${days} day${days === 1 ? "" : "s"}` : "Trade deadline passed";
  }
  $("partner").innerHTML = d.teams.filter(t => t.id !== ME).sort((a,b) => a.name.localeCompare(b.name))
    .map(t => `<option value="${t.id}">${esc(t.name)} (${t.w}-${t.l})</option>`).join("");
  $("msg").hidden = true; $("app").hidden = false;
  renderTiles(); renderRoster(); renderBuilder();
  $("pks").innerHTML = `<div class="chip">Searching every team&hellip;</div>`;
  setTimeout(renderPackages, 30);

  $("partner").onchange = () => { get.clear(); renderBuilder(); };
  $("clear").onclick = () => { give.clear(); get.clear(); renderBuilder(); };
  const toggle = (set) => e => {
    const r = e.target.closest(".row"); if(!r) return;
    const id = +r.dataset.id; set.has(id) ? set.delete(id) : set.add(id); renderBuilder();
  };
  $("mine").onclick = toggle(give); $("theirs").onclick = toggle(get);
  $("pks").onclick = e => {
    const c = e.target.closest(".pk"); if(!c) return;
    const pk = D._pk[+c.dataset.i];
    give.clear(); get.clear(); pk.give.forEach(id => give.add(id)); pk.get.forEach(id => get.add(id));
    $("partner").value = pk.team; renderBuilder();
    $("bh").scrollIntoView({behavior:"smooth", block:"start"});
  };
}

fetch("/api/trade").then(r => r.json()).then(d => {
  if(d.error) throw new Error(d.error);
  boot(d);
}).catch(e => { $("msg").textContent = "Couldn't load league data (" + e.message + ")"; console.warn(e); });
</script></body></html>
