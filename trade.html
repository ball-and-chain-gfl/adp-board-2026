<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
/* Light theme in the manner of a fantasy-sports site: white panels on a light grey page, a dark
   top bar, one blue for "do this", green = good for me, red = bad for me, amber = maybe. */
:root{--bg:#eef0f2;--panel:#fff;--panel2:#f6f7f8;--line:#dcdee1;--line2:#e9ebed;--txt:#1b1d1f;--soft:#3f4246;--dim:#6b6f74;
  --blue:#0b6fd0;--blue2:#e7f1fc;--good:#0a7f3f;--good2:#e4f4ea;--bad:#c8102e;--bad2:#fbe7ea;--warn:#a86500;--warn2:#fdf1dc;
  --ink:#1d1e20;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
a{color:var(--blue)}

/* top: a dark site bar with the two tools, then my team */
header{background:var(--panel);z-index:30;flex:none;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;background:var(--ink);padding:0 20px}
.tab{padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.3px;text-decoration:none;color:#b9bcc0;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--blue)}
a.tab:hover{color:#fff}

/* section switch: text tabs with a blue underline */
.sub{display:flex;gap:4px;padding:0 20px;flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.sub button{font-size:14px;font-weight:700;padding:11px 14px 9px;border:0;border-bottom:3px solid transparent;background:none;color:var(--soft);cursor:pointer;white-space:nowrap}
.sub button:hover{color:var(--blue)}
.sub button.on{color:var(--blue);border-bottom-color:var(--blue)}
.sub button span{font-weight:600;color:var(--dim);margin-left:4px;font-size:12.5px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px 18px;overflow-y:auto}
#msg{color:var(--dim);padding:40px 0;text-align:center;font-size:15px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:16px 0 8px;font-size:16px;font-weight:800;flex:none}
.sect-h:first-child{margin-top:0}
.sect-h span{font-size:12.5px;font-weight:600;color:var(--dim)}

/* controls */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px;flex:none}
.view > .tools:first-child{margin-top:0}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13.5px}
select{cursor:pointer}
input[type=search]{width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--line);color:var(--soft);padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel2)}
.seg button.on{background:var(--blue);color:#fff}
button.b{background:var(--panel);border:1px solid var(--line);color:var(--soft);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
button.b:hover{border-color:var(--blue);color:var(--blue)}
button.b.go{background:var(--blue);border-color:var(--blue);color:#fff}
button.b.go:hover{background:#095db0}
button.b.sm{padding:5px 10px;font-size:12px}
.count{color:var(--dim);font-size:12.5px;margin-left:auto}
.more{display:block;margin:14px auto;padding:10px 18px}

/* people and teams */
.av{width:46px;height:46px;flex:0 0 46px;border-radius:10px;overflow:hidden;background:#e3e6e9;border:1px solid var(--line);display:block}
.av.QB{background:#e7d6f7}.av.RB{background:#d3eedd}.av.WR{background:#d6e6f8}.av.TE{background:#f8e3c4}.av.K,.av.DST{background:#e3e6e9}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
.av.d img{object-fit:contain;padding:5px}
.av.xl{width:104px;height:104px;flex-basis:104px;border-radius:14px}
[data-pid]{cursor:pointer}
.nm[data-pid]:hover,.tpn[data-pid]:hover{color:var(--blue);text-decoration:underline}
.tlg{position:relative;width:24px;height:24px;flex:0 0 24px;border-radius:50%;overflow:hidden;background:#d5d9de;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--soft);vertical-align:middle}
.tlg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta > *{white-space:nowrap}
.pos{font-size:10px;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:.3px}
.QB{background:#f1e6fb;color:#6d2fa6}.RB{background:#e2f4ea;color:#126b3e}.WR{background:#e4effb;color:#1958a0}
.TE{background:#fcefdc;color:#94520a}.K,.DST{background:#eceef0;color:#555a60}
.inj{font-size:10px;font-weight:800;color:#fff;background:var(--bad);border-radius:3px;padding:0 5px;white-space:nowrap}
.inj.Q{background:#c98200}
.byeb{font-size:10px;font-weight:800;color:#6b4a00;background:var(--warn2);border-radius:3px;padding:0 5px;white-space:nowrap}
.inj.man{background:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:#9a9ea3}
.own{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--soft)}
.own .tlg{width:16px;height:16px;flex-basis:16px;font-size:7px}
.own.fa{color:#9a9ea3}
.need{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--soft);white-space:nowrap;border:1px solid var(--line)}
.need.g{background:var(--good2);color:var(--good);border-color:transparent}.need.r{background:var(--bad2);color:var(--bad);border-color:transparent}
.needs{display:flex;flex-wrap:wrap;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.g{background:var(--good2);border-color:transparent;color:var(--good)}
.chip.r{background:var(--bad2);border-color:transparent;color:var(--bad)}
.chip.a{background:var(--warn2);border-color:transparent;color:var(--warn)}
.chip.b{background:var(--blue2);border-color:transparent;color:var(--blue)}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:52px;padding:3px 6px;border-radius:5px;line-height:1.2;flex:none}
.wkc em{font-style:normal;font-size:9.5px;font-weight:800;color:var(--dim);text-transform:uppercase}
.wkc b{font-size:12px;font-weight:700}
.wkc i{font-style:normal;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.wkc.bye b,.wkc.out b{color:#9a9ea3}
.wkc.out i{color:var(--bad);font-weight:800;font-size:10.5px}
select.st,select.rl{padding:4px 6px;font-size:12.5px;font-weight:700;border-radius:5px;color:var(--soft);max-width:176px}
select.st.Q{border-color:#e0a800;color:var(--warn)}
select.st.D,select.st.O,select.st.IR,select.st.SUS{border-color:#e7a0aa;color:var(--bad)}
select.st.man{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
select.rl.on{border-color:#e0a800;background:var(--warn2);color:var(--warn)}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.rtag{font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:3px;padding:0 5px;white-space:nowrap}
.rtag.S{background:var(--blue2);color:var(--blue)}.rtag.B{background:#eceef0;color:#555a60}.rtag.C{background:var(--warn2);color:var(--warn)}
.xpb{font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:3px;padding:0 5px;background:#ece7fb;color:#5b3fb8;white-space:nowrap}
.warn{color:var(--warn);font-weight:800}
.market{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;flex:none}
.mini{font-size:10.5px;font-weight:700;padding:3px 5px;border-radius:4px;min-width:38px;text-align:center}

/* grades, answers, outlook */
.gr{display:inline-block;min-width:36px;padding:3px 7px;border-radius:5px;font-weight:800;font-size:13px;text-align:center}
.gr.a{background:var(--good);color:#fff}.gr.b{background:#5a9a2a;color:#fff}.gr.c{background:#c98200;color:#fff}.gr.d{background:#e3e6e9;color:var(--soft)}.gr.s{background:var(--bad);color:#fff}
.will{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.will.likely{background:var(--good2);color:var(--good)}.will.maybe{background:var(--warn2);color:var(--warn)}.will.long{background:#eceef0;color:#6b6f74}
.will.three{background:#ece7fb;color:#5b3fb8}
.ol{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:4px;white-space:nowrap}
.ol.target{background:var(--good);color:#fff}.ol.avoid{background:var(--bad);color:#fff}
.ol.sell{background:#d86a00;color:#fff}.ol.core{background:var(--blue);color:#fff}.ol.hold{background:#e3e6e9;color:var(--soft)}
td:has(> .olw){text-align:left}
.pt{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pt.up2,.pt.t1{background:var(--good);color:#fff}.pt.up1,.pt.t2{background:var(--good2);color:var(--good)}
.pt.t3{background:var(--warn2);color:var(--warn)}.pt.even,.pt.out,.pt.t4{background:#eceef0;color:#6b6f74}
.pt.down{background:var(--bad2);color:var(--bad)}
.pt.sm{font-size:9.5px;padding:1px 5px}
.hint2{font-size:12.5px;color:var(--dim);margin:0 0 10px;flex:none}
details.hab{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;flex:none}
details.hab summary{cursor:pointer;padding:10px 13px;font-weight:800;font-size:14px;list-style:none;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
details.hab summary::-webkit-details-marker{display:none}
details.hab summary span{font-weight:600;font-size:12.5px;color:var(--dim)}
details.hab summary span b{color:var(--good)}
details.hab summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:700;color:var(--blue)}
details.hab[open] summary::after{content:"Hide"}
details.hab .scroll{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px;max-height:none}
details.hab td{vertical-align:top;line-height:1.5}
/* the player card */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,18,22,.55);overflow-y:auto;padding:24px 14px;display:flex;justify-content:center;align-items:flex-start}
.mbox{position:relative;background:var(--panel);border-radius:14px;width:100%;max-width:560px;padding:18px 18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1;cursor:pointer;color:var(--soft)}
.mclose:hover{border-color:var(--blue);color:var(--blue)}
.pct{display:flex;gap:14px;align-items:center;padding-right:34px}
.pcid{min-width:0}
.pcid h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.pcid .own{margin-top:6px;font-size:12.5px}
.pcid .own .tlg{width:18px;height:18px;flex-basis:18px;font-size:7px}
.pcls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pcl{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.pcl .lab{margin-bottom:5px}
.pcl .pt{font-size:14px;padding:4px 10px}
.pcl .olw{max-width:none;font-size:12px}
.pcns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.pcn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;line-height:1.2}
.pcn b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pcn span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.pcn i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:2px}
.pcwv{margin-top:10px;font-size:13px;color:var(--soft)}
.pch{margin:16px 0 7px;font-size:13px;font-weight:800;letter-spacing:.2px}
.pch span{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:6px}
.pcsched{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pcw{display:grid;grid-template-columns:52px 74px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:13.5px}
.pcw:last-child{border-bottom:0}
.pcw .wk{font-size:11.5px;font-weight:800;color:var(--dim)}
.pcw .op{font-weight:800;text-align:center;border-radius:5px;padding:3px 4px;background:#eef0f2}
.pcw .mr{font-size:12px;color:var(--dim)}
.pcw b{text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
.pcw.po{box-shadow:inset 3px 0 0 #1958a0}
.pcw.po .wk{color:#1958a0}
.pcw.off b,.pcw.off .op{color:#9a9ea3}
.pcw.tot{background:var(--panel2);font-weight:800}
.pchow{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--soft);background:var(--blue2);border-radius:8px;padding:9px 11px}
.pclog{display:flex;gap:4px;align-items:flex-end;height:92px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pcb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.pcb em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--soft)}
.pcb i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;background:var(--blue)}
.pcb.none i{background:#d5d9de}
.pcb span{font-size:10px;color:var(--dim)}
.pcctl{display:flex;flex-wrap:wrap;gap:8px}
.pcctl select{max-width:none;flex:1 1 180px;padding:7px 8px}
.pcact{margin-top:16px;display:flex}
.pcact .b{flex:1;padding:11px;font-size:14px}
/* phone rows: an arrow opens the rest underneath */
.xb{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--blue);font-size:13px;cursor:pointer;padding:0;line-height:1}
.xb.on{background:var(--blue);color:#fff;border-color:var(--blue);transform:rotate(180deg)}
.xc{width:36px;padding-left:0!important;padding-right:6px!important}
tr.dt > td{background:var(--panel2)!important;padding:10px!important;white-space:normal;text-align:left}
.dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dc{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;min-width:0;text-align:left}
.dc.w{grid-column:1/-1}
.dc > span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.dc > div{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere}
.dc.ctl > div{display:flex;flex-wrap:wrap;gap:6px}
.dc.ctl select{max-width:none;flex:1 1 140px}
.dc .olw{max-width:none}
.wks{display:flex;flex-wrap:wrap;gap:4px}
.lr em.pos{font-style:normal}
.top1 .rp{font-size:12px;color:var(--dim)}
.top1 .rp b{color:var(--txt)}
.olw{display:block;font-size:11px;color:var(--dim);margin-top:3px;max-width:190px;white-space:normal;line-height:1.25}
tr.o-up td.l{box-shadow:inset 4px 0 0 var(--good)}

/* my needs: one tile per spot in the lineup */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 11px;border-top:4px solid #c3c8ce;min-width:0;text-align:left;color:var(--txt)}
button.tile{cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
button.tile:hover{border-color:var(--blue)}
button.tile.on{outline:2px solid var(--blue);outline-offset:-1px}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tile .k em{font-style:normal;font-size:10px;letter-spacing:.4px;padding:1px 7px;border-radius:3px;background:#eceef0;color:var(--soft)}
.tile.g .k em{background:var(--good2);color:var(--good)}.tile.r .k em{background:var(--bad);color:#fff}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
.strip{display:flex;gap:3px;margin:6px 0 7px}
.strip i{flex:1;height:5px;border-radius:2px;background:#e3e6e9}
.strip i.me{background:var(--txt)}
.tile.g .strip i.me{background:var(--good)}.tile.r .strip i.me{background:var(--bad)}
.tile .v .rkn{font-weight:800}.rkn.g{color:var(--good)}.rkn.r{color:var(--bad)}
.tps{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.tp{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.tp .av{width:34px;height:34px;flex-basis:34px;border-radius:8px}
.tp .tpn{flex:1;min-width:0;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tp b{font-variant-numeric:tabular-nums;color:var(--soft)}
.tbig{font-size:20px;font-weight:800;margin-bottom:4px}
.tbig small{font-size:11px;font-weight:700;color:var(--dim);margin-left:4px}
.tile .s2{font-size:11.5px;color:var(--dim);line-height:1.3}
/* the roster, one table per position */
.ptab{margin-bottom:14px}
.ptab-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--dim);font-weight:700}
.ptab-h .pos{font-size:12px;padding:2px 8px}
.ptab .scroll{max-height:none}
.tile .s3{font-size:11.5px;font-weight:700;color:var(--blue);margin-top:4px}

/* top targets */
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;flex:none}
.top1{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--txt);min-width:0}
.top1:hover{border-color:var(--blue);border-left-color:var(--good)}
.top1 .hd{display:flex;gap:10px;align-items:center;min-width:0}
.top1 .hd .av{width:64px;height:64px;flex-basis:64px;border-radius:12px}
.top1 .who{flex:1;min-width:0}
.top1 .nm{font-size:15px}
.top1 .nums{display:flex;gap:16px;align-items:baseline}
.top1 .nums div{display:flex;flex-direction:column;line-height:1.1}
.top1 .nums b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.top1 .nums span{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.top1 .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--blue)}

/* tables */
/* a table is as tall as its rows, up to most of the screen, then scrolls inside */
.scroll{flex:none;max-height:74vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.scroll table{width:auto;min-width:100%}
/* everything sits in a centred column instead of running edge to edge */
.view > *{width:100%;max-width:1180px;margin-left:auto;margin-right:auto}
.tm{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.tm.long{background:var(--good2);color:var(--good)}.tm.short{background:var(--warn2);color:var(--warn)}.tm.fill,.tm.none{background:#eceef0;color:#6b6f74}
.tmw{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.opt.pick{padding:4px 6px}
.opt.pick .av{width:30px;height:30px;flex-basis:30px;border-radius:7px}
.opt .ck{width:14px;height:14px;flex:0 0 14px;border:1.5px solid #9aa0a6;border-radius:3px;background:#fff}
.opt.pick.on .ck{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 2px #fff}
.lnk{background:none;border:0;padding:0;margin-left:6px;color:var(--blue);font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);background:#f6f7f8;position:sticky;top:0;z-index:3;padding:8px 10px;user-select:none;border-bottom:1px solid var(--line)}
th.sort{cursor:pointer}
th.sort:hover{color:var(--blue)}
th.on{color:var(--txt)}
th .ar{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}
th.l,td.l{text-align:left;position:sticky;left:0;z-index:2;background:var(--panel)}
th.l{z-index:4;background:#f6f7f8}
th.po{color:#1958a0}
th.c,td.c{text-align:center}
.sep{border-left:1px solid var(--line2)}
tbody tr:hover td{background:#f4f8fd}
tr.me td.l{box-shadow:inset 4px 0 0 var(--blue)}
tr.click{cursor:pointer}
.ply{display:flex;align-items:center;gap:10px;min-width:0}
.spk{display:block;margin-left:auto}
td.wk{padding:5px 4px;text-align:center}
.fitc{font-size:12.5px;font-weight:700;color:var(--soft)}
td .chip{font-size:11px;padding:1px 7px}
.go-r{color:var(--blue);font-weight:800;font-size:16px}

/* packages: filters on the left, deals on the right */
.pkwrap{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
.pkside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;align-self:start;max-height:100%}
.fl .lab{margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--soft)}
.opt:hover{background:var(--panel2)}
.opt.on{background:var(--blue2);color:var(--blue);font-weight:700}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--dim);font-weight:600}
.opt .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkside .seg{display:flex}
.pkside .seg button{flex:1;padding:6px 4px}
.pkside input[type=search],.pkside select{width:100%}
.pkmain{min-height:0;overflow:auto;display:flex;flex-direction:column}
.pkhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;flex:none}
.pkhead .count{margin-left:0;flex:none!important;text-align:left!important}
.pkhead .chips{flex:1}
#pkFilt{display:none}
.pkl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;align-items:start;max-width:760px}
.pkc{background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0;display:flex;flex-direction:column;text-align:left;color:var(--txt);padding:0}
.pkc:hover{border-color:var(--blue);box-shadow:0 1px 6px rgba(11,111,208,.12)}
.pkc-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.pkc-t{flex:1;min-width:0}
.pkc-t .tn{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;min-width:0}
.pkc-t .tn span.x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkc-t .sub2{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pkc-t .sub2 .rec{font-size:11.5px;color:var(--dim);font-weight:700}
.pkc-g{display:flex;gap:12px;flex:none}
.pkc-g div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.pkc-g b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.pkc-g span{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.pkc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.pkc-b.three{grid-template-columns:minmax(0,1fr)}
.leg{padding:9px 12px;min-width:0}
.pkc-b:not(.three) .leg + .leg{border-left:1px solid var(--line2)}
.pkc-b.three .leg + .leg{border-top:1px solid var(--line2)}
.leg .lh{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.leg .lh .tlg{width:16px;height:16px;flex-basis:16px;font-size:7px}
.leg.get .lh{color:var(--good)}.leg.give .lh{color:var(--bad)}
.pr{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 0}
.pr .av{width:46px;height:46px;flex-basis:46px}
.pr .who{flex:1;min-width:0}
.pr .nm{font-size:13.5px}
.pr .pts{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--soft)}
.pkc-f{padding:8px 12px 10px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:0 0 8px 8px}
.pkc-f .them{font-size:12px;color:var(--dim)}
.pkc-f .them b{font-weight:700}

/* builder: my players | the deal | their players, each scrolling on its own */
.bseg{display:none;margin-bottom:10px;flex:none}
.bgrid{flex:1 0 auto;height:0;min-height:min(520px,78vh);display:grid;grid-template-columns:minmax(270px,360px) minmax(300px,540px) minmax(270px,360px);gap:12px;justify-content:center}
.rcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.rcol .pane{flex:1}
.bmode{margin-bottom:10px;flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bmode .hint{font-size:12.5px;color:var(--dim)}
.dsides.three{grid-template-columns:1fr 1fr 1fr}
@container (max-width:420px){ .dsides.three{grid-template-columns:1fr} }
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ph{padding:9px 10px;background:#f6f7f8;border-bottom:1px solid var(--line);flex:none}
.ph .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b.h{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.ph select{flex:1;min-width:0;padding:6px 8px;font-weight:700}
.ph .cap{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--dim);white-space:nowrap}
.ph .needs{margin-top:7px}
.plist{flex:1;min-height:0;overflow:auto}
.grp{padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);background:#f6f7f8;border-bottom:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:none;color:var(--txt);text-align:left}
.row:hover{background:#f4f8fd}
.row.sel{background:var(--blue2);box-shadow:inset 4px 0 0 var(--blue)}
.row .av{width:38px;height:38px;flex-basis:38px;border-radius:8px}
.row .who{min-width:0;flex:1}
.row .nm{font-size:13.5px;display:block}
.row .meta{gap:3px 6px;margin-top:1px}
.row .ol{font-size:9.5px;padding:1px 5px}
.row .n2{display:flex;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;flex:none}
.row .n2 span{width:42px;text-align:right}
.row .n2 span + span{color:#1958a0}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;min-height:0;container-type:inline-size}
@container (max-width:330px){ .dsides,.dgrid{grid-template-columns:1fr} }
.dsum{display:none}
.dsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px 10px;min-height:74px;min-width:0}
.dchips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.dchip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;min-width:0;color:var(--txt);text-align:left}
.dchip:hover{border-color:var(--bad)}
.dchip .nm{font-size:13.5px;flex:1;min-width:0}
.dchip .x{color:var(--dim);font-weight:800;font-size:14px}
.dempty{color:var(--dim);text-align:center;padding:26px 0 18px;font-size:14px}
.call{font-size:22px;font-weight:800;margin:14px 0 10px;letter-spacing:-.2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dcard{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:9px 11px 10px;min-width:0}
.dcard .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnum{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.dnum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.dnum span{font-size:12.5px;color:var(--dim);white-space:nowrap}
.deal .sig{margin:7px 0 14px}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rk{font-size:12.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:4px 9px;white-space:nowrap}
.rk i{font-style:normal;color:var(--dim);font-weight:600;margin:0 3px}
.rk.up{background:var(--good2);border-color:transparent}.rk.dn{background:var(--bad2);border-color:transparent}
.vbar{height:8px;border-radius:4px;background:#b9cde4;overflow:hidden;margin-top:7px;display:flex}
.vbar i{background:var(--blue)}
.vlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.vlab b{color:var(--txt)}
.dfoot{margin-top:14px;display:flex;justify-content:flex-end}
.sig{display:flex;flex-direction:column;gap:6px}
.sg{display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.3}
.sg i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--good)}
.sg.r i{background:var(--bad)}.sg.a i{background:#e0a800}
.sg.r span{color:var(--bad)}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.pvseg button{padding:5px 11px;font-size:12px}
.pv{margin:2px 0 6px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lr{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line2);font-size:13px}
.lr:last-child{border-bottom:0}
.lr .sl{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim)}
.lr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr i{font-style:normal;color:var(--dim);font-size:12px;margin-left:3px;font-variant-numeric:tabular-nums}
.lr .was{color:var(--dim);text-decoration:line-through}
.lr .now{font-weight:700}
.lr.same .now{font-weight:600;color:var(--soft)}
.lr.up{background:var(--good2)}.lr.dn{background:var(--bad2)}
.lr > b{text-align:right;font-variant-numeric:tabular-nums}
.bench{font-size:12px;color:var(--dim);margin-bottom:14px}

@media (max-width:1100px){
  .tiles{gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{padding:9px 10px 10px}
  .bgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)}
  .pkwrap{grid-template-columns:210px minmax(0,1fr)}
  .pkl{grid-template-columns:minmax(0,1fr)}
}

/* ---- phones ------------------------------------------------------------------------------
   Sections move to a bar along the bottom, tables scroll sideways inside their box with the
   player column pinned, filters fold behind a button, and the builder keeps the deal pinned
   under the roster list. */
@media (max-width:820px){
  .tabs{padding:0 10px}
  .tab{padding:7px 10px;font-size:12px}
  .sub{order:3;padding:0 4px env(safe-area-inset-bottom);gap:0;border-top:1px solid var(--line);border-bottom:0}
  .sub button{flex:1;padding:12px 2px 10px;font-size:12.5px;min-width:0;border-bottom:0;border-top:3px solid transparent}
  .sub button.on{border-top-color:var(--blue)}
  .sub button span{display:none}
  .view{padding:10px 10px 14px}
  .tools{gap:6px;margin:10px 0 8px}
  .tools select{flex:1 1 40%;min-width:0}
  .tools .seg{display:flex;width:100%}
  .tools .seg button{flex:1 1 0;padding:8px 4px;font-size:12.5px;white-space:normal;line-height:1.15;min-width:0}
  #tgcols,#wvcols,#colsf{display:none}
  input[type=search]{flex:1 1 100%;width:auto}
  .count{flex:1 1 100%;margin:0;text-align:right}
  .modal{padding:0;align-items:flex-end}
  .mbox{border-radius:16px 16px 0 0;max-width:none;padding:16px 14px 22px;max-height:94dvh;overflow-y:auto}
  .av.xl{width:84px;height:84px;flex-basis:84px}
  .pcid h2{font-size:19px}
  .pcw{grid-template-columns:44px 64px minmax(0,1fr) 50px;padding:6px 8px}
  /* nothing scrolls sideways and nothing scrolls inside something else: the page is the only scroller */
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:8px 9px 9px}
  .tile .v{font-size:20px}
  .tile .s2{display:none}
  .tile .k{letter-spacing:.3px;font-size:10.5px;white-space:normal}
  .tops{grid-template-columns:minmax(0,1fr);gap:8px}
  .top1{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 10px}
  .top1 .hd{grid-column:1/-1}
  .top1 .hd .av{width:56px;height:56px;flex-basis:56px}
  .top1 .nums b{font-size:16px}
  .top1 .rp{grid-column:1/-1;order:3}
  .top1 .ft{align-self:center}
  .top1 .ft span:last-child{display:none}
  .scroll{max-height:none;overflow:visible}
  .scroll table{width:100%;min-width:0}
  th,td{padding:7px 6px}
  th.l,td.l{position:static;white-space:normal}
  .ply{gap:8px;align-items:flex-start}
  .ply .nm{max-width:none;white-space:normal;line-height:1.2;overflow-wrap:anywhere}
  .av{width:42px;height:42px;flex-basis:42px}
  .olw{max-width:104px}
  td:has(> .olw){white-space:normal}
  details.hab td{font-size:13px}
  select.st,select.rl{padding:6px 6px;font-size:13px;max-width:130px}
  /* packages */
  .pkwrap{display:flex;flex-direction:column;gap:10px;overflow:visible}
  .pkside{display:none;max-height:none}
  .pkwrap.filt .pkside{display:flex}
  #pkFilt{display:inline-block}
  .pkmain{overflow:visible}
  .pkl{grid-template-columns:minmax(0,1fr);gap:10px}
  .pkc-b{grid-template-columns:minmax(0,1fr)}
  .pkc-b:not(.three) .leg + .leg{border-left:0;border-top:1px solid var(--line2)}
  /* builder */
  .rcol{flex:1;gap:8px}
  .bgrid[data-side=mine] .rcol,.bgrid[data-side=theirs] #p-via,.bgrid[data-side=via] #p-theirs{display:none}
  .bgrid[data-side=mine] #p-mine{display:flex}
  .bgrid[data-side=theirs] #p-mine,.bgrid[data-side=via] #p-mine{display:none}
  .bmode{margin-bottom:8px}
  .bmode .hint{display:none}
  #v-builder{overflow:hidden;padding-bottom:8px}
  .bseg{display:flex;width:100%}
  .bseg button{flex:1;padding:9px 6px}
  .bgrid{display:flex;flex-direction:column;gap:8px;height:auto;min-height:0;flex:1}
  .pane{flex:1}
  .row{padding:8px 10px}
  .deal{order:9;flex:none;padding:0;overflow:visible}
  .dsum{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer;color:var(--txt)}
  .dsum .mid{flex:1;min-width:0}
  .dsum .who{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsum .v{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsum .v span{font-size:12.5px;font-weight:700;margin-left:8px}
  .dsum .tog{flex:none;font-size:12px;font-weight:800;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
  .dfull{display:none;padding:0 12px 12px;max-height:48vh;overflow:auto;border-top:1px solid var(--line)}
  .deal.open .dfull{display:block;padding-top:12px}
  .call{font-size:18px;margin:10px 0 8px}
  .dnum b{font-size:17px;min-width:46px}
  .dside{min-height:0}
}

/* ==== photos: rounded tiles on the position's colour; top targets keep the full-height fade == */
.av{border:0}
.av.QB{background:linear-gradient(135deg,#d4baf0,#efe3fb)}.av.RB{background:linear-gradient(135deg,#b5e2c8,#e2f4ea)}
.av.WR{background:linear-gradient(135deg,#b9d4f4,#e4effb)}.av.TE{background:linear-gradient(135deg,#f3cf9a,#fcefdc)}
.av.d img{object-fit:contain!important;padding:5px}
.row > .ck{width:18px;height:18px;flex:0 0 18px;border:1.5px solid #9aa0a6;border-radius:5px;background:#fff}
.row.sel > .ck{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.row .nm[data-pid]{display:inline-block;max-width:100%}
.tops{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.top1{position:relative;padding-left:132px;overflow:hidden;min-height:132px}
.top1 .hd > .av{position:absolute;left:0;top:0;bottom:0;width:124px;height:auto;flex:none;border-radius:0;
  -webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.top1 .hd > .av img{object-position:50% 0}
.top1 .ft span:last-child{white-space:nowrap}
.mclose{z-index:2}
/* period tags: centred under their headers; the playoff games sit above the average */
td.c:has(> .olw){text-align:center}
td.c > .olw{margin-left:auto;margin-right:auto;text-align:center}
.pgs{display:flex;gap:3px;justify-content:center;margin-bottom:5px}
.pcl .pgs,.dc .pgs{justify-content:flex-start}
.pg{display:inline-flex;flex-direction:column;align-items:center;min-width:38px;padding:2px 4px 3px;border-radius:5px;font-size:11px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.pg em{font-style:normal;font-size:9px;font-weight:700;opacity:.75}
.pg.t1{background:var(--good);color:#fff}.pg.t2{background:var(--good2);color:var(--good)}.pg.t3{background:var(--warn2);color:var(--warn)}.pg.t4,.pg.off{background:#eceef0;color:#6b6f74}
.seeall{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:0;cursor:pointer;white-space:nowrap}
.seeall:hover{text-decoration:underline}
.tile .v{display:flex;align-items:baseline;gap:4px}
.dest{font-size:10px;font-weight:800;color:var(--blue);background:var(--blue2);border-radius:3px;padding:0 5px;white-space:nowrap}
/* league ranking pop-up */
.bdh{margin:0 40px 4px 0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.bdsub{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.bdl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bd{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.bd:last-child{border-bottom:0}
.bd.me{background:var(--blue2);box-shadow:inset 4px 0 0 var(--blue)}
.bdr{width:22px;text-align:right;font-size:14px;color:var(--dim);flex:none}
.bd .tlg{width:28px;height:28px;flex-basis:28px;font-size:8px}

function lineupOf(ids, mine){
  const by = {QB:[],RB:[],WR:[],TE:[]}, rows = [], spill = [], bench = [];
  const benched = p => mine && (roleOf(p.id) || {}).r === "B";
  for(const id of ids){ const p = P[id]; if(by[p.pos]){ if(benched(p)) bench.push(p); else by[p.pos].push(p); } }
  for(const pos of SKILL){
    const a = by[pos].sort((x,y) => rk(y, mine) - rk(x, mine));
    for(let i = 0; i < Math.max(a.length, spots(pos)); i++){
      if(i < spots(pos)) rows.push({slot:pos, p:a[i] || null});
      else (pos === "QB" ? bench : spill).push(a[i]);
    }
  }
  spill.sort((x,y) => rk(y, mine) - rk(x, mine));
  for(let i = 0; i < spots("FLEX"); i++) rows.push({slot:"FLEX", p:spill[i] || null});
  return {rows, bench:spill.slice(spots("FLEX")).concat(bench)};
}

/* ---- availability + the league view -------------------------------------------------------
   The feed sends a HEALTHY projection per week. This applies ESPN's status, or my own call
   when I have made one, then rebuilds everything that depends on it. */
// when ESPN's status says he plays again: `back` is the week (99 = not this fantasy season),
// `first` is how much of his first game back to count on
function autoOut(p){
  // ESPN's projections already know who is out: he is back the first week ESPN gives him points
  if(p.ep){
    const i = p.wk.findIndex(w => w.o !== "BYE" && !w.z);
    return {back:i < 0 ? 99 : p.wk.slice(0, i).some(w => w.z) ? p.wk[i].w : D.weeks[0], first:1, espn:true};
  }
  const w0 = D.weeks[0], hurt = p.inj === "O" || p.inj === "IR" || p.inj === "SUS";
  const first = p.inj === "D" ? 0.25 : p.inj === "Q" ? 0.8 : hurt ? 0.85 : 1;
  if(!p.inj) return {back:w0, first:1};
  if(p.ret != null) return {back:p.ret, first};
  // no return date published. On IR or suspended and not playing, or out two games running: treat
  // him as gone until I say otherwise. A stale tag on someone who played last week is ignored.
  if(hurt && (p.miss || 0) >= (p.inj === "O" ? 2 : 1)) return {back:99, first, unknown:true};
  return {back:p.inj === "O" ? w0 + 1 : w0, first};
}
function recompute(){
  SJ.clear(); MEW.clear();
  for(const p of Object.values(P)){
    const o = OV[p.id], au = (p.au = autoOut(p)); let tot = 0, raw = 0, back = false;
    p.eff = p.wk.map(w => {
      if(w.o === "BYE") return 0;
      let a = 1;
      if(o){ if(o.t === "O" && w.w <= o.thru) a = 0; }
      else if(p.ep){ if(w.z) a = 0; }                 // a week ESPN projects at zero
      else if(w.w < au.back) a = 0;
      else if(!back){ a = au.first; back = true; }
      raw += w.p; tot += w.p * a;
      return w.p * a;
    });
    p.af = raw ? tot / raw : 1;          // share of his remaining value he is actually there for
    p.adj = p.base * p.af;
    p.ros = playAvg(p, REG); p.po = playAvg(p, PO);
    p.ko = p.eff.map(v => (v > 0 ? 2000 + v : 0));
    const role = roleOf(p.id);
    p.km = !role ? p.ko : p.eff.map(v => (v <= 0 ? 0 : role.r === "B" && role.c ? -1 : TIER(role) + v));
    /* What the league sees. The other managers price a player on what he has done: his season
       average with his last three games counted again, 60% of the number, the projection the
       other 40%. Old production fades: the 60% is cut down when he has missed games lately
       (played 3 of the last 4 weeks or more = full weight, none of them = a quarter), because
       nobody pays for September. My side never uses this - my lineup runs on the projections. */
    const past = SKILL.includes(p.pos) && p.g >= (D.minG || 3) && p.ppg != null ? (p.l3 && p.g >= 4 ? (2 * p.ppg + p.l3.ppg) / 3 : p.ppg) : null;
    const rec = (p.pl || []).slice(0, D.weeks[0] - 1).slice(-4), pw = PAST_W * (rec.length < 4 ? 1 : Math.min(1, (rec.filter(x => x != null).length + 1) / 4));
    p.ps = past == null || !(p.base > 0) ? 1 : Math.max(0.6, Math.min(1.6, (pw * past + (1 - pw) * p.base) / p.base));
    p.seen = p.base * p.ps;
    p.mk = p.seen - p.base;                 // + the league prices him above what he will do, - below
    p.padj = p.adj * p.ps;
    p.kp = p.ps === 1 ? p.ko : p.eff.map(v => (v > 0 ? 2000 + v * p.ps : 0));
    p.win = null;
  }
  // the startable line is a rank at the position across every player: QB12, RB24, WR24, TE12,
  // K12, DEF12. Depth is how many of THOSE a team holds, not how many bodies it has.
  for(const pos of Object.keys(STARTN)){
    const a = Object.values(P).filter(p => p.pos === pos).sort((x,y) => y.adj - x.adj), N = STARTN[pos];
    a.forEach((p, i) => (p.ok = i < N && p.adj > 0));
    a.slice().sort((x,y) => y.padj - x.padj).forEach((p, i) => (p.okp = i < N && p.padj > 0));   // startable as the league sees it
    START[pos] = (a[Math.min(a.length, N) - 1] || {adj:0}).adj;
    if(!SKILL.includes(pos)) continue;
    const fa = a.filter(p => !p.t).slice(1, 4);                            // 2nd-4th best free agents: the best one goes fast
    REPL[pos] = fa.length ? fa.reduce((s,p) => s + p.adj, 0) / fa.length : START[pos] * 0.75;
    const byX = a.filter(p => p.g >= (D.minG || 3)).sort((x,y) => y.xfp - x.xfp);
    XSTART[pos] = (byX[Math.min(byX.length, N) - 1] || {xfp:0}).xfp;      // a starter's workload
    RANK[pos] = a.filter(p => p.t).map(p => p.id);
  }
  FLOOR = SKILL.map(pos => 2000 + (REPL[pos] || 0));
  WKN = D.weeks.map((w, i) => { const a = Object.values(P).filter(p => SKILL.includes(p.pos) && p.t && p.base >= 6 && p.af >= 0.9 && p.eff[i] > 0).map(p => p.eff[i] / p.base).sort((x,y) => x - y);
    return a.length >= 20 ? a[a.length >> 1] : 1; });
  for(const p of Object.values(P)) p.v = val(p);
  ROLE0 = {};
  for(const t of D.teams){ const m = t.id === ME;
    DEPTH[t.id] = depthOf(t.players, m); DEPP[t.id] = depthOf(t.players, false, true);
    Object.assign(ROLE0, rolesOf(t.players, m, !m));          // another team's roles are its own view of its roster
    W0[t.id] = worth(t.players, true, m); W0S[t.id] = m ? W0[t.id] : worth(t.players, true, false, true); }
  BASE = posRanks();
  for(const p of Object.values(P)) p.sg = signals(p);
  buildLens();
  buildTargets();
  buildWaivers();
}

/* ---- the read on a player: is the box score ahead of, or behind, what he is being given? ----
   owed   workload says more than he has scored (xFP - PPG)
   tdl    the part of that gap that is touchdowns: expected from his carries and targets vs scored.
          Touchdown luck evens out, so it counts most
   eff    the rest of the gap, yardage efficiency: part luck, part the player
   grow   his role over the last three games against the season
   sched  how soft the defences ahead are next to the ones he has already played
   E      what all of it is worth, in points a game against what he has been scoring */
function signals(p){
  if(p.g == null || !p.l3 || p.g < (D.minG || 3) || !SKILL.includes(p.pos)) return null;
  const s = {};
  s.owed = p.xfp - p.ppg;
  s.tdl = p.xtd != null ? (p.xtd - p.td) / p.g * 6 : 0;
  s.eff = s.owed - s.tdl;
  // role change, from the API: share of the team's carries and targets AND playing time both
  // moved the same way, last three games against the ones before. Never set for a QB.
  s.shift = p.rs || 0;
  s.grow = s.shift * p.xfp;                  // the same thing in points a game
  s.cold = p.g >= 4 ? p.l3.xfp - p.l3.ppg : 0;
  s.ahead = avgRk(p, ALLW);
  s.sched = s.ahead != null && p.fsos != null ? s.ahead - p.fsos : 0;
  s.po = avgRk(p, PO);
  s.E = 0.75 * s.tdl + 0.35 * s.eff + 0.6 * s.grow + Math.max(-1.5, Math.min(1.5, p.base * 0.004 * s.sched));
  return s;
}
function pq(p, k){
  const a = (PCT[p.pos] || {})[k], v = p[k];
  if(!a || a.length < 8 || v == null) return 0;
  let lo = 0, hi = a.length;
  while(lo < hi){ const m = (lo + hi) >> 1; a[m] <= v ? (lo = m + 1) : (hi = m); }
  return lo / a.length;
}
// the same read, cut down to a few words for a chip
function tagLine(p){
  const s = p.sg;
  if(!s) return "";
  if(s.E >= 0.8){
    if(s.tdl >= 0.8) return `${(p.xtd - p.td).toFixed(1)} TDs owed`;
    if(s.owed >= 1.5) return `${f1(p.xfp)} workload, ${f1(p.ppg)} scored`;
    if(s.shift >= 0.15) return `role up ${Math.round(s.shift * 100)}%`;
    if(s.sched >= 4) return "softer schedule ahead";
  } else if(s.E <= -0.8){
    if(s.tdl <= -0.8) return `${(p.td - p.xtd).toFixed(1)} TDs over expected`;
    if(s.owed <= -2) return `${f1(p.ppg)} scored on ${f1(p.xfp)} workload`;
    if(s.shift <= -0.15) return `role down ${Math.round(-s.shift * 100)}%`;
    if(s.sched <= -4) return "tougher schedule ahead";
  }
  return "";
}
/* ---- when to make the move ------------------------------------------------------------------
   The league prices a player on what he has done, so the price moves with his next game: a
   quiet one against a tough defense drops it, a big one against a soft defense lifts it. A week
   is tough or soft when ESPN projects him 7% under or over his usual game. Buying, I wait out a
   tough game and move before a soft one; selling is the mirror. Waiting is only offered when
   that week finishes before the trade deadline. Each week is first set against the league's
   middle player that week, because ESPN projects the coming week higher than the later ones
   for everybody. Returns {k: now | wait | any, w, why}. */
const T_LO = 0.93, T_HI = 1.07;
let WKN = [];      // each week's usual level across the league (ESPN runs the coming week a little hot), so a week is read against it
function windowOf(p, side){
  if(p.win && p.win[side]) return p.win[side];
  const out = (k, w, why) => ((p.win = p.win || {})[side] = {k, w, why});
  const n = D.weeks.length, WT = D.weekTimes || {}, g = i => p.wk[i];
  const open = i => !D.deadline || !WT[g(i).w] || WT[g(i).w][1] + 4 * 3600e3 < D.deadline;
  const r = i => (p.eff[i] > 0 && p.base > 0 ? p.eff[i] / p.base / (WKN[i] || 1) : null);
  let i0 = 0; while(i0 < n && r(i0) == null) i0++;                       // his next game
  if(!SKILL.includes(p.pos) || i0 >= n) return out("any", null, "");
  const at = i => `${g(i).o} wk ${g(i).w}`, r0 = r(i0), bye0 = g(0).o === "BYE" && open(0), usual = f1(p.base);
  // a run of games of one kind, from his next one, that is over before the deadline
  const run = test => { let j = i0, last = -1; while(j < n && open(j) && r(j) != null && test(r(j))){ last = j; j++; } return last; };
  const names = (a, b) => { const o = []; for(let j = a; j <= b; j++) o.push(j === a ? at(j) : g(j).o); return o.join(", "); };
  const tough = run(x => x <= T_LO), soft = run(x => x >= T_HI);
  const nxt = []; for(let j = i0 + 1; j < n && nxt.length < 3; j++) if(r(j) != null) nxt.push(j);   // the three games after it
  const blk = nxt.length >= 2 ? nxt.reduce((s, j) => s + r(j), 0) / nxt.length : 1;
  const stretch = () => `wk ${g(nxt[0]).w} on (${nxt.map(j => g(j).o).join(", ")})`;
  if(side === "buy"){
    if(tough >= 0) return out("wait", g(tough).w, `${names(i0, tough)} project${tough > i0 ? "" : "s"} ${f1(p.eff[i0])}${tough > i0 ? " and " + f1(p.eff[tough]) : ""}, under his usual ${usual}. A quiet game drops his price: ask after it.`);
    if(bye0) return out("now", g(0).w, `On bye this week: he is no use to his team right now, and the price comes back once he plays.`);
    if(r0 >= T_HI) return out("now", g(i0).w, `${at(i0)} projects ${f1(p.eff[i0])}, over his usual ${usual}. A big game lifts his price: get him before it.`);
    if(blk >= 1.05) return out("now", g(nxt[0]).w, `A soft stretch starts wk ${stretch()}: the price climbs with it.`);
    return out("any", null, "No game ahead should move his price much.");
  }
  if(soft >= 0) return out("wait", g(soft).w, `${names(i0, soft)} project${soft > i0 ? "" : "s"} ${f1(p.eff[i0])}${soft > i0 ? " and " + f1(p.eff[soft]) : ""}, over his usual ${usual}. Let him post it, then sell.`);
  if(bye0) return out("wait", g(0).w, `On bye this week: teams pay less for a player they can't start. Shop him once it's over${r0 <= T_LO ? `, before ${at(i0)}` : ""}.`);
  if(r0 <= T_LO) return out("now", g(i0).w, `${at(i0)} projects ${f1(p.eff[i0])}, under his usual ${usual}. Sell before a quiet game drops his price.`);
  if(blk <= 0.95) return out("now", g(nxt[0]).w, `A tough stretch starts wk ${stretch()}: sell before it shows in his numbers.`);
  return out("any", null, "No game ahead should move his price much.");
}
// the two as small labels. A player of mine is read as a sale, anyone else as a buy
const sideOf = p => (p.t === ME ? "sell" : "buy");
const wkList = a => (a.length > 1 && a[a.length - 1] - a[0] === a.length - 1 ? a[0] + "–" + a[a.length - 1] : a.join(", "));
function winCell(p){
  const s = sideOf(p), w = windowOf(p, s);
  const lab = w.k === "wait" ? "After wk " + w.w : w.k === "now" ? (s === "buy" ? "Buy now" : "Sell now") : "Any time";
  return `<span class="win ${w.k}" title="${esc(w.why)}">${lab}</span>`;
}
const winRank = p => { const w = windowOf(p, sideOf(p)); return w.k === "now" ? 2 : w.k === "wait" ? 1 : 0; };
const mkTip = p => `The league prices him on what he has scored: about ${f1(p.seen)} a game. He projects ${f1(p.base)} from here.`;
function mkCell(p){
  const mine = p.t === ME, hi = p.mk >= MK, lo = p.mk <= -MK;
  const lab = hi ? (mine ? "Sell high" : "Priced high") : lo ? (mine ? "Priced low" : "Buy low") : "Fair";
  return `<span class="mk ${hi ? (mine ? "g" : "r") : lo ? (mine ? "r" : "g") : "n"}" title="${esc(mkTip(p))}">${lab}</span>${hi || lo ? ` <span class="dimn">${sgn(p.mk)}</span>` : ""}`;
}

/* Three lists.
   BUYS    everyone healthy on another roster who would make my lineup better from here on,
           ranked by how much. Upside is part of the grade, no longer a gate
   DEPTHS  free agents, for the bench - or a straight upgrade when one would start
   SELLS   my own players the league prices above what they project: sell on what they've done */
function buildTargets(){
  const mine = TEAMS[ME].players, denom = (REG.length + 1.5 * PO.length) || 1, bare = worth(mine, false, true);
  BUYS = []; SELLS = []; DEPTHS = [];
  for(const p of Object.values(P)){
    if(!SKILL.includes(p.pos) || p.g == null) continue;
    if(p.t === ME){
      if(p.okp && p.mk >= MK && p.af >= 0.75) SELLS.push({p, grade:Math.round(99 * Math.min(1, p.mk / 4))});
      continue;
    }
    // hurt players are nobody's target: anyone out, doubtful, on IR or suspended is left off
    // until I overrule ESPN's status myself, however soon he is due back
    if(p.af < 0.9 || (!p.ep && !OV[p.id] && ["O","IR","SUS","D"].includes(p.inj))) continue;
    const after = mine.concat([p.id]), role = rolesOf(after, true)[p.id];
    if(!p.t){
      const d = delta(bare, worth(after, false, true));
      DEPTHS.push({p, role, d, fit:d.score / denom});
      continue;
    }
    const d = delta(W0[ME], worth(after, true, true)), fit = d.score / denom;
    if(fit < 0.25) continue;                       // a quarter-point a week or more, byes and injuries counted
    const E = p.sg ? p.sg.E : 0, po = p.sg ? p.sg.po : null;
    const soft = po == null ? 0.5 : Math.max(0, Math.min(1, (po - 8) / 16));
    // half the upgrade; then how cheap he is next to what he will do, his upside, workload, playoff schedule
    const g = 0.5 * Math.min(1, fit / 4) + 0.15 * Math.max(0, Math.min(1, -p.mk / 3)) + 0.15 * Math.max(0, Math.min(1, E / 4)) + 0.1 * pq(p, "xfp") + 0.1 * soft;
    const slot = mine.filter(id => P[id].pos === p.pos && rk(P[id], true) > p.adj + 2000).length + 1;
    BUYS.push({p, role, d, fit, slot, over:BAR[p.pos][REG.length ? "reg" : "po"], grade:Math.round(99 * g)});
  }
  TGT = Object.fromEntries(BUYS.map(x => [x.p.id, x]));
}


const byeBadge = p => { const b = (p.wk || []).find(w => w.o === "BYE"); return b ? `<span class="byeb" title="Bye week ${b.w}. Not counted in his per-game numbers">BYE ${b.w}</span>` : ""; };
function injBadge(p){ return injBadge0(p) + byeBadge(p); }
function injBadge0(p){
  const o = OV[p.id], w0 = D.weeks[0], last = D.weeks[D.weeks.length - 1];
  if(o) return o.t === "O" ? `<span class="inj man">OUT${o.thru >= last ? " season" : o.thru === w0 ? " wk " + o.thru : " thru " + o.thru}</span>` : "";
  const b = p.au.back;
  if(!p.inj) return p.ep && b > w0 ? `<span class="inj">OUT${b > last ? " · season" : " · back wk " + b}</span>` : "";
  return `<span class="inj ${p.inj}">${p.inj}${b > last ? " · season" : b > w0 ? " · back wk " + b : ""}</span>`;
}
function roleBadge(p){
  const r = roleOf(p.id);
  if(!r) return "";
  if(r.r === "S") return `<span class="rtag S">STARTER</span>`;
  return r.c && P[r.c] ? `<span class="rtag C">CUFF · ${esc(short(P[r.c]).toUpperCase())}</span>` : `<span class="rtag B">BENCH</span>`;
}
function who(p, extra){
  return `<div class="who"><div class="nm" data-pid="${p.id}">${esc(p.n)}</div>
    <div class="meta"><span class="pos ${p.pos}">${p.pos}</span><span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${roleBadge(p)}${extra || ""}</div></div>`;
}
// my lineup call for one of my players: automatic, always start, bench, or handcuff to a teammate
function roleSel(p){
  if(p.t !== ME || !SKILL.includes(p.pos)) return "";
  const r = roleOf(p.id), cur = !r ? "" : r.r === "S" ? "S" : r.c ? "C:" + r.c : "B";
  let opts = `<option value=""${cur === "" ? " selected" : ""}>Lineup: auto</option>
    <option value="S"${cur === "S" ? " selected" : ""}>Always start</option>
    <option value="B"${cur === "B" ? " selected" : ""}>Bench: never start</option>`;
  for(const id of TEAMS[ME].players){
    const q = P[id];
    if(id === p.id || q.pos !== p.pos) continue;
    opts += `<option value="C:${id}"${cur === "C:" + id ? " selected" : ""}>Handcuff: starts if ${esc(short(q))} out</option>`;
  }
  return `<select class="rl${r ? " on" : ""}" data-id="${p.id}" aria-label="Lineup call for ${esc(p.n)}">${opts}</select>`;
}
const plyCell = p => `<div class="ply">${img(p)}${who(p)}</div>`;
function spark(p){
  if(!p.pl) return "";
  const bw = 5, gap = 2, H = 26, max = Math.max(32, ...p.pl.map(x => x || 0));
  const hot = new Set(p.pl.map((x, i) => (x != null ? i : -1)).filter(i => i >= 0).slice(-3));
  let s = "";
  p.pl.forEach((x, i) => {
    const X = i * (bw + gap);
    if(x == null) s += `<rect x="${X}" y="${H - 2}" width="${bw}" height="2" fill="#d5d9de"/>`;
    else { const h = Math.max(2, Math.round(x / max * H));
      s += `<rect x="${X}" y="${H - h}" width="${bw}" height="${h}" rx="1" fill="${hot.has(i) ? "#0b6fd0" : "#9fb9d8"}"><title>Wk ${i + 1}: ${x}</title></rect>`; }
  });
  return `<svg class="spk" width="${p.pl.length * (bw + gap) - gap}" height="${H}">${s}</svg>`;
}
function wkChip(p, i, lab){
  const w = p.wk[i], top = lab ? `<em>Wk ${w.w}</em>` : "";
  if(w.o === "BYE") return `<span class="wkc bye" style="background:#eef0f2">${top}<b>BYE</b><i>&nbsp;</i></span>`;
  const out = p.eff[i] === 0 && w.p > 0;
  return `<span class="wkc${out ? " out" : ""}" style="${out ? "background:#eef0f2" : rkBg(w.rk)}" title="${w.rk ? ord(w.rk) + " vs " + p.pos + " (32nd = softest)" : ""}">${top}<b>${w.o}</b><i>${out ? "OUT" : f1(p.eff[i])}</i></span>`;
}
// the rule-out control: ESPN's call, or mine
function stSel(p){
  const o = OV[p.id], cur = o ? (o.t === "H" ? "H" : "O:" + o.thru) : "";
  const nm = {"":"Active", Q:"Questionable", D:"Doubtful", O:"Out", IR:"On IR", SUS:"Suspended"}[p.inj || ""];
  const bk = p.au.back, auto = !p.inj && !(p.ep && bk > D.weeks[0]) ? nm : bk > D.weeks[D.weeks.length - 1] ? (p.inj ? nm : "Out") + (p.au.unknown ? ", no return date" : p.ep ? ": ESPN projects 0" : " for season") : bk > D.weeks[0] ? `${nm}, back wk ${bk}` : nm;
  const last = D.weeks[D.weeks.length - 1];

  if(p.inj) opts += `<option value="H"${cur === "H" ? " selected" : ""}>Healthy</option>`;
  D.weeks.forEach((w, i) => {
    const v = "O:" + w;
    opts += `<option value="${v}"${cur === v ? " selected" : ""}>${i === 0 ? "Out wk " + w : w === last ? "Out for season" : "Out thru wk " + w}</option>`;
  });
  return `<select class="st ${o ? "man" : (p.inj || "")}" data-id="${p.id}" aria-label="Status for ${esc(p.n)}">${opts}</select>`;
}
// short / set / deep at each position, by how many startable players a team holds
function needsHtml(teamId){
  return Object.keys(STARTN).map(pos => { const c = DEPTH[teamId][pos], n = spots(pos) || 1;
    return `<span class="need ${c < n ? "r" : c > n ? "g" : ""}" title="${c} startable for ${plural(n, "spot")}">${pos === "DST" ? "DEF" : pos} ${c < n ? "short" : c > n ? "deep" : "set"}</span>`; }).join("");
}

/* ---- percentile shading: how a number stacks up at his position across the whole pool ----*/
function buildPct(){
  const keys = ["ppg","xfp","snap","ts","cs","ays","wopr","doc","tps","cr","ypt","yacr","opp","rzg","rz","ypc","yaco","bt","fdg"];
  for(const pos of SKILL){
    PCT[pos] = {};
    const pool = Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3));
    for(const k of keys) PCT[pos][k] = pool.map(p => p[k]).filter(v => v != null).sort((a,b) => a - b);
  }
}
function tint(p, k){
  const a = (PCT[p.pos] || {})[k];
  if(!a || a.length < 8 || p[k] == null) return "";
  const q = pq(p, k);
  return q >= 0.6 || q <= 0.4 ? "background:" + heat(q, 0.6) : "";
}

/* ---- targets -------------------------------------------------------------------------------
   Colour does the talking. A bar or tile is green when the number is high for the position and
   red when it is low, so a wall of green over a short yellow scoring bar is the whole story:
   the workload of a good player, without the points yet. */
const TILES = {
  QB: [["xfp","Workload"],["cs","Rushing"],["rz","Red zone"],["fdg","1st downs"]],
  RB: [["snap","Snaps"],["cs","Carries"],["ts","Targets"],["rz","Red zone"],["yaco","Contact"]],
  WR: [["snap","Snaps"],["ts","Targets"],["tps","Tgt/snap"],["wopr","WOPR"],["rz","Red zone"]],
};
TILES.TE = TILES.WR;
const heat = (q, a = 0.32) => q >= 0.5 ? `rgba(34,170,95,${((q - 0.5) * 2 * a).toFixed(2)})` : `rgba(220,64,54,${((0.5 - q) * 2 * a).toFixed(2)})`;
const solid = q => `hsl(${Math.round(q * 125)},62%,45%)`;
// the read on a player as a few coloured words: green is in his favour from here, red against
function sigChips(p){
  const s = p.sg, out = [];
  if(!s) return out;
  if(s.tdl >= 0.8) out.push([`${(p.xtd - p.td).toFixed(1)} TDs owed`, "g"]);
  else if(s.tdl <= -0.8) out.push([`${(p.td - p.xtd).toFixed(1)} TDs over`, "r"]);
  if(s.eff >= 1.5) out.push(["yards owed", "g"]); else if(s.eff <= -2) out.push(["hot efficiency", "r"]);
  if(s.shift >= 0.15) out.push(["role growing", "g"]); else if(s.shift <= -0.15) out.push(["role shrinking", "r"]);
  if(p.g >= 4 && s.cold >= 3 && p.l3.ppg <= p.ppg - 1.5) out.push(["cold last 3", "g"]);
  if(s.sched >= 4) out.push(["easier schedule", "g"]); else if(s.sched <= -4) out.push(["tougher schedule", "r"]);
  if(PO.length && s.po != null){ if(s.po >= 21) out.push(["soft playoffs", "g"]); else if(s.po <= 11) out.push(["tough playoffs", "r"]); }
  return out.sort((a,b) => (a[1] === "g" ? 0 : 1) - (b[1] === "g" ? 0 : 1));
}
/* ---- row tables -------------------------------------------------------------------------
   Targets, Waivers and Packages are all one row per item. A column is
   {k, h, t (header tip), v (sort value), html (cell), c (centre), l (sticky player column), sep, nosort}.
   Clicking a sortable header sorts by it; clicking again flips the order. */
const WIDE = new Set(["read", "drop", "rival", "top", "fits", "deal", "next", "why", "mk"]);   // these get a full-width line in a phone row's panel
// the tap-open panel under a phone row: every column that didn't fit, as labelled values
const detailHtml = (cols, r) => `<div class="dg">${cols.map(c => { const v = c.html(r); const st = c.style ? c.style(r) : "";
  return v === "" || v == null ? "" : `<div class="dc${WIDE.has(c.k) ? " w" : ""}"${st ? ` style="${st}"` : ""}><span>${c.h}</span><div>${v}</div></div>`; }).join("")}</div>`;
const XB = `<td class="c xc"><button class="xb" aria-label="More">▾</button></td>`;
function gridHtml(cols, rows, sk, dir, rowAttr, mainKeys){
  const phone = MQ.matches && !!mainKeys;
  const main = phone ? cols.filter(c => c.l || mainKeys.includes(c.k)) : cols;
  const rest = phone ? cols.filter(c => !main.includes(c) && c.k !== "act") : [];
  const th = c => `<th class="${c.l ? "l" : ""}${c.nosort || !c.v ? "" : " sort"}${sk === c.k ? " on" : ""}${c.sep && !phone ? " sep" : ""}${c.c ? " c" : ""}${c.po ? " po" : ""}" data-k="${c.k}"${c.t ? ` title="${esc(c.t)}"` : ""}>${c.h}${sk === c.k ? `<span class="ar">${dir < 0 ? "▾" : "▴"}</span>` : ""}</th>`;
  const td = (c, r) => `<td class="${c.l ? "l" : c.c ? "c" : "num"}${c.sep && !phone ? " sep" : ""}"${c.style ? ` style="${c.style(r)}"` : ""}>${c.html(r)}</td>`;
  const body = rows.map(r => `<tr${rowAttr ? rowAttr(r) : ""}>${main.map(c => td(c, r)).join("")}${rest.length ? XB : ""}</tr>` +
    (rest.length ? `<tr class="dt" hidden><td colspan="${main.length + 1}">${detailHtml(rest, r)}</td></tr>` : "")).join("");
  return `<table><thead><tr>${main.map(th).join("")}${rest.length ? '<th class="xc"></th>' : ""}</tr></thead><tbody>${body}</tbody></table>`;
}
function sortRows(rows, cols, sk, dir){
  const c = cols.find(x => x.k === sk);
  if(!c || !c.v) return rows;
  return rows.slice().sort((a, b) => {
    const x = c.v(a), y = c.v(b);
    if(x == null && y == null) return 0;
    if(x == null) return 1;
    if(y == null) return -1;
    return typeof x === "string" ? x.localeCompare(y) * dir : (x - y) * dir;
  });
}
// header clicks on a row table: the same column flips, a new one sorts high-to-low (names A-Z)
function onSort(el, get, set, render){
  el.addEventListener("click", e => {
    const th = e.target.closest("th.sort"); if(!th) return;
    const k = th.dataset.k, cur = get();
    set(cur.k === k ? {k, dir:-cur.dir} : {k, dir:k === "name" ? 1 : -1});
    render();
  });
}
/* Stats that mean something for the position, and only those. A QB's red-zone carries or snap
   share say nothing; a back's air yards don't exist. In a mixed list each column is blank for the
   positions it doesn't apply to. Hidden until "Stats" is picked. */
const REL = {
  QB: ["xfp","fpoe","up","cs","fdg"],
  RB: ["xfp","fpoe","trend","up","snap","cs","ts","opp","rzg","rz","td","xtd","ypc","yaco","bt","fdg"],
  WR: ["xfp","fpoe","trend","up","snap","ts","ays","wopr","tps","doc","cr","ypt","yacr","rz","td","xtd","fdg"],
};
REL.TE = REL.WR;
const STATORDER = ["xfp","fpoe","trend","up","snap","cs","ts","opp","rzg","rz","td","xtd","ays","wopr","tps","doc","cr","ypt","yacr","ypc","yaco","bt","fdg"];
const statKeys = pos => (pos === "ALL" ? STATORDER : STATORDER.filter(k => (REL[pos] || []).includes(k)));
const relevant = (p, k) => !STATORDER.includes(k) || (REL[p.pos] || []).includes(k);
// one stat cell, tinted by where it sits at the position
function statCell(p, k){
  const c = COLS[k];
  if(!relevant(p, k)) return "";
  const t = cellText(c, p);
  if(t == null) return `<span class="dimn">–</span>`;
  return `<span class="${c.cl ? c.cl(c.v(p)) : ""}">${t}</span>`;
}
const statCols = (pos, P_) => statKeys(pos).map((k, i) => ({k:"s_" + k, h:COLS[k].h, t:COLS[k].t, sep:i === 0,
  v:r => { const p = P_(r); return relevant(p, k) ? COLS[k].v(p) : null; },
  html:r => statCell(P_(r), k),
  style:r => { const p = P_(r); return COLS[k].tint && relevant(p, k) ? tint(p, k) : ""; }}));
const plyX = (p, extra) => `<div class="ply plb">${img(p)}${who(p, extra)}</div>`;
const gainCell = v => `<span class="pt ${v >= 2 ? "up2" : v >= PT ? "up1" : v <= -PT ? "down" : "even"}">${sgn(v)}</span>`;
const readCell = p => sigChips(p).slice(0, 2).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ");
const gradeCell = (g, kind) => `<span class="gr ${kind || (g >= 70 ? "a" : g >= 50 ? "b" : g >= 35 ? "c" : "d")}">${g}</span>`;

// a fantasy team's logo, with its abbreviation underneath for when the image is missing
function tlogo(id){
  const t = TEAMS[id]; if(!t) return "";
  return `<span class="tlg">${esc((t.abbrev || "").slice(0, 4))}${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
const ownTag = p => (p.t ? `<span class="own">${tlogo(p.t)}${esc(ownAb(p))}</span>` : `<span class="own fa">FA</span>`);

/* ---- the lens: everyone is read against MY lineup ----------------------------------------------
   Two tags a player, one for the rest of the regular season and one for the playoff weeks.
     My players     how good he will be: his rank at the position over those weeks.
                    Elite = top third of the startable ranks, Starter, Fringe (the next half
                    again), Bench.
     Everyone else  what he would do to my lineup. If he would play for me, the points a week
                    my lineup gains with him in it (byes and injuries counted). Usually that is
                    "over" my starter; when he doesn't out-project him but the pair still scores
                    more by matchup and bye, it says "sharing weeks with". If he wouldn't,
                    how far he sits behind the weakest starter he could replace. Half a point
                    either way is "even".
   BAR is that weakest starter, per position and per period: my QB for a QB; the lowest of my
   two RBs and my flex for a back, and so on. */
const PT = 0.5;
function buildLens(){
  const mine = TEAMS[ME].players, L = lineupOf(mine, true);
  BAR = {};
  for(const pos of SKILL){
    const rows = L.rows.filter(r => r.p && (r.slot === pos || (r.slot === "FLEX" && pos !== "QB")));
    const low = k => (rows.length ? rows.slice().sort((a,b) => a.p[k] - b.p[k])[0].p : null);
    BAR[pos] = {reg:low("ros"), po:low("po")};
    const all = Object.values(P).filter(p => p.pos === pos);
    all.slice().sort((a,b) => b.ros - a.ros).forEach((p, i) => (p.rr = i + 1));
    all.slice().sort((a,b) => b.po - a.po).forEach((p, i) => (p.rp = i + 1));
    // and his rank at the position in each playoff game on its own
    for(const p of all) p.wrk = {};
    for(const i of PO) all.slice().sort((a,b) => b.eff[i] - a.eff[i]).forEach((p, n) => (p.wrk[i] = n + 1));
  }
  for(const p of Object.values(P)){
    p.lens = null;
    if(!SKILL.includes(p.pos) || p.t === ME) continue;
    const d = delta(W0[ME], worth(mine.concat([p.id]), true, true)), bar = BAR[p.pos];
    const gap = (k, a) => (bar[k] ? Math.min(0, p[a] - bar[k][a]) : 0);
    p.lens = {d, reg:d.reg > 0.05 ? d.reg : gap("reg", "ros"), po:d.po > 0.05 ? d.po : gap("po", "po"), over:bar};
  }
}
// the playoff weeks one at a time: his rank at the position that week, coloured by tier
function poGames(p){
  const N = STARTN[p.pos];
  return `<div class="pgs">${PO.map(i => { const w = p.wk[i], r = (p.wrk || {})[i];
    if(w.o === "BYE") return `<span class="pg off" title="Week ${w.w}: bye"><em>${w.w}</em>BYE</span>`;
    if(p.eff[i] === 0) return `<span class="pg off" title="Week ${w.w}: out"><em>${w.w}</em>OUT</span>`;
    const t = r <= Math.ceil(N / 3) ? "t1" : r <= N ? "t2" : r <= Math.round(N * 1.5) ? "t3" : "t4";
    return `<span class="pg ${t}" title="Week ${w.w} ${w.o}: ${f1(p.eff[i])} projected, ${p.pos}${r} that week"><em>${w.w}</em>${p.pos}${r}</span>`; }).join("")}</div>`;
}
function ptag(p, k, mini){
  if(!mini && k === "po" && SKILL.includes(p.pos) && PO.length > 1) return poGames(p) + ptagAvg(p, k, mini);
  return ptagAvg(p, k, mini);
}
function ptagAvg(p, k, mini){
  if(!SKILL.includes(p.pos)) return "";
  const idx = k === "reg" ? REG : PO, a = k === "reg" ? "ros" : "po", r = p[k === "reg" ? "rr" : "rp"];
  if(!idx.length) return "";
  const outW = idx.filter(i => p.eff[i] === 0 && p.wk[i].p > 0).length;
  if(outW > idx.length / 2) return mini ? "" : `<span class="pt out">Out</span><span class="olw">${outW} of ${plural(idx.length, "week")}</span>`;
  if(p.t === ME){
    const N = STARTN[p.pos], t = r <= Math.ceil(N / 3) ? ["t1", "Elite"] : r <= N ? ["t2", "Starter"] : r <= Math.round(N * 1.5) ? ["t3", "Fringe"] : ["t4", "Bench"];
    return mini ? "" : `<span class="pt ${t[0]}">${t[1]}</span><span class="olw">${p.pos}${r} · ${f1(p[a])} a game</span>`;
  }
  const v = p.lens[k], o = p.lens.over[k];
  const c = v >= 2 ? "up2" : v >= PT ? "up1" : v <= -PT ? "down" : "even";
  const lab = c === "even" ? "≈ Even" : (v > 0 ? "▲ " : "▼ ") + sgn(v);
  if(mini) return c === "even" ? "" : `<span class="pt sm ${c}">${lab}${k === "po" ? " PO" : ""}</span>`;
  return `<span class="pt ${c}">${lab}</span><span class="olw">${p.pos}${r}${o ? ` · ${v <= -PT ? "behind" : v < PT ? "level with" : p.base > o.base ? "over" : "sharing weeks with"} ${esc(short(o))}` : ""}</span>`;
}
const lensUp = p => !!p.lens && (p.lens.reg >= PT || p.lens.po >= PT);

/* ---- my needs: lineup rank overall and at each spot -----------------------------------------
   On Targets the position tiles are buttons: tap one to see only the players who fix it. */
function renderTiles(el, clickable){
  const n = D.teams.length, out = [];
  const tile = (k, rank, word, s, s2, pos, key) => {
    const tag = clickable && pos ? "button" : "div";
    const cnt = clickable && pos ? BUYS.filter(x => x.p.pos === pos).length : 0;
    const tone = rank <= 4 ? "g" : rank >= 9 ? "r" : "";
    return `<${tag} class="tile ${tone}${clickable && pos && S.tgPos === pos ? " on" : ""}"${tag === "button" ? ` data-pos="${pos}"` : ""}>
    <div class="k"><span>${k}</span>${word ? `<em>${rank <= 4 ? "Strength" : rank >= 9 ? "Need" : "Solid"}</em>` : ""}</div>
    <div class="v"><b class="rkn ${tone}">${ord(rank)}</b><small>of ${n}</small><span class="seeall" data-board="${key || pos}">see all ›</span></div>
    <div class="strip">${Array.from({length:n}, (_, i) => `<i${i + 1 === rank ? ' class="me"' : ""}></i>`).join("")}</div>
    <div class="tps">${s}</div><div class="s2">${s2}</div>${clickable && pos ? `<div class="s3">${cnt ? plural(cnt, "upgrade") + " →" : "no upgrade out there"}</div>` : ""}</${tag}>`;
  };
  const tp = p => `<div class="tp">${img(p)}<span class="tpn" data-pid="${p.id}">${esc(short(p))}</span><b>${f1(p.adj)}</b></div>`;
  // the lineup as it stands today, no waiver help
  const all = D.teams.map(t => ({id:t.id, w:worth(t.players, false, t.id === ME)}));
  const place = key => all.slice().sort((a,b) => b.w[key] - a.w[key]).findIndex(x => x.id === ME) + 1;
  const mine = all.find(x => x.id === ME).w;
  const lineupTiles = [];
  if(REG.length) lineupTiles.push(tile("Lineup · wk " + wkSpan(REG), place("reg"), false, `<div class="tbig">${f1(mine.reg / REG.length)}<small>pts / wk</small></div>`, "regular season", null, "reg"));
  if(PO.length) lineupTiles.push(tile("Lineup · wk " + wkSpan(PO), place("po"), false, `<div class="tbig">${f1(mine.po / PO.length)}<small>pts / wk</small></div>`, "playoffs", null, "po"));
  if(!clickable) out.push(...lineupTiles);
  // on Targets the weakest spot comes first, and the overall lineup last
  const order = clickable ? SKILL.slice().sort((a, b) => BASE[ME][b] - BASE[ME][a]) : SKILL;
  for(const pos of order){
    const k = spots(pos) || 1, c = DEPTH[ME][pos];
    const top = TEAMS[ME].players.map(id => P[id]).filter(p => p.pos === pos).sort((a,b) => rk(b, true) - rk(a, true));
    out.push(tile(pos, BASE[ME][pos], true, top.slice(0, k).map(tp).join("") || "nobody",
      `${c} startable for ${plural(k, "spot")}` + (top[k] ? ` · next up ${esc(short(top[k]))} ${f1(top[k].adj)}` : ""), pos));
  }
  if(clickable) out.push(...lineupTiles);
  $(el).innerHTML = out.join("");
}

/* ---- targets ---------------------------------------------------------------------------------
   Top targets: the biggest upgrades to my lineup for the rest of the season and the playoffs
   (the grade weighs playoff weeks 1.5x) that some team would actually deal for - a package with
   a likely or worth-asking answer. Then everyone who helps, in a table. Tapping a player opens
   the packages that would get him. */
const gettable = id => BESTWILL[id] === "likely" || BESTWILL[id] === "maybe";
function renderTops(){

  const checking = !!SEARCHING;
  if(!checking) list = list.filter(x => gettable(x.p.id));

  list = list.slice(0, MQ.matches ? 4 : 6);
  $("topsub").textContent = checking ? "checking which teams would deal…" : "the biggest upgrades for now and the playoffs that a team would deal — tap for packages";
  if(!list.length){ $("tops").innerHTML = `<div class="chip">${checking ? "Checking…" : "No gettable upgrade at this spot right now"}</div>`; return; }
  $("tops").innerHTML = list.map(x => {
    const p = x.p, w = BESTWILL[p.id];
    return `<button class="top1" data-id="${p.id}">
      <div class="hd">${img(p)}<div class="who"><div class="nm" data-pid="${p.id}">${esc(p.n)}</div>
        <div class="meta"><span class="pos ${p.pos}">${p.pos}</span><span>${p.tm}${p.prk ? " · " + p.pos + p.prk : ""}</span>${byeBadge(p)}${ownTag(p)}</div></div>${gradeCell(x.grade)}</div>
      <div class="nums">${REG.length ? `<div><b class="${cls(x.d.reg)}">${sgn(x.d.reg)}</b><span>pts / wk</span></div>` : ""}${PO.length ? `<div><b class="${cls(x.d.po)}">${sgn(x.d.po)}</b><span>playoffs</span></div>` : ""}</div>
      ${x.over ? (p.base > x.over.base ? `<div class="rp">replaces <b>${esc(short(x.over))}</b> ${f1(x.over.base)} → <b>${f1(p.base)}</b> a game</div>` : `<div class="rp">shares weeks with <b>${esc(short(x.over))}</b></div>`) : ""}
      <div class="tmr">${mkCell(p)}${winCell(p)}</div>
      <div class="ft">${w ? `<span class="will ${w}">${WORD[w]}</span>` : `<span class="dimn">checking deals…</span>`}<span>Packages →</span></div>
    </button>`;
  }).join("");
}
function renderTargets(){
  renderTiles("ntiles", true);
  renderTops();
  // scarcity, measured not assumed: a player's trade value is his points over what the waiver wire gives at HIS position
  /* Scarcity, measured not assumed. A player's trade value is his points over replacement:
     what he scores above the best free agent you could start at HIS position instead. The
     depth line makes the reason visible: count how many receivers score what the last
     startable back scores. */
  { const gap = REPL.WR - REPL.RB, N = STARTN.RB;
    const byPpg = pos => Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3)).sort((a, b) => b.ppg - a.ppg);
    const rb = byPpg("RB"), wr = byPpg("WR"), line = rb[N - 1] ? rb[N - 1].ppg : null;
    const wrAt = line != null ? wr.filter(p => p.ppg >= line).length : 0;
    $("replline").innerHTML = `<b>Points over replacement.</b> A player is worth what he scores above the waiver wire at his own position: today ${SKILL.map(pos => `${pos} <b>${f1(REPL[pos])}</b>`).join(" · ")} a game. ` +
      (Math.abs(gap) < 1 ? "Backs and receivers are equally hard to replace right now."
        : gap > 0 ? `Backs are scarcer, so a back is worth about <b>${f1(gap)}</b> more than a receiver who scores the same.`
        : `Receivers are scarcer, so a receiver is worth about <b>${f1(-gap)}</b> more than a back who scores the same.`) +
      (line != null && wrAt > N ? ` The depth shows why: the ${ord(N)} back has scored ${f1(line)} a game this season, and <b>${wrAt} receivers</b> are at or above that.` : ""); }
  { const WT = D.weekTimes || {}, openW = D.weeks.filter(w => D.deadline && WT[w] && WT[w][1] + 4 * 3600e3 < D.deadline);
    const dl = D.deadline ? new Date(D.deadline).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}) : "";
    $("mkline").innerHTML = `<b>Price and timing.</b> The league prices a player on what he has scored; my lineup runs on what he is projected to do. <b>Buy low</b> is a player who projects for more than he has scored, <b>sell high</b> is one of mine the league pays more for than he projects. <b>When</b> reads his next games: wait out a tough one and his price dips, move before a soft one.` +
      (dl ? ` Trade deadline ${dl}${openW.length ? `, so week${openW.length > 1 ? "s" : ""} ${wkList(openW)} can still move a price` : ""}.` : ""); }
  const mode = S.tgMode;
  let list = (mode === "buy" ? BUYS : mode === "sell" ? SELLS : DEPTHS).slice();
  if(S.tgPos !== "ALL") list = list.filter(x => x.p.pos === S.tgPos);
  if(mode === "buy" && S.tgSrc) list = list.filter(x => x.p.t === +S.tgSrc);
  if(mode === "buy" && S.tgGet) list = list.filter(x => gettable(x.p.id));
  if(mode === "depth") list = list.filter(x => x.fit > 0.05 || S.tgPos !== "ALL");
  $("tgsrc").hidden = mode !== "buy"; $("tgget").hidden = mode !== "buy";
  $("tgcount").textContent = plural(list.length, "player");
  $("tgsub").textContent = mode === "buy" ? "every player who'd start for me over one of mine, and by how much — tap a row for packages"

  if(!list.length){

const PKF = {
