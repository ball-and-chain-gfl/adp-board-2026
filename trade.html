  pkKind:{lab:"Deal type", opts:[["", "2- and 3-team"], ["2", "Two teams"], ["3", "Three teams"]], test:(pk, v) => !v || (v === "3") === pk.three},
  pkPos:{lab:"I get a", opts:[["", "Any position"], ["QB", "QB"], ["RB", "RB"], ["WR", "WR"], ["TE", "TE"]], test:(pk, v) => !v || pk.get.some(id => P[id].pos === v)},
  pkTeam:{lab:"Trading with", opts:null, test:(pk, v) => !v || pk.teams.includes(+v)},
  pkMe:{lab:"My lineup", opts:[["", "Gets better"], ["any", "Any, even if it costs me"]], test:(pk, v) => v === "any" || pk.me.score + (pk.h2hB || 0) > 0},
};
// the list Packages is showing: deals for a target, deals for the players I picked, or everything
const curPK = () => (S.pkGive.length ? GIVEPK : S.pkFor && P[S.pkFor] ? FORPK : ALLPK);
/* Shopping my own players: every package where exactly the players I picked go out. Two teams
   (one or two of theirs back) and three-team rotations (mine to C, C to B, B to me). Unlike the
   main search it doesn't require the deal to help my lineup - I've decided to move them - but
   it drops anything that costs my lineup more than half a point a week, and asking a team for
   more than twice what I'm sending. */
function findForGive(mg){
  const out = [], others = D.teams.filter(t => t.id !== ME), mV = sumV(mg), mine = TEAMS[ME].players, mTop = maxV(mg), straight = new Set();
  const floor = -0.5 * ((REG.length + 1.5 * PO.length) || 1);
  for(const t of others) for(const tg of sets(tradeable(t))){
    if(sumV(tg) > 2.2 * mV) continue;
    const j = judgeDeal([{from:ME, to:t.id, ids:mg}, {from:t.id, to:ME, ids:tg}], false);
    if(j.me.score >= floor){ out.push(j); if(j.will === "likely") straight.add(key2(t.id, mg, tg)); }
  }
  for(const B of others) for(const bg of sets(tradeable(B))){
    const bV = sumV(bg);
    if(bV > 2.2 * mV || straight.has(key2(B.id, mg, bg))) continue;
    if(delta(W0[ME], worth(swap(mine, new Set(mg), new Set(bg)), true, true)).score < floor) continue;
    threeWays(mg, bg, B, others, false, out);
  }
  return prune(out);
}
function pkBase(){
  let list = curPK();
  if(S.pkQ){
    const q = S.pkQ.toLowerCase();
    list = list.filter(pk => (pk.teams.map(id => TEAMS[id].name + " " + TEAMS[id].abbrev).join(" ") + " " + pk.legs.flatMap(l => l.ids).map(id => P[id].n).join(" ")).toLowerCase().includes(q));
  }

}
const pkPass = (pk, except) => Object.keys(PKF).every(k => k === except || PKF[k].test(pk, S[k]));

/* What a team would need to give a player up, in the same terms the deals are judged on: about
   88% of what he is worth to them in total, one piece worth at least 60% of him, and a starter
   back at his position if losing him leaves them short. It says which of my players qualify. */
function askLine(p){
  const t = TEAMS[p.t]; if(!t) return "";
  const ab = esc(t.abbrev || t.name), keep = p.v * (KEEP[ROLE0[p.id]] || 0.75), top = 0.6 * p.v;
  const mine = tradeable(TEAMS[ME]).map(id => P[id]).sort((a, b) => b.v - a.v);
  const big = mine.filter(q => q.v >= top);
  const hole = p.okp && DEPP[t.id][p.pos] - 1 < spots(p.pos);
  return `<b>What ${ab} would need for ${esc(short(p))}:</b> about ${f1(0.88 * keep)} in trade value (he is worth ${f1(keep)} to them), led by one piece worth at least ${f1(top)}` +
    (big.length ? `. Of mine that is ${big.map(q => esc(short(q)) + " " + f1(q.v)).join(", ")}` : `. None of my tradeable players is, so a third team's player would have to lead the deal`) +
    (hole ? `. Losing him leaves ${ab} short at ${p.pos}, so a startable ${p.pos} has to come back` : "") +
    `. My pieces: ${mine.slice(0, 7).map(q => esc(short(q)) + " " + f1(q.v)).join(" · ")}.`;
}

function tableRows(){
  let ids;
  if(S.scope === "me") ids = TEAMS[ME].players;
  else if(S.scope === "league") ids = D.teams.flatMap(t => t.players);
  else if(S.scope === "all") ids = Object.keys(P);

  else ids = TEAMS[S.scope].players;
  let list = ids.map(id => P[id]);
  if(!isSingle()) list = list.filter(p => SKILL.includes(p.pos));
  if(S.ol === "up") list = list.filter(p => p.lens && p.lens.reg >= PT);
  if(S.ol === "poup") list = list.filter(p => p.lens && p.lens.po >= PT);
  if(S.ol === "down") list = list.filter(p => p.lens && p.lens.reg <= -PT && p.lens.po <= -PT);
  if(S.pos !== "ALL") list = list.filter(p => p.pos === S.pos);
  if(S.q){ const q = S.q.toLowerCase(); list = list.filter(p => (p.n + " " + p.tm + " " + ownAb(p) + " " + (p.t ? TEAMS[p.t].name : "free agent")).toLowerCase().includes(q)); }
  const c = COLS[S.sort];
  if(c){
    list.sort((a, b) => {
      const x = c.v(a), y = c.v(b);
      if(x == null && y == null) return b.adj - a.adj;
      if(x == null) return 1;
      if(y == null) return -1;
      return (c.str ? String(x).localeCompare(String(y)) * -S.dir : (y - x) * -S.dir) || b.adj - a.adj;
    });
  } else if(isSingle()) list.sort((a, b) => ORDER[a.pos] - ORDER[b.pos] || b.adj - a.adj);
  else list.sort((a, b) => b.adj - a.adj);
  return list;
}
function cellText(c, p){

/* ---- judging a trade ---------------------------------------------------------------------
   A deal is read from both rosters, not from two price tags:
   1. Holes. If it leaves either team with fewer startable players at a position than it has
      spots to fill, and it had them before, that side says no. A team with two backs does not
      give one up unless one comes back.
   2. What it is worth TO THEM. A player's value is cut when he would not start for the team
      getting him: full if he starts, 70% if he is their flex, 25% if he would sit. A third
      good back is not worth to them what he is worth on the open market. Their own starters
      cost a premium to pry loose; their bench is cheap. And a starter only moves for a
      starter: if they give up someone in their lineup, someone coming back has to go into it.
   3. Their lineup has to come out ahead too, against the waiver-wire alternative.
   `quick` is the package search: bail at the first failed test. */
/* What an incoming player is worth to the team getting him, by where he'd play for them: full as
   a starter, 70% as their flex, and next to nothing on their bench - 15% at RB/WR (injury cover),
   5% at a one-starter spot like QB or TE, where a backup only plays on a bye. */
const USE = {S:1, F:0.7, B:0.15}, KEEP = {S:1.15, F:0.9, B:0.5};
const useOf = (role, pos) => (role === "B" ? (spots(pos) <= 1 ? 0.05 : USE.B) : USE[role] || 0.45);
const WORD = {likely:"Likely yes", maybe:"Worth asking", long:"Long shot"}, WORST = {likely:0, maybe:1, long:2};
const WILLF = {likely:1, maybe:0.85, long:0.5};
const tName = id => (id === ME ? "Me" : TEAMS[id].abbrev || TEAMS[id].name);
// one other team's side of a deal: what it gives up, what comes back, and whether it says yes
const SJ = new Map(), MEW = new Map(), SJ_MAX = 60000;
function sideJudge(tid, out, inn){
  const key = key2(tid, out, inn), hit = SJ.get(key);
  if(hit) return hit;
  const r = sideJudge0(tid, out, inn);
  if(SJ.size < SJ_MAX) SJ.set(key, r);
  return r;
}
function sideJudge0(tid, out, inn){
  /* Everything here is the OTHER team's view: it counts a player at what he has done (p.seen),
     so a back who has outscored his projection fills its hole and one who is owed points
     doesn't look like much yet. */
  const t = TEAMS[tid], d0 = DEPP[tid], d = Object.assign({}, d0);
  for(const id of out){ const p = P[id]; if(p.okp) d[p.pos]--; }
  for(const id of inn){ const p = P[id]; if(p.okp) d[p.pos]++; }
  const holes = SKILL.filter(pos => d[pos] < d0[pos] && d[pos] < spots(pos));
  const after = swap(t.players, new Set(out), new Set(inn));
  const them = delta(W0S[tid], worth(after, true, false, true));
  const ra = rolesOf(after, false, true);
  const inV = inn.reduce((s,id) => s + val(P[id]) * useOf(ra[id], P[id].pos), 0);
  const outV = out.reduce((s,id) => s + val(P[id]) * (KEEP[ROLE0[id]] || 0.75), 0);
  const ratio = outV ? inV / outV : 9;
  const starterBack = !out.some(id => ROLE0[id] === "S") || inn.some(id => ra[id] === "S" || ra[id] === "F");
  const top = a => (a.length ? Math.max(...a.map(id => val(P[id]))) : 0);
  const fairTop = top(inn) >= 0.6 * top(out);          // no pile of lesser players for the best one in the deal
  /* Something they get has to play for them: nobody trades to fill their bench.
     A lateral move - everything in and out at one position - only happens for a clear upgrade:
     +1.5 a week to be worth asking, +2.5 to be likely. Purdy for Love is a shrug, not a trade.
     Any other deal needs a real gain too: +0.35 a week to ask, +0.75 to be likely. */
  const starts = inn.some(id => ra[id] === "S" || ra[id] === "F");
  // a backup QB or TE is a roster spot wasted: nobody takes one they'd never play
  const dead = inn.filter(id => ra[id] === "B" && spots(P[id].pos) <= 1);
  const lateral = new Set(out.concat(inn).map(id => P[id].pos)).size === 1;
  const wk = them.score / ((REG.length + 1.5 * PO.length) || 1);
  const need = lateral ? [2.5, 1.5] : [0.75, 0.35];
  let will = "long";
  if(!holes.length && starterBack && fairTop && starts && !dead.length){
    if(ratio >= 1.08 && wk >= need[0] && them.reg >= -0.5 && them.po >= -0.5) will = "likely";
    else if(ratio >= 0.88 && wk >= need[1] && them.reg >= -0.75 && them.po >= -0.75) will = "maybe";
  }
  return {id:tid, out, inn, after, d, holes, them, ra, inV, outV, ratio, starterBack, fairTop, starts, dead, lateral, wk, need, will};
}
/* A deal is a list of legs, {from, to, ids}. Two teams: me -> them, them -> me. Three teams is
   a rotation: me -> C, C -> B, B -> me. Every other team is judged on its own roster; the deal's
   answer is the worst of theirs. `quick` drops it early when it does nothing for me. */
function judgeDeal(legs, quick){
  const io = {}, at = id => (io[id] = io[id] || {out:[], inn:[]});
  for(const l of legs){ at(l.from).out.push(...l.ids); at(l.to).inn.push(...l.ids); }
  const m = at(ME), mine = TEAMS[ME].players;
  const mineAfter = swap(mine, new Set(m.out), new Set(m.inn));
  const mkey = m.out.join() + ">" + m.inn.join();
  let me = MEW.get(mkey);
  if(!me){ me = delta(W0[ME], worth(mineAfter, true, true)); MEW.set(mkey, me); }
  if(quick && me.score < 1) return null;
  const dm = Object.assign({}, DEPTH[ME]);
  for(const id of m.out){ const p = P[id]; if(counts(p, true)) dm[p.pos]--; }
  for(const id of m.inn){ const p = P[id]; if(p.ok) dm[p.pos]++; }
  const holesMe = SKILL.filter(pos => dm[pos] < DEPTH[ME][pos] && dm[pos] < spots(pos));
  const sides = Object.keys(io).map(Number).filter(id => id !== ME).map(id => sideJudge(id, io[id].out, io[id].inn));
  const will = sides.reduce((w, s) => (WORST[s.will] > WORST[w] ? s.will : w), "likely");
  /* The weeks I PLAY a team in the deal: what the trade does to their lineup that week counts
     against me (or for me). A player I send them who is on bye or out that week helps them
     every week but the one that matters to me. */
  const h2h = [];
  for(const s of sides){
    const ow = OPPW[s.id] || [];
    if(!s.dT) s.dT = ow.map(wi => lineup(s.after, wi, true, false) - lineup(TEAMS[s.id].players, wi, true, false));   // this is the real lineup, on projections
    ow.forEach((wi, n) => h2h.push({t:s.id, w:D.weeks[wi], dThem:s.dT[n], off:s.inn.filter(id => m.out.includes(id) && P[id].eff[wi] === 0).map(id => ({id, bye:P[id].wk[wi].o === "BYE"}))}));
  }
  const h2hB = -h2h.reduce((a, x) => a + x.dThem, 0);
  return {legs, sides, teams:sides.map(s => s.id), me, mineAfter, holesMe, dm, rm:rolesOf(mineAfter, true), will,
          give:m.out, get:m.inn, three:sides.length > 1, h2h, h2hB, rank:(me.score + h2hB) * WILLF[will]};
}
function sets(ids){
  const out = ids.map(a => [a]);
  for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++) out.push([ids[i], ids[j]]);
  return out;
}
// nobody deals for the injured list: hurt players stay out of the search unless I asked for one
const tradeable = (t, keep) => t.players.filter(id => id === keep || (SKILL.includes(P[id].pos) && P[id].base >= 5 && P[id].af >= 0.75 && (OV[id] || P[id].ep || !["O","IR","SUS","D"].includes(P[id].inj))));
const sumV = ids => ids.reduce((s,id) => s + P[id].v, 0);
/* Three-team deals for one pairing (what I send, what B sends me). Two shapes:
     rotation   everything of mine goes to C, C sends one player to B, B sends to me
     hub        I send one player to B and one to C; C still sends one to B
   The hub is the one that makes "my back for a better back" possible: B gives up its better
   back only if a back comes back (mine) AND something makes up the difference (C's player),
   and C is paid with my other player. The bounds are exact - value only shrinks on the
   receiving end, and a hole or a lopsided top piece is a no - so nothing that could pass is
   skipped. A three-way is kept only when every team can say yes. */
function threeWays(mg, bg, B, others, quick, out){
  const bKeep = keepV(bg), bTop = maxV(bg);
  const splits = [[[], mg]];
  if(mg.length === 2) splits.push([[mg[0]], [mg[1]]], [[mg[1]], [mg[0]]]);
  for(const C of others){
    if(C.id === B.id) continue;
    for(const a of tradeable(C)){
      const aV = P[a].v, aKeep = keepV([a]);
      for(const [toB, toC] of splits){
        if(sumV(toB) + aV < 0.88 * bKeep || sumV(toC) < 0.88 * aKeep || Math.max(aV, maxV(toB)) < 0.6 * bTop || maxV(toC) < 0.6 * aV) continue;
        if(holed(B.id, bg, toB.concat([a])) || holed(C.id, [a], toC)) continue;
        const j = judgeDeal([{from:ME, to:C.id, ids:toC}, ...(toB.length ? [{from:ME, to:B.id, ids:toB}] : []), {from:C.id, to:B.id, ids:[a]}, {from:B.id, to:ME, ids:bg}], quick);
        if(j && j.will !== "long") out.push(j);
      }
    }
  }
}
const maxV = ids => ids.reduce((m,id) => Math.max(m, P[id].v), 0);
const keepV = ids => ids.reduce((s,id) => s + P[id].v * (KEEP[ROLE0[id]] || 0.75), 0);
// would this team be left short anywhere? (the same test sideJudge makes, without the lineup maths)
function holed(tid, out, inn){
  const d0 = DEPP[tid], d = Object.assign({}, d0);
  for(const id of out){ const p = P[id]; if(p.okp) d[p.pos]--; }
  for(const id of inn){ const p = P[id]; if(p.okp) d[p.pos]++; }
  return SKILL.some(pos => d[pos] < d0[pos] && d[pos] < spots(pos));
}
const key2 = (t, g, r) => t + "|" + g.slice().sort().join() + ">" + r.slice().sort().join();
/* Every deal that makes my lineup better, with every team - no caps. 1-for-1 up to 2-for-2 with
   one team, and three-team rotations where I send one or two players to C, C sends one to B and
   B sends one or two to me. The only thing skipped is the absurd: asking for a player while
   offering under half his value. Returns a list of tasks so the page can run them in slices. */
function packageTasks(only, out){
  const tasks = [], mineT = tradeable(TEAMS[ME]), mySets = sets(mineT), others = D.teams.filter(t => t.id !== ME);
  // what a swap does for my lineup, worked out once per pair and shared by both searches
  const memo = new Map(), mine = TEAMS[ME].players;
  const meGain = (mg, tg) => { const k = mg.join() + ">" + tg.join(); let v = memo.get(k);
    if(v === undefined){ v = delta(W0[ME], worth(swap(mine, new Set(mg), new Set(tg)), true, true)).score; memo.set(k, v); } return v; };
  const onlyT = only ? P[only].t : null, straight = new Set();
  // two teams
  for(const t of others){
    if(only && onlyT !== t.id) continue;
    tasks.push(() => {
      let theirs = sets(tradeable(t, only));
      if(only) theirs = theirs.filter(s => s.includes(only));
      for(const tg of theirs){
        const getV = sumV(tg);
        for(const mg of mySets){
          if(sumV(mg) < 0.45 * getV || meGain(mg, tg) < 1) continue;
          const j = judgeDeal([{from:ME, to:t.id, ids:mg}, {from:t.id, to:ME, ids:tg}], true);
          if(j){ out.push(j); if(j.will === "likely") straight.add(key2(t.id, mg, tg)); }
        }
      }
    });
  }
  // three teams: for each thing I could send and each thing B could send me, find a C in the
  // middle that wants mine and has what B wants
  for(const B of others){
    if(only && onlyT !== B.id) continue;
    let fromB = sets(tradeable(B, only));
    if(only) fromB = fromB.filter(s => s.includes(only));
    for(const bg of fromB) tasks.push(() => {
      const bV = sumV(bg);
      for(const mg of mySets){
        const mV = sumV(mg);
        if(mV < 0.45 * bV) continue;
        if(meGain(mg, bg) < 1 || straight.has(key2(B.id, mg, bg))) continue;     // already a yes without a third team
        threeWays(mg, bg, B, others, true, out);
      }
    });
  }
  return tasks;
}
/* Drop a deal only when a simpler one is at least as good: the same team, a subset of the same
   players, as big a gain for me and an answer at least as likely. A three-way goes when the
   straight deal with B (same players out, same back) already works as well. */
/* Thin the list to deals worth reading. A deal goes when a smaller one with the same team does
   as well for me and gets as good an answer: fewer players out, or fewer back. A three-way
   goes when a straight deal with the team I'm getting players from does as well, and each
   swap keeps only its best three-way - the same players out and back through a different
   third team is the same idea twice. */
function prune(list){
  const two = {}, three = {};
  const src = j => (j.three ? j.legs.find(l => l.to === ME).from : j.teams[0]);
  const asGood = (k, j) => k && k !== j && WORST[k.will] <= WORST[j.will] && k.me.score >= j.me.score - 0.5;
  for(const j of list){
    const k = key2(src(j), j.give, j.get);
    if(!j.three){ two[k] = j; continue; }
    const b = three[k];
    if(!b || WORST[j.will] < WORST[b.will] || (j.will === b.will && j.rank > b.rank)) three[k] = j;
  }
  const subs = a => (a.length === 2 ? [[a[0]], [a[1]], a] : [a]);
  return list.filter(j => {
    const B = src(j);
    if(j.three && three[key2(B, j.give, j.get)] !== j) return false;
    for(const g of subs(j.give)) for(const r of subs(j.get)){
      const k = key2(B, g, r);
      if(asGood(two[k], j)) return false;
      if(j.three && asGood(three[k], j)) return false;
    }
    return true;
  });
}
function findPackages(only){
  const out = [];
  for(const f of packageTasks(only, out)) f();
  return prune(out);
}
function searchPackages(){
  const run = ++SEARCH, out = [], tasks = packageTasks(null, out), n = tasks.length;
  ALLPK = []; BESTWILL = {}; SEARCHING = "Searching every team…";
  $("pkn").textContent = ""; if(S.view === "packages" && !S.pkFor) renderPackages();
  if(S.pkFor) FORPK = P[S.pkFor] ? findPackages(S.pkFor) : [];
  if(S.pkGive.length) GIVEPK = findForGive(S.pkGive.filter(id => P[id] && P[id].t === ME));
  const step = () => {
    if(run !== SEARCH) return;
    const t0 = performance.now();
    while(tasks.length && performance.now() - t0 < 25) tasks.shift()();
    if(tasks.length){
      SEARCHING = `Searching every team… ${Math.round(100 * (n - tasks.length) / n)}%`;
      if(S.view === "packages" && !S.pkFor) $("pkl").innerHTML = `<div class="chip">${SEARCHING}</div>`;
      setTimeout(step, 0); return;
    }
    ALLPK = prune(out); SEARCHING = ""; SJ.clear(); MEW.clear();
    for(const pk of ALLPK) for(const id of pk.get){ const w = BESTWILL[id]; if(!w || WORST[pk.will] < WORST[w]) BESTWILL[id] = pk.will; }
    $("pkn").textContent = ALLPK.length; renderPackages(); renderTargets();
  };
  clearTimeout(pkTimer); pkTimer = setTimeout(step, 30);
}
// why a deal reads the way it does, as a few coloured words
function pkChips(pk){
  const out = [], seen = new Set();
  const add = (txt, k) => { if(!seen.has(txt)){ seen.add(txt); out.push([txt, k]); } };
  for(const s of pk.sides){
    const ab = tName(s.id);
    for(const pos of s.holes) add(`Leaves ${ab} short at ${pos}`, "r");
    if(!s.starterBack) add(`${ab} loses a starter, gets none`, "r");
    if(!s.fairTop) add(`${ab} gives the best player for less`, "r");
    if(!s.starts) add(`${ab} only gets bench players`, "r");
    else if(s.dead.length) add(`${ab} has no use for ${short(P[s.dead[0]])}`, "r");
    else if(s.lateral && s.wk < s.need[1]) add(`Lateral move for ${ab}`, "r");
    else if(s.holes.length === 0 && s.starterBack && s.fairTop && s.will === "long") add(`Light for ${ab}`, "r");
  }
  for(const s of pk.sides){
    const ab = tName(s.id);
    for(const id of s.inn){ const p = P[id];
      if(p.okp && DEPP[s.id][p.pos] < spots(p.pos)) add(`Fills ${ab}'s ${p.pos} hole`, "g");
      else if(s.ra[id] === "S") add(`${short(p)} starts for ${ab}`, "g"); }
    for(const id of s.out){ const pos = P[id].pos; if(DEPP[s.id][pos] > spots(pos)) add(`${ab} deep at ${pos}`, "g"); }
  }
  const lead = [];
  for(const x of pk.h2h || []){
    const ab = tName(x.t);
    if(x.off.length) lead.push([`${x.off.map(o => short(P[o.id])).join(", ")} ${x.off.every(o => o.bye) ? "on bye" : "out"} wk ${x.w}, when I play ${ab}`, "g"]);
    else if(x.dThem <= -1) lead.push([`${ab} weaker wk ${x.w}, when I play them (${sgn(x.dThem)})`, "g"]);
    else if(x.dThem >= 1) lead.push([`${ab} stronger wk ${x.w}, when I play them (${sgn(x.dThem)})`, "r"]);
  }
  for(const id of pk.get){ const p = P[id], b = p.wk.find(w => w.o === "BYE"); if(b) lead.push([`${short(p)} bye wk ${b.w}`, "a"]); }
  for(const id of pk.get){ const p = P[id], l = p.sg && p.sg.E >= 0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, "b"); }
  for(const id of pk.give){ const p = P[id], l = p.sg && p.sg.E <= -0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, ""); }
  // price and timing, one note a player: who is bought low or sold high, and whether a week's
  // wait gets a better deal. Only players the league would start count as sold high.
  for(const id of pk.get){ const p = P[id], w = windowOf(p, "buy");
    if(w.k === "wait") lead.push([`${short(p)} cheaper after wk ${w.w}`, "a"]);
    else if(p.mk <= -MK) lead.push([`Buying ${short(p)} low`, "g"]); }
  for(const id of pk.give){ const p = P[id], w = windowOf(p, "sell");
    if(!p.okp) continue;
    if(w.k === "wait") lead.push([`${short(p)} sells for more after wk ${w.w}`, "a"]);
    else if(p.mk >= MK) lead.push([`Selling ${short(p)} high`, "g"]); }
  return lead.concat(out).slice(0, 7);
}

/* ---- builder ---------------------------------------------------------------------------*/
function listHtml(team, sel, dest){
  const mine = team.id === ME;
  const ps = team.players.map(id => P[id]).filter(p => SKILL.includes(p.pos)).sort((a,b) => ORDER[a.pos] - ORDER[b.pos] || rk(b, mine) - rk(a, mine));
  let out = "", last = "";
  for(const p of ps){
    if(p.pos !== last){ out += `<div class="grp">${p.pos}</div>`; last = p.pos; }
    out += `<button class="row${sel.has(p.id) ? " sel" : ""}" data-id="${p.id}"><span class="ck"></span>${img(p)}
      <span class="who"><span class="nm" data-pid="${p.id}">${esc(p.n)}</span><span class="meta"><span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${roleBadge(p)}${dest && dest(p.id) ? `<span class="dest">${esc(dest(p.id))}</span>` : ""}${p.lens ? ptag(p, "reg", true) + ptag(p, "po", true) : ""}</span></span>
      <span class="n2"><span>${f1(p.ros)}</span><span>${f1(p.po)}</span></span></button>`;
  }
  return out;
}
// the legs of whatever is picked in the builder
function builderLegs(){
  const B = +$("partner").value;
  if(!S.three) return [{from:ME, to:B, ids:[...give], set:"give"}, {from:B, to:ME, ids:[...get], set:"get"}];
  const C = +$("partnerA").value;
  // mine to C always; mine to B too when I've sent B a piece directly (the hub shape)
  return [{from:ME, to:C, ids:[...give], set:"give"}, ...(giveB.size ? [{from:ME, to:B, ids:[...giveB], set:"giveB"}] : []),
          {from:C, to:B, ids:[...via], set:"via"}, {from:B, to:ME, ids:[...get], set:"get"}];
}
function renderDeal(){
  const legs = builderLegs(), setOf = {give, get, via, giveB};
  const chip = (id, set) => { const p = P[id]; return `<button class="dchip" data-id="${id}" data-set="${set}"><span class="nm" title="${esc(p.n)}">${esc(initial(p))}</span><span class="pos ${p.pos}">${p.pos}</span><span class="x">×</span></button>`; };
  const names = ids => ids.map(id => short(P[id])).join(", ");

  let full = `<div class="dsides${S.three ? " three" : ""}">${legs.map((l, i) => `<div class="dside"><div class="lab">${legLab(l, i)}</div><div class="dchips">${[...setOf[legSet(i)]].map(id => chip(id, legSet(i))).join("")}</div></div>`).join("")}</div>`;
  const any = legs.some(l => l.ids.length), ready = legs.every(l => l.ids.length);

  if(!ready) full += `<div class="dempty">${sumV}</div>`;
  else {

    else if(j.me.score >= 3){ call = "Good for me, a long shot for them"; color = "var(--warn)"; }
    else if(j.me.score > -3){ call = "A wash"; color = "var(--dim)"; }
    else { call = "Pass"; color = "var(--bad)"; }
    // why: each roster after the deal
    const fl = [], line = (k, t) => fl.push(`<div class="sg ${k}"><i></i><span>${t}</span></div>`);
    for(const s of j.sides){
      const ab = esc(tName(s.id));
      for(const pos of s.holes) line("r", `Leaves ${ab} short at ${pos}: ${s.d[pos]} startable for ${plural(spots(pos), "spot")}`);

      if(!s.starterBack) line("r", `${ab} gives up a starter and gets none back`);

      else if(s.lateral && s.wk < s.need[1]) line("r", `A sideways move for ${ab}: ${sgn(s.wk)} a week at one position isn't worth the trouble`);
      else if(s.holes.length === 0 && s.starterBack && s.fairTop && s.will === "long") line("r", `${ab} would want more: it gets ${f1(s.inV)} of value for ${f1(s.outV)}`);
      for(const id of s.inn){ const p = P[id], r = s.ra[id];
        if(p.okp && DEPP[s.id][p.pos] < spots(p.pos)) line("", `${esc(short(p))} fills a hole for ${ab} at ${p.pos}`);
        else if(r === "S") line("", `${esc(short(p))} starts for ${ab}`);
        else if(r === "F") line("a", `${esc(short(p))} would be ${ab}'s flex`);

    }

    const pvBtns = pvTeams.map(id => `<button data-pv="${id === ME ? "me" : id}"${id === pid ? ' class="on"' : ""}>${esc(id === ME ? "Mine" : tName(id))}</button>`).join("");
    const vbars = j.sides.map(s => `<div class="lab" style="margin-top:14px">What it is worth to ${esc(tName(s.id))} &middot; ${WORD[s.will]}</div>

    full += `<div class="call" style="color:${color}">${call}</div>
      <div class="sig">${fl.join("")}</div>
      <div class="pvh"><div class="lab">Lineup after the trade</div>
        <div class="seg pvseg">${pvBtns}</div></div>
      <div class="ranks">${diff}</div>

      <div class="lab">Lineup points a week, byes and injuries counted</div>

    sumV = `<b style="color:${color}">${call}</b>${REG.length ? `<span class="${cls(j.me.reg)}">${sgn(j.me.reg)}</span>` : ""}${PO.length ? `<span class="${cls(j.me.po)}">${sgn(j.me.po)} PO</span>` : ""}`;
  }
  if(any) full += `<div class="dfoot"><button class="b" id="clear">Clear</button></div>`;
  $("deal").classList.toggle("open", S.dealOpen);
  $("deal").innerHTML = `<button class="dsum" id="dsum"><div class="mid"><div class="who">${sumWho}</div><div class="v">${sumV}</div></div><span class="tog">${S.dealOpen ? "Hide" : "Details"}</span></button>
    <div class="dfull">${full}</div>`;

/* ---- waivers -------------------------------------------------------------------------------
   Every free agent is priced by what he would add to each team's lineup, byes and injuries
   counted, from today to week 17 (playoff weeks count 1.5x). What a team should pay is a share
   of the FAAB it has left, and that share climbs faster than the points do:
     share = min(70%, ((gain - 0.5) / 10)^1.5)    gain = lineup points a week he adds to that team
   The first half-point is free: a body to cover one bye can be found that week for $0-5. So +1 a
   week is about 1% of a budget, +2 about 6%, +3 about 12%, +5 about 30%, +8 or more 65-70%.
   The bid is what it takes to beat the rival who wants him most (their share of THEIR budget,
   plus $1), never more than he is worth to me. If that rival can outbid my ceiling, it says so. */
const share = g => Math.min(0.7, Math.pow(Math.max(0, g - 0.5) / 10, 1.5));
/* How long a pickup helps. Every remaining week is scored on its own: the points he adds to the
   lineup that week, against the lineup without him. A week counts as "useful" at +1 or more.
     Long-term   useful in at least 60% of the remaining weeks (a real lineup piece)
     Short-term  useful in 2 or more weeks, but not most of them (injury cover, a soft stretch)
     Fill-in     useful in one week only (a bye or a single injury)
   Value follows from that. A long-term pickup is worth his full gain. A short-term one is worth
   his gain times the share of the 60% he covers. A fill-in is worth nothing today unless his
   week is the next one: anyone can be picked up the week he's needed, usually for $0-5. */
const USEFUL = 1, LONG = 0.6;
function termOf(dw){
  const n = dw.length, use = dw.filter(x => x >= USEFUL).length;
  if(!n || !use) return {k:"none", use, persist:0};
  if(use >= Math.max(3, Math.ceil(LONG * n))) return {k:"long", use, persist:1};
  if(use >= 2) return {k:"short", use, persist:Math.min(1, use / (LONG * n))};
  return {k:"fill", use, persist:0, wk:D.weeks[dw.findIndex(x => x >= USEFUL)]};
}
/* How each team has bid this season, from every waiver claim ESPN recorded - the ones that won
   and the ones that lost to a higher bid (a losing bid still shows what they'd pay).
   Each bid is read as a share of the budget the team had at that moment, so $200 from a full
   $1,000 and $60 from the last $300 are the same appetite.
     rate    the average of a team's three biggest shares: how hard it goes when it wants someone
     f       that rate against the league's median, held between 0.6 and 1.6. A team at 1.4
             pays about 40% more for the same player than the model's price; one at 0.7, less
   The price is still a share of what the team has LEFT, so a big spender with little left can't
   repeat it - the habit scales the bid, the wallet caps it.
   (Budget-at-the-time ignores FAAB moved in trades, which ESPN doesn't date; shares cap at 1.) */
function buildHabits(){
  HAB = {};
  const F = D.faab;
  if(!F) return;
  const rem = {}, bids = {};
  for(const t of D.teams){ rem[t.id] = F.budget; bids[t.id] = []; }
  for(const b of F.hist || []){
    if(!(b.t in rem)) continue;
    bids[b.t].push(Object.assign({s:Math.min(1, b.a / Math.max(1, rem[b.t]))}, b));
    if(b.won) rem[b.t] = Math.max(0, rem[b.t] - b.a);
  }
  const rate = {};
  for(const t of D.teams){ const s = bids[t.id].map(x => x.s).sort((a,b) => b - a).slice(0, 3); rate[t.id] = s.length ? s.reduce((a,b) => a + b, 0) / s.length : null; }
  const known = Object.values(rate).filter(x => x != null).sort((a,b) => a - b);
  const med = known.length ? (known[(known.length - 1) >> 1] + known[known.length >> 1]) / 2 : 0;
  for(const t of D.teams){
    const b = bids[t.id], amts = b.map(x => x.a).sort((x,y) => x - y), won = b.filter(x => x.won);
    const f = rate[t.id] == null || !med ? 1 : Math.max(0.6, Math.min(1.6, rate[t.id] / med));
    HAB[t.id] = {f, rate:rate[t.id], n:b.length, won:won.length, lost:b.length - won.length,
      typ:amts.length ? amts[amts.length >> 1] : null, low:amts.length ? amts.filter(a => a <= 2 * (F.min || 1)).length / amts.length : 0,
      big:b.slice().sort((x,y) => y.a - x.a)[0] || null, top:b.slice().sort((x,y) => y.a - x.a).slice(0, 3),
      style:f >= 1.25 ? "big" : f <= 0.8 ? "thrifty" : "avg"};
  }
}
function buildWaivers(){
  buildHabits();
  WAIV = [];
  if(!D.faab) return;
  const W = D.weeks.length, wt = i => (PO.includes(i) ? 1.5 : 1), denom = (REG.length + 1.5 * PO.length) || 1;
  const left = D.faab.left || {}, min = D.faab.min || 1;
  // each team's lineup each week without help
  const base = {};
  for(const t of D.teams) base[t.id] = D.weeks.map((w, i) => lineup(t.players, i, false, t.id === ME));
  const mine = TEAMS[ME].players;
  const gainFor = (t, p) => {
    const ids = t.players.concat([p.id]), m = t.id === ME;
    const dw = D.weeks.map((w, i) => Math.max(0, lineup(ids, i, false, m) - base[t.id][i]));
    const raw = dw.reduce((s, x, i) => s + x * wt(i), 0) / denom, term = termOf(dw);
    // a fill-in only counts if he's needed this coming week, and only for that week
    const now = term.k === "fill" && term.wk === D.weeks[0] ? dw[0] * wt(0) / denom : 0;
    /* A kicker's or a defence's projected edge is far less dependable than a skill player's:
       this season only about a quarter of a kicker's edge over the average carried into his
       next game, and about two-thirds of a defence's (own form plus matchup). A bid is sized
       on the part that can be counted on, so nobody pays starter money for a kicker. */
    const kd = (D.kd || {})[p.pos], rel = SKILL.includes(p.pos) ? 1 : kd ? Math.min(1, p.pos === "K" ? kd.own : kd.own + kd.match) : 0.4;
    return {dw, raw, term, g:(term.k === "fill" ? now : raw * term.persist) * rel};
  };
  for(const p of Object.values(P)){
    if(p.t || !(p.base > 0)) continue;
    const by = {};
    for(const t of D.teams) by[t.id] = gainFor(t, p);
    const me = by[ME], g = me.g;
    const dMe = {reg:REG.length ? REG.reduce((s, i) => s + me.dw[i], 0) / REG.length : 0, po:PO.length ? PO.reduce((s, i) => s + me.dw[i], 0) / PO.length : 0};
    let rival = null, rv = 0, users = 0;
    for(const t of D.teams){
      if(t.id === ME) continue;
      if(by[t.id].term.k === "long") users++;
      // what the model says he's worth to them, scaled by how that team actually bids, capped by its wallet
      const w = Math.min(left[t.id] || 0, (left[t.id] || 0) * share(by[t.id].g) * ((HAB[t.id] || {}).f || 1));
      if(w > rv){ rv = w; rival = t.id; }
    }
    const cap = Math.floor((left[ME] || 0) * share(g));
    const need = Math.max(min, Math.round(rv) + 1);
    let bid = g < 0.5 ? 0 : Math.max(min, Math.min(cap, need));
    // a fill-in for this week: a dollar or two, never a real bid
    if(me.term.k === "fill" && me.term.wk === D.weeks[0] && me.dw[0] >= USEFUL) bid = Math.max(min, Math.min(3, cap || min));
    WAIV.push({p, g, raw:me.raw, term:me.term, dw:me.dw, d:dMe, role:rolesOf(mine.concat([p.id]), true)[p.id], cap, bid, rival, rv:Math.round(rv), users,
      outbid:!!rival && need > cap && g >= 0.5 && me.term.k !== "fill"});
  }
  // who to cut for the best few: the player whose loss costs my lineup least once he is in
  WAIV.sort((a,b) => b.bid - a.bid || b.g - a.g);
  // never suggest cutting a starter call or a handcuff: both are holds I made on purpose
  const cut = mine.filter(id => SKILL.includes(P[id].pos) && !(roleOf(id) && (roleOf(id).r === "S" || roleOf(id).c)));
  for(const x of WAIV.filter((x, i) => i < 60 || !SKILL.includes(x.p.pos))){
    const withP = worth(mine.concat([x.p.id]), false, true);
    let best = null;
    // a kicker or defence comes in for my own kicker or defence
    for(const id of SKILL.includes(x.p.pos) ? cut : mine.filter(q => P[q].pos === x.p.pos)){
      const d = delta(withP, worth(mine.filter(q => q !== id).concat([x.p.id]), false, true));
      if(!best || d.score > best.d.score) best = {id, d};
    }
    x.drop = best;
  }
}

/* ---- player card -----------------------------------------------------------------------------
   Tap a player's name or photo anywhere and this opens: what he does for my team, his schedule
   week by week with the projection for each game, the totals, how the projection is built, his
   games so far, and the stats that matter at his position. */
let CARD = null;
function playerCard(id){

    lens = `<div class="pcls">${cell("reg", "Rest of season · wk " + wkSpan(REG))}${cell("po", "Playoffs · wk " + wkSpan(PO))}</div>`;
  }
  // schedule, one line a week
  const sched = D.weeks.map((w, i) => {
    const g = p.wk[i], bye = g.o === "BYE", out = !bye && p.eff[i] === 0 && g.p > 0;
    return `<div class="pcw${w >= 15 ? " po" : ""}${bye || out ? " off" : ""}" style="${bye || out ? "" : rkBg(g.rk)}" title="${g.rk ? ord(g.rk) + " of 32 vs " + p.pos + " (32nd = softest)" : ""}"><span>Wk ${w}</span><b>${bye ? "BYE" : g.o}</b><i>${bye ? "–" : out ? "out" : f1(p.eff[i])}</i></div>`;
  }).join("");
  // games so far
  let log = "";
  if(p.pl){
    const max = Math.max(30, ...p.pl.map(x => x || 0));
    log = `<div class="pch">Games so far</div><div class="pclog">${p.pl.map((x, i) => `<div class="pcb${x == null ? " none" : ""}"><em>${x == null ? "" : Math.round(x)}</em><i style="height:${x == null ? 2 : Math.max(3, Math.round(x / max * 56))}px"></i><span>${i + 1}</span></div>`).join("")}</div>`;
  }
  // stats for his position
  let stats = "";
  if(skill && p.g != null){
    const cx = k => { const c = COLS[k], t = cellText(c, p);
      return `<div class="dc"${t != null && c.tint ? ` style="${tint(p, k)}"` : ""}><span title="${esc(c.t || "")}">${c.h}</span><div class="${t != null && c.cl ? c.cl(c.v(p)) : ""}">${t == null ? "–" : t}</div></div>`; };
    stats = `<div class="pch">${p.pos} numbers <span>green = high for the position, red = low</span></div><div class="dg">${["ppg", ...statKeys(p.pos)].map(cx).join("")}</div>`;
  }
  const read = skill ? sigChips(p).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ") : "";
  // how the number is built
  const how = p.ep
    ? `<b>${f1(p.base)}</b> a game in the weeks he plays. These are <b>ESPN's projections</b>, week by week, in this league's scoring.${p.wk.some(w => w.z) ? " A week ESPN projects at zero counts as out unless I overrule it under My call." : ""}${skill && p.g != null ? ` For reference: his workload is worth ${f1(p.xfp)} expected points a game, and he has scored ${f1(p.ppg)} a game over ${plural(p.g, "game")}.` : p.g != null ? ` So far: ${f1(p.ppg)} a game.` : ""}`
    : skill && p.g != null
    ? `<b>${f1(p.base)}</b> a game when healthy = half his workload (${f1(p.xfp)} expected points from his carries and targets${p.pos === "QB" ? ", passes and runs" : ""}) and half what he has scored (${f1(p.ppg)} a game over ${plural(p.g, "game")})${p.xp ? ", lifted to his last three games because the analysts flagged him this week" : Math.abs(p.rs || 0) >= 0.05 ? `, leaning on his last three because his role moved ${p.rs > 0 ? "up" : "down"} ${Math.round(Math.abs(p.rs) * 100)}%` : ""}. Each week is that rate times the matchup (how many points the opponent gives up to ${p.pos}s, up to ±20%), zero on a bye, and nothing while he's out.`
    : (D.kd || {})[p.pos] && p.g != null
      ? `<b>${f1(p.base)}</b> a game on average. ${p.pos === "DST" ? "A defense's week is mostly its opponent" : "Kickers mostly regress to the average"}: each week starts at the league average (${f1(D.kd[p.pos].lg)}), adds ${Math.round(D.kd[p.pos].own * 100)}% of ${p.pos === "DST" ? "this unit's" : "his"} own edge (${f1(p.ppg)} a game so far), and ${p.pos === "DST" ? Math.round(D.kd[p.pos].match * 100) + "% of how far that opponent is above or below average in points given up to defenses" : D.kd[p.pos].match.toFixed(2) + " for every point his team is expected to score above average"}.`
      : `<b>${f1(p.base)}</b> a game: his season average.`;
  const wv = !p.t && skill ? WAIV.find(x => x.p.id === p.id) : null;
  // price against projection, and when to move
  let timing = "";
  if(skill && p.t){
    const side = sideOf(p), w = windowOf(p, side), mine = p.t === ME, hi = p.mk >= MK, lo = p.mk <= -MK;
    const call = hi ? (mine ? "Sell high" : "Priced high") : lo ? (mine ? "Priced low" : "Buy low") : "Fairly priced";
    const head = w.k === "wait" ? `${mine ? "Sell" : "Buy"} after wk ${w.w}.` : w.k === "now" ? `${mine ? "Sell" : "Buy"} now.` : "No rush either way.";
    const said = hi ? (mine ? "The league pays for what he has done, which is more than he projects: this is the time his price beats his value to me."
                            : "His team will want paying for what he has done, which is more than he projects.")
               : lo ? (mine ? "The league would pay less than he projects for: better kept than sold."
                            : "He has scored less than he projects for, so he costs less than he is worth to me.")
               : "The league's price and the projection agree.";
    timing = `<div class="pch">Trade timing <span>the league prices on what he has done; my lineup runs on what he will do</span></div>
    <div class="pcns">${num(f1(p.seen), "League sees", "a game: season and last three")}${num(f1(p.base), "Projects", "a game from here")}${num(`<span class="mkc ${hi ? (mine ? "up" : "down") : lo ? (mine ? "down" : "up") : ""}">${call}</span>`, hi || lo ? sgn(p.mk) + " a game" : "within " + MK, "price against projection")}</div>
    <div class="pchow pctm"><b>${head}</b> ${esc(w.why)} ${said}</div>`;
  }
  const act = p.t && p.t !== ME && skill ? `<button class="b go" data-card-act="deal">Packages to get him</button>`
    : p.t === ME && skill ? `<button class="b go" data-card-act="shop">Shop him</button>` : "";
  $("pcard").innerHTML = `<div class="mbox" role="dialog" aria-label="${esc(p.n)}">
    <button class="mclose" data-card-close aria-label="Close">×</button>
    <div class="pct">${img(p, "xl")}
      <div class="pcid"><h2>${esc(p.n)}</h2>
        <div class="meta"><span class="pos ${p.pos}">${p.pos === "DST" ? "DEF" : p.pos}</span><span>${p.tm}${p.prk ? ` · ${p.pos}${p.prk} in scoring` : ""}</span>${injBadge(p)}${roleBadge(p)}</div>
        <div class="own">${owner}</div></div></div>
    ${lens}
    <div class="pcns">${skill ? num(sgn(p.base - (REPL[p.pos] || 0)), "Over replacement", `a game vs the ${p.pos} waiver wire (${f1(REPL[p.pos] || 0)})`) : ""}${num(f1(sum(ALLW)), "Projected total", `wk ${wkSpan(ALLW)}`)}${REG.length ? num(f1(sum(REG)), "Rest of season", `${plural(games(REG), "game")} · ${f1(p.ros)} a game`) : ""}${PO.length ? num(f1(sum(PO)), "Playoffs", `${plural(games(PO), "game")} · ${f1(p.po)} a game`) : ""}${p.g != null ? num(f1(p.ppg), "Scored so far", `a game, ${plural(p.g, "game")}`) : ""}</div>
    ${timing}
    ${wv ? `<div class="pcwv">Waivers: ${wv.bid ? `bid <b>$${wv.bid}</b>` : "no bid"} · ${termPill(wv).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}</div>` : ""}
    <div class="pch">Schedule and projection <span>opponent shaded by how soft it is on ${p.pos === "DST" ? "defences" : p.pos + "s"}; playoff weeks outlined</span></div>
    <div class="pcsched">${sched}</div>
    <div class="pchow">${how}</div>
    ${read ? `<div class="pch">The read</div><div class="chips">${read}</div>` : ""}
    ${log}${stats}
    <div class="pch">My call</div><div class="pcctl">${stSel(p)}${roleSel(p)}</div>
    ${act ? `<div class="pcact">${act}</div>` : ""}
  </div>`;
  $("pcard").hidden = false;
  $("pcard").scrollTop = 0;
}
function closeCard(){ CARD = null; $("pcard").hidden = true; $("pcard").innerHTML = ""; }

/* ---- league ranking: all twelve teams at one spot, or by lineup ----------------------------
   The same numbers the tiles rank on: a position is each team's starters there (best first, as
   many as the league starts), a lineup is its best legal lineup a week with byes and injuries. */
function boardCard(kind){
  CARD = null;
  const lineupKind = kind === "reg" || kind === "po", idx = kind === "reg" ? REG : PO, n = lineupKind ? 0 : spots(kind) || 1;
  const rows = D.teams.map(t => {
    if(lineupKind) return {t, v:idx.length ? idx.reduce((s, i) => s + lineup(t.players, i, false, t.id === ME), 0) / idx.length : 0, top:[]};
    const top = t.players.map(id => P[id]).filter(p => p.pos === kind).sort((a, b) => b.adj - a.adj).slice(0, n);
    return {t, v:top.reduce((s, p) => s + p.adj, 0), top};
  }).sort((a, b) => b.v - a.v);
  const max = Math.max(1, ...rows.map(r => r.v));
  const title = lineupKind ? `Lineup, weeks ${wkSpan(idx)}` : `${kind} around the league`;
  $("pcard").innerHTML = `<div class="mbox" role="dialog" aria-label="${esc(title)}">
    <button class="mclose" data-card-close aria-label="Close">×</button>
    <h2 class="bdh">${esc(title)}</h2>
    <div class="bdsub">${lineupKind ? "Each team's best lineup, points a week, byes and injuries counted" : `Each team's ${n > 1 ? plural(n, "starter") : "starter"} at ${kind}, projected points a game`}. Tap a player for his card.</div>
    <div class="bdl">${rows.map((r, i) => `<div class="bd${r.t.id === ME ? " me" : ""}">
      <b class="bdr">${i + 1}</b>${tlogo(r.t.id)}
      <div class="bdm"><div class="bdn">${esc(r.t.id === ME ? r.t.name + " (me)" : r.t.name)}<span>${r.t.w}-${r.t.l}</span></div>
        ${r.top.length ? `<div class="bdp">${r.top.map(p => `<span data-pid="${p.id}">${esc(short(p))} <i>${f1(p.adj)}</i></span>`).join("")}</div>` : ""}
        <div class="bdbar"><i style="width:${Math.round(r.v / max * 100)}%"></i></div></div>
      <b class="bdv">${f1(r.v)}</b></div>`).join("")}</div>
  </div>`;
  $("pcard").hidden = false; $("pcard").scrollTop = 0;
}

function show(v){
  S.view = v;
  for(const k of VIEWS) $("v-" + k).hidden = k !== v;
  document.querySelectorAll("#sub button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  try { history.replaceState(null, "", "#" + v); } catch(e){}
}
function renderAll(){ recompute(); SEARCHING = "Searching every team…"; BESTWILL = {}; renderTargets(); renderTiles("tiles", false); renderRoster(); renderBuilder(); renderWaivers(); searchPackages(); }
const pickSeg = (id, attr, fn) => ($(id).onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  fn(b.dataset[attr]);
});

function boot(d){
  D = d; P = d.players; ME = d.me;
  d.teams.forEach(t => (TEAMS[t.id] = t));
  d.weeks.forEach((w, i) => { (w >= 15 ? PO : REG).push(i); ALLW.push(i); });
  for(const p of Object.values(P)) p.tr = p.rs || 0;
  OPPW = {};
  for(const [w, t] of Object.entries(d.opps || {})){ const wi = d.weeks.indexOf(+w); if(wi >= 0) (OPPW[t] = OPPW[t] || []).push(wi); }
  // drop status calls that have run their course
  for(const id of Object.keys(OV)) if(!P[id] || (OV[id].t === "O" && OV[id].thru < d.weeks[0])) delete OV[id];
  saveOV();
  buildPct(); buildCols();
  NS = ["QB","RB","WR","TE","K","DST"].map(spots); NF = spots("FLEX");
  for(const p of Object.values(P)) p.pi = PI[p.pos];

  const me = TEAMS[ME], others = d.teams.filter(t => t.id !== ME).sort((a,b) => a.name.localeCompare(b.name));
  const teamOpts = others.map(t => `<option value="${t.id}">${esc(t.name)} (${t.w}-${t.l})</option>`).join("");
  $("scope").innerHTML = `<option value="me">My roster</option><option value="league">Every rostered player</option>
    <option value="all">Everyone, with free agents</option><option value="fa">Free agents only</option><optgroup label="Other teams">${teamOpts}</optgroup>`;
  $("tgsrc").innerHTML = `<option value="">Any team</option>${teamOpts}`;
  $("partner").innerHTML = teamOpts;
  $("partnerA").innerHTML = teamOpts;
  if(others[1]) $("partnerA").value = others[1].id;
  $("msort").innerHTML = [["","Sort: roster order"],["ppg","Sort: PPG"],["xfp","Sort: expected (xFP)"],["fpoe","Sort: scored vs expected"],["up","Sort: upside"],
    ["snap","Sort: snap share"],["ts","Sort: target share"],["cs","Sort: carry share"],["wopr","Sort: WOPR"],["tps","Sort: targets per snap"],["opp","Sort: opportunities"],
    ["rz","Sort: red-zone share"],["trend","Sort: trend"],["ros","Sort: rest of season"],["po","Sort: playoffs"],["st","Sort: availability"]]
    .map(o => `<option value="${o[0]}">${o[1]}</option>`).join("");

  $("msg").hidden = true; $("sub").hidden = false;
  const want = location.hash.slice(1);
  show(VIEWS.includes(want) ? want : "targets");
  renderAll();

  $("sub").onclick = e => { const b = e.target.closest("button"); if(b){ show(b.dataset.v); if(b.dataset.v === "packages") renderPackages(); } };
  // any status or lineup-call menu, wherever it is drawn
  document.addEventListener("change", e => {
    const s = e.target.closest("select.st");
    if(s){
      const v = s.value, id = s.dataset.id;
      if(!v) delete OV[id]; else OV[id] = v === "H" ? {t:"H"} : {t:"O", thru:+v.slice(2)};
      saveOV(); renderAll(); if(CARD) playerCard(CARD); return;
    }
    const r = e.target.closest("select.rl");
    if(r){
      const v = r.value, id = r.dataset.id;
      ROLE[id] = !v ? {r:"A"} : v === "S" ? {r:"S"} : v === "B" ? {r:"B"} : {r:"B", c:v.slice(2)};
      saveRole(); renderAll(); if(CARD) playerCard(CARD);
    }
  });
  // "see all" on a ranking tile: the whole league at that spot
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-board]"); if(!b) return;
    e.stopPropagation(); e.preventDefault();
    boardCard(b.dataset.board);
  }, true);
  // a name or a photo, anywhere: open his card instead of whatever the row does
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-pid]");
    if(!t || t.closest(".opt, .dchip") || (t.closest("#pcard") && t.dataset.pid === CARD)) return;
    e.stopPropagation(); e.preventDefault();
    playerCard(t.dataset.pid);
  }, true);
  $("pcard").addEventListener("click", e => {
    if(e.target === $("pcard") || e.target.closest("[data-card-close]")){ closeCard(); return; }
    const a = e.target.closest("[data-card-act]"); if(!a) return;
    const id = CARD; closeCard();
    (a.dataset.cardAct === "shop" ? window.shopMine : window.dealsFor)(id);
  });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("pcard").hidden) closeCard(); });
  // targets
  pickSeg("tgmode", "m", v => { S.tgMode = v; renderTargets(); });
  pickSeg("tgpos", "p", v => { S.tgPos = v; renderTargets(); });
  $("tgsrc").onchange = e => { S.tgSrc = e.target.value; renderTargets(); };
  pickSeg("tgcols", "c", v => { S.tgCols = v; renderTargets(); });
  onSort($("tgscroll"), () => S.tgSort[S.tgMode] || {k:"grade", dir:-1}, v => (S.tgSort[S.tgMode] = v), renderTargets);
  pickSeg("tgget", "g", v => { S.tgGet = !!v; renderTargets(); });
  // tap a target: every package that would get him, whatever the answer
  const dealsFor = id => { S.pkGive = []; GIVEPK = []; S.pkFor = id; S.pkQ = ""; $("pkQ").value = ""; S.pkWill = ""; S.pkTeam = ""; S.pkPos = ""; S.pkKind = ""; S.pkLimit = 40;
    FORPK = findPackages(id); show("packages"); renderPackages(); $("v-packages").scrollTop = 0; };
  const shop = id => window.shopMine(id);
  window.dealsFor = dealsFor;
  document.addEventListener("click", e => {
    const b = e.target.closest(".xb"); if(!b) return;
    const d = b.closest("tr").nextElementSibling;
    if(d && d.classList.contains("dt")){ d.hidden = !d.hidden; b.classList.toggle("on", !d.hidden); }
  });
  // crossing the phone breakpoint changes what a table is made of
  let wasPhone = MQ.matches;
  const reflow = () => { if(MQ.matches === wasPhone) return; wasPhone = MQ.matches; renderTargets(); renderRoster(); renderWaivers(); };
  MQ.addEventListener("change", reflow);
  window.addEventListener("resize", reflow);
  $("tgscroll").onclick = e => {
    if(e.target.closest("th, .xb, tr.dt")) return;
    const r = e.target.closest("tr.click"); if(!r) return;
    (r.dataset.a === "shop" ? shop : dealsFor)(r.dataset.id);
  };
  $("tops").onclick = e => { const b = e.target.closest(".top1"); if(b) dealsFor(b.dataset.id); };
  $("ntiles").onclick = e => {
    const b = e.target.closest("button.tile"); if(!b) return;
    S.tgPos = S.tgPos === b.dataset.pos ? "ALL" : b.dataset.pos;
    $("tgpos").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.p === S.tgPos));
    renderTargets();
  };
  // roster
  $("scope").onchange = e => { S.scope = e.target.value; S.sort = null; S.limit = 40; $("msort").value = ""; renderRoster(); $("rscroll").scrollTop = 0; };
  pickSeg("posf", "p", v => { S.pos = v; S.limit = 40; if(!colKeys().includes(S.sort) && S.sort !== "name") S.sort = null; renderRoster(); });
  pickSeg("olf", "o", v => {
    S.ol = v;
    // upgrades and downgrades are other people's players, measured against mine
    if(v && S.scope === "me"){ S.scope = "all"; $("scope").value = "all"; }
    S.sort = !v ? null : v === "poup" || !REG.length ? "opo" : "oreg"; S.dir = v === "down" ? 1 : -1; renderRoster(); $("rscroll").scrollTop = 0;
  });
  pickSeg("colsf", "c", v => { S.cols = v; if(!colKeys().includes(S.sort) && S.sort !== "name") S.sort = null; renderRoster(); });
  $("q").oninput = e => { S.q = e.target.value.trim(); S.limit = 40; renderRoster(); };
  $("msort").onchange = e => { S.sort = e.target.value || null; S.dir = -1; S.limit = 40; renderRoster(); };
  $("rscroll").onclick = e => {
    const th = e.target.closest("th.sort"); if(!th) return;
    const k = th.dataset.k;
    if(S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = COLS[k].str ? 1 : -1; }
    renderRoster(); $("rscroll").scrollTop = 0;
  };
  $("ovclr").onclick = () => { OV = {}; saveOV(); renderAll(); };
  // packages
  const pkf = (k, v) => { S[k] = v; S.pkLimit = 40; renderPackages(); };
  $("pkFor").onclick = () => { S.pkFor = null; S.pkGive = []; S.pkWill = "maybe"; S.pkLimit = 40; renderPackages(); };
  $("pkside").addEventListener("click", e => { const o = e.target.closest(".opt[data-f]"); if(o) pkf(o.dataset.f, o.dataset.v); });
  // picking my own players to move: search again for exactly that group
  const setGive = ids => {
    S.pkGive = ids; S.pkFor = null; S.pkLimit = 40;
    if(ids.length){ S.pkWill = ""; GIVEPK = findForGive(ids); } else { GIVEPK = []; S.pkWill = "maybe"; }
    renderPackages();
  };
  $("pkGiveO").addEventListener("click", e => {
    const b = e.target.closest("[data-give]"); if(!b) return;
    const id = b.dataset.give;
    setGive(S.pkGive.includes(id) ? S.pkGive.filter(x => x !== id) : S.pkGive.concat([id]));
  });
  $("pkGiveClr").onclick = e => { e.stopPropagation(); setGive([]); };
  window.shopMine = id => { show("packages"); setGive([id]); $("v-packages").scrollTop = 0; };
  $("pkSort").onchange = e => pkf("pkSort", e.target.value);
  $("pkQ").oninput = e => pkf("pkQ", e.target.value.trim());
  $("pkFilt").onclick = () => $("pkwrap").classList.toggle("filt");
  $("pkl").onclick = e => {
    if(e.target.closest("#pkmore")){ S.pkLimit += 40; renderPackages(); return; }
    const c = e.target.closest(".pkc"); if(!c) return;
    const pk = curPK()[+c.dataset.i];
    openBuilder(pk.legs);
  };
  // builder
  pickSeg("bmode", "n", v => { setThree(v === "3"); renderBuilder(); });
  $("partner").onchange = () => { get.clear(); via.clear(); $("theirs").scrollTop = 0; renderBuilder(); };
  $("partnerA").onchange = () => { via.clear(); $("via").scrollTop = 0; renderBuilder(); };
  const toggle = set => e => {
    const r = e.target.closest(".row"); if(!r) return;
    const id = r.dataset.id; set.has(id) ? set.delete(id) : set.add(id); renderBuilder();
  };
  $("theirs").onclick = toggle(get); $("via").onclick = toggle(via);
  // my players: in a three-way a tap sends him to C, a second tap to B, a third takes him out
  $("mine").onclick = e => {
    const r = e.target.closest(".row"); if(!r) return;
    const id = r.dataset.id;
    if(!S.three) give.has(id) ? give.delete(id) : give.add(id);
    else if(give.has(id)){ give.delete(id); giveB.add(id); }
    else if(giveB.has(id)) giveB.delete(id);
    else give.add(id);
    renderBuilder();
  };
  $("deal").onclick = e => {
    const pv = e.target.closest("button[data-pv]");
    if(pv){ S.pvSide = pv.dataset.pv; renderBuilder(); return; }
    if(e.target.closest("#dsum")){ S.dealOpen = !S.dealOpen; renderBuilder(); return; }
    if(e.target.closest("#clear")){ give.clear(); get.clear(); via.clear(); giveB.clear(); S.dealOpen = false; renderBuilder(); return; }
    const c = e.target.closest(".dchip"); if(!c) return;
    ({give, get, via, giveB})[c.dataset.set].delete(c.dataset.id); renderBuilder();
  };
  $("bseg").onclick = e => { const b = e.target.closest("button"); if(b) setSide(b.dataset.s); };
  // waivers
  pickSeg("wvpos", "p", v => { S.wvPos = v; S.wvLimit = 30; renderWaivers(); });
  pickSeg("wvmode", "m", v => { S.wvMode = v; renderWaivers(); });
  pickSeg("wvcols", "c", v => { S.wvCols = v; renderWaivers(); });
  pickSeg("wvterm", "t", v => { S.wvTerm = v; renderWaivers(); });
  onSort($("wvscroll"), () => (S.wvMode ? S.kdSortK : S.wvSortK), v => (S.wvMode ? (S.kdSortK = v) : (S.wvSortK = v)), renderWaivers);
  $("wvq").oninput = e => { S.wvQ = e.target.value.trim(); renderWaivers(); };
  $("wvall").onclick = () => { S.wvAll = !S.wvAll; renderWaivers(); };
}

fetch("/api/trade", {cache:"no-cache"}).then(r => r.json()).then(d => {
  if(d.error) throw new Error(d.error);
  boot(d);
}).catch(e => { $("msg").textContent = "Couldn't load league data (" + e.message + ")"; console.warn(e); });
</script></body></html>
