<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1b222c;--line:#2a3340;--txt:#f0f4f8;--dim:#9ba8b6;--blue:#2f81f7;
  --good:#4cc77f;--bad:#f0736a;--warn:#e6b450;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{padding:11px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);z-index:30}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.bar h1{margin:0;font-size:18px;letter-spacing:.2px}
.bar .rec{color:var(--dim);font-size:13.5px;font-weight:700}
.bar .dl{margin-left:auto;color:var(--dim);font-size:12.5px}
.bar .dl b{color:var(--txt)}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
.tab{padding:9px 16px 8px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;position:relative;top:1px;text-decoration:none}
.tab.on{background:var(--bg);color:var(--txt)}
a.tab{background:#0b0f14;color:var(--dim)}
a.tab:hover{color:var(--txt)}

/* section switch: Roster / Packages / Builder */
.sub{display:flex;gap:8px;padding:12px 20px 0}
.sub button{font-size:14px;font-weight:700;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:#0b0f14;color:var(--dim);cursor:pointer}
.sub button:hover{color:var(--txt)}
.sub button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sub button span{font-weight:600;opacity:.8;margin-left:4px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 16px;overflow-y:auto}
#msg{color:var(--dim);padding:40px 0;text-align:center;font-size:15px}

/* roster need tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;border-top:3px solid #3a4658;min-width:0}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);text-transform:uppercase}
.tile .k em{font-style:normal;font-size:10.5px;letter-spacing:.5px;padding:1px 7px;border-radius:999px;background:#232c38;color:#c5cfda}
.tile.g .k em{background:#12382a;color:#7fe0aa}.tile.r .k em{background:#4a1f1c;color:#ffa59c}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
.strip{display:flex;gap:3px;margin:6px 0 7px}
.strip i{flex:1;height:5px;border-radius:3px;background:#27303c}
.strip i.me{background:var(--txt)}
.tile.g .strip i.me{background:var(--good)}.tile.r .strip i.me{background:var(--bad)}
.tile .s{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s b{font-weight:700;color:#c5cfda}
.tile .s2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toolbars */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px;flex:none}
.view > .tools:first-child{margin-top:0}
select,input[type=search]{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13.5px}
select{cursor:pointer}
option,optgroup{background:#0b0f14;color:var(--txt)}
input[type=search]{width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#0b0f14;border:0;border-right:1px solid var(--line);color:var(--dim);padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:#223a5e;color:#fff}
button.b{background:#0b0f14;border:1px solid var(--line);color:var(--dim);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px}
button.b:hover{color:var(--txt)}
.count{color:var(--dim);font-size:12.5px;margin-left:auto}

/* player table */
.scroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:#10151c;position:sticky;top:0;z-index:3;padding:9px 10px;user-select:none}
th.sort{cursor:pointer}
th.sort:hover{color:var(--txt)}
th.on{color:#fff}
th .ar{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}
th.l,td.l{text-align:left;position:sticky;left:0;z-index:2;background:var(--panel)}
th.l{z-index:4;background:#10151c}
th.po{color:#9dc4ff}
th.c,td.c{text-align:center}
.sep{border-left:1px solid var(--line)}
tbody tr:hover td{background:#1a212b}
tbody tr:hover td.l{background:#1a212b}
tr.me td.l{box-shadow:inset 3px 0 0 var(--blue)}
.ply{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:#0b0f14;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.d img{object-fit:contain;padding:3px}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
.pos{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.QB{background:#43235a;color:#e2b8fb}.RB{background:#134030;color:#86e2ae}.WR{background:#15365f;color:#a3c9fb}
.TE{background:#553a13;color:#f7c57c}.K,.DST{background:#2d3440;color:#b7c0cc}
.inj{font-size:10.5px;font-weight:800;color:#fff;background:#b93a32;border-radius:4px;padding:0 5px;white-space:nowrap}
.inj.Q{background:#96741f}
.inj.man{background:#1f5fbf}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:#6f7b88}
.spk{display:block;margin-left:auto}
td.wk{padding:5px 4px;text-align:center}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:54px;padding:4px 6px;border-radius:7px;line-height:1.2}
.wkc b{font-size:12px;font-weight:700}
.wkc i{font-style:normal;font-size:11.5px;color:#c5cfda;font-variant-numeric:tabular-nums}
.wkc.bye b,.wkc.out b{color:#66717e}
.wkc.out i{color:var(--bad);font-weight:800;font-size:10.5px}
.own{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:#c5cfda}
.own.fa{color:#6f7b88}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tag.core{background:#15365f;border-color:#2a5590;color:#a3c9fb}
.tag.sell{background:#4a1f1c;border-color:#7a332d;color:#ffa59c}
.tag.buy,.tag.up{background:#12382a;border-color:#22604a;color:#7fe0aa}
.tag.down{background:#3b2f14;border-color:#6b5420;color:var(--warn)}
/* the rule-out control */
select.st{padding:5px 6px;font-size:12.5px;font-weight:700;border-radius:7px;color:#c5cfda;max-width:130px}
select.st.Q{border-color:#96741f;color:var(--warn)}
select.st.D,select.st.O,select.st.IR,select.st.SUS{border-color:#8f2f29;color:#ffa59c}
select.st.man{border-color:var(--blue);background:#12233d;color:#a3c9fb}

/* packages */
.pkscroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;align-content:start}
.grp-h{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:15px;font-weight:800;margin-top:8px}
.grp-h:first-child{margin-top:0}
.grp-h span{font-size:12.5px;font-weight:600;color:var(--dim)}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;text-align:left;color:var(--txt);width:100%;min-width:0;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pk:hover{border-color:#4a5d7a}
.pk .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pk .tm{font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .tm span{color:var(--dim);font-weight:600;font-size:12.5px;margin-left:6px}
.gains{display:flex;gap:8px;flex:none}
.gain{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:4px 9px;text-align:center;line-height:1.15}
.gain b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.gain span{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.pk .sides{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:8px;margin-top:11px;align-items:center}
.pk .arrow{color:var(--dim);font-size:18px;text-align:center}
.pk .side{min-width:0;background:#11161d;border-radius:8px;padding:7px 9px 8px}
.pk .side .h{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.pill{display:flex;align-items:center;gap:7px;margin-top:6px;min-width:0}
.pill .av{width:28px;height:28px;flex-basis:28px}
.pill .nm{font-size:13px;white-space:nowrap;min-width:0}
.pill .x{margin-left:auto;font-size:12.5px;color:#c5cfda;font-variant-numeric:tabular-nums;padding-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#0b0f14;border:1px solid var(--line);color:#c5cfda}
.pk .them{margin-top:9px;font-size:12.5px;color:var(--dim)}
.pk .them b{color:#c5cfda;font-weight:700}

/* builder: my players | the deal | their players, each scrolling on its own */
.bseg{display:none;margin-bottom:10px;flex:none}
.bgrid{flex:1 0 auto;height:0;min-height:min(520px,78vh);display:grid;grid-template-columns:minmax(270px,360px) minmax(300px,540px) minmax(270px,360px);gap:12px;justify-content:center}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{padding:9px 10px;background:#10151c;border-bottom:1px solid var(--line);flex:none}
.ph .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b.h{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.ph select{flex:1;min-width:0;padding:6px 8px;font-weight:700}
.ph .cap{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);white-space:nowrap}
.needs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.need{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#232c38;color:#c5cfda}
.need.g{background:#12382a;color:#7fe0aa}.need.r{background:#4a1f1c;color:#ffa59c}
.plist{flex:1;min-height:0;overflow:auto}
.grp{padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--dim);background:#131920;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;color:var(--txt);text-align:left}
.row:hover{background:#1a212b}
.row.sel{background:#17294a;box-shadow:inset 3px 0 0 var(--blue)}
.row .av{width:30px;height:30px;flex-basis:30px}
.row .who{min-width:0;flex:1}
.row .nm{font-size:13.5px;white-space:nowrap}
.row .meta{flex-wrap:wrap;gap:3px 6px;margin-top:1px}
.row .meta > span{white-space:nowrap}
.row .tag{font-size:9.5px;padding:1px 6px}
.row .n2{display:flex;gap:0;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;flex:none}
.row .n2 span{width:42px;text-align:right}
.row .n2 span + span{color:#9dc4ff}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;min-height:0;container-type:inline-size}
@container (max-width:330px){ .dsides,.dgrid{grid-template-columns:1fr} }
.lab{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.dsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:#11161d;border-radius:8px;padding:8px 10px 10px;min-height:74px;min-width:0}
.dchips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.dchip{display:flex;align-items:center;gap:7px;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:4px 7px;cursor:pointer;min-width:0;color:var(--txt);text-align:left}
.dchip:hover{border-color:#7a332d}
.dchip .nm{font-size:13.5px;white-space:nowrap;flex:1;min-width:0}
.dchip .x{color:var(--dim);font-weight:800;font-size:14px}
.dempty{color:var(--dim);text-align:center;padding:26px 0 18px;font-size:14px}
.call{font-size:22px;font-weight:800;margin:14px 0 10px;letter-spacing:-.2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:#11161d;border-radius:8px;padding:9px 11px 10px;min-width:0}
.dcard .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnum{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.dnum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.dnum span{font-size:12.5px;color:var(--dim);white-space:nowrap}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rk{font-size:12.5px;font-weight:700;background:#11161d;border-radius:7px;padding:4px 9px;white-space:nowrap}
.rk i{font-style:normal;color:var(--dim);font-weight:600;margin:0 3px}
.vbar{height:8px;border-radius:4px;background:#3d5a80;overflow:hidden;margin-top:7px;display:flex}
.vbar i{background:var(--warn)}
.vlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.vlab b{color:var(--txt)}
.dfoot{margin-top:14px;display:flex;justify-content:flex-end}

@media (max-width:1100px){
  .tiles{gap:8px}
  .tile{padding:9px 10px 10px}
  .tile .k{letter-spacing:.3px}
  .bgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)}
}
@media (max-width:820px){
  header{padding:8px 12px 0}
  .bar h1{font-size:16px}
  .bar .dl{margin-left:0;width:100%}
  .tabs{margin-top:8px}
  .tab{padding:6px 12px 5px;font-size:12px}
  .sub{padding:10px 12px 0;gap:6px}
  .sub button{padding:7px 14px;font-size:13.5px}
  .view{padding:12px 12px 12px}
  /* tiles become one swipeable row so the table keeps its height */
  .tiles{display:flex;overflow-x:auto;gap:8px;padding-bottom:2px;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:0 0 156px}
  .tools{gap:6px;margin:10px 0 8px}
  input[type=search]{width:100%;order:9}
  .tools select{flex:1;min-width:0}
  .pks{grid-template-columns:minmax(0,1fr)}
  .nm{max-width:150px}
  /* builder: the deal stays on top, one roster at a time below it */
  .bseg{display:inline-flex;align-self:flex-start}
  .bgrid{display:flex;flex-direction:column;gap:10px;height:auto;min-height:0}
  .deal{order:-1;flex:none;padding:10px}
  .pane{flex:none;height:min(520px,72vh)}
  .bgrid[data-side=mine] #p-theirs,.bgrid[data-side=theirs] #p-mine{display:none}
  .call{font-size:18px;margin:10px 0 8px}
  .dnum b{font-size:17px;min-width:46px}
  .dside{min-height:0}
}
</style></head><body>
<header>
<div class="bar">
  <h1 id="tname">Trade Analyzer</h1><span class="rec" id="trec"></span>
  <span class="dl" id="dl"></span>
</div>
<div class="tabs">
  <a class="tab" href="/">ADP Board</a>
  <div class="tab on">Trade Analyzer</div>
</div>
</header>
<nav class="sub" id="sub" hidden>
  <button data-v="roster" class="on">Roster</button>
  <button data-v="packages">Packages<span id="pkn"></span></button>
  <button data-v="builder">Builder</button>
</nav>
<div class="wrap">
<div id="msg">Loading league&hellip;</div>

<section class="view" id="v-roster" hidden>
  <div class="tiles" id="tiles"></div>
  <div class="tools">
    <select id="scope"></select>
    <div class="seg" id="posf">
      <button data-p="ALL" class="on">All</button><button data-p="QB">QB</button><button data-p="RB">RB</button><button data-p="WR">WR</button><button data-p="TE">TE</button>
    </div>
    <div class="seg" id="colsf">
      <button data-c="overview" class="on">Overview</button><button data-c="usage">Usage</button><button data-c="schedule">Schedule</button>
    </div>
    <input type="search" id="q" placeholder="Search player or team">
    <button class="b" id="ovclr" hidden></button>
    <span class="count" id="rcount"></span>
  </div>
  <div class="scroll" id="rscroll"><table id="rt"><thead></thead><tbody></tbody></table></div>
</section>

<section class="view" id="v-packages" hidden>
  <div class="tools">
    <select id="pkTeam"></select>
    <select id="pkPos">
      <option value="">Getting any position</option><option value="QB">Getting a QB</option><option value="RB">Getting an RB</option>
      <option value="WR">Getting a WR</option><option value="TE">Getting a TE</option>
    </select>
    <select id="pkSort">
      <option value="gain">Sort: biggest gain</option><option value="po">Sort: playoff gain</option>
      <option value="reg">Sort: regular-season gain</option><option value="team">Sort: by team</option>
    </select>
    <input type="search" id="pkQ" placeholder="Search player or team">
    <span class="count" id="pkCount"></span>
  </div>
  <div class="pkscroll"><div class="pks" id="pks"></div></div>
</section>

<section class="view" id="v-builder" hidden>
  <div class="seg bseg" id="bseg"><button data-s="mine" class="on">My players</button><button data-s="theirs">Their players</button></div>
  <div class="bgrid" id="bgrid" data-side="mine">
    <div class="pane" id="p-mine">
      <div class="ph"><div class="t"><b class="h">I give</b><span class="cap">ROS &nbsp;&nbsp; PO</span></div><div class="needs" id="myneed"></div></div>
      <div class="plist" id="mine"></div>
    </div>
    <div class="deal" id="deal"></div>
    <div class="pane" id="p-theirs">
      <div class="ph"><div class="t"><select id="partner"></select><span class="cap">ROS &nbsp;&nbsp; PO</span></div><div class="needs" id="pneed"></div></div>
      <div class="plist" id="theirs"></div>
    </div>
  </div>
</section>
</div>
<script>
let D, P, ME, TEAMS = {}, REG = [], PO = [], REPL = {}, RANK = {}, PCT = {}, BASE = {}, COLS = {}, ALLPK = [], pkTimer;
const SKILL = ["QB","RB","WR","TE"], ORDER = {QB:0,RB:1,WR:2,TE:3,K:4,DST:5};
const S = {view:"roster", scope:"me", pos:"ALL", cols:"overview", q:"", sort:null, dir:-1,
           pkTeam:"", pkPos:"", pkSort:"gain", pkQ:""};
const give = new Set(), get = new Set();
// my own injury calls, kept in this browser: { playerId: {t:"H"} | {t:"O", thru: week} }
let OV = {};
try { OV = JSON.parse(localStorage.getItem("trade.ov") || "{}") || {}; } catch(e){}
const saveOV = () => { try { localStorage.setItem("trade.ov", JSON.stringify(OV)); } catch(e){} };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = x => (x == null ? "–" : x.toFixed(1));
const f2 = x => (x == null ? "–" : x.toFixed(2));
const pct = x => (x == null ? "–" : Math.round(x * 100) + "%");
const sgn = (x, d = 1) => (x > 0.049 ? "+" : x < -0.049 ? "−" : "") + Math.abs(x).toFixed(d);
const cls = x => (x > 0.05 ? "pos-n" : x < -0.05 ? "neg-n" : "dimn");
const ord = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
const avg = (arr, idx) => idx.length ? idx.reduce((s,i) => s + arr[i], 0) / idx.length : 0;
const short = p => p.pos === "DST" ? p.n : (p.n.replace(/ (Jr\.?|Sr\.?|II|III|IV|V)$/, "").split(" ").slice(1).join(" ") || p.n);
const initial = p => (p.pos === "DST" || !p.n.includes(" ") ? p.n : p.n[0] + ". " + short(p));
const ownAb = p => (p.t ? (TEAMS[p.t].abbrev || "T" + p.t) : "FA");
const wkSpan = idx => idx.length ? (idx.length > 1 ? `${D.weeks[idx[0]]}–${D.weeks[idx[idx.length-1]]}` : `${D.weeks[idx[0]]}`) : "";

function img(p){
  const src = p.pos === "DST" ? `https://a.espncdn.com/i/teamlogos/nfl/500/${p.tm.toLowerCase()}.png`
    : p.sid ? `https://sleepercdn.com/content/nfl/players/thumb/${p.sid}.jpg`
    : `https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png`;
  return `<span class="av${p.pos === "DST" ? " d" : ""}"><img src="${src}" alt="" loading="lazy" onerror="this.style.display='none'"></span>`;
}
// opponent colour: ESPN convention, 1 = stingiest defence (red), 32 = softest (green)
function rkBg(rk){
  if(rk == null) return "background:#1f2732";
  if(rk <= 10) return `background:rgba(214,58,49,${(0.16 + (11 - rk) * 0.05).toFixed(2)})`;
  if(rk >= 23) return `background:rgba(24,165,88,${(0.16 + (rk - 22) * 0.05).toFixed(2)})`;
  return "background:#1f2732";
}

/* ---- availability ------------------------------------------------------------------------
   The feed sends a HEALTHY projection per week. This applies ESPN's status, or my own call
   when I have made one, and everything downstream (ranks, lineups, packages) reads the result. */
function recompute(){
  for(const p of Object.values(P)){
    const o = OV[p.id]; let tot = 0, raw = 0;
    p.eff = p.wk.map((w, i) => {
      if(w.o === "BYE") return 0;
      let a = 1;
      if(o){ if(o.t === "O" && w.w <= o.thru) a = 0; }
      else if(p.inj === "O" || p.inj === "IR" || p.inj === "SUS") a = i < 2 ? 0 : 0.85;
      else if(p.inj === "D") a = i === 0 ? 0.25 : 1;
      else if(p.inj === "Q") a = i === 0 ? 0.8 : 1;
      raw += w.p; tot += w.p * a;
      return w.p * a;
    });
    p.af = raw ? tot / raw : 1;          // share of his remaining value he is actually there for
    p.adj = p.base * p.af;
    p.ros = avg(p.eff, REG); p.po = avg(p.eff, PO);
  }
  for(const pos of SKILL){
    const pool = Object.values(P).filter(p => p.pos === pos && p.t);
    RANK[pos] = pool.slice().sort((a,b) => b.adj - a.adj).map(p => p.id);
    const byBase = pool.sort((a,b) => b.base - a.base);
    const n = D.teams.length * ((D.slots[pos] || 1) + (pos === "RB" || pos === "WR" ? 0.5 : 0));
    REPL[pos] = (byBase[Math.min(byBase.length - 1, Math.round(n))] || {base:0}).base;
  }
  BASE = posRanks();
}

/* ---- lineup maths ---------------------------------------------------------------------
   A roster's worth is what its best legal lineup scores each remaining week, so byes,
   injuries and depth are all priced in: a bench player only counts in weeks he would start. */
function lineup(ids, wi){
  const by = {QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  for(const id of ids){ const p = P[id]; by[p.pos].push(p.eff[wi]); }
  let tot = 0; const flex = [];
  for(const pos in by){
    const a = by[pos].sort((x,y) => y - x), n = D.slots[pos] || 0;
    for(let i = 0; i < a.length; i++){
      if(i < n) tot += a[i];
      else if(pos === "RB" || pos === "WR" || pos === "TE") flex.push(a[i]);
    }
  }
  flex.sort((x,y) => y - x);
  for(let i = 0; i < (D.slots.FLEX || 0) && i < flex.length; i++) tot += flex[i];
  return tot;
}
function worth(ids){
  let reg = 0, po = 0;
  for(const wi of REG) reg += lineup(ids, wi);
  for(const wi of PO) po += lineup(ids, wi);
  return {reg, po};
}
const swap = (ids, out, inn) => ids.filter(id => !out.has(id)).concat([...inn]);
function delta(before, after){
  return { reg: REG.length ? (after.reg - before.reg) / REG.length : 0,
           po: PO.length ? (after.po - before.po) / PO.length : 0,
           score: (after.reg - before.reg) + 1.5 * (after.po - before.po) };
}
// where every team's starters rank at each position; `over` swaps in hypothetical rosters
function posRanks(over){
  const out = {};
  for(const pos of SKILL){
    const n = D.slots[pos] || 1;
    D.teams.map(t => {
      const ids = (over && over[t.id]) || t.players;
      const a = ids.map(id => P[id]).filter(p => p.pos === pos).map(p => p.adj).sort((x,y) => y - x).slice(0, n);
      return {id:t.id, v:a.reduce((s,x) => s + x, 0)};
    }).sort((a,b) => b.v - a.v).forEach((x, i) => ((out[x.id] = out[x.id] || {})[pos] = i + 1));
  }
  return out;
}
const avgRk = (p, idx) => { const r = idx.map(i => p.wk[i].rk).filter(x => x != null); return r.length ? r.reduce((a,b) => a + b, 0) / r.length : null; };
// trade-market value: points over the last startable player at the position, cut for time missed
const mv = p => (Math.max(0, p.base - (REPL[p.pos] || 0)) + 1.5) * (0.35 + 0.65 * p.af);

function verdictTag(p){
  if(p.g == null) return "";
  const mine = p.t === ME, rankAt = (RANK[p.pos] || []).indexOf(p.id) + 1, coreN = {QB:6,RB:12,WR:12,TE:5}[p.pos];
  if(mine && p.fpoe >= 3 && p.tr < 1 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag sell">Sell high</span>`;
  if(!mine && p.fpoe <= -2.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag buy">Buy low</span>`;
  if(p.tr >= 2) return `<span class="tag up">Rising</span>`;
  if(p.tr <= -2) return `<span class="tag down">Fading</span>`;
  if(rankAt && rankAt <= coreN) return `<span class="tag core">Core</span>`;
  return `<span class="tag">Hold</span>`;
}
function injBadge(p){
  const o = OV[p.id], last = D.weeks[D.weeks.length - 1];
  if(o) return o.t === "O" ? `<span class="inj man">OUT${o.thru >= last ? "" : o.thru === D.weeks[0] ? " wk " + o.thru : " thru " + o.thru}</span>` : "";
  return p.inj ? `<span class="inj ${p.inj}">${p.inj}</span>` : "";
}
function plyCell(p){
  return `<div class="ply">${img(p)}<div style="min-width:0"><div class="nm">${esc(p.n)}</div>
    <div class="meta"><span class="pos ${p.pos}">${p.pos}</span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""} ${injBadge(p)}</div></div></div>`;
}
function spark(p){
  if(!p.pl) return "";
  const bw = 5, gap = 2, H = 26, max = Math.max(32, ...p.pl.map(x => x || 0));
  const hot = new Set(p.pl.map((x, i) => (x != null ? i : -1)).filter(i => i >= 0).slice(-3));
  let s = "";
  p.pl.forEach((x, i) => {
    const X = i * (bw + gap);
    if(x == null) s += `<rect x="${X}" y="${H - 2}" width="${bw}" height="2" fill="#39424e"/>`;
    else { const h = Math.max(2, Math.round(x / max * H));
      s += `<rect x="${X}" y="${H - h}" width="${bw}" height="${h}" rx="1" fill="${hot.has(i) ? "#58a6ff" : "#3d5a80"}"><title>Wk ${i + 1}: ${x}</title></rect>`; }
  });
  return `<svg class="spk" width="${p.pl.length * (bw + gap) - gap}" height="${H}">${s}</svg>`;
}
function wkChip(p, i){
  const w = p.wk[i];
  if(w.o === "BYE") return `<span class="wkc bye"><b>BYE</b><i>&nbsp;</i></span>`;
  const out = p.eff[i] === 0 && w.p > 0;
  return `<span class="wkc${out ? " out" : ""}" style="${out ? "background:#1f2732" : rkBg(w.rk)}" title="${w.rk ? ord(w.rk) + " vs " + p.pos + " (32nd = softest)" : ""}"><b>${w.o}</b><i>${out ? "OUT" : f1(p.eff[i])}</i></span>`;
}
// the rule-out control: ESPN's call, or mine
function stSel(p){
  const o = OV[p.id], cur = o ? (o.t === "H" ? "H" : "O:" + o.thru) : "";
  const auto = {"":"Active", Q:"Questionable", D:"Doubtful", O:"Out", IR:"On IR", SUS:"Suspended"}[p.inj || ""];
  const last = D.weeks[D.weeks.length - 1];
  let opts = `<option value=""${cur === "" ? " selected" : ""}>${auto}</option>`;
  if(p.inj) opts += `<option value="H"${cur === "H" ? " selected" : ""}>Healthy</option>`;
  D.weeks.forEach((w, i) => {
    const v = "O:" + w;
    opts += `<option value="${v}"${cur === v ? " selected" : ""}>${i === 0 ? "Out wk " + w : w === last ? "Out for season" : "Out thru wk " + w}</option>`;
  });
  return `<select class="st ${o ? "man" : (p.inj || "")}" data-id="${p.id}" aria-label="Status for ${esc(p.n)}">${opts}</select>`;
}

/* ---- percentile shading: how a number stacks up at his position across the whole pool ----*/
function buildPct(){
  const keys = ["ppg","xfp","snap","ts","cs","ays","wopr","doc","tps","cr","ypt","yacr","opp","rzg","rz","ypc","yaco","bt","fdg"];
  for(const pos of SKILL){
    PCT[pos] = {};
    const pool = Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3));
    for(const k of keys) PCT[pos][k] = pool.map(p => p[k]).filter(v => v != null).sort((a,b) => a - b);
  }
}
function tint(p, k, v){
  const a = (PCT[p.pos] || {})[k];
  if(!a || a.length < 8) return "";
  let lo = 0, hi = a.length;
  while(lo < hi){ const m = (lo + hi) >> 1; a[m] <= v ? (lo = m + 1) : (hi = m); }
  const q = lo / a.length;
  return q >= 0.9 ? "background:rgba(47,129,247,.42)" : q >= 0.75 ? "background:rgba(47,129,247,.26)" : q >= 0.6 ? "background:rgba(47,129,247,.12)" : "";
}

/* ---- the player table ------------------------------------------------------------------*/

  const stat = (k, h, t, f, o) => Object.assign({k, h, t, v:p => (p.g != null ? p[k] : null), f, tint:true}, o || {});
  const notQB = p => p.pos !== "QB";
  COLS = {
    name: {k:"name", h:"Player", v:p => p.n, str:true},

    ppg:  {k:"ppg", h:"PPG", t:"Points per game, full PPR", v:p => (p.g != null ? p.ppg : p.espn), f:f1, tint:true, sep:true},
    log:  {k:"log", h:"Games", t:"Points in each game this season; the last three played are brighter", html:spark, nosort:true},
    xfp:  stat("xfp", "xFP", "Expected points per game from workload alone: carries, red-zone carries, targets, red-zone targets", f1),

    snap: stat("snap", "Snap", "Share of team offensive snaps", pct, {sep:true}),

    wopr: stat("wopr", "WOPR", "Weighted opportunity: 1.5 × target share + 0.7 × air-yard share", f2, {only:notQB}),
    doc:  stat("doc", "Depth", "Air yards per catch: how far downfield he is caught", f1),
    tps:  stat("tps", "Tgt/snap", "Targets per snap on the field: how often he is the read", pct),
    cr:   stat("cr", "Catch%", "Catches per target", pct),
    ypt:  stat("ypt", "Yds/tgt", "Receiving yards per target", f1),
    yacr: stat("yacr", "YAC/rec", "Yards after the catch per reception", f1),
    opp:  stat("opp", "Opp/g", "Carries plus targets per game", f1),
    rzg:  stat("rzg", "RZ/g", "Red-zone carries plus targets per game", f1),
    rz:   stat("rz", "RZ%", "Share of team red-zone carries and targets", pct),
    ypc:  stat("ypc", "YPC", "Yards per carry", f1),
    yaco: stat("yaco", "YACo", "Yards after contact per carry", f1),
    bt:   stat("bt", "BT%", "Broken tackles per carry", pct),
    fdg:  stat("fdg", "1D/g", "First downs per game, rushing and receiving", f1),
    trend:{k:"trend", h:"Trend", t:"Last three games' xFP against the season", v:p => (p.g >= 4 ? p.tr : null),
           f:x => (x >= 1 ? "▲ " : x <= -1 ? "▼ " : "") + sgn(x), cl:x => cls(Math.abs(x) >= 1 ? x : 0)},
    ros:  {k:"ros", h:"ROS", t:"Projected points per week, weeks " + wkSpan(REG), v:p => p.ros, f:f1, bold:true, sep:true},
    po:   {k:"po", h:"PO", t:"Projected points per week, weeks " + wkSpan(PO), v:p => p.po, f:f1, bold:true, hd:"po"},
    sos:  {k:"sos", h:"Sched", t:"Average opponent rank against his position, weeks " + wkSpan(REG) + " (32 = softest)", v:p => avgRk(p, REG), f:x => x.toFixed(0), sep:true},
    psos: {k:"psos", h:"PO sched", t:"Average opponent rank against his position, weeks " + wkSpan(PO) + " (32 = softest)", v:p => avgRk(p, PO), f:x => x.toFixed(0), hd:"po"},
    st:   {k:"st", h:"Status", t:"ESPN's injury status. Change it to make your own call", v:p => p.af, html:stSel, c:true},
    tag:  {k:"tag", h:"", html:verdictTag, nosort:true, c:true},
  };
  D.weeks.forEach((w, i) => (COLS["w" + i] = {k:"w" + i, h:"Wk " + w, t:"Projected points and opponent, week " + w, v:p => p.eff[i],
    html:p => wkChip(p, i), hd:(w >= 15 ? "po" : ""), wk:true, sep:(i === 0 || w === 15)}));
}
const isSingle = () => S.scope === "me" || !!TEAMS[S.scope];
function colKeys(){
  const lead = [...(isSingle() ? [] : ["own"]), "st"], tail = [...(REG.length ? ["ros"] : []), ...(PO.length ? ["po"] : [])];
  if(S.cols === "overview"){
    const wk = D.weeks.length ? ["w0"] : [];
    D.weeks.forEach((w, i) => { if(w >= 15 && i !== 0) wk.push("w" + i); });
    return [...lead, "ppg", "log", "xfp", "fpoe", "snap", "trend", ...wk, ...tail, "tag"];
  }
  if(S.cols === "usage"){
    const u = S.pos === "RB" ? ["snap","cs","ts","opp","rzg","rz","ypc","yaco","bt","fdg","trend"]
      : (S.pos === "WR" || S.pos === "TE") ? ["snap","ts","ays","wopr","tps","doc","cr","ypt","yacr","rz","fdg","trend"]
      : ["snap","ts","cs","wopr","opp","rz","rzg","fdg","trend"];
    return [...lead, "ppg", "xfp", "fpoe", ...u];
  }
  return [...lead, ...D.weeks.map((w, i) => "w" + i), ...tail, ...(REG.length ? ["sos"] : []), ...(PO.length ? ["psos"] : [])];
}
function tableRows(){
  let ids;
  if(S.scope === "me") ids = TEAMS[ME].players;
  else if(S.scope === "league") ids = D.teams.flatMap(t => t.players);
  else if(S.scope === "all") ids = Object.keys(P);
  else if(S.scope === "fa") ids = Object.keys(P).filter(id => !P[id].t);
  else ids = TEAMS[S.scope].players;
  let list = ids.map(id => P[id]);
  if(!isSingle()) list = list.filter(p => SKILL.includes(p.pos));
  if(S.pos !== "ALL") list = list.filter(p => p.pos === S.pos);
  if(S.q){ const q = S.q.toLowerCase(); list = list.filter(p => (p.n + " " + p.tm + " " + ownAb(p) + " " + (p.t ? TEAMS[p.t].name : "free agent")).toLowerCase().includes(q)); }
  const c = COLS[S.sort];
  if(c){
    list.sort((a, b) => {
      const x = c.v(a), y = c.v(b);
      if(x == null && y == null) return b.adj - a.adj;
      if(x == null) return 1;
      if(y == null) return -1;
      return (c.str ? String(x).localeCompare(String(y)) * -S.dir : (y - x) * -S.dir) || b.adj - a.adj;
    });
  } else if(isSingle()) list.sort((a, b) => ORDER[a.pos] - ORDER[b.pos] || b.adj - a.adj);
  else list.sort((a, b) => b.adj - a.adj);
  return list;
}
function renderTable(){
  const keys = colKeys(), list = tableRows();
  const th = (c, extra) => `<th class="${extra || ""}${c.nosort ? "" : " sort"}${S.sort === c.k ? " on" : ""}${c.hd ? " " + c.hd : ""}${c.sep ? " sep" : ""}${c.c || c.wk ? " c" : ""}" data-k="${c.k}"${c.t ? ` title="${esc(c.t)}"` : ""}>${c.h}${S.sort === c.k ? `<span class="ar">${S.dir < 0 ? "▾" : "▴"}</span>` : ""}</th>`;
  $("rt").tHead.innerHTML = `<tr>${th(COLS.name, "l")}${keys.map(k => th(COLS[k])).join("")}</tr>`;
  $("rt").tBodies[0].innerHTML = list.map(p => {
    const tds = keys.map(k => {
      const c = COLS[k], sep = c.sep ? " sep" : "";
      if(c.html) return `<td class="${c.wk ? "wk" : c.c ? "c" : ""}${sep}">${c.html(p)}</td>`;
      const v = c.v(p);
      if(v == null || (c.only && !c.only(p))) return `<td class="num dimn${sep}">–</td>`;
      return `<td class="num ${c.cl ? c.cl(v) : ""}${sep}"${c.tint ? ` style="${tint(p, k, v)}"` : ""}>${c.bold ? "<b>" : ""}${c.f(v)}${c.bold ? "</b>" : ""}</td>`;
    }).join("");
    return `<tr class="${!isSingle() && p.t === ME ? "me" : ""}"><td class="l">${plyCell(p)}</td>${tds}</tr>`;
  }).join("");
  $("rcount").textContent = list.length + (list.length === 1 ? " player" : " players");
  const n = Object.keys(OV).length;
  $("ovclr").hidden = !n;
  $("ovclr").textContent = `Reset my ${n} status call${n === 1 ? "" : "s"}`;
}

function renderTiles(){
  const n = D.teams.length, out = [];
  const tile = (k, rank, word, s, s2) => `<div class="tile ${rank <= 4 ? "g" : rank >= 9 ? "r" : ""}">
    <div class="k"><span>${k}</span>${word ? `<em>${rank <= 4 ? "Strength" : rank >= 9 ? "Need" : "Solid"}</em>` : ""}</div>
    <div class="v">${ord(rank)}<small>of ${n}</small></div>
    <div class="strip">${Array.from({length:n}, (_, i) => `<i${i + 1 === rank ? ' class="me"' : ""}></i>`).join("")}</div>
    <div class="s">${s}</div><div class="s2">${s2}</div></div>`;
  const all = D.teams.map(t => ({id:t.id, w:worth(t.players)}));
  const place = key => all.slice().sort((a,b) => b.w[key] - a.w[key]).findIndex(x => x.id === ME) + 1;
  const mine = all.find(x => x.id === ME).w;
  if(REG.length) out.push(tile("Lineup · wk " + wkSpan(REG), place("reg"), false, `<b>${f1(mine.reg / REG.length)}</b> pts a week`, "regular season"));
  if(PO.length) out.push(tile("Lineup · wk " + wkSpan(PO), place("po"), false, `<b>${f1(mine.po / PO.length)}</b> pts a week`, "playoffs"));
  for(const pos of SKILL){
    const k = D.slots[pos] || 1;

    out.push(tile(pos, BASE[ME][pos], true, top.slice(0, k).map(p => `${esc(short(p))} <b>${f1(p.adj)}</b>`).join(" · ") || "nobody",
      top[k] ? `bench: ${esc(short(top[k]))} ${f1(top[k].adj)}` : "no bench"));
  }
  $("tiles").innerHTML = out.join("");
}

/* ---- package search --------------------------------------------------------------------
   Every 1-for-1, 2-for-1, 1-for-2 and 2-for-2 with every team. A deal is kept only if the
   other side comes out ahead too and is not giving up clearly more market value - otherwise
   it is a trade nobody accepts. Ranked by what it adds to my lineup, playoffs 1.5x. */
function sets(ids){
  const out = ids.map(a => [a]);
  for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++) out.push([ids[i], ids[j]]);
  return out;
}
function findPackages(){
  const tradeable = t => t.players.filter(id => SKILL.includes(P[id].pos) && P[id].base >= 5);
  const mine = TEAMS[ME].players, myBase = worth(mine), mySets = sets(tradeable(TEAMS[ME]));
  const found = [];
  for(const t of D.teams){
    if(t.id === ME) continue;
    const tBase = worth(t.players), best = [];
    for(const tg of sets(tradeable(t))){
      const getV = tg.reduce((s,id) => s + mv(P[id]), 0), G = new Set(tg);
      for(const mg of mySets){
        const giveV = mg.reduce((s,id) => s + mv(P[id]), 0);
        if(giveV < 0.85 * getV || giveV > 1.6 * getV) continue;      // lopsided on market value either way
        const O = new Set(mg);
        const me = delta(myBase, worth(swap(mine, O, G)));
        if(me.score < 2) continue;
        const them = delta(tBase, worth(swap(t.players, G, O)));
        // they have to come out ahead overall, and not pay for it in either stretch
        if(them.score < 1 || them.reg < -0.5 || them.po < -0.5) continue;
        best.push({team:t.id, give:mg, get:tg, me, them});
      }
    }
    best.sort((a,b) => b.me.score - a.me.score);
    // up to eight a team, and no headline player more than twice
    const seen = {}; let n = 0;
    for(const b of best){
      const head = b.get.slice().sort((x,y) => mv(P[y]) - mv(P[x]))[0];
      if((seen[head] = (seen[head] || 0) + 1) > 2) continue;
      found.push(b);
      if(++n === 8) break;
    }
  }
  return found;
}
function chipsFor(pk){
  const out = [];
  for(const id of pk.get){
    const p = P[id], nm = short(p), rk = avgRk(p, PO);
    if(p.g == null) continue;
    if(p.fpoe <= -2) out.push(`${nm}: ${f1(p.xfp)} xFP vs ${f1(p.ppg)} scored`);
    else if(p.tr >= 2) out.push(`${nm}: usage up ${sgn(p.tr)}`);
    else if(rk != null && rk >= 21) out.push(`${nm}: soft wk ${wkSpan(PO)}`);
    else if(p.snap != null) out.push(`${nm}: ${pct(p.snap)} snaps${p.pos === "RB" ? ", " + pct(p.cs) + " carries" : p.pos !== "QB" ? ", " + pct(p.ts) + " targets" : ""}`);
  }
  for(const id of pk.give){
    const p = P[id], nm = short(p), rk = avgRk(p, PO);
    if(p.g == null) continue;
    if(p.fpoe >= 3) out.push(`${nm}: ${sgn(p.fpoe)} over xFP`);
    else if(p.tr <= -2) out.push(`${nm}: usage down ${sgn(p.tr)}`);
    else if(rk != null && rk <= 11) out.push(`${nm}: tough wk ${wkSpan(PO)}`);
  }
  return out;
}
function needsHtml(teamId){
  return SKILL.map(pos => { const r = BASE[teamId][pos]; return `<span class="need ${r <= 4 ? "g" : r >= 9 ? "r" : ""}">${pos} ${ord(r)}</span>`; }).join("");
}
function renderPackages(){
  let list = ALLPK.map((pk, i) => ({pk, i}));
  if(S.pkTeam) list = list.filter(x => x.pk.team === +S.pkTeam);
  if(S.pkPos) list = list.filter(x => x.pk.get.some(id => P[id].pos === S.pkPos));
  if(S.pkQ){
    const q = S.pkQ.toLowerCase();
    list = list.filter(x => (TEAMS[x.pk.team].name + " " + TEAMS[x.pk.team].abbrev + " " + x.pk.give.concat(x.pk.get).map(id => P[id].n).join(" ")).toLowerCase().includes(q));
  }
  const by = {gain:x => x.pk.me.score, po:x => x.pk.me.po, reg:x => x.pk.me.reg, team:x => x.pk.me.score}[S.pkSort];
  list.sort((a,b) => by(b) - by(a));
  const byTeam = S.pkSort === "team";
  // with every team on screen, show each team's best few rather than all eight
  if(!S.pkTeam && !S.pkQ){
    const cap = byTeam ? 3 : 2, n = {};
    list = list.filter(x => (n[x.pk.team] = (n[x.pk.team] || 0) + 1) <= cap);
  }
  if(byTeam) list.sort((a,b) => TEAMS[a.pk.team].name.localeCompare(TEAMS[b.pk.team].name) || by(b) - by(a));
  $("pkCount").textContent = list.length + (list.length === 1 ? " package" : " packages");
  if(!list.length){ $("pks").innerHTML = `<div class="chip">No deal here helps both sides right now</div>`; return; }
  const pill = id => { const p = P[id]; return `<div class="pill">${img(p)}<span class="nm" title="${esc(p.n)}">${esc(initial(p))}</span><span class="pos ${p.pos}">${p.pos}</span>${injBadge(p)}<span class="x">${f1(p.adj)}</span></div>`; };
  const gain = (v, lab) => `<div class="gain"><b class="${cls(v)}">${sgn(v)}</b><span>${lab}</span></div>`;
  let last = null;
  $("pks").innerHTML = list.map(({pk, i}) => {
    const t = TEAMS[pk.team];
    let head = "";
    if(byTeam && last !== pk.team){ last = pk.team; head = `<div class="grp-h">${esc(t.name)}<span>${t.w}-${t.l}</span><span class="needs" style="margin:0">${needsHtml(t.id)}</span></div>`; }
    return head + `<button class="pk" data-i="${i}">
      <div class="top"><div class="tm">${esc(t.name)}<span>${t.w}-${t.l}</span></div>
        <div class="gains">${REG.length ? gain(pk.me.reg, "wk " + wkSpan(REG)) : ""}${PO.length ? gain(pk.me.po, "wk " + wkSpan(PO)) : ""}</div></div>
      <div class="sides"><div class="side"><div class="h">I give</div>${pk.give.map(pill).join("")}</div>
        <div class="arrow">⇄</div>
        <div class="side"><div class="h">I get</div>${pk.get.map(pill).join("")}</div></div>
      <div class="chips">${chipsFor(pk).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      <div class="them">Their lineup <b>${sgn(pk.them.reg)}</b> a week${PO.length ? `, <b>${sgn(pk.them.po)}</b> in wk ${wkSpan(PO)}` : ""}</div>
    </button>`;
  }).join("");
}
function searchPackages(){
  clearTimeout(pkTimer);
  $("pks").innerHTML = `<div class="chip">Searching every team&hellip;</div>`;
  $("pkn").textContent = ""; $("pkCount").textContent = "";
  pkTimer = setTimeout(() => { ALLPK = findPackages(); $("pkn").textContent = ALLPK.length; renderPackages(); }, 40);
}

/* ---- builder ---------------------------------------------------------------------------*/
function listHtml(team, sel){
  const ps = team.players.map(id => P[id]).filter(p => SKILL.includes(p.pos)).sort((a,b) => ORDER[a.pos] - ORDER[b.pos] || b.adj - a.adj);
  let out = "", last = "";
  for(const p of ps){
    if(p.pos !== last){ out += `<div class="grp">${p.pos}</div>`; last = p.pos; }
    out += `<button class="row${sel.has(p.id) ? " sel" : ""}" data-id="${p.id}">${img(p)}
      <span class="who"><span class="nm" style="display:block">${esc(p.n)}</span><span class="meta"><span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${verdictTag(p)}</span></span>
      <span class="n2"><span>${f1(p.ros)}</span><span>${f1(p.po)}</span></span></button>`;
  }
  return out;
}
function renderDeal(partner){
  const chip = (id, set) => { const p = P[id]; return `<button class="dchip" data-id="${id}" data-set="${set}"><span class="nm" title="${esc(p.n)}">${esc(initial(p))}</span><span class="pos ${p.pos}">${p.pos}</span><span class="x">×</span></button>`; };
  let h = `<div class="dsides">
    <div class="dside"><div class="lab">I give</div><div class="dchips">${[...give].map(id => chip(id, "give")).join("")}</div></div>
    <div class="dside"><div class="lab">I get</div><div class="dchips">${[...get].map(id => chip(id, "get")).join("")}</div></div></div>`;
  if(!give.size || !get.size) h += `<div class="dempty">Pick players on both sides</div>`;
  else {
    const mine = TEAMS[ME].players, mineAfter = swap(mine, give, get), theirsAfter = swap(partner.players, get, give);
    const me = delta(worth(mine), worth(mineAfter)), them = delta(worth(partner.players), worth(theirsAfter));
    const gv = [...give].reduce((s,id) => s + mv(P[id]), 0), tv = [...get].reduce((s,id) => s + mv(P[id]), 0);
    let call, color;
    if(me.score >= 2 && them.score >= 1 && them.reg >= -0.5 && them.po >= -0.5 && gv >= 0.85 * tv){ call = "Send it"; color = "var(--good)"; }
    else if(me.score >= 2){ call = "Good for me, hard sell"; color = "var(--warn)"; }
    else if(me.score > -2){ call = "A wash"; color = "var(--dim)"; }
    else { call = "Pass"; color = "var(--bad)"; }
    const after = posRanks({[ME]:mineAfter, [partner.id]:theirsAfter});
    const card = (name, d) => `<div class="dcard"><div class="lab" title="${esc(name)}">${esc(name)}</div>
      ${REG.length ? `<div class="dnum"><b class="${cls(d.reg)}">${sgn(d.reg)}</b><span>wk ${wkSpan(REG)}</span></div>` : ""}
      ${PO.length ? `<div class="dnum"><b class="${cls(d.po)}">${sgn(d.po)}</b><span>wk ${wkSpan(PO)}</span></div>` : ""}</div>`;
    const ranks = id => SKILL.map(pos => { const a = BASE[id][pos], b = after[id][pos];
      return `<span class="rk">${pos} ${ord(a)}${a !== b ? `<i>→</i><span class="${b < a ? "pos-n" : "neg-n"}">${ord(b)}</span>` : ""}</span>`; }).join("");
    h += `<div class="call" style="color:${color}">${call}</div>
      <div class="lab">Lineup points a week</div>
      <div class="dgrid" style="margin-top:6px">${card("Mine", me)}${card(partner.name, them)}</div>
      <div class="lab" style="margin-top:14px">My position ranks</div><div class="ranks">${ranks(ME)}</div>
      <div class="lab">${esc(partner.abbrev || "Their")} position ranks</div><div class="ranks">${ranks(partner.id)}</div>
      <div class="lab">Trade value</div>
      <div class="vbar"><i style="width:${(gv / (gv + tv) * 100).toFixed(0)}%"></i></div>
      <div class="vlab"><span>I give <b>${f1(gv)}</b></span><span>I get <b>${f1(tv)}</b></span></div>`;
  }
  if(give.size || get.size) h += `<div class="dfoot"><button class="b" id="clear">Clear</button></div>`;
  $("deal").innerHTML = h;
}
function renderBuilder(){
  const partner = TEAMS[+$("partner").value];
  const keep = el => { const y = el.scrollTop; return () => (el.scrollTop = y); };
  const r1 = keep($("mine")), r2 = keep($("theirs"));
  $("mine").innerHTML = listHtml(TEAMS[ME], give);
  $("theirs").innerHTML = listHtml(partner, get);
  $("myneed").innerHTML = needsHtml(ME);
  $("pneed").innerHTML = needsHtml(partner.id);
  r1(); r2();
  renderDeal(partner);
}

function show(v){
  S.view = v;
  for(const k of ["roster","packages","builder"]) $("v-" + k).hidden = k !== v;
  document.querySelectorAll("#sub button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  try { history.replaceState(null, "", "#" + v); } catch(e){}
}
function renderAll(){ recompute(); renderTiles(); renderTable(); renderBuilder(); searchPackages(); }

function boot(d){
  D = d; P = d.players; ME = d.me;
  d.teams.forEach(t => (TEAMS[t.id] = t));
  d.weeks.forEach((w, i) => (w >= 15 ? PO : REG).push(i));
  for(const p of Object.values(P)) p.tr = p.l3 && p.g >= 4 ? p.l3.xfp - p.xfp : 0;
  // drop status calls that have run their course
  for(const id of Object.keys(OV)) if(!P[id] || (OV[id].t === "O" && OV[id].thru < d.weeks[0])) delete OV[id];
  saveOV();
  buildPct(); buildCols();

  const me = TEAMS[ME], others = d.teams.filter(t => t.id !== ME).sort((a,b) => a.name.localeCompare(b.name));
  $("tname").textContent = me.name;
  $("trec").textContent = `${me.w}-${me.l}`;
  if(d.deadline){
    const days = Math.ceil((d.deadline - Date.now()) / 864e5);
    $("dl").innerHTML = days >= 0 ? `Trade deadline <b>${new Date(d.deadline).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</b> &middot; ${days} day${days === 1 ? "" : "s"}` : "Trade deadline passed";
  }
  const teamOpts = others.map(t => `<option value="${t.id}">${esc(t.name)} (${t.w}-${t.l})</option>`).join("");
  $("scope").innerHTML = `<option value="me">My roster</option><option value="league">Every rostered player</option>
    <option value="all">Everyone, with free agents</option><option value="fa">Free agents only</option><optgroup label="Other teams">${teamOpts}</optgroup>`;
  $("partner").innerHTML = teamOpts;
  $("pkTeam").innerHTML = `<option value="">All teams</option>${teamOpts}`;

  $("msg").hidden = true; $("sub").hidden = false;
  const want = location.hash.slice(1);
  show(["roster","packages","builder"].includes(want) ? want : "roster");
  renderAll();

  $("sub").onclick = e => { const b = e.target.closest("button"); if(b) show(b.dataset.v); };
  // roster table controls
  $("scope").onchange = e => { S.scope = e.target.value; S.sort = null; renderTable(); $("rscroll").scrollTop = 0; };
  const segPick = (id, key, attr) => ($(id).onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    S[key] = b.dataset[attr];
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    if(!colKeys().includes(S.sort) && S.sort !== "name") S.sort = null;
    renderTable();
  });
  segPick("posf", "pos", "p"); segPick("colsf", "cols", "c");
  $("q").oninput = e => { S.q = e.target.value.trim(); renderTable(); };
  $("rt").tHead.onclick = e => {
    const th = e.target.closest("th.sort"); if(!th) return;
    const k = th.dataset.k;
    if(S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = COLS[k].str ? 1 : -1; }
    renderTable(); $("rscroll").scrollTop = 0;
  };
  $("rt").tBodies[0].onchange = e => {
    const s = e.target.closest("select.st"); if(!s) return;
    const v = s.value, id = s.dataset.id;
    if(!v) delete OV[id]; else OV[id] = v === "H" ? {t:"H"} : {t:"O", thru:+v.slice(2)};
    saveOV(); renderAll();
  };
  $("ovclr").onclick = () => { OV = {}; saveOV(); renderAll(); };
  // packages
  $("pkTeam").onchange = e => { S.pkTeam = e.target.value; renderPackages(); };
  $("pkPos").onchange = e => { S.pkPos = e.target.value; renderPackages(); };
  $("pkSort").onchange = e => { S.pkSort = e.target.value; renderPackages(); };
  $("pkQ").oninput = e => { S.pkQ = e.target.value.trim(); renderPackages(); };
  $("pks").onclick = e => {
    const c = e.target.closest(".pk"); if(!c) return;
    const pk = ALLPK[+c.dataset.i];
    give.clear(); get.clear(); pk.give.forEach(id => give.add(id)); pk.get.forEach(id => get.add(id));
    $("partner").value = pk.team; renderBuilder(); show("builder");
  };
  // builder
  $("partner").onchange = () => { get.clear(); $("theirs").scrollTop = 0; renderBuilder(); };
  const toggle = set => e => {
    const r = e.target.closest(".row"); if(!r) return;
    const id = r.dataset.id; set.has(id) ? set.delete(id) : set.add(id); renderBuilder();
  };
  $("mine").onclick = toggle(give); $("theirs").onclick = toggle(get);
  $("deal").onclick = e => {
    if(e.target.closest("#clear")){ give.clear(); get.clear(); renderBuilder(); return; }
    const c = e.target.closest(".dchip"); if(!c) return;
    (c.dataset.set === "give" ? give : get).delete(c.dataset.id); renderBuilder();
  };
  $("bseg").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    $("bgrid").dataset.side = b.dataset.s;
    $("bseg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  };
}

fetch("/api/trade", {cache:"no-cache"}).then(r => r.json()).then(d => {
  if(d.error) throw new Error(d.error);
  boot(d);
}).catch(e => { $("msg").textContent = "Couldn't load league data (" + e.message + ")"; console.warn(e); });
</script></body></html>
