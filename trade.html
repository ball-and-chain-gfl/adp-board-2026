<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
/* Light theme in the manner of a fantasy-sports site: white panels on a light grey page, a dark
   top bar, one blue for "do this", green = good for me, red = bad for me, amber = maybe. */
:root{--bg:#eef0f2;--panel:#fff;--panel2:#f6f7f8;--line:#dcdee1;--line2:#e9ebed;--txt:#1b1d1f;--soft:#3f4246;--dim:#6b6f74;
  --blue:#0b6fd0;--blue2:#e7f1fc;--good:#0a7f3f;--good2:#e4f4ea;--bad:#c8102e;--bad2:#fbe7ea;--warn:#a86500;--warn2:#fdf1dc;
  --ink:#1d1e20;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
a{color:var(--blue)}

/* top: a dark site bar with the two tools, then my team */
header{background:var(--panel);z-index:30;flex:none;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;background:var(--ink);padding:0 20px}
.tab{padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.3px;text-decoration:none;color:#b9bcc0;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--blue)}
a.tab:hover{color:#fff}

/* section switch: text tabs with a blue underline */
.sub{display:flex;gap:4px;padding:0 20px;flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.sub button{font-size:14px;font-weight:700;padding:11px 14px 9px;border:0;border-bottom:3px solid transparent;background:none;color:var(--soft);cursor:pointer;white-space:nowrap}
.sub button:hover{color:var(--blue)}
.sub button.on{color:var(--blue);border-bottom-color:var(--blue)}
.sub button span{font-weight:600;color:var(--dim);margin-left:4px;font-size:12.5px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px 18px;overflow-y:auto}
#msg{color:var(--dim);padding:40px 0;text-align:center;font-size:15px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:16px 0 8px;font-size:16px;font-weight:800;flex:none}
.sect-h:first-child{margin-top:0}
.sect-h span{font-size:12.5px;font-weight:600;color:var(--dim)}

/* controls */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px;flex:none}
.view > .tools:first-child{margin-top:0}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13.5px}
select{cursor:pointer}
input[type=search]{width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--line);color:var(--soft);padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel2)}
.seg button.on{background:var(--blue);color:#fff}
button.b{background:var(--panel);border:1px solid var(--line);color:var(--soft);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
button.b:hover{border-color:var(--blue);color:var(--blue)}
button.b.go{background:var(--blue);border-color:var(--blue);color:#fff}
button.b.go:hover{background:#095db0}
button.b.sm{padding:5px 10px;font-size:12px}
.count{color:var(--dim);font-size:12.5px;margin-left:auto}
.more{display:block;margin:14px auto;padding:10px 18px}

/* people and teams */
.av{width:46px;height:46px;flex:0 0 46px;border-radius:10px;overflow:hidden;background:#e3e6e9;border:1px solid var(--line);display:block}
.av.QB{background:#e7d6f7}.av.RB{background:#d3eedd}.av.WR{background:#d6e6f8}.av.TE{background:#f8e3c4}.av.K,.av.DST{background:#e3e6e9}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
.av.d img{object-fit:contain;padding:5px}
.av.xl{width:104px;height:104px;flex-basis:104px;border-radius:14px}
[data-pid]{cursor:pointer}
.nm[data-pid]:hover,.tpn[data-pid]:hover{color:var(--blue);text-decoration:underline}
.tlg{position:relative;width:24px;height:24px;flex:0 0 24px;border-radius:50%;overflow:hidden;background:#d5d9de;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--soft);vertical-align:middle}
.tlg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta > *{white-space:nowrap}
.pos{font-size:10px;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:.3px}
.QB{background:#f1e6fb;color:#6d2fa6}.RB{background:#e2f4ea;color:#126b3e}.WR{background:#e4effb;color:#1958a0}
.TE{background:#fcefdc;color:#94520a}.K,.DST{background:#eceef0;color:#555a60}
.inj{font-size:10px;font-weight:800;color:#fff;background:var(--bad);border-radius:3px;padding:0 5px;white-space:nowrap}
.inj.Q{background:#c98200}
.hw{display:inline-flex;align-items:stretch;border-radius:3px;overflow:hidden;white-space:nowrap;font-size:10px;font-weight:800;line-height:15px;letter-spacing:.2px;vertical-align:middle}
.hw i{font-style:normal;background:#4b2e83;color:#fff;padding:0 3px}
.hw b{background:#ede7f7;color:#4b2e83;padding:0 5px;font-weight:800}
.byeb{font-size:10px;font-weight:800;color:#6b4a00;background:var(--warn2);border-radius:3px;padding:0 5px;white-space:nowrap}
.inj.man{background:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:#9a9ea3}
.own{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--soft)}
.own .tlg{width:16px;height:16px;flex-basis:16px;font-size:7px}
.own.fa{color:#9a9ea3}
.need{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--soft);white-space:nowrap;border:1px solid var(--line)}
.need.g{background:var(--good2);color:var(--good);border-color:transparent}.need.r{background:var(--bad2);color:var(--bad);border-color:transparent}
.needs{display:flex;flex-wrap:wrap;gap:5px}
button.need{font:inherit;cursor:pointer}
button.need:hover{box-shadow:0 0 0 1.5px #4b2e83 inset}
.need.my{background:#ede7f7;color:#4b2e83;border-color:#4b2e83;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.g{background:var(--good2);border-color:transparent;color:var(--good)}
.chip.r{background:var(--bad2);border-color:transparent;color:var(--bad)}
.chip.a{background:var(--warn2);border-color:transparent;color:var(--warn)}
.chip.b{background:var(--blue2);border-color:transparent;color:var(--blue)}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:52px;padding:3px 6px;border-radius:5px;line-height:1.2;flex:none}
.wkc em{font-style:normal;font-size:9.5px;font-weight:800;color:var(--dim);text-transform:uppercase}
.wkc b{font-size:12px;font-weight:700}
.wkc i{font-style:normal;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.wkc.bye b,.wkc.out b{color:#9a9ea3}
.wkc.out i{color:var(--bad);font-weight:800;font-size:10.5px}
select.st,select.rl{padding:4px 6px;font-size:12.5px;font-weight:700;border-radius:5px;color:var(--soft);max-width:176px}
select.st.Q{border-color:#e0a800;color:var(--warn)}
select.st.D,select.st.O,select.st.IR,select.st.SUS{border-color:#e7a0aa;color:var(--bad)}
select.st.man{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
select.rl.on{border-color:#e0a800;background:var(--warn2);color:var(--warn)}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.rtag{font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:3px;padding:0 5px;white-space:nowrap}
.rtag.S{background:var(--blue2);color:var(--blue)}.rtag.B{background:#eceef0;color:#555a60}.rtag.C{background:var(--warn2);color:var(--warn)}
.xpb{font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:3px;padding:0 5px;background:#ece7fb;color:#5b3fb8;white-space:nowrap}
.warn{color:var(--warn);font-weight:800}
.market{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;flex:none}
.mini{font-size:10.5px;font-weight:700;padding:3px 5px;border-radius:4px;min-width:38px;text-align:center}

/* grades, answers, outlook */
.gr{display:inline-block;min-width:36px;padding:3px 7px;border-radius:5px;font-weight:800;font-size:13px;text-align:center}
.gr.a{background:var(--good);color:#fff}.gr.b{background:#5a9a2a;color:#fff}.gr.c{background:#c98200;color:#fff}.gr.d{background:#e3e6e9;color:var(--soft)}.gr.s{background:var(--bad);color:#fff}
.will{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.will.likely{background:var(--good2);color:var(--good)}.will.maybe{background:var(--warn2);color:var(--warn)}.will.long{background:#eceef0;color:#6b6f74}
.will.three{background:#ece7fb;color:#5b3fb8}
.ol{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:4px;white-space:nowrap}
.ol.target{background:var(--good);color:#fff}.ol.avoid{background:var(--bad);color:#fff}
.ol.sell{background:#d86a00;color:#fff}.ol.core{background:var(--blue);color:#fff}.ol.hold{background:#e3e6e9;color:var(--soft)}
td:has(> .olw){text-align:left}
.pt{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pt.up2,.pt.t1{background:var(--good);color:#fff}.pt.up1,.pt.t2{background:var(--good2);color:var(--good)}
.pt.t3{background:var(--warn2);color:var(--warn)}.pt.even,.pt.out,.pt.t4{background:#eceef0;color:#6b6f74}
.pt.down{background:var(--bad2);color:var(--bad)}
.pt.sm{font-size:9.5px;padding:1px 5px}
.hint2{font-size:12.5px;color:var(--dim);margin:0 0 10px;flex:none}
details.hab{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;flex:none}
details.hab summary{cursor:pointer;padding:10px 13px;font-weight:800;font-size:14px;list-style:none;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
details.hab summary::-webkit-details-marker{display:none}
details.hab summary span{font-weight:600;font-size:12.5px;color:var(--dim)}
details.hab summary span b{color:var(--good)}
details.hab summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:700;color:var(--blue)}
details.hab[open] summary::after{content:"Hide"}
details.hab .scroll{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px;max-height:none}
details.hab td{vertical-align:top;line-height:1.5}
/* the player card */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,18,22,.55);overflow-y:auto;padding:24px 14px;display:flex;justify-content:center;align-items:flex-start}
.mbox{position:relative;background:var(--panel);border-radius:14px;width:100%;max-width:560px;padding:18px 18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1;cursor:pointer;color:var(--soft)}
.mclose:hover{border-color:var(--blue);color:var(--blue)}
.pct{display:flex;gap:14px;align-items:center;padding-right:34px}
.pcid{min-width:0}
.pcid h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.pcid .own{margin-top:6px;font-size:12.5px}
.pcid .own .tlg{width:18px;height:18px;flex-basis:18px;font-size:7px}
.pcls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pcl{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.pcl .lab{margin-bottom:5px}
.pcl .pt{font-size:14px;padding:4px 10px}
.pcl .olw{max-width:none;font-size:12px}
.pcns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.pcn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;line-height:1.2}
.pcn b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pcn span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.pcn i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:2px}
.pcwv{margin-top:10px;font-size:13px;color:var(--soft)}
.pch{margin:16px 0 7px;font-size:13px;font-weight:800;letter-spacing:.2px}
.pch span{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:6px}
.pcsched{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pcw{display:grid;grid-template-columns:52px 74px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:13.5px}
.pcw:last-child{border-bottom:0}
.pcw .wk{font-size:11.5px;font-weight:800;color:var(--dim)}
.pcw .op{font-weight:800;text-align:center;border-radius:5px;padding:3px 4px;background:#eef0f2}
.pcw .mr{font-size:12px;color:var(--dim)}
.pcw b{text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
.pcw.po{box-shadow:inset 3px 0 0 #1958a0}
.pcw.po .wk{color:#1958a0}
.pcw.off b,.pcw.off .op{color:#9a9ea3}
.pcw.tot{background:var(--panel2);font-weight:800}
.pchow{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--soft);background:var(--blue2);border-radius:8px;padding:9px 11px}
.pclog{display:flex;gap:4px;align-items:flex-end;height:92px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pcb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.pcb em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--soft)}
.pcb i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;background:var(--blue)}
.pcb.none i{background:#d5d9de}
.pcb span{font-size:10px;color:var(--dim)}
.pcctl{display:flex;flex-wrap:wrap;gap:8px}
.pcrange{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--soft)}
.pcrange select{padding:7px 6px;font-size:13px;font-weight:600;border-radius:5px}
.pcrange .rgs{flex:1 1 110px}
.pcrange .b{padding:7px 14px}
.pccalls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rcall{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;background:var(--blue2);color:var(--blue)}
.rcall.O{background:var(--bad2);color:var(--bad)}
.rcall i{font-style:normal;opacity:.6;margin-left:2px}
.pcctl select{max-width:none;flex:1 1 180px;padding:7px 8px}
.pcact{margin-top:16px;display:flex}
.pcact .b{flex:1;padding:11px;font-size:14px}
/* phone rows: an arrow opens the rest underneath */
.xb{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--blue);font-size:13px;cursor:pointer;padding:0;line-height:1}
.xb.on{background:var(--blue);color:#fff;border-color:var(--blue);transform:rotate(180deg)}
.xc{width:36px;padding-left:0!important;padding-right:6px!important}
tr.dt > td{background:var(--panel2)!important;padding:10px!important;white-space:normal;text-align:left}
.dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dc{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;min-width:0;text-align:left}
.dc.w{grid-column:1/-1}
.dc > span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.dc > div{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere}
.dc.ctl > div{display:flex;flex-wrap:wrap;gap:6px}
.dc.ctl select{max-width:none;flex:1 1 140px}
.dc .olw{max-width:none}
.wks{display:flex;flex-wrap:wrap;gap:4px}
.lr em.pos{font-style:normal}
.top1 .rp{font-size:12px;color:var(--dim)}
.top1 .rp b{color:var(--txt)}
.olw{display:block;font-size:11px;color:var(--dim);margin-top:3px;max-width:190px;white-space:normal;line-height:1.25}
tr.o-up td.l{box-shadow:inset 4px 0 0 var(--good)}

/* my needs: one tile per spot in the lineup */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 11px;border-top:4px solid #c3c8ce;min-width:0;text-align:left;color:var(--txt)}
button.tile{cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
button.tile:hover{border-color:var(--blue)}
button.tile.on{outline:2px solid var(--blue);outline-offset:-1px}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tile .k em{font-style:normal;font-size:10px;letter-spacing:.4px;padding:1px 7px;border-radius:3px;background:#eceef0;color:var(--soft)}
.tile.g .k em{background:var(--good2);color:var(--good)}.tile.r .k em{background:var(--bad);color:#fff}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
.strip{display:flex;gap:3px;margin:6px 0 7px}
.strip i{flex:1;height:5px;border-radius:2px;background:#e3e6e9}
.strip i.me{background:var(--txt)}
.tile.g .strip i.me{background:var(--good)}.tile.r .strip i.me{background:var(--bad)}
.tile .v .rkn{font-weight:800}.rkn.g{color:var(--good)}.rkn.r{color:var(--bad)}
.tps{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.tp{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.tp .av{width:34px;height:34px;flex-basis:34px;border-radius:8px}
.tp .tpn{flex:1;min-width:0;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tp b{font-variant-numeric:tabular-nums;color:var(--soft)}
.tbig{font-size:20px;font-weight:800;margin-bottom:4px}
.tbig small{font-size:11px;font-weight:700;color:var(--dim);margin-left:4px}
.tile .s2{font-size:11.5px;color:var(--dim);line-height:1.3}
/* the roster, one table per position */
.ptab{margin-bottom:14px}
.ptab-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--dim);font-weight:700}
.ptab-h .pos{font-size:12px;padding:2px 8px}
.ptab .scroll{max-height:none}
.tile .s3{font-size:11.5px;font-weight:700;color:var(--blue);margin-top:4px}

/* top targets */
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;flex:none}
.top1{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--txt);min-width:0}
.top1:hover{border-color:var(--blue);border-left-color:var(--good)}
.top1 .hd{display:flex;gap:10px;align-items:center;min-width:0}
.top1 .hd .av{width:64px;height:64px;flex-basis:64px;border-radius:12px}
.top1 .who{flex:1;min-width:0}
.top1 .nm{font-size:15px}
.top1 .nums{display:flex;gap:16px;align-items:baseline}
.top1 .nums div{display:flex;flex-direction:column;line-height:1.1}
.top1 .nums b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.top1 .nums span{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.top1 .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--blue)}

/* tables */
/* a table is as tall as its rows, up to most of the screen, then scrolls inside */
.scroll{flex:none;max-height:74vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.scroll table{width:auto;min-width:100%}
/* everything sits in a centred column instead of running edge to edge */
.view > *{width:100%;max-width:1180px;margin-left:auto;margin-right:auto}
.tm{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.tm.long{background:var(--good2);color:var(--good)}.tm.short{background:var(--warn2);color:var(--warn)}.tm.fill,.tm.none{background:#eceef0;color:#6b6f74}
.tmw{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.opt.pick{padding:4px 6px}
.opt.pick .av{width:30px;height:30px;flex-basis:30px;border-radius:7px}
.opt .ck{width:14px;height:14px;flex:0 0 14px;border:1.5px solid #9aa0a6;border-radius:3px;background:#fff}
.opt.pick.on .ck{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 2px #fff}
.lnk{background:none;border:0;padding:0;margin-left:6px;color:var(--blue);font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);background:#f6f7f8;position:sticky;top:0;z-index:3;padding:8px 10px;user-select:none;border-bottom:1px solid var(--line)}
th.sort{cursor:pointer}
th.sort:hover{color:var(--blue)}
th.on{color:var(--txt)}
th .ar{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}
th.l,td.l{text-align:left;position:sticky;left:0;z-index:2;background:var(--panel)}
th.l{z-index:4;background:#f6f7f8}
th.po{color:#1958a0}
th.c,td.c{text-align:center}
.sep{border-left:1px solid var(--line2)}
tbody tr:hover td{background:#f4f8fd}
tr.me td.l{box-shadow:inset 4px 0 0 var(--blue)}
tr.click{cursor:pointer}
.ply{display:flex;align-items:center;gap:10px;min-width:0}
.spk{display:block;margin-left:auto}
td.wk{padding:5px 4px;text-align:center}
.fitc{font-size:12.5px;font-weight:700;color:var(--soft)}
td .chip{font-size:11px;padding:1px 7px}
.go-r{color:var(--blue);font-weight:800;font-size:16px}

/* packages: filters on the left, deals on the right */
.pkwrap{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
.pkside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;align-self:start;max-height:100%}
.fl .lab{margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--soft)}
.opt:hover{background:var(--panel2)}
.opt.on{background:var(--blue2);color:var(--blue);font-weight:700}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--dim);font-weight:600}
.opt .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkside .seg{display:flex}
.pkside .seg button{flex:1;padding:6px 4px}
.pkside input[type=search],.pkside select{width:100%}
.pkmain{min-height:0;overflow:auto;display:flex;flex-direction:column}
.pkhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;flex:none}
.pkhead .count{margin-left:0;flex:none!important;text-align:left!important}
.pkhead .chips{flex:1}
#pkFilt{display:none}
.pkl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;align-items:start;max-width:760px}
.pkc{background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0;display:flex;flex-direction:column;text-align:left;color:var(--txt);padding:0}
.pkc:hover{border-color:var(--blue);box-shadow:0 1px 6px rgba(11,111,208,.12)}
.pkc-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.pkc-t{flex:1;min-width:0}
.pkc-t .tn{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;min-width:0}
.pkc-t .tn span.x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkc-t .sub2{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pkc-t .sub2 .rec{font-size:11.5px;color:var(--dim);font-weight:700}
.pkc-g{display:flex;gap:12px;flex:none}
.pkc-g div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.pkc-g b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.pkc-g span{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.pkc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.pkc-b.three{grid-template-columns:minmax(0,1fr)}
.leg{padding:9px 12px;min-width:0}
.pkc-b:not(.three) .leg + .leg{border-left:1px solid var(--line2)}
.pkc-b.three .leg + .leg{border-top:1px solid var(--line2)}
.leg .lh{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.leg .lh .tlg{width:16px;height:16px;flex-basis:16px;font-size:7px}
.leg.get .lh{color:var(--good)}.leg.give .lh{color:var(--bad)}
.pr{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 0}
.pr .av{width:46px;height:46px;flex-basis:46px}
.pr .who{flex:1;min-width:0}
.pr .nm{font-size:13.5px}
.pr .pts{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--soft)}
.pkc-f{padding:8px 12px 10px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:0 0 8px 8px}
.pkc-f .them{font-size:12px;color:var(--dim)}
.pkc-f .them b{font-weight:700}

/* builder: my players | the deal | their players, each scrolling on its own */
.bseg{display:none;margin-bottom:10px;flex:none}
.bgrid{flex:1 0 auto;height:0;min-height:min(520px,78vh);display:grid;grid-template-columns:minmax(270px,360px) minmax(300px,540px) minmax(270px,360px);gap:12px;justify-content:center}
.rcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.rcol .pane{flex:1}
.bmode{margin-bottom:10px;flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bmode .hint{font-size:12.5px;color:var(--dim)}
.dsides.three{grid-template-columns:1fr 1fr 1fr}
@container (max-width:420px){ .dsides.three{grid-template-columns:1fr} }
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ph{padding:9px 10px;background:#f6f7f8;border-bottom:1px solid var(--line);flex:none}
.ph .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b.h{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.ph select{flex:1;min-width:0;padding:6px 8px;font-weight:700}
.ph .cap{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--dim);white-space:nowrap}
.ph .needs{margin-top:7px}
.plist{flex:1;min-height:0;overflow:auto}
.grp{padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);background:#f6f7f8;border-bottom:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:none;color:var(--txt);text-align:left}
.row:hover{background:#f4f8fd}
.row{position:relative}
.row.sel{background:var(--blue2);box-shadow:inset 4px 0 0 var(--blue)}
.row.sel .av{box-shadow:0 0 0 2px var(--blue)}
.row.sel .nm{color:var(--blue)}
/* picked: a tick on the corner of the photo, in place of a checkbox */
.row.sel::before{content:"✓";position:absolute;left:36px;top:calc(50% + 7px);width:17px;height:17px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px #fff;z-index:1}
.row .av{width:38px;height:38px;flex-basis:38px;border-radius:8px}
.row .who{min-width:0;flex:1}
.row .nm{font-size:13.5px;display:block}
.row .meta{gap:3px 6px;margin-top:1px}
.row .ol{font-size:9.5px;padding:1px 5px}
.row .n2{display:flex;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;flex:none}
.row .n2 span{width:42px;text-align:right}
.row .n2 span + span{color:#1958a0}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;min-height:0;container-type:inline-size}
@container (max-width:330px){ .dsides,.dgrid{grid-template-columns:1fr} }
.dsum{display:none}
.dsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px 10px;min-height:74px;min-width:0}
.dchips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.dchip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;min-width:0;color:var(--txt);text-align:left}
.dchip:hover{border-color:var(--bad)}
.dchip .nm{font-size:13.5px;flex:1;min-width:0}
.dchip .x{color:var(--dim);font-weight:800;font-size:14px}
.dempty{color:var(--dim);text-align:center;padding:26px 0 18px;font-size:14px}
.call{font-size:22px;font-weight:800;margin:14px 0 10px;letter-spacing:-.2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dcard{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:9px 11px 10px;min-width:0}
.dcard .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnum{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.dnum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.dnum span{font-size:12.5px;color:var(--dim);white-space:nowrap}
.deal .sig{margin:7px 0 14px}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rk{font-size:12.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:4px 9px;white-space:nowrap}
.rk i{font-style:normal;color:var(--dim);font-weight:600;margin:0 3px}
.rk.up{background:var(--good2);border-color:transparent}.rk.dn{background:var(--bad2);border-color:transparent}
.vbar{height:8px;border-radius:4px;background:#b9cde4;overflow:hidden;margin-top:7px;display:flex}
.vbar i{background:var(--blue)}
.vlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.vlab b{color:var(--txt)}
.dfoot{margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
/* the lineup, week by week */
.lwk{flex:none}
.lwk .sect-h{margin-top:14px}
.lwk .sect-h .lnk2{margin-left:auto}
.lwkey{font-style:normal;background:var(--warn2);color:var(--warn);border-radius:3px;padding:0 4px}
.lwlow{font-style:normal;color:var(--bad);font-weight:700}
.lwbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lwtab{width:100%;table-layout:fixed;border-collapse:collapse}
.lwtab th,.lwtab td{padding:5px 6px;border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);text-align:left;vertical-align:middle;overflow:hidden}
.lwtab th:first-child,.lwtab td:first-child{border-left:0}
.lwtab thead th{background:var(--panel2);font-size:12px;line-height:1.25}
.lwtab thead th b{display:block;font-weight:800}
.lwtab thead th i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lwtab th.po b{color:#1958a0}
.lwtab .sl{width:60px;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.lwtab tfoot td{border-bottom:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.lwtab tfoot tr.tot td{background:var(--panel2);border-bottom:1px solid var(--line2);font-size:13.5px}
.lwtab tr.sit td{font-size:11px;color:var(--soft);vertical-align:top;line-height:1.35}
.lwtab tr.sit td span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lwtab tr.sit td i,.lwsit i{font-style:normal;color:var(--bad);font-weight:700;font-size:10px;text-transform:uppercase}
.lwc{display:flex;align-items:center;gap:6px;min-width:0;border-radius:6px;padding:2px 3px}
.lwc .av{width:28px;height:28px;flex:0 0 28px;border-radius:7px}
.lwc .lwt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.lwc .lwn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lwc .lwn[data-pid]:hover{color:var(--blue);text-decoration:underline}
.lwc .lwm{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lwc .lwm b{color:var(--soft);font-weight:700}
.lwc .lwm .low{color:var(--bad)}
.lwc.fill{background:var(--warn2)}
.lwc.bn .lwn{font-weight:600;color:var(--soft)}
.lwc.bn .av{opacity:.85}
.lwtab tbody tr.tot td{background:var(--panel2);font-size:13.5px;font-variant-numeric:tabular-nums}
.lwtab .bnrows td{border-bottom-color:transparent;padding-top:3px;padding-bottom:3px}
.lwtab .bnrows tr:last-child td{border-bottom:1px solid var(--line2)}
.lwbh{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:var(--panel2);padding:6px 11px;border-bottom:1px solid var(--line2)}
.lwc.empty{flex-direction:column;align-items:flex-start;gap:0;background:var(--bad2);padding:4px 6px}
.lwc.empty .lwn{color:var(--bad)}
/* one week at a time, on a phone or a narrow window */
.lwpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:4px;margin-bottom:8px}
.lwpick button{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-height:40px}
.lwpick button b{font-size:13.5px}
.lwpick button i{font-style:normal;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.lwpick button.po b{color:#1958a0}
.lwpick button.on{background:var(--blue);border-color:var(--blue)}
.lwpick button.on b,.lwpick button.on i{color:#fff}
.lwone{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lwoh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 11px;background:var(--panel2);border-bottom:1px solid var(--line2);font-size:13px}
.lwoh span{color:var(--soft);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lwr{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line2)}
.lwr .sl{flex:0 0 38px;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim)}
.lwr .lwc{flex:1}
.lwr .lwc .av{width:36px;height:36px;flex-basis:36px;border-radius:8px}
.lwr .lwc .lwn{font-size:14px}
.lwr .lwc .lwm{font-size:12px}
.lwsit{padding:8px 11px;font-size:12px;color:var(--soft)}
/* banked trades */
.bankbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 20px;background:#fff7e0;border-bottom:1px solid #ecd9a0;font-size:12.5px;color:#5c4a12}
.lnk2{font:inherit;font-size:12.5px;font-weight:700;color:var(--blue);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline}
.banked{flex:none;margin-bottom:10px;background:var(--panel);border:1px solid #ecd9a0;border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.banked .lab{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8a6d10}
.bk{display:flex;align-items:center;gap:9px;font-size:13px;min-width:0}
.bk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:#f3e3ad;color:#5c4a12;font-size:11px;font-weight:800;display:grid;place-items:center}
.bk span{flex:1;min-width:0}
.bk button{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--soft);font-size:16px;line-height:1;cursor:pointer}
.bk button:hover{color:var(--bad);border-color:var(--bad)}
/* ruled-out players */
.nogo{font-size:10px;font-weight:800;color:#6b6f74;background:#eceef0;border-radius:3px;padding:0 5px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.rxb{font:inherit;font-size:12px;font-weight:700;color:#a3a7ac;background:none;border:1px solid transparent;border-radius:5px;width:26px;height:26px;padding:0;cursor:pointer;white-space:nowrap}
.rxb .t{display:none}
.rxb:hover{color:var(--bad);border-color:var(--bad)}
.dc .rxb{width:auto;height:auto;padding:6px 10px;border-color:var(--line);color:var(--soft)}
.dc .rxb .x{display:none}.dc .rxb .t{display:inline}
.top1 .ft .rx{margin-left:auto;margin-right:10px;font-size:11.5px;font-weight:600;color:#9a9ea3;cursor:pointer;white-space:nowrap}
.top1 .ft .dimn{white-space:nowrap}
.top1 .ft .rx:hover{color:var(--bad);text-decoration:underline}
.pcact{gap:8px}
.pcact .b:not(.go){flex:0 0 auto}
.pcact .b.on{background:#eceef0;color:var(--soft)}
/* the builder uses the whole window */
#v-builder > *{max-width:none}
@media (min-width:1101px){
  .bgrid{grid-template-columns:minmax(300px,1fr) minmax(380px,1.35fr) minmax(300px,1fr);justify-content:stretch}
}
.sig{display:flex;flex-direction:column;gap:6px}
.sg{display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.3}
.sg i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--good)}
.sg.r i{background:var(--bad)}.sg.a i{background:#e0a800}
.sg.r span{color:var(--bad)}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.pvseg button{padding:5px 11px;font-size:12px}
.pvwk{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:4px;margin:8px 0 2px}

/* Three lists.

    if(p.t === ME){

      continue;

    // hurt players are nobody's target: anyone out, doubtful, on IR or suspended is left off
    // until I overrule ESPN's status myself, however soon he is due back

/* ---- percentile shading: how a number stacks up at his position across the whole pool ----*/
function buildPct(){
  const keys = ["ppg","xfp","snap","ts","cs","ays","wopr","doc","tps","cr","ypt","yacr","opp","rzg","rz","ypc","yaco","bt","fdg"];
  for(const pos of SKILL){
    PCT[pos] = {};
    const pool = Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3));
    for(const k of keys) PCT[pos][k] = pool.map(p => p[k]).filter(v => v != null).sort((a,b) => a - b);
  }
}
function tint(p, k){
  const a = (PCT[p.pos] || {})[k];

/* ---- targets -------------------------------------------------------------------------------
   Colour does the talking. A bar or tile is green when the number is high for the position and
   red when it is low, so a wall of green over a short yellow scoring bar is the whole story:
   the workload of a good player, without the points yet. */
const TILES = {
  QB: [["xfp","Workload"],["cs","Rushing"],["rz","Red zone"],["fdg","1st downs"]],
  RB: [["snap","Snaps"],["cs","Carries"],["ts","Targets"],["rz","Red zone"],["yaco","Contact"]],
  WR: [["snap","Snaps"],["ts","Targets"],["tps","Tgt/snap"],["wopr","WOPR"],["rz","Red zone"]],
};
TILES.TE = TILES.WR;
const heat = (q, a = 0.32) => q >= 0.5 ? `rgba(34,170,95,${((q - 0.5) * 2 * a).toFixed(2)})` : `rgba(220,64,54,${((0.5 - q) * 2 * a).toFixed(2)})`;
const solid = q => `hsl(${Math.round(q * 125)},62%,45%)`;
// the read on a player as a few coloured words: green is in his favour from here, red against
function sigChips(p){
  const s = p.sg, out = [];
  if(!s) return out;
  if(s.tdl >= 0.8) out.push([`${(p.xtd - p.td).toFixed(1)} TDs owed`, "g"]);
  else if(s.tdl <= -0.8) out.push([`${(p.td - p.xtd).toFixed(1)} TDs over`, "r"]);
  if(s.eff >= 1.5) out.push(["yards owed", "g"]); else if(s.eff <= -2) out.push(["hot efficiency", "r"]);
  if(s.shift >= 0.15) out.push(["role growing", "g"]); else if(s.shift <= -0.15) out.push(["role shrinking", "r"]);
  if(p.g >= 4 && s.cold >= 3 && p.l3.ppg <= p.ppg - 1.5) out.push(["cold last 3", "g"]);
  if(s.sched >= 4) out.push(["easier schedule", "g"]); else if(s.sched <= -4) out.push(["tougher schedule", "r"]);
  if(PO.length && s.po != null){ if(s.po >= 21) out.push(["soft playoffs", "g"]); else if(s.po <= 11) out.push(["tough playoffs", "r"]); }
  return out.sort((a,b) => (a[1] === "g" ? 0 : 1) - (b[1] === "g" ? 0 : 1));
}

const detailHtml = (cols, r) => `<div class="dg">${cols.map(c => { const v = c.html(r); const st = c.style ? c.style(r) : "";

/* Put a row table in its box so that it FITS. On a phone or a narrow window the table keeps

function fitGrid(el, cols, rows, sk, dir, rowAttr, mainKeys){
  el.innerHTML = gridHtml(cols, rows, sk, dir, rowAttr, mainKeys);
  if(CQ.matches || !el.clientWidth || el.scrollWidth <= el.clientWidth + 1) return;
  const keys = cols.filter(c => !c.l && c.k !== "act").map(c => c.k), pri = k => { const c = cols.find(x => x.k === k); return c.pri == null ? 5 : c.pri; };
  const order = keys.slice().sort((a, b) => pri(a) - pri(b) || keys.indexOf(b) - keys.indexOf(a));
  for(let n = Math.max(1, keys.length - Math.floor(keys.length * el.clientWidth / el.scrollWidth) - 1); n < keys.length; n++){
    const gone = new Set(order.slice(0, n));

function gridHtml(cols, rows, sk, dir, rowAttr, mainKeys, force){

  const td = (c, r) => `<td class="${c.l ? "l" : c.c ? "c" : "num"}${c.sep && !phone ? " sep" : ""}"${c.style ? ` style="${c.style(r)}"` : ""}>${c.html(r)}</td>`;

function sortRows(rows, cols, sk, dir){

// header clicks on a row table: the same column flips, a new one sorts high-to-low (names A-Z)

/* ---- the lens: everyone is read against MY lineup ----------------------------------------------
   Two tags a player, one for the rest of the regular season and one for the playoff weeks.
     My players     how good he will be: his rank at the position over those weeks.
                    Elite = top third of the startable ranks, Starter, Fringe (the next half
                    again), Bench.
     Everyone else  what he would do to my lineup. If he would play for me, the points a week
                    my lineup gains with him in it (byes and injuries counted). Usually that is
                    "over" my starter; when he doesn't out-project him but the pair still scores
                    more by matchup and bye, it says "sharing weeks with". If he wouldn't,
                    how far he sits behind the weakest starter he could replace. Half a point
                    either way is "even".
   BAR is that weakest starter, per position and per period: my QB for a QB; the lowest of my
   two RBs and my flex for a back, and so on. */
const PT = 0.5;
function buildLens(){
  const mine = TEAMS[ME].players, L = lineupOf(mine, true);
  BAR = {};
  for(const pos of SKILL){
    const rows = L.rows.filter(r => r.p && (r.slot === pos || (r.slot === "FLEX" && pos !== "QB")));
    const low = k => (rows.length ? rows.slice().sort((a,b) => a.p[k] - b.p[k])[0].p : null);
    BAR[pos] = {reg:low("ros"), po:low("po")};
    const all = Object.values(P).filter(p => p.pos === pos);
    all.slice().sort((a,b) => b.ros - a.ros).forEach((p, i) => (p.rr = i + 1));
    all.slice().sort((a,b) => b.po - a.po).forEach((p, i) => (p.rp = i + 1));
    // and his rank at the position in each playoff game on its own
    for(const p of all) p.wrk = {};
    for(const i of PO) all.slice().sort((a,b) => b.eff[i] - a.eff[i]).forEach((p, n) => (p.wrk[i] = n + 1));
  }
  for(const pos of ["K", "DST"]){
    const all = Object.values(P).filter(p => p.pos === pos);
    all.slice().sort((a,b) => b.ros - a.ros).forEach((p, i) => (p.rr = i + 1));
    all.slice().sort((a,b) => b.po - a.po).forEach((p, i) => (p.rp = i + 1));
    for(const p of all) p.wrk = {};
    for(const i of PO) all.slice().sort((a,b) => b.eff[i] - a.eff[i]).forEach((p, n) => (p.wrk[i] = n + 1));
  }
  for(const pos of ["K", "DST"]){
    const a = mine.map(id => P[id]).filter(p => p.pos === pos && !((roleOf(p.id) || {}).r === "B")), n = spots(pos) || 1;
    const low = k => { const s = a.slice().sort((x, y) => y[k] - x[k]).slice(0, n); return s.length ? s[s.length - 1] : null; };
    BAR[pos] = {reg:low("ros"), po:low("po")};
  }
  for(const p of Object.values(P)){
    p.lens = null;
    if(!(SKILL.includes(p.pos) || p.pos === "K" || p.pos === "DST") || p.t === ME) continue;
    const d = delta(W0[ME], worth(mine.concat([p.id]), true, true)), bar = BAR[p.pos];
    const gap = (k, a) => (bar[k] ? Math.min(0, p[a] - bar[k][a]) : 0);
    p.lens = {d, reg:d.reg > 0.05 ? d.reg : gap("reg", "ros"), po:d.po > 0.05 ? d.po : gap("po", "po"), over:bar};
  }
}
// the playoff weeks one at a time: his rank at the position that week, coloured by tier

    if(w.o === "BYE") return `<span class="pg off" title="Week ${w.w}: bye"><em>${w.w}</em>BYE</span>`;
    if(p.eff[i] === 0) return `<span class="pg off" title="Week ${w.w}: out"><em>${w.w}</em>OUT</span>`;

/* The playoff column wherever a list of players has one (Targets, Waivers, kickers, defenses):

const poCell = p => ((SKILL.includes(p.pos) || p.pos === "K" || p.pos === "DST") && PO.length > 1 && p.rp
  ? poGames(p) + `<span class="olw nw">${p.pos === "DST" ? "DEF" : p.pos}${p.rp} · ${f1(p.po)}${MQ.matches ? "" : " a game"}</span>` : `<b>${f1(p.po)}</b>`);
function ptag(p, k, mini){
  // the playoff games one by one, then the average line. On my own players the tier tag (Elite,
  // Starter, Fringe, Bench) is left off here: the three games already say it
  if(!mini && k === "po" && SKILL.includes(p.pos) && PO.length > 1){

function ptagAvg(p, k, mini){
  if(!SKILL.includes(p.pos)) return "";
  const idx = k === "reg" ? REG : PO, a = k === "reg" ? "ros" : "po", r = p[k === "reg" ? "rr" : "rp"];
  if(!idx.length) return "";
  const outW = idx.filter(i => p.eff[i] === 0 && p.wk[i].p > 0).length;
  if(outW > idx.length / 2) return mini ? "" : `<span class="pt out">Out</span><span class="olw">${outW} of ${plural(idx.length, "week")}</span>`;
  if(p.t === ME){
    const N = STARTN[p.pos], t = r <= Math.ceil(N / 3) ? ["t1", "Elite"] : r <= N ? ["t2", "Starter"] : r <= Math.round(N * 1.5) ? ["t3", "Fringe"] : ["t4", "Bench"];
    return mini ? "" : `<span class="pt ${t[0]}">${t[1]}</span><span class="olw nw">${p.pos}${r} · ${f1(p[a])}${MQ.matches ? "" : " a game"}</span>`;
  }
  const v = p.lens[k], o = p.lens.over[k];
  const c = v >= 2 ? "up2" : v >= PT ? "up1" : v <= -PT ? "down" : "even";
  const lab = c === "even" ? "≈ Even" : (v > 0 ? "▲ " : "▼ ") + sgn(v);
  if(mini) return c === "even" ? "" : `<span class="pt sm ${c}">${lab}${k === "po" ? " PO" : ""}</span>`;
  return `<span class="pt ${c}">${lab}</span><span class="olw">${p.pos}${r}${o ? ` · ${v <= -PT ? "behind" : v < PT ? "level with" : p.base > o.base ? "over" : "sharing weeks with"} ${esc(short(o))}` : ""}</span>`;
}
const lensUp = p => !!p.lens && (p.lens.reg >= PT || p.lens.po >= PT);

/* ---- my needs: lineup rank overall and at each spot -----------------------------------------

function renderTiles(el, clickable){
  const n = D.teams.length, out = [];

    <div class="k"><span>${k}</span>${word ? `<em>${rank <= 4 ? "Strength" : rank >= 9 ? "Need" : "Solid"}</em>` : ""}</div>

  };
  // on Targets the whole tile is one button (filter to this position), so a name inside it must not open a card:
  // a thumb lands on the name. On Roster the tile does nothing itself, so names stay tappable.
  const tp = p => { const s = `<div class="tp">${img(p)}<span class="tpn" data-pid="${p.id}">${esc(short(p))}</span><b>${f1(p.adj)}</b></div>`; return clickable ? s.replace(/ data-pid="[^"]*"/g, "") : s; };
  // the lineup as it stands today, no waiver help
  const all = D.teams.map(t => ({id:t.id, w:worth(t.players, false, t.id === ME)}));
  const place = key => all.slice().sort((a,b) => b.w[key] - a.w[key]).findIndex(x => x.id === ME) + 1;
  const mine = all.find(x => x.id === ME).w;

  if(PO.length) lineupTiles.push(tile("Lineup · wk " + wkSpan(PO), place("po"), false, `<div class="tbig">${f1(mine.po / PO.length)}<small>pts / wk</small></div>`, "playoffs", null, "po"));
  if(!clickable) out.push(...lineupTiles);

/* ---- packages: filters on the left, one card per deal on the right ---------------------------*/
const PKF = {
  pkWill:{lab:"Their answer", opts:[["", "Any answer"], ["maybe", "Likely or worth asking"], ["likely", "Likely yes"]], test:(pk, v) => !v || WORST[pk.will] <= WORST[v]},

  pkPos:{lab:"I get a", opts:[["", "Any position"], ["QB", "QB"], ["RB", "RB"], ["WR", "WR"], ["TE", "TE"]], test:(pk, v) => !v || pk.get.some(id => P[id].pos === v)},
  pkTeam:{lab:"Trading with", opts:null, test:(pk, v) => !v || pk.teams.includes(+v)},
  pkMe:{lab:"My lineup", opts:[["", "Gets better"], ["any", "Any, even if it costs me"]], test:(pk, v) => v === "any" || pk.me.score + (pk.h2hB || 0) > 0},

// the list Packages is showing: deals for a target, deals for the players I picked, or everything
const curPK = () => (S.pkGive.length ? GIVEPK : S.pkFor && P[S.pkFor] ? FORPK : ALLPK);
/* Shopping my own players: every package where exactly the players I picked go out. Two teams
   (one or two of theirs back) and three-team rotations (mine to C, C to B, B to me). Unlike the
   main search it doesn't require the deal to help my lineup - I've decided to move them - but
   it drops anything that costs my lineup more than half a point a week, and asking a team for
   more than twice what I'm sending. */
function findForGive(mg){
  const out = [], others = D.teams.filter(t => t.id !== ME), mV = sumV(mg), mine = TEAMS[ME].players, mTop = maxV(mg), straight = new Set();
  const floor = -0.5 * DEN();
  for(const t of others) for(const tg of sets(tradeable(t))){
    if(sumV(tg) > 2.2 * mV) continue;
    const j = judgeDeal([{from:ME, to:t.id, ids:mg}, {from:t.id, to:ME, ids:tg}], false);
    if(j.me.score >= floor){ out.push(j); if(j.will === "likely") straight.add(key2(t.id, mg, tg)); }
  }
  for(const B of others) for(const bg of sets(tradeable(B))){
    const bV = sumV(bg);
    if(bV > 2.2 * mV || straight.has(key2(B.id, mg, bg))) continue;
    if(delta(W0[ME], worth(swap(mine, new Set(mg), new Set(bg)), true, true)).score < floor) continue;
    threeWays(mg, bg, B, others, false, out);
  }
  return prune(out);
}

const isSingle = () => S.scope === "me" || !!TEAMS[S.scope];

function colKeys(pos = S.pos){

function tableRows(){
  let ids;
  if(S.scope === "me") ids = TEAMS[ME].players;
  else if(S.scope === "league") ids = D.teams.flatMap(t => t.players);
  else if(S.scope === "all") ids = Object.keys(P);
  else if(S.scope === "fa") ids = Object.keys(P).filter(id => !P[id].t);
  else ids = TEAMS[S.scope].players;
  let list = ids.map(id => P[id]);
  if(!isSingle()) list = list.filter(p => SKILL.includes(p.pos) || p.pos === "DST");
  if(S.ol === "up") list = list.filter(p => p.lens && p.lens.reg >= PT);
  if(S.ol === "poup") list = list.filter(p => p.lens && p.lens.po >= PT);
  if(S.ol === "down") list = list.filter(p => p.lens && p.lens.reg <= -PT && p.lens.po <= -PT);
  if(S.pos !== "ALL") list = list.filter(p => p.pos === S.pos);
  if(S.q){ const q = S.q.toLowerCase(); list = list.filter(p => (p.n + " " + p.tm + " " + ownAb(p) + " " + (p.t ? TEAMS[p.t].name : "free agent")).toLowerCase().includes(q)); }
  const c = COLS[S.sort];
  if(c){
    list.sort((a, b) => {
      const x = c.v(a), y = c.v(b);
      if(x == null && y == null) return b.adj - a.adj;
      if(x == null) return 1;
      if(y == null) return -1;
      return (c.str ? String(x).localeCompare(String(y)) * -S.dir : (y - x) * -S.dir) || b.adj - a.adj;
    });
  } else if(isSingle()) list.sort((a, b) => ORDER[a.pos] - ORDER[b.pos] || b.adj - a.adj);
  else list.sort((a, b) => b.adj - a.adj);
  return list;
}
function cellText(c, p){

/* One table per position, each with only the columns that mean something there: a QB table

const GROUPS = [["QB", ["QB"]], ["RB", ["RB"]], ["WR", ["WR"]], ["TE", ["TE"]], ["K / DEF", ["K", "DST"]]];
function renderTable(list){
  const th = (c, extra) => `<th class="${extra || ""}${c.nosort ? "" : " sort"}${S.sort === c.k ? " on" : ""}${c.hd ? " " + c.hd : ""}${c.sep ? " sep" : ""}${c.c || c.wk ? " c" : ""}" data-k="${c.k}"${c.t ? ` title="${esc(c.t)}"` : ""}>${c.h}${S.sort === c.k ? `<span class="ar">${S.dir < 0 ? "▾" : "▴"}</span>` : ""}</th>`;

    const read = sigChips(p).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ");
    return `<div class="dg"><div class="dc w ctl"><span>Status${p.t === ME && SKILL.includes(p.pos) ? " and lineup call" : ""}</span><div>${stSel(p)}${roleSel(p)}</div></div>

      <div class="dc w"><span>Schedule</span><div class="wks">${D.weeks.map((w, i) => wkChip(p, i, true)).join("")}</div></div>
      ${read ? `<div class="dc w"><span>Read</span><div>${read}</div></div>` : ""}</div>`;
  };
  // a full-width table; with `cut` it keeps that many columns and the rest go under the row
  const wide = (ps, keys, nopos, cut) => {
    const ks = cut ? keys.slice(0, cut) : keys;
    return `<table><thead><tr>${th(COLS.name, "l")}${ks.map(k => th(COLS[k])).join("")}${cut ? '<th class="xc"></th>' : ""}</tr></thead><tbody>${ps.map(p => !cut ? row(p, ks, nopos)
      : row(p, ks, nopos).replace(/<\/tr>$/, XB + "</tr>") + `<tr class="dt" hidden><td colspan="${ks.length + 2}">${detail(p)}</td></tr>`).join("")}</tbody></table>`;
  };
  const html = GROUPS.map(([lab0, poss]) => {

    }
    const keys = colKeys(poss.length === 1 ? poss[0] : "K").map(k => (k === "po" && !SKILL.includes(poss[0]) && PO.length > 1 ? "kpo" : k));

      <div class="scroll">${wide(ps, keys, poss.length === 1, 0)}</div></div>`;

  for(const [lab, poss] of GROUPS){
    const box = document.querySelector(`#rscroll .ptab[data-g="${lab}"] .scroll`);

      box.innerHTML = wide(ps, keys, poss.length === 1, k);
      if(box.scrollWidth <= box.clientWidth + 1) break;
    }
  }
}

/* ---- the lineup, week by week ------------------------------------------------------------
   Who starts in each slot in every week left, by the same rules the lineup maths uses: the
   best available at each position that week, then the best of the leftover backs, receivers
   and tight ends in the flex, with my starter / bench / handcuff calls applied to my own team.
   A bye or a week out takes a player off the board. A slot nobody rostered can fill is shown
   as a waiver pickup at that position's waiver level, which is what the maths counts there. */
function lineupWeek(ids, wi, mine){
  const key = p => { let v = mine ? p.km[wi] : p.ko[wi]; if(v < 0) v = cuffKey(p, wi, ids); return v; };
  const by = {QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  for(const id of ids){ const p = P[id], k = by[p.pos] ? key(p) : 0; if(k >= 2000) by[p.pos].push({p, k}); }      // 2000+ = playing, and not a bench call
  for(const pos of Object.keys(by)) by[pos].sort((a, b) => b.k - a.k);
  const rows = [], spill = [];
  for(const pos of SKILL){
    for(let i = 0; i < spots(pos); i++) rows.push({slot:pos, pos, p:by[pos][i] ? by[pos][i].p : null});
    if(pos !== "QB") spill.push(...by[pos].slice(spots(pos)));
  }
  spill.sort((a, b) => b.k - a.k);
  for(let i = 0; i < spots("FLEX"); i++) rows.push({slot:"FLEX", pos:"WR", p:spill[i] ? spill[i].p : null});
  for(const [pos, lab] of [["K", "K"], ["DST", "DEF"]]) for(let i = 0; i < spots(pos); i++) rows.push({slot:lab, pos, p:by[pos][i] ? by[pos][i].p : null});
  for(const r of rows) r.pts = r.p ? r.p.eff[wi] : (REPL[r.pos] || 0);
  return rows;
}
function renderLineupWeeks(){
  const el = $("lwk");
  if(!D.weeks.length){ el.innerHTML = ""; return; }
  const tid = /^\d+$/.test(S.scope) ? +S.scope : ME, mine = tid === ME, t = TEAMS[tid], ids = t.players;
  const weeks = D.weeks.map((w, wi) => ({w, wi, rows:lineupWeek(ids, wi, mine)}));
  // the regular starters, on season rates: anyone else in a slot is filling in
  const usual = new Set(lineupOf(ids, mine).rows.filter(r => r.p).map(r => r.p.id));
  for(const pos of ["K", "DST"]){ const a = ids.map(id => P[id]).filter(p => p.pos === pos).sort((a, b) => b.adj - a.adj); a.slice(0, spots(pos)).forEach(p => usual.add(p.id)); }
  const oppOf = w => { if(mine && D.opps && D.opps[w]) return D.opps[w]; const g = ((D.sched || {})[w] || []).find(g => g.includes(tid)); return g ? (g[0] === tid ? g[1] : g[0]) : null; };
  const head = x => { const o = oppOf(x.w); return `<b>Wk ${x.w}</b><i>${o ? "vs " + esc(tName(o)) : x.w >= 15 ? "playoffs" : ""}</i>`; };
  const total = x => x.rows.reduce((s, r) => s + r.pts, 0);
  const sitting = x => { const inn = new Set(x.rows.filter(r => r.p).map(r => r.p.id));
    return [...usual].filter(id => !inn.has(id) && !(P[id].eff[x.wi] > 0)).map(id => { const p = P[id], g = p.wk[x.wi]; return {p, why:g.o === "BYE" ? "bye" : g.done ? "played" : "out"}; }); };
  const cell = (r, x, big) => {
    if(!r.p) return `<div class="lwc empty"><span class="lwn">Waiver pickup</span><span class="lwm">no ${r.slot === "FLEX" ? "flex" : r.slot} available · ${f1(r.pts)}</span></div>`;
    const p = r.p, g = p.wk[x.wi], fill = !usual.has(p.id);
    // a starter the waiver wire out-projects this week is worth knowing about
    const wire = SKILL.includes(p.pos) && r.slot !== "FLEX" ? REPL[p.pos] || 0 : 0, low = wire && r.pts < wire - 0.05;
    return `<div class="lwc${fill ? " fill" : ""}"${fill ? ' title="Filling in: not one of the regular starters"' : ""}>${img(p)}<span class="lwt"><span class="lwn" data-pid="${p.id}">${esc(big ? p.n : short(p))}</span><span class="lwm"><b${low ? ` class="low" title="Under the ${p.pos} waiver level this week (${f1(wire)}): a free agent projects better"` : ""}>${f1(r.pts)}</b> · ${r.slot === "FLEX" ? p.pos + " · " : ""}${g.o}${fill && big ? " · filling in" : ""}${low && big ? ` · <span class="low">wire ${f1(wire)}</span>` : ""}</span></span></div>`;
  };
  /* The bench that week, startable players only: playing (no bye, not out), not in the lineup,
     and worth a start - he projects at or above the waiver level at his position, or he is a
     regular starter who lost his slot that week, or he is the other kicker or defense. A bench
     player who projects under the wire isn't an option anyone would use, so he is left off. */
  for(const x of weeks){

    if(x.off.length) lead.push([`${x.off.map(o => short(P[o.id])).join(", ")} ${x.off.every(o => o.bye) ? "on bye" : "out"} wk ${x.w}, when I play ${ab}`, "g"]);
    else if(x.dThem <= -1) lead.push([`${ab} weaker wk ${x.w}, when I play them (${sgn(x.dThem)})`, "g"]);
    else if(x.dThem >= 1) lead.push([`${ab} stronger wk ${x.w}, when I play them (${sgn(x.dThem)})`, "r"]);
  }
  for(const id of pk.get){ const p = P[id], b = p.wk.find(w => w.o === "BYE"); if(b) lead.push([`${short(p)} bye wk ${b.w}`, "a"]); }
  for(const id of pk.get){ const p = P[id], l = p.sg && p.sg.E >= 0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, "b"); }
  for(const id of pk.give){ const p = P[id], l = p.sg && p.sg.E <= -0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, ""); }
  // price and timing, one note a player: who is bought low or sold high, and whether a week's
  // wait gets a better deal. Only players the league would start count as sold high.
  for(const id of pk.get){ const p = P[id], w = windowOf(p, "buy");
    if(w.k === "wait") lead.push([`${short(p)} cheaper after wk ${w.w}`, "a"]);
    else if(p.mk <= -MK) lead.push([`Buying ${short(p)} low`, "g"]); }
  for(const id of pk.give){ const p = P[id], w = windowOf(p, "sell");
    if(!p.okp) continue;
    if(w.k === "wait") lead.push([`${short(p)} sells for more after wk ${w.w}`, "a"]);
    else if(p.mk >= MK) lead.push([`Selling ${short(p)} high`, "g"]); }
  return lead.concat(out).slice(0, 7);
}

function listHtml(team, sel, dest){
  const mine = team.id === ME;
  // backs, receivers, tight ends, quarterbacks - and kickers and defenses, which can be traded by hand here but never
  // turn up in a suggested package (tradeable() keeps the search to the skill positions)
  const ps = team.players.map(id => P[id]).filter(p => SKILL.includes(p.pos) || p.pos === "K" || p.pos === "DST").sort((a,b) => ORDER[a.pos] - ORDER[b.pos] || rk(b, mine) - rk(a, mine));
  let out = "", last = "";
  for(const p of ps){
    if(p.pos !== last){ out += `<div class="grp">${p.pos === "DST" ? "DEF" : p.pos}</div>`; last = p.pos; }
    out += `<button class="row${sel.has(p.id) ? " sel" : ""}" data-id="${p.id}" aria-pressed="${sel.has(p.id)}">${img(p)}
      <span class="who"><span class="nm" data-pid="${p.id}">${esc(p.n)}</span><span class="meta">${hwTag(p)}<span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${roleBadge(p)}${nogoTag(p)}${dest && dest(p.id) ? `<span class="dest">${esc(dest(p.id))}</span>` : ""}${p.lens ? ptag(p, "reg", true) + ptag(p, "po", true) : ""}</span></span>
      <span class="n2"><span>${f1(p.ros)}</span><span>${f1(p.po)}</span></span></button>`;
  }
  return out;
}
// the legs of whatever is picked in the builder

  const C = +$("partnerA").value;

  return [{from:ME, to:C, ids:[...give], set:"give"}, ...(giveB.size ? [{from:ME, to:B, ids:[...giveB], set:"giveB"}] : []),
          {from:C, to:B, ids:[...via], set:"via"}, {from:B, to:ME, ids:[...get], set:"get"}];
}

  }

  $("deal").classList.toggle("open", S.dealOpen);

    <div class="dfull">${full}</div>`;

function openBuilder(legs){
  give.clear(); get.clear(); via.clear(); giveB.clear();
  const teams = [...new Set(legs.flatMap(l => [l.from, l.to]))].filter(t => t !== ME), three = teams.length > 1;
  setThree(three);
  if(three){
    // B is whoever sends to me; C is the other. My players go to C ("give") or straight to B ("giveB")
    const B = legs.find(l => l.to === ME).from, C = teams.find(t => t !== B);
    for(const l of legs){ const s = l.from === ME ? (l.to === C ? give : giveB) : l.from === C ? via : get; l.ids.forEach(id => s.add(id)); }
    $("partner").value = B; $("partnerA").value = C;
  } else {
    legs[0].ids.forEach(id => give.add(id)); legs[1].ids.forEach(id => get.add(id));
    $("partner").value = legs[0].to;
  }
  S.dealOpen = legs.every(l => l.ids.length);
  setSide((give.size || giveB.size) && !get.size ? "theirs" : "mine");
  renderBuilder(); show("builder");
}
const open2 = (teamId, g, r) => openBuilder([{from:ME, to:teamId, ids:g}, {from:teamId, to:ME, ids:r}]);

/* ---- waivers -------------------------------------------------------------------------------
   Every free agent is priced by what he would add to each team's lineup, byes and injuries
   counted, from today to week 17 (playoff weeks count 1.5x). What a team should pay is a share
   of the FAAB it has left, and that share climbs faster than the points do:
     share = min(70%, ((gain - 0.5) / 10)^1.5)    gain = lineup points a week he adds to that team
   The first half-point is free: a body to cover one bye can be found that week for $0-5. So +1 a
   week is about 1% of a budget, +2 about 6%, +3 about 12%, +5 about 30%, +8 or more 65-70%.
   The bid is what it takes to beat the rival who wants him most (their share of THEIR budget,
   plus $1), never more than he is worth to me. If that rival can outbid my ceiling, it says so. */
const share = g => Math.min(0.7, Math.pow(Math.max(0, g - 0.5) / 10, 1.5));
/* How long a pickup helps. Every remaining week is scored on its own: the points he adds to the
   lineup that week, against the lineup without him. A week counts as "useful" at +1 or more.
     Long-term   useful in at least 60% of the remaining weeks (a real lineup piece)
     Short-term  useful in 2 or more weeks, but not most of them (injury cover, a soft stretch)
     Fill-in     useful in one week only (a bye or a single injury)
   Value follows from that. A long-term pickup is worth his full gain. A short-term one is worth
   his gain times the share of the 60% he covers. A fill-in is worth nothing today unless his
   week is the next one: anyone can be picked up the week he's needed, usually for $0-5. */
const USEFUL = 1, LONG = 0.6;
function termOf(dw){
  const n = dw.length, use = dw.filter(x => x >= USEFUL).length;
  if(!n || !use) return {k:"none", use, persist:0};
  if(use >= Math.max(3, Math.ceil(LONG * n))) return {k:"long", use, persist:1};
  if(use >= 2) return {k:"short", use, persist:Math.min(1, use / (LONG * n))};
  return {k:"fill", use, persist:0, wk:D.weeks[dw.findIndex(x => x >= USEFUL)]};
}
/* How each team has bid this season, from every waiver claim ESPN recorded - the ones that won
   and the ones that lost to a higher bid (a losing bid still shows what they'd pay).
   Each bid is read as a share of the budget the team had at that moment, so $200 from a full
   $1,000 and $60 from the last $300 are the same appetite.
     rate    the average of a team's three biggest shares: how hard it goes when it wants someone
     f       that rate against the league's median, held between 0.6 and 1.6. A team at 1.4
             pays about 40% more for the same player than the model's price; one at 0.7, less
   The price is still a share of what the team has LEFT, so a big spender with little left can't
   repeat it - the habit scales the bid, the wallet caps it.
   (Budget-at-the-time ignores FAAB moved in trades, which ESPN doesn't date; shares cap at 1.) */
function buildHabits(){
  HAB = {};
  const F = D.faab;
  if(!F) return;
  const rem = {}, bids = {};
  for(const t of D.teams){ rem[t.id] = F.budget; bids[t.id] = []; }
  for(const b of F.hist || []){
    if(!(b.t in rem)) continue;
    bids[b.t].push(Object.assign({s:Math.min(1, b.a / Math.max(1, rem[b.t]))}, b));
    if(b.won) rem[b.t] = Math.max(0, rem[b.t] - b.a);
  }
  const rate = {};
  for(const t of D.teams){ const s = bids[t.id].map(x => x.s).sort((a,b) => b - a).slice(0, 3); rate[t.id] = s.length ? s.reduce((a,b) => a + b, 0) / s.length : null; }
  const known = Object.values(rate).filter(x => x != null).sort((a,b) => a - b);
  const med = known.length ? (known[(known.length - 1) >> 1] + known[known.length >> 1]) / 2 : 0;
  for(const t of D.teams){
    const b = bids[t.id], amts = b.map(x => x.a).sort((x,y) => x - y), won = b.filter(x => x.won);
    const f = rate[t.id] == null || !med ? 1 : Math.max(0.6, Math.min(1.6, rate[t.id] / med));
    HAB[t.id] = {f, rate:rate[t.id], n:b.length, won:won.length, lost:b.length - won.length,
      typ:amts.length ? amts[amts.length >> 1] : null, low:amts.length ? amts.filter(a => a <= 2 * (F.min || 1)).length / amts.length : 0,
      big:b.slice().sort((x,y) => y.a - x.a)[0] || null, top:b.slice().sort((x,y) => y.a - x.a).slice(0, 3),
      style:f >= 1.25 ? "big" : f <= 0.8 ? "thrifty" : "avg"};
  }
}
function buildWaivers(){
  buildHabits();
  for(const pos of SKILL){
    const all = Object.values(P).filter(p => p.pos === pos);
    for(const p of all) p.wrk2 = D.weeks.map(() => 0);
    D.weeks.forEach((w, i) => all.filter(p => p.eff[i] > 0).sort((a, b) => b.eff[i] - a.eff[i]).forEach((p, n) => (p.wrk2[i] = n + 1)));
  }
  WAIV = [];
  if(!D.faab) return;
  const W = D.weeks.length, wt = i => (PO.includes(i) ? 1.5 : 1), denom = (REG.length + 1.5 * PO.length) || 1;
  const left = D.faab.left || {}, min = D.faab.min || 1;
  // each team's lineup each week without help
  const base = {};
  for(const t of D.teams) base[t.id] = D.weeks.map((w, i) => lineup(t.players, i, false, t.id === ME));
  const mine = TEAMS[ME].players;
  const gainFor = (t, p) => {
    const ids = t.players.concat([p.id]), m = t.id === ME;
    const dw = D.weeks.map((w, i) => Math.max(0, lineup(ids, i, false, m) - base[t.id][i]));
    const raw = dw.reduce((s, x, i) => s + x * wt(i), 0) / denom, term = termOf(dw);
    // a fill-in only counts if he's needed this coming week, and only for that week
    const now = term.k === "fill" && term.wk === D.weeks[0] ? dw[0] * wt(0) / denom : 0;
    /* A kicker's or a defence's projected edge is far less dependable than a skill player's:
       this season only about a quarter of a kicker's edge over the average carried into his
       next game, and about two-thirds of a defence's (own form plus matchup). A bid is sized
       on the part that can be counted on, so nobody pays starter money for a kicker. */
    const kd = (D.kd || {})[p.pos], rel = SKILL.includes(p.pos) ? 1 : kd ? Math.min(1, p.pos === "K" ? kd.own : kd.own + kd.match) : 0.4;
    return {dw, raw, term, g:(term.k === "fill" ? now : raw * term.persist) * rel};
  };
  for(const p of Object.values(P)){
    if(p.t || !(p.base > 0)) continue;
    const by = {};
    for(const t of D.teams) by[t.id] = gainFor(t, p);
    const me = by[ME], g = me.g;
    const dMe = {reg:REG.length ? REG.reduce((s, i) => s + me.dw[i], 0) / REG.length : 0, po:PO.length ? PO.reduce((s, i) => s + me.dw[i], 0) / PO.length : 0};
    let rival = null, rv = 0, users = 0;
    for(const t of D.teams){
      if(t.id === ME) continue;
      if(by[t.id].term.k === "long") users++;
      // what the model says he's worth to them, scaled by how that team actually bids, capped by its wallet
      const w = Math.min(left[t.id] || 0, (left[t.id] || 0) * share(by[t.id].g) * ((HAB[t.id] || {}).f || 1));
      if(w > rv){ rv = w; rival = t.id; }
    }
    const cap = Math.floor((left[ME] || 0) * share(g));
    const need = Math.max(min, Math.round(rv) + 1);
    let bid = g < 0.5 ? 0 : Math.max(min, Math.min(cap, need));
    // a fill-in for this week: a dollar or two, never a real bid
    if(me.term.k === "fill" && me.term.wk === D.weeks[0] && me.dw[0] >= USEFUL) bid = Math.max(min, Math.min(3, cap || min));
    WAIV.push({p, g, raw:me.raw, term:me.term, st:SKILL.includes(p.pos) ? startTerm(p) : null, dw:me.dw, d:dMe, role:rolesOf(mine.concat([p.id]), true)[p.id], cap, bid, rival, rv:Math.round(rv), users,
      outbid:!!rival && need > cap && g >= 0.5 && me.term.k !== "fill"});
  }
  // who to cut for the best few: the player whose loss costs my lineup least once he is in
  WAIV.sort((a,b) => b.bid - a.bid || b.g - a.g);
  // never suggest cutting a starter call or a handcuff: both are holds I made on purpose
  const cut = mine.filter(id => SKILL.includes(P[id].pos) && !(roleOf(id) && (roleOf(id).r === "S" || roleOf(id).c)));
  for(const x of WAIV.filter((x, i) => i < 60 || !SKILL.includes(x.p.pos))){
    const withP = worth(mine.concat([x.p.id]), false, true);
    let best = null;
    // a kicker or defence comes in for my own kicker or defence
    for(const id of SKILL.includes(x.p.pos) ? cut : mine.filter(q => P[q].pos === x.p.pos)){
      const d = delta(withP, worth(mine.filter(q => q !== id).concat([x.p.id]), false, true));
      if(!best || d.score > best.d.score) best = {id, d};
    }
    x.drop = best;
  }
}

/* ---- player card -----------------------------------------------------------------------------
   Tap a player's name or photo anywhere and this opens: what he does for my team, his schedule
   week by week with the projection for each game, the totals, how the projection is built, his
   games so far, and the stats that matter at his position. */
let CARD = null;
function playerCard(id){
  const p = P[id];
  if(!p) return;
  CARD = id;
  const skill = SKILL.includes(p.pos), sum = idx => idx.reduce((s, i) => s + p.eff[i], 0);
  const games = idx => idx.filter(i => p.eff[i] > 0).length;
  const num = (v, lab, sub) => `<div class="pcn"><b>${v}</b><span>${lab}</span>${sub ? `<i>${sub}</i>` : ""}</div>`;
  const owner = p.t ? `${tlogo(p.t)}<span>${esc(p.t === ME ? "My team" : TEAMS[p.t].name)}</span>` : `<span>Free agent</span>`;
  // what he is to my team
  let lens = "";
  if(skill){
    const cell = (k, lab) => { const h = ptag(p, k); return h ? `<div class="pcl"><span class="lab">${lab}</span><div>${h}</div></div>` : ""; };
    lens = `<div class="pcls">${cell("reg", "Rest of season · wk " + wkSpan(REG))}${cell("po", "Playoffs · wk " + wkSpan(PO))}</div>`;
  }
  // schedule, one line a week
  const sched = D.weeks.map((w, i) => {
    const g = p.wk[i], bye = g.o === "BYE", played = !!g.done, out = !bye && !played && p.eff[i] === 0 && g.p > 0;
    return `<div class="pcw${w >= 15 ? " po" : ""}${bye || out || played ? " off" : ""}" style="${bye || out || played ? "" : rkBg(g.rk)}" title="${g.rk ? ord(g.rk) + " of 32 vs " + p.pos + " (32nd = softest)" : ""}"><span>Wk ${w}</span><b>${bye ? "BYE" : g.o}</b><i>${bye ? "–" : played ? "played" : out ? "out" : f1(p.eff[i])}</i></div>`;
  }).join("");
  // games so far
  let log = "";
  if(p.pl){
    const max = Math.max(30, ...p.pl.map(x => x || 0));
    log = `<div class="pch">Games so far</div><div class="pclog">${p.pl.map((x, i) => `<div class="pcb${x == null ? " none" : ""}"><em>${x == null ? "" : Math.round(x)}</em><i style="height:${x == null ? 2 : Math.max(3, Math.round(x / max * 56))}px"></i><span>${i + 1}</span></div>`).join("")}</div>`;
  }
  // stats for his position
  let stats = "";
  if(skill && p.g != null){
    const cx = k => { const c = COLS[k], t = cellText(c, p);
      return `<div class="dc"${t != null && c.tint ? ` style="${tint(p, k)}"` : ""}><span title="${esc(c.t || "")}">${c.h}</span><div class="${t != null && c.cl ? c.cl(c.v(p)) : ""}">${t == null ? "–" : t}</div></div>`; };
    stats = `<div class="pch">${p.pos} numbers <span>green = high for the position, red = low</span></div><div class="dg">${["ppg", ...statKeys(p.pos)].map(cx).join("")}</div>`;
  }
  const read = skill ? sigChips(p).map(c => `<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(" ") : "";
  // how the number is built
  const how = p.ep
    ? `<b>${f1(p.base)}</b> a game in the weeks he plays. These are <b>ESPN's projections</b>, week by week, in this league's scoring.${p.wk.some(w => w.z) ? " A week ESPN projects at zero counts as out unless I overrule it under My call." : ""}${skill && p.g != null ? ` For reference: his workload is worth ${f1(p.xfp)} expected points a game, and he has scored ${f1(p.ppg)} a game over ${plural(p.g, "game")}.` : p.g != null ? ` So far: ${f1(p.ppg)} a game.` : ""}`
    : skill && p.g != null
    ? `<b>${f1(p.base)}</b> a game when healthy = half his workload (${f1(p.xfp)} expected points from his carries and targets${p.pos === "QB" ? ", passes and runs" : ""}) and half what he has scored (${f1(p.ppg)} a game over ${plural(p.g, "game")})${p.xp ? ", lifted to his last three games because the analysts flagged him this week" : Math.abs(p.rs || 0) >= 0.05 ? `, leaning on his last three because his role moved ${p.rs > 0 ? "up" : "down"} ${Math.round(Math.abs(p.rs) * 100)}%` : ""}. Each week is that rate times the matchup (how many points the opponent gives up to ${p.pos}s, up to ±20%), zero on a bye, and nothing while he's out.`
    : (D.kd || {})[p.pos] && p.g != null
      ? `<b>${f1(p.base)}</b> a game on average. ${p.pos === "DST" ? "A defense's week is mostly its opponent" : "Kickers mostly regress to the average"}: each week starts at the league average (${f1(D.kd[p.pos].lg)}), adds ${Math.round(D.kd[p.pos].own * 100)}% of ${p.pos === "DST" ? "this unit's" : "his"} own edge (${f1(p.ppg)} a game so far), and ${p.pos === "DST" ? Math.round(D.kd[p.pos].match * 100) + "% of how far that opponent is above or below average in points given up to defenses" : D.kd[p.pos].match.toFixed(2) + " for every point his team is expected to score above average"}.`
      : `<b>${f1(p.base)}</b> a game: his season average.`;
  const wv = !p.t && skill ? WAIV.find(x => x.p.id === p.id) : null;
  // price against projection, and when to move
  let timing = "";
  if(skill && p.t){
    const side = sideOf(p), w = windowOf(p, side), mine = p.t === ME, hi = p.mk >= MK, lo = p.mk <= -MK;
    const call = hi ? (mine ? "Sell high" : "Priced high") : lo ? (mine ? "Priced low" : "Buy low") : "Fairly priced";
    const head = w.k === "wait" ? `${mine ? "Sell" : "Buy"} after wk ${w.w}.` : w.k === "now" ? `${mine ? "Sell" : "Buy"} now.` : "No rush either way.";
    const said = hi ? (mine ? "The league pays for what he has done, which is more than he projects: this is the time his price beats his value to me."
                            : "His team will want paying for what he has done, which is more than he projects.")
               : lo ? (mine ? "The league would pay less than he projects for: better kept than sold."
                            : "He has scored less than he projects for, so he costs less than he is worth to me.")
               : "The league's price and the projection agree.";
    timing = `<div class="pch">Trade timing <span>the league prices on what he has done; my lineup runs on what he will do</span></div>
    <div class="pcns">${num(f1(p.seen), "League sees", "a game: season and last three")}${num(f1(p.base), "Projects", "a game from here")}${num(`<span class="mkc ${hi ? (mine ? "up" : "down") : lo ? (mine ? "down" : "up") : ""}">${call}</span>`, hi || lo ? sgn(p.mk) + " a game" : "within " + MK, "price against projection")}</div>
    <div class="pchow pctm"><b>${head}</b> ${esc(w.why)} ${said}</div>`;
  }
  const act = p.t && p.t !== ME && kdPos(p) ? `<button class="b go" data-card-act="build">Build a deal for him</button>`
    : p.t && p.t !== ME && skill ? `<button class="b go" data-card-act="deal">Packages to get him</button><button class="b${NOGO[p.id] ? " on" : ""}" data-card-act="nogo" title="I know I can't get him: leave him out of targets and packages">${NOGO[p.id] ? "Ruled out · undo" : "Rule him out"}</button>`
    : p.t === ME && skill ? `<button class="b go" data-card-act="shop">Shop him</button>` : "";
  $("pcard").innerHTML = `<div class="mbox" role="dialog" aria-label="${esc(p.n)}">
    <button class="mclose" data-card-close aria-label="Close">×</button>
    <div class="pct">${img(p, "xl")}
      <div class="pcid"><h2>${esc(p.n)}</h2>
        <div class="meta"><span class="pos ${p.pos}">${p.pos === "DST" ? "DEF" : p.pos}</span>${hwTag(p)}<span>${p.tm}${p.prk ? ` · ${p.pos}${p.prk} in scoring` : ""}</span>${injBadge(p)}${roleBadge(p)}</div>
        <div class="own">${owner}</div></div></div>
    ${act ? `<div class="pcact">${act}</div>` : ""}
    ${lens}
    <div class="pcns">${skill ? num(sgn(p.base - (REPL[p.pos] || 0)), "Over replacement", `a game vs the ${p.pos} waiver wire (${f1(REPL[p.pos] || 0)})`) : ""}${REG.length ? num(f1(sum(REG)), "Rest of season", `${plural(games(REG), "game")} · ${f1(p.ros)} a game`) : ""}${PO.length ? num(f1(sum(PO)), "Playoffs", `${plural(games(PO), "game")} · ${f1(p.po)} a game`) : ""}${p.g != null ? num(f1(p.ppg), "Scored so far", `a game, ${plural(p.g, "game")}`) : ""}</div>
    ${timing}
    ${wv ? `<div class="pcwv">Waivers: ${wv.bid ? `bid <b>$${wv.bid}</b>` : "no bid"} · ${termPill(wv).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}</div>` : ""}
    <div class="pch">Schedule and projection <span>opponent shaded by how soft it is on ${p.pos === "DST" ? "defences" : p.pos + "s"}; playoff weeks outlined</span></div>
    <div class="pcsched">${sched}</div>
    <div class="pch">My call <span>his status week by week, and where he plays for me</span></div><div class="pcctl">${stSel(p)}${roleSel(p)}</div>
    ${rangeForm(p)}
    <div class="pchow">${how}</div>
    ${read ? `<div class="pch">The read</div><div class="chips">${read}</div>` : ""}
    ${log}${stats}
  </div>`;
  $("pcard").hidden = false;
  $("pcard").scrollTop = 0;
}
