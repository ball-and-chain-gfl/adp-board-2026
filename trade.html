<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Analyzer &mdash; The Bryan Football Team</title>
<!-- Hand-written page, NOT generated by build.py. Data comes from /api/trade (read-only). -->
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#11161d;--line:#2a3340;--txt:#f0f4f8;--dim:#9ba8b6;--soft:#c5cfda;--blue:#2f81f7;
  --good:#4cc77f;--bad:#f0736a;--warn:#e6b450;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{padding:11px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);z-index:30;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.bar h1{margin:0;font-size:18px;letter-spacing:.2px}
.bar .rec{color:var(--dim);font-size:13.5px;font-weight:700}
.bar .dl{margin-left:auto;color:var(--dim);font-size:12.5px}
.bar .dl b{color:var(--txt)}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
.tab{padding:9px 16px 8px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;position:relative;top:1px;text-decoration:none}
.tab.on{background:var(--bg);color:var(--txt)}
a.tab{background:#0b0f14;color:var(--dim)}
a.tab:hover{color:var(--txt)}

/* section switch */
.sub{display:flex;gap:8px;padding:12px 20px 0;flex:none}
.sub button{font-size:14px;font-weight:700;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:#0b0f14;color:var(--dim);cursor:pointer;white-space:nowrap}
.sub button:hover{color:var(--txt)}
.sub button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sub button span{font-weight:600;opacity:.8;margin-left:4px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 16px;overflow-y:auto}
#msg{color:var(--dim);padding:40px 0;text-align:center;font-size:15px}

/* shared bits */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px;flex:none}
.view > .tools:first-child{margin-top:0}
select,input[type=search]{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13.5px}
select{cursor:pointer}
option,optgroup{background:#0b0f14;color:var(--txt)}
input[type=search]{width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:#0b0f14;border:0;border-right:1px solid var(--line);color:var(--dim);padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:#223a5e;color:#fff}
button.b{background:#0b0f14;border:1px solid var(--line);color:var(--soft);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
button.b:hover{color:var(--txt);border-color:#4a5d7a}
button.b.go{background:#17294a;border-color:#2a5590;color:#cfe0ff}
.count{color:var(--dim);font-size:12.5px;margin-left:auto}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:#0b0f14;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.d img{object-fit:contain;padding:3px}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta > *{white-space:nowrap}
.pos{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.QB{background:#43235a;color:#e2b8fb}.RB{background:#134030;color:#86e2ae}.WR{background:#15365f;color:#a3c9fb}
.TE{background:#553a13;color:#f7c57c}.K,.DST{background:#2d3440;color:#b7c0cc}
.inj{font-size:10.5px;font-weight:800;color:#fff;background:#b93a32;border-radius:4px;padding:0 5px;white-space:nowrap}
.inj.Q{background:#96741f}
.inj.man{background:#1f5fbf}
.num{font-variant-numeric:tabular-nums}
.pos-n{color:var(--good)}.neg-n{color:var(--bad)}.dimn{color:#6f7b88}
.own{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--soft)}
.own.fa{color:#6f7b88}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tag.core{background:#15365f;border-color:#2a5590;color:#a3c9fb}
.tag.sell{background:#4a1f1c;border-color:#7a332d;color:#ffa59c}
.tag.buy,.tag.up{background:#12382a;border-color:#22604a;color:#7fe0aa}
.tag.down{background:#3b2f14;border-color:#6b5420;color:var(--warn)}
.need{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#232c38;color:var(--soft);white-space:nowrap}
.need.g{background:#12382a;color:#7fe0aa}.need.r{background:#4a1f1c;color:#ffa59c}
.needs{display:flex;flex-wrap:wrap;gap:5px}
.gain{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:4px 9px;text-align:center;line-height:1.15;flex:none}
.gain b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.gain span{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gains{display:flex;gap:8px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#0b0f14;border:1px solid var(--line);color:var(--soft)}
.chip.g{border-color:#22604a;color:#7fe0aa}.chip.b{border-color:#2a5590;color:#a3c9fb}
.wkc{display:inline-flex;flex-direction:column;align-items:center;min-width:54px;padding:4px 6px;border-radius:7px;line-height:1.2;flex:none}
.wkc em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
.wkc b{font-size:12px;font-weight:700}
.wkc i{font-style:normal;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.wkc.bye b,.wkc.out b{color:#66717e}
.wkc.out i{color:var(--bad);font-weight:800;font-size:10.5px}
select.st{padding:5px 6px;font-size:12.5px;font-weight:700;border-radius:7px;color:var(--soft);max-width:130px}
select.st.Q{border-color:#96741f;color:var(--warn)}
select.st.D,select.st.O,select.st.IR,select.st.SUS{border-color:#8f2f29;color:#ffa59c}
select.st.man{border-color:var(--blue);background:#12233d;color:#a3c9fb}
.lab{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}

/* targets */
.market{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;flex:none}
.mk{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--dim);white-space:nowrap}
.mk b{color:var(--txt)}
.tgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px;align-content:start}
.tg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tg .top{display:flex;gap:10px;align-items:center;min-width:0}
.tg .top .who{flex:1;min-width:0}
.tg .nm{font-size:15px}
.rkline{display:flex;flex-wrap:wrap;gap:6px}
.rkc{font-size:12px;font-weight:700;background:var(--panel2);border-radius:7px;padding:3px 9px;color:var(--soft)}
.rkc b{color:var(--txt)}
.sig{display:flex;flex-direction:column;gap:6px}
.sg{display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.3}
.sg i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--good);position:relative;top:-1px}
.sg.r i{background:var(--bad)}.sg.a i{background:var(--warn)}
.ahead{display:flex;gap:4px;flex-wrap:wrap}
.mini{font-size:10.5px;font-weight:700;padding:3px 5px;border-radius:5px;min-width:38px;text-align:center}
.tg .foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:auto}
.nums{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.nums b{color:var(--txt);font-size:15px;margin-left:4px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px}

/* roster need tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;border-top:3px solid #3a4658;min-width:0}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tile .k em{font-style:normal;font-size:10.5px;letter-spacing:.5px;padding:1px 7px;border-radius:999px;background:#232c38;color:var(--soft)}
.tile.g .k em{background:#12382a;color:#7fe0aa}.tile.r .k em{background:#4a1f1c;color:#ffa59c}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
.strip{display:flex;gap:3px;margin:6px 0 7px}
.strip i{flex:1;height:5px;border-radius:3px;background:#27303c}
.strip i.me{background:var(--txt)}
.tile.g .strip i.me{background:var(--good)}.tile.r .strip i.me{background:var(--bad)}
.tile .s{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s b{font-weight:700;color:var(--soft)}
.tile .s2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* player table (wide screens) */
.scroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:#10151c;position:sticky;top:0;z-index:3;padding:9px 10px;user-select:none}
th.sort{cursor:pointer}
th.sort:hover{color:var(--txt)}
th.on{color:#fff}
th .ar{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}
th.l,td.l{text-align:left;position:sticky;left:0;z-index:2;background:var(--panel)}
th.l{z-index:4;background:#10151c}
th.po{color:#9dc4ff}
th.c,td.c{text-align:center}
.sep{border-left:1px solid var(--line)}
tbody tr:hover td{background:#1a212b}
tr.me td.l{box-shadow:inset 3px 0 0 var(--blue)}
.ply{display:flex;align-items:center;gap:10px;min-width:0}
.spk{display:block;margin-left:auto}
td.wk{padding:5px 4px;text-align:center}

/* player cards (phones) */
.cards{display:none}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.pc.me{box-shadow:inset 3px 0 0 var(--blue)}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-top .who{flex:1;min-width:0}
.pc-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}
.cx{background:var(--panel2);border-radius:7px;padding:5px 2px 6px;text-align:center;min-width:0}
.cx span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.3px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.cx b{font-size:15px;font-variant-numeric:tabular-nums}
.pc-wk{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.pc-wk::-webkit-scrollbar{display:none}
.pc-wk .wkc{min-width:50px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.pc-foot .spk{margin:0}
.pc-x{display:none;margin-top:8px}
.pc.open .pc-x{display:grid}

/* packages */
.pkscroll{flex:1 0 auto;height:0;min-height:min(460px,70vh);overflow:auto}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;align-content:start}
.grp-h{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:15px;font-weight:800;margin-top:8px}
.grp-h:first-child{margin-top:0}
.grp-h > span{font-size:12.5px;font-weight:600;color:var(--dim)}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;text-align:left;color:var(--txt);width:100%;min-width:0;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pk:hover{border-color:#4a5d7a}
.pk .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pk .tm{font-weight:800;font-size:14.5px;min-width:0}
.pk .tm > div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .tm > div span{color:var(--dim);font-weight:600;font-size:12.5px;margin-left:6px}
.will{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-top:3px}
.will.likely{background:#12382a;color:#7fe0aa}.will.maybe{background:#3b2f14;color:var(--warn)}
.pk .sides{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:8px;margin-top:11px;align-items:center}
.pk .arrow{color:var(--dim);font-size:18px;text-align:center}
.pk .side{min-width:0;background:var(--panel2);border-radius:8px;padding:7px 9px 8px}
.pk .side .h{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.pill{display:flex;align-items:center;gap:7px;margin-top:6px;min-width:0}
.pill .av{width:28px;height:28px;flex-basis:28px}
.pill .nm{font-size:13px;min-width:0}
.pill .x{margin-left:auto;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;padding-left:4px}
.pk .chips{margin-top:10px}
.pk .them{margin-top:9px;font-size:12.5px;color:var(--dim)}
.pk .them b{color:var(--soft);font-weight:700}

/* builder: my players | the deal | their players, each scrolling on its own */
.bseg{display:none;margin-bottom:10px;flex:none}
.bgrid{flex:1 0 auto;height:0;min-height:min(520px,78vh);display:grid;grid-template-columns:minmax(270px,360px) minmax(300px,540px) minmax(270px,360px);gap:12px;justify-content:center}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{padding:9px 10px;background:#10151c;border-bottom:1px solid var(--line);flex:none}
.ph .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b.h{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.ph select{flex:1;min-width:0;padding:6px 8px;font-weight:700}
.ph .cap{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);white-space:nowrap}
.ph .needs{margin-top:7px}
.plist{flex:1;min-height:0;overflow:auto}
.grp{padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--dim);background:#131920;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;color:var(--txt);text-align:left}
.row:hover{background:#1a212b}
.row.sel{background:#17294a;box-shadow:inset 3px 0 0 var(--blue)}
.row .av{width:30px;height:30px;flex-basis:30px}
.row .who{min-width:0;flex:1}
.row .nm{font-size:13.5px;display:block}
.row .meta{gap:3px 6px;margin-top:1px}
.row .tag{font-size:9.5px;padding:1px 6px}
.row .n2{display:flex;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;flex:none}
.row .n2 span{width:42px;text-align:right}
.row .n2 span + span{color:#9dc4ff}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;min-height:0;container-type:inline-size}
@container (max-width:330px){ .dsides,.dgrid{grid-template-columns:1fr} }
.dsum{display:none}
.dsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--panel2);border-radius:8px;padding:8px 10px 10px;min-height:74px;min-width:0}
.dchips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.dchip{display:flex;align-items:center;gap:7px;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;min-width:0;color:var(--txt);text-align:left}
.dchip:hover{border-color:#7a332d}
.dchip .nm{font-size:13.5px;flex:1;min-width:0}
.dchip .x{color:var(--dim);font-weight:800;font-size:14px}
.dempty{color:var(--dim);text-align:center;padding:26px 0 18px;font-size:14px}
.call{font-size:22px;font-weight:800;margin:14px 0 10px;letter-spacing:-.2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dcard{background:var(--panel2);border-radius:8px;padding:9px 11px 10px;min-width:0}
.dcard .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnum{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.dnum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.dnum span{font-size:12.5px;color:var(--dim);white-space:nowrap}
.deal .sig{margin:7px 0 14px}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rk{font-size:12.5px;font-weight:700;background:var(--panel2);border-radius:7px;padding:4px 9px;white-space:nowrap}
.rk i{font-style:normal;color:var(--dim);font-weight:600;margin:0 3px}
.vbar{height:8px;border-radius:4px;background:#3d5a80;overflow:hidden;margin-top:7px;display:flex}
.vbar i{background:var(--warn)}
.vlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.vlab b{color:var(--txt)}
.dfoot{margin-top:14px;display:flex;justify-content:flex-end}

@media (max-width:1100px){
  .tiles{gap:8px}
  .tile{padding:9px 10px 10px}
  .tile .k{letter-spacing:.3px}
  .bgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)}
}

/* ---- phones ------------------------------------------------------------------------------
   One thumb, no sideways scrolling: sections move to a bar along the bottom, the stat table
   becomes a card per player, and the builder keeps the deal pinned under the roster list. */
@media (max-width:820px){
  header{padding:8px 12px 0}
  .bar{gap:2px 10px}
  .bar h1{font-size:16px}
  .bar .dl{font-size:11.5px}
  .tabs{margin-top:7px}
  .tab{padding:6px 12px 5px;font-size:12px}
  .sub{order:3;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:5px;border-top:1px solid var(--line);background:var(--panel)}
  .sub button{flex:1;padding:10px 2px;font-size:13px;border-radius:10px;min-width:0}
  .sub button span{display:none}
  .view{padding:10px 10px 14px}
  .tools{gap:6px;margin:10px 0 8px}
  .tools select{flex:1 1 40%;min-width:0}
  .tools .seg{max-width:100%;overflow-x:auto}
  .tools .seg button{padding:9px 13px}
  input[type=search]{flex:1 1 100%;width:auto}
  .count{flex:1 1 100%;margin:0;text-align:right}
  .market{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .market::-webkit-scrollbar{display:none}
  .tgs,.pks{grid-template-columns:minmax(0,1fr);gap:10px}
  .tg{padding:12px}
  .tg .top{flex-wrap:wrap}
  .tg .gains{flex:1 1 100%}
  .tg .gain{flex:1}
  #tgcount{display:none}
  .acts{flex:1 1 100%}

<script>
let D, P, ME, TEAMS = {}, REG = [], PO = [], ALLW = [], COLS = {}, PCT = {}, ALLPK = [], FORPK = [], pkTimer;
// league view, rebuilt whenever availability changes
let REPL = {}, START = {}, XSTART = {}, RANK = {}, BASE = {}, DEPTH = {}, ROLE0 = {}, W0 = {}, BUYS = [], SELLS = [];
const SKILL = ["QB","RB","WR","TE"], ORDER = {QB:0,RB:1,WR:2,TE:3,K:4,DST:5}, VIEWS = ["targets","roster","packages","builder"];
const S = {view:"targets", tgMode:"buy", tgPos:"ALL", tgSrc:"", tgSort:"best",
           scope:"me", pos:"ALL", cols:"overview", q:"", sort:null, dir:-1, limit:40,
           pkTeam:"", pkPos:"", pkSort:"gain", pkQ:"", pkFor:null, dealOpen:false};
const give = new Set(), get = new Set(), OPEN = new Set();
const MQ = window.matchMedia("(max-width:820px)");
// my own injury calls, kept in this browser: { playerId: {t:"H"} | {t:"O", thru: week} }
let OV = {};
try { OV = JSON.parse(localStorage.getItem("trade.ov") || "{}") || {}; } catch(e){}
const saveOV = () => { try { localStorage.setItem("trade.ov", JSON.stringify(OV)); } catch(e){} };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = x => (x == null ? "–" : x.toFixed(1));
const f2 = x => (x == null ? "–" : x.toFixed(2));
const pct = x => (x == null ? "–" : Math.round(x * 100) + "%");
const sgn = (x, d = 1) => (x > 0.049 ? "+" : x < -0.049 ? "−" : "") + Math.abs(x).toFixed(d);
const cls = x => (x > 0.05 ? "pos-n" : x < -0.05 ? "neg-n" : "dimn");
const ord = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
const avg = (arr, idx) => idx.length ? idx.reduce((s,i) => s + arr[i], 0) / idx.length : 0;
const short = p => p.pos === "DST" ? p.n : (p.n.replace(/ (Jr\.?|Sr\.?|II|III|IV|V)$/, "").split(" ").slice(1).join(" ") || p.n);
const initial = p => (p.pos === "DST" || !p.n.includes(" ") ? p.n : p.n[0] + ". " + short(p));
const ownAb = p => (p.t ? (TEAMS[p.t].abbrev || "T" + p.t) : "FA");
const wkSpan = idx => idx.length ? (idx.length > 1 ? `${D.weeks[idx[0]]}–${D.weeks[idx[idx.length-1]]}` : `${D.weeks[idx[0]]}`) : "";
const spots = pos => D.slots[pos] || 0;
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

function img(p){
  const src = p.pos === "DST" ? `https://a.espncdn.com/i/teamlogos/nfl/500/${p.tm.toLowerCase()}.png`
    : p.sid ? `https://sleepercdn.com/content/nfl/players/thumb/${p.sid}.jpg`
    : `https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png`;
  return `<span class="av${p.pos === "DST" ? " d" : ""}"><img src="${src}" alt="" loading="lazy" onerror="this.style.display='none'"></span>`;

// opponent colour: ESPN convention, 1 = stingiest defence (red), 32 = softest (green)
function rkBg(rk){
  if(rk == null) return "background:#1f2732";
  if(rk <= 10) return `background:rgba(214,58,49,${(0.16 + (11 - rk) * 0.05).toFixed(2)})`;
  if(rk >= 23) return `background:rgba(24,165,88,${(0.16 + (rk - 22) * 0.05).toFixed(2)})`;
  return "background:#1f2732";
}
const avgRk = (p, idx) => { const r = idx.map(i => p.wk[i].rk).filter(x => x != null); return r.length ? r.reduce((a,b) => a + b, 0) / r.length : null; };

/* ---- lineup maths ---------------------------------------------------------------------
   A roster's worth is what its best legal lineup scores each remaining week, so byes,
   injuries and depth are all priced in: a bench player only counts in weeks he would start.
   With `floor` on, every starting spot is worth at least what the waiver wire offers at
   that position - nobody actually starts an empty slot - so a trade is measured against
   the free alternative, not against zero. */
function lineup(ids, wi, floor){
  const by = {QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  for(const id of ids){ const p = P[id]; by[p.pos].push(p.eff[wi]); }
  if(floor) for(const pos of SKILL) for(let i = 0; i < spots(pos); i++) by[pos].push(REPL[pos]);
  let tot = 0; const flex = [];
  for(const pos in by){
    const a = by[pos].sort((x,y) => y - x), n = spots(pos);
    for(let i = 0; i < a.length; i++){
      if(i < n) tot += a[i];
      else if(pos === "RB" || pos === "WR" || pos === "TE") flex.push(a[i]);
    }
  }
  flex.sort((x,y) => y - x);
  for(let i = 0; i < spots("FLEX") && i < flex.length; i++) tot += flex[i];
  return tot;
}
function worth(ids, floor = true){
  let reg = 0, po = 0;
  for(const wi of REG) reg += lineup(ids, wi, floor);
  for(const wi of PO) po += lineup(ids, wi, floor);
  return {reg, po};
}
const swap = (ids, out, inn) => ids.filter(id => !out.has(id)).concat([...inn]);
function delta(before, after){
  return { reg: REG.length ? (after.reg - before.reg) / REG.length : 0,
           po: PO.length ? (after.po - before.po) / PO.length : 0,
           score: (after.reg - before.reg) + 1.5 * (after.po - before.po) };
}
// where every team's starters rank at each position; `over` swaps in hypothetical rosters
function posRanks(over){
  const out = {};
  for(const pos of SKILL){
    const n = spots(pos) || 1;
    D.teams.map(t => {
      const ids = (over && over[t.id]) || t.players;
      const a = ids.map(id => P[id]).filter(p => p.pos === pos).map(p => p.adj).sort((x,y) => y - x).slice(0, n);
      return {id:t.id, v:a.reduce((s,x) => s + x, 0)};
    }).sort((a,b) => b.v - a.v).forEach((x, i) => ((out[x.id] = out[x.id] || {})[pos] = i + 1));
  }
  return out;
}
// how many startable players a roster holds at each position
function depthOf(ids){
  const d = {QB:0,RB:0,WR:0,TE:0};
  for(const id of ids){ const p = P[id]; if(p.ok) d[p.pos]++; }
  return d;
}
// what each player is to his team: S starter, F flex, B bench
function rolesOf(ids){
  const out = {}, spill = [];
  for(const pos of SKILL){
    ids.map(id => P[id]).filter(p => p.pos === pos).sort((a,b) => b.adj - a.adj).forEach((p, i) => {
      if(i < spots(pos)) out[p.id] = "S";
      else { out[p.id] = "B"; if(pos !== "QB") spill.push(p); }
    });
  }
  spill.sort((a,b) => b.adj - a.adj).slice(0, spots("FLEX")).forEach(p => (out[p.id] = "F"));
  return out;
}
/* Trade value is points over what the waiver wire gives you at the SAME position, so scarcity
   is built in: where free agents are thin (running back, usually) a starter is worth more than
   an equal scorer at a position you can replace for free. Cut for time he will miss. */
const val = p => (Math.max(0, p.base - (REPL[p.pos] || 0)) + 1) * (0.35 + 0.65 * p.af);

/* ---- availability + the league view -------------------------------------------------------
   The feed sends a HEALTHY projection per week. This applies ESPN's status, or my own call
   when I have made one, then rebuilds everything that depends on it. */
function recompute(){
  for(const p of Object.values(P)){
    const o = OV[p.id]; let tot = 0, raw = 0;
    p.eff = p.wk.map((w, i) => {
      if(w.o === "BYE") return 0;
      let a = 1;
      if(o){ if(o.t === "O" && w.w <= o.thru) a = 0; }
      else if(p.inj === "O" || p.inj === "IR" || p.inj === "SUS") a = i < 2 ? 0 : 0.85;
      else if(p.inj === "D") a = i === 0 ? 0.25 : 1;
      else if(p.inj === "Q") a = i === 0 ? 0.8 : 1;
      raw += w.p; tot += w.p * a;
      return w.p * a;
    });
    p.af = raw ? tot / raw : 1;          // share of his remaining value he is actually there for
    p.adj = p.base * p.af;
    p.ros = avg(p.eff, REG); p.po = avg(p.eff, PO);
  }
  // who is a starter league-wide: the top players at each position for every starting spot in
  // the league, with the flex spots going to the best of whoever is left
  const nT = D.teams.length, pools = {}, N = {}, left = [];
  for(const pos of SKILL){
    pools[pos] = Object.values(P).filter(p => p.pos === pos).sort((a,b) => b.adj - a.adj);
    N[pos] = nT * spots(pos);
    if(pos !== "QB") left.push(...pools[pos].slice(N[pos]));
  }
  left.sort((a,b) => b.adj - a.adj).slice(0, nT * spots("FLEX")).forEach(p => N[p.pos]++);
  for(const pos of SKILL){
    const a = pools[pos];
    START[pos] = (a[Math.min(a.length, N[pos]) - 1] || {adj:0}).adj;      // the last starter in the league
    const fa = a.filter(p => !p.t).slice(1, 4);                            // 2nd-4th best free agents: the best one goes fast
    REPL[pos] = fa.length ? fa.reduce((s,p) => s + p.adj, 0) / fa.length : START[pos] * 0.75;
    const byX = a.filter(p => p.g >= (D.minG || 3)).sort((x,y) => y.xfp - x.xfp);
    XSTART[pos] = (byX[Math.min(byX.length, N[pos]) - 1] || {xfp:0}).xfp;  // a starter's workload
    RANK[pos] = a.filter(p => p.t).map(p => p.id);
  }
  for(const p of Object.values(P)) p.ok = SKILL.includes(p.pos) && p.adj >= 0.93 * START[p.pos];
  ROLE0 = {};
  for(const t of D.teams){ DEPTH[t.id] = depthOf(t.players); Object.assign(ROLE0, rolesOf(t.players)); W0[t.id] = worth(t.players); }
  BASE = posRanks();
  for(const p of Object.values(P)) p.sg = signals(p);
  buildTargets();
}

/* ---- the read on a player: is the box score ahead of, or behind, what he is being given? ----
   owed   workload says more than he has scored (xFP - PPG)
   tdl    the part of that gap that is touchdowns: expected from his carries and targets vs scored.
          Touchdown luck evens out, so it counts most
   eff    the rest of the gap, yardage efficiency: part luck, part the player
   grow   his role over the last three games against the season
   sched  how soft the defences ahead are next to the ones he has already played
   E      what all of it is worth, in points a game against what he has been scoring */
function signals(p){
  if(p.g == null || !p.l3 || p.g < (D.minG || 3) || !SKILL.includes(p.pos)) return null;
  const s = {};
  s.owed = p.xfp - p.ppg;
  s.tdl = p.xtd != null ? (p.xtd - p.td) / p.g * 6 : 0;
  s.eff = s.owed - s.tdl;
  s.grow = p.g >= 4 ? p.l3.xfp - p.xfp : 0;
  s.cold = p.g >= 4 ? p.l3.xfp - p.l3.ppg : 0;
  s.ahead = avgRk(p, ALLW);
  s.sched = s.ahead != null && p.fsos != null ? s.ahead - p.fsos : 0;
  s.po = avgRk(p, PO);
  s.E = 0.75 * s.tdl + 0.35 * s.eff + 0.6 * s.grow + Math.max(-1.5, Math.min(1.5, p.base * 0.004 * s.sched));
  return s;
}
function pq(p, k){
  const a = (PCT[p.pos] || {})[k], v = p[k];
  if(!a || a.length < 8 || v == null) return 0;
  let lo = 0, hi = a.length;
  while(lo < hi){ const m = (lo + hi) >> 1; a[m] <= v ? (lo = m + 1) : (hi = m); }
  return lo / a.length;
}
function roleLine(p, dir){
  const c = [["Snaps", p.snap, p.l3.snap], ["Targets", p.ts, p.l3.ts], ["Carries", p.cs, p.l3.cs]]
    .filter(x => x[1] != null && x[2] != null && Math.max(x[1], x[2]) >= 0.08)
    .map(x => [x[0], x[1], x[2], (x[2] - x[1]) * dir]).sort((a,b) => b[3] - a[3])[0];
  if(c && c[3] >= 0.04) return `${c[0]} ${pct(c[1])} → ${pct(c[2])} over the last three`;
  return `Workload ${dir > 0 ? "up" : "down"} ${Math.abs(p.l3.xfp - p.xfp).toFixed(1)} a game over the last three`;
}
function buyLines(p){
  const s = p.sg, L = [];
  if(!s) return [];
  if(s.tdl >= 0.8) L.push([s.tdl * 0.75 + 1, `${plural(p.td, "TD")} on ${f1(p.xtd)} expected from his workload`]);
  if(s.owed >= 1.5) L.push([s.owed * 0.35 + 0.5, `Workload is worth ${f1(p.xfp)} a game, he has scored ${f1(p.ppg)}`]);
  if(s.grow >= 1.5) L.push([s.grow * 0.6 + 0.5, roleLine(p, 1)]);
  if(p.g >= 4 && s.cold >= 3 && p.l3.ppg <= p.ppg - 1.5) L.push([1, `Cold streak: ${f1(p.l3.ppg)} a game on ${f1(p.l3.xfp)} of workload the last three`]);
  if(s.sched >= 4) L.push([0.9, `Softer defences ahead: ${Math.round(p.fsos)} → ${Math.round(s.ahead)} of 32`]);
  if(PO.length && s.po != null && s.po >= 21) L.push([0.8, `Soft playoff slate: ${PO.map(i => p.wk[i].o).join(", ")}`]);
  if(p.pos === "RB"){
    if(pq(p, "yaco") >= 0.8) L.push([0.7, `${f1(p.yaco)} yards after contact a carry, top fifth of backs`]);
    else if(pq(p, "bt") >= 0.8) L.push([0.7, `Breaks a tackle on ${pct(p.bt)} of carries, top fifth of backs`]);
  } else if(p.pos !== "QB"){
    if(pq(p, "tps") >= 0.8) L.push([0.7, `Targeted on ${pct(p.tps)} of his snaps, top fifth at ${p.pos}`]);
    else if(pq(p, "wopr") >= 0.85) L.push([0.7, `WOPR ${f2(p.wopr)}, top 15% at ${p.pos}`]);
  }
  return L.sort((a,b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
}
function sellLines(p){
  const s = p.sg, L = [];
  if(!s) return [];
  if(s.tdl <= -0.8) L.push([-s.tdl * 0.75 + 1, `${plural(p.td, "TD")} on ${f1(p.xtd)} expected from his workload`]);
  if(s.owed <= -2) L.push([-s.owed * 0.35 + 0.5, `Scoring ${f1(p.ppg)} a game on a workload worth ${f1(p.xfp)}`]);
  if(s.grow <= -1.5) L.push([-s.grow * 0.6 + 0.5, roleLine(p, -1)]);
  if(s.sched <= -4) L.push([0.9, `Tougher defences ahead: ${Math.round(p.fsos)} → ${Math.round(s.ahead)} of 32`]);
  if(PO.length && s.po != null && s.po <= 11) L.push([0.8, `Tough playoff slate: ${PO.map(i => p.wk[i].o).join(", ")}`]);
  return L.sort((a,b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
}
// the same read, cut down to a few words for a chip
function tagLine(p){
  const s = p.sg;
  if(!s) return "";
  if(s.E >= 0.8){
    if(s.tdl >= 0.8) return `${(p.xtd - p.td).toFixed(1)} TDs owed`;
    if(s.owed >= 1.5) return `${f1(p.xfp)} workload, ${f1(p.ppg)} scored`;
    if(s.grow >= 1.5) return `role up ${sgn(s.grow)}`;
    if(s.sched >= 4) return "softer schedule ahead";
  } else if(s.E <= -0.8){
    if(s.tdl <= -0.8) return `${(p.td - p.xtd).toFixed(1)} TDs over expected`;
    if(s.owed <= -2) return `${f1(p.ppg)} scored on ${f1(p.xfp)} workload`;
    if(s.grow <= -1.5) return `role down ${sgn(s.grow)}`;
    if(s.sched <= -4) return "tougher schedule ahead";
  }
  return "";
}
function buildTargets(){
  const mine = TEAMS[ME].players, w0 = worth(mine, false), denom = (REG.length + 1.5 * PO.length) || 1;
  BUYS = []; SELLS = [];
  for(const p of Object.values(P)){
    if(!p.sg) continue;
    if(p.t === ME){
      if(-p.sg.E >= 0.8 && p.base >= REPL[p.pos]) SELLS.push({p, E:-p.sg.E, fit:0, score:-p.sg.E});
      continue;
    }
    if(p.af < 0.5) continue;
    // what he would add to my lineup as it stands today, in points a week
    const fit = delta(w0, worth(mine.concat([p.id]), false)).score / denom;
    const buyLow = p.sg.E >= 0.8 && (p.xfp + p.l3.xfp) / 2 >= 0.9 * XSTART[p.pos];   // a starter's workload, a lesser box score
    const role = rolesOf(mine.concat([p.id]))[p.id];
    const freeUp = !p.t && fit >= 1 && role !== "B";                                    // free, and he starts for me
    const E = Math.max(0, p.sg.E);
    if(buyLow || freeUp) BUYS.push({p, E:p.sg.E, fit, buyLow, freeUp, score:E * (0.6 + 0.4 * Math.min(1, fit / 2)) + 0.3 * fit + (freeUp ? 1 : 0)});
  }
}

function verdictTag(p){
  if(p.g == null) return "";
  const mine = p.t === ME, rankAt = (RANK[p.pos] || []).indexOf(p.id) + 1, coreN = {QB:6,RB:12,WR:12,TE:5}[p.pos];
  const E = p.sg ? p.sg.E : 0;
  if(mine && E <= -1.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag sell">Sell high</span>`;
  if(!mine && E >= 1.5 && p.base >= (REPL[p.pos] || 0)) return `<span class="tag buy">Buy low</span>`;
  if(p.tr >= 2) return `<span class="tag up">Rising</span>`;
  if(p.tr <= -2) return `<span class="tag down">Fading</span>`;
  if(rankAt && rankAt <= coreN) return `<span class="tag core">Core</span>`;
  return `<span class="tag">Hold</span>`;
}
function injBadge(p){
  const o = OV[p.id], last = D.weeks[D.weeks.length - 1];
  if(o) return o.t === "O" ? `<span class="inj man">OUT${o.thru >= last ? "" : o.thru === D.weeks[0] ? " wk " + o.thru : " thru " + o.thru}</span>` : "";
  return p.inj ? `<span class="inj ${p.inj}">${p.inj}</span>` : "";
}
function who(p, extra){
  return `<div class="who"><div class="nm">${esc(p.n)}</div>
    <div class="meta"><span class="pos ${p.pos}">${p.pos}</span><span>${p.tm}${p.prk ? ` &middot; ${p.pos}${p.prk}` : ""}</span>${injBadge(p)}${extra || ""}</div></div>`;
}
const plyCell = p => `<div class="ply">${img(p)}${who(p)}</div>`;
function spark(p){
  if(!p.pl) return "";
  const bw = 5, gap = 2, H = 26, max = Math.max(32, ...p.pl.map(x => x || 0));
  const hot = new Set(p.pl.map((x, i) => (x != null ? i : -1)).filter(i => i >= 0).slice(-3));
  let s = "";
  p.pl.forEach((x, i) => {
    const X = i * (bw + gap);
    if(x == null) s += `<rect x="${X}" y="${H - 2}" width="${bw}" height="2" fill="#39424e"/>`;
    else { const h = Math.max(2, Math.round(x / max * H));
      s += `<rect x="${X}" y="${H - h}" width="${bw}" height="${h}" rx="1" fill="${hot.has(i) ? "#58a6ff" : "#3d5a80"}"><title>Wk ${i + 1}: ${x}</title></rect>`; }
  });
  return `<svg class="spk" width="${p.pl.length * (bw + gap) - gap}" height="${H}">${s}</svg>`;
}
function wkChip(p, i, lab){
  const w = p.wk[i], top = lab ? `<em>Wk ${w.w}</em>` : "";
  if(w.o === "BYE") return `<span class="wkc bye" style="background:#1f2732">${top}<b>BYE</b><i>&nbsp;</i></span>`;
  const out = p.eff[i] === 0 && w.p > 0;
  return `<span class="wkc${out ? " out" : ""}" style="${out ? "background:#1f2732" : rkBg(w.rk)}" title="${w.rk ? ord(w.rk) + " vs " + p.pos + " (32nd = softest)" : ""}">${top}<b>${w.o}</b><i>${out ? "OUT" : f1(p.eff[i])}</i></span>`;
}
// the rule-out control: ESPN's call, or mine
function stSel(p){
  const o = OV[p.id], cur = o ? (o.t === "H" ? "H" : "O:" + o.thru) : "";
  const auto = {"":"Active", Q:"Questionable", D:"Doubtful", O:"Out", IR:"On IR", SUS:"Suspended"}[p.inj || ""];
  const last = D.weeks[D.weeks.length - 1];
  let opts = `<option value=""${cur === "" ? " selected" : ""}>${auto}</option>`;
  if(p.inj) opts += `<option value="H"${cur === "H" ? " selected" : ""}>Healthy</option>`;
  D.weeks.forEach((w, i) => {
    const v = "O:" + w;
    opts += `<option value="${v}"${cur === v ? " selected" : ""}>${i === 0 ? "Out wk " + w : w === last ? "Out for season" : "Out thru wk " + w}</option>`;
  });
  return `<select class="st ${o ? "man" : (p.inj || "")}" data-id="${p.id}" aria-label="Status for ${esc(p.n)}">${opts}</select>`;
}
// short / set / deep at each position, by how many startable players a team holds
function needsHtml(teamId){
  return SKILL.map(pos => { const c = DEPTH[teamId][pos], n = spots(pos) || 1;
    return `<span class="need ${c < n ? "r" : c > n ? "g" : ""}" title="${c} startable for ${plural(n, "spot")}">${pos} ${c < n ? "short" : c > n ? "deep" : "set"}</span>`; }).join("");
}

/* ---- percentile shading: how a number stacks up at his position across the whole pool ----*/
function buildPct(){
  const keys = ["ppg","xfp","snap","ts","cs","ays","wopr","doc","tps","cr","ypt","yacr","opp","rzg","rz","ypc","yaco","bt","fdg"];
  for(const pos of SKILL){
    PCT[pos] = {};
    const pool = Object.values(P).filter(p => p.pos === pos && p.g >= (D.minG || 3));
    for(const k of keys) PCT[pos][k] = pool.map(p => p[k]).filter(v => v != null).sort((a,b) => a - b);
  }
}
function tint(p, k){
  const q = pq(p, k);
  return q >= 0.9 ? "background:rgba(47,129,247,.42)" : q >= 0.75 ? "background:rgba(47,129,247,.26)" : q >= 0.6 ? "background:rgba(47,129,247,.12)" : "";
}

/* ---- targets -------------------------------------------------------------------------------*/
function ownerLine(t, pos){
  const c = DEPTH[t.id][pos], n = spots(pos) || 1, ab = esc(t.abbrev || t.name);
  const wants = SKILL.filter(k => DEPTH[t.id][k] < (spots(k) || 1));
  const tail = wants.length ? ` They are short at ${wants.join(", ")}.` : "";
  if(c > n) return `<div class="sg"><i></i><span>${ab} is deep at ${pos}: ${c} startable for ${plural(n, "spot")}.${tail}</span></div>`;
  if(c === n) return `<div class="sg a"><i></i><span>${ab} has just enough at ${pos}, so they will want one back.${tail}</span></div>`;
  return `<div class="sg r"><i></i><span>${ab} is already short at ${pos}, a hard get.</span></div>`;
}

    const ownTag = t ? `<span class="own">${esc(t.abbrev || t.name)}</span>` : `<span class="tag buy">Free agent</span>`;
    const ahead = ALLW.map(i => { const w = p.wk[i], out = p.eff[i] === 0 && w.p > 0;
      return `<span class="mini" style="${w.o === "BYE" || out ? "background:#1f2732;color:#66717e" : rkBg(w.rk)}" title="Wk ${w.w}${w.rk ? " · " + ord(w.rk) + " vs " + p.pos : ""}">${out ? "OUT" : w.o}</span>`; }).join("");
    const sigs = [];

    if(buy && t) sigs.push(ownerLine(t, p.pos));
    const acts = buy

      : `<button class="b go" data-a="shop" data-id="${p.id}">Shop him</button><button class="b" data-a="build" data-id="${p.id}">Builder</button>`;
    return `<div class="tg">

  }).join("");

    snap: stat("snap", "Snap", "Share of team offensive snaps", pct, {sep:true}),

    wopr: stat("wopr", "WOPR", "Weighted opportunity: 1.5 × target share + 0.7 × air-yard share", f2, {only:notQB}),
    doc:  stat("doc", "Depth", "Air yards per catch: how far downfield he is caught", f1),
    tps:  stat("tps", "Tgt/snap", "Targets per snap on the field: how often he is the read", pct),
    cr:   stat("cr", "Catch%", "Catches per target", pct),
    ypt:  stat("ypt", "Yds/tgt", "Receiving yards per target", f1),
    yacr: stat("yacr", "YAC/rec", "Yards after the catch per reception", f1),
    opp:  stat("opp", "Opp/g", "Carries plus targets per game", f1),
    rzg:  stat("rzg", "RZ/g", "Red-zone carries plus targets per game", f1),
    rz:   stat("rz", "RZ%", "Share of team red-zone carries and targets", pct),
    td:   {k:"td", h:"TD", t:"Rushing and receiving touchdowns", v:p => (p.g != null && p.pos !== "QB" ? p.td : null), f:x => String(x)},
    xtd:  {k:"xtd", h:"xTD", t:"Touchdowns his carries and targets would normally produce", v:p => (p.g != null ? p.xtd : null), f:f1},
    ypc:  stat("ypc", "YPC", "Yards per carry", f1),
    yaco: stat("yaco", "YACo", "Yards after contact per carry", f1),
    bt:   stat("bt", "BT%", "Broken tackles per carry", pct),
    fdg:  stat("fdg", "1D/g", "First downs per game, rushing and receiving", f1),
    trend:{k:"trend", h:"Trend", t:"Last three games' xFP against the season", v:p => (p.g >= 4 ? p.tr : null),
           f:x => (x >= 1 ? "▲ " : x <= -1 ? "▼ " : "") + sgn(x), cl:x => cls(Math.abs(x) >= 1 ? x : 0)},
    up:   {k:"up", h:"Upside", t:"What his workload, touchdown luck, role trend and schedule say he should gain or lose per game", v:p => (p.sg ? p.sg.E : null), f:x => sgn(x), cl:x => cls(Math.abs(x) >= 0.8 ? x : 0)},

const isSingle = () => S.scope === "me" || !!TEAMS[S.scope];
const usageKeys = pos => pos === "RB" ? ["snap","cs","ts","opp","rzg","rz","td","xtd","ypc","yaco","bt","fdg"]
  : (pos === "WR" || pos === "TE") ? ["snap","ts","ays","wopr","tps","doc","cr","ypt","yacr","rz","td","xtd","fdg"]
  : ["snap","ts","cs","wopr","opp","rz","rzg","td","xtd","fdg"];
function colKeys(){
  const lead = [...(isSingle() ? [] : ["own"]), "st"], tail = [...(REG.length ? ["ros"] : []), ...(PO.length ? ["po"] : [])];
  if(S.cols === "overview"){
    const wk = D.weeks.length ? ["w0"] : [];
    D.weeks.forEach((w, i) => { if(w >= 15 && i !== 0) wk.push("w" + i); });
    return [...lead, "ppg", "log", "xfp", "fpoe", "snap", "trend", "up", ...wk, ...tail, "tag"];
  }
  if(S.cols === "usage") return [...lead, "ppg", "xfp", "fpoe", ...usageKeys(S.pos), "trend"];
  return [...lead, ...D.weeks.map((w, i) => "w" + i), ...tail, "fsos", ...(REG.length ? ["sos"] : []), ...(PO.length ? ["psos"] : [])];
}
function tableRows(){
  let ids;
  if(S.scope === "me") ids = TEAMS[ME].players;
  else if(S.scope === "league") ids = D.teams.flatMap(t => t.players);
  else if(S.scope === "all") ids = Object.keys(P);
  else if(S.scope === "fa") ids = Object.keys(P).filter(id => !P[id].t);
  else ids = TEAMS[S.scope].players;
  let list = ids.map(id => P[id]);
  if(!isSingle()) list = list.filter(p => SKILL.includes(p.pos));
  if(S.pos !== "ALL") list = list.filter(p => p.pos === S.pos);
  if(S.q){ const q = S.q.toLowerCase(); list = list.filter(p => (p.n + " " + p.tm + " " + ownAb(p) + " " + (p.t ? TEAMS[p.t].name : "free agent")).toLowerCase().includes(q)); }
  const c = COLS[S.sort];
  if(c){
    list.sort((a, b) => {
      const x = c.v(a), y = c.v(b);
      if(x == null && y == null) return b.adj - a.adj;
      if(x == null) return 1;
      if(y == null) return -1;
      return (c.str ? String(x).localeCompare(String(y)) * -S.dir : (y - x) * -S.dir) || b.adj - a.adj;
    });
  } else if(isSingle()) list.sort((a, b) => ORDER[a.pos] - ORDER[b.pos] || b.adj - a.adj);
  else list.sort((a, b) => b.adj - a.adj);
  return list;
}
function cellText(c, p){
  const v = c.v(p);
  return v == null || (c.only && !c.only(p)) ? null : c.f(v);
}
function renderTable(list){
  const keys = colKeys();

  $("rt").tHead.innerHTML = `<tr>${th(COLS.name, "l")}${keys.map(k => th(COLS[k])).join("")}</tr>`;
  $("rt").tBodies[0].innerHTML = list.map(p => {
    const tds = keys.map(k => {

      const txt = cellText(c, p);
      if(txt == null) return `<td class="num dimn${sep}">–</td>`;
      return `<td class="num ${c.cl ? c.cl(c.v(p)) : ""}${sep}"${c.tint ? ` style="${tint(p, k)}"` : ""}>${c.bold ? "<b>" : ""}${txt}${c.bold ? "</b>" : ""}</td>`;
    }).join("");
    return `<tr class="${!isSingle() && p.t === ME ? "me" : ""}"><td class="l">${plyCell(p)}</td>${tds}</tr>`;

function renderTiles(){
  const n = D.teams.length, out = [];
  const tile = (k, rank, word, s, s2) => `<div class="tile ${rank <= 4 ? "g" : rank >= 9 ? "r" : ""}">
    <div class="k"><span>${k}</span>${word ? `<em>${rank <= 4 ? "Strength" : rank >= 9 ? "Need" : "Solid"}</em>` : ""}</div>
    <div class="v">${ord(rank)}<small>of ${n}</small></div>
    <div class="strip">${Array.from({length:n}, (_, i) => `<i${i + 1 === rank ? ' class="me"' : ""}></i>`).join("")}</div>
    <div class="s">${s}</div><div class="s2">${s2}</div></div>`;
  // the lineup as it stands today, no waiver help
  const all = D.teams.map(t => ({id:t.id, w:worth(t.players, false)}));
  const place = key => all.slice().sort((a,b) => b.w[key] - a.w[key]).findIndex(x => x.id === ME) + 1;
  const mine = all.find(x => x.id === ME).w;
  if(REG.length) out.push(tile("Lineup · wk " + wkSpan(REG), place("reg"), false, `<b>${f1(mine.reg / REG.length)}</b> pts a week`, "regular season"));
  if(PO.length) out.push(tile("Lineup · wk " + wkSpan(PO), place("po"), false, `<b>${f1(mine.po / PO.length)}</b> pts a week`, "playoffs"));
  for(const pos of SKILL){
    const k = spots(pos) || 1, c = DEPTH[ME][pos];
    const top = TEAMS[ME].players.map(id => P[id]).filter(p => p.pos === pos).sort((a,b) => b.adj - a.adj);
    out.push(tile(pos, BASE[ME][pos], true, top.slice(0, k).map(p => `${esc(short(p))} <b>${f1(p.adj)}</b>`).join(" · ") || "nobody",
      `${c} startable for ${plural(k, "spot")}` + (top[k] ? ` · next ${esc(short(top[k]))} ${f1(top[k].adj)}` : "")));
  }
  $("tiles").innerHTML = out.join("");
}

/* ---- judging a trade ---------------------------------------------------------------------
   A deal is read from both rosters, not from two price tags:
   1. Holes. If it leaves either team with fewer startable players at a position than it has
      spots to fill, and it had them before, that side says no. A team with two backs does not
      give one up unless one comes back.
   2. What it is worth TO THEM. A player's value is cut when he would not start for the team
      getting him: full if he starts, 80% if he is their flex, 45% if he would sit. A third
      good back is not worth to them what he is worth on the open market. Their own bench is
      easier for them to part with than their starters.
   3. Their lineup has to come out ahead too, against the waiver-wire alternative.
   `quick` is the package search: bail at the first failed test. */
const USE = {S:1, F:0.8, B:0.45}, KEEP = {S:1, F:0.9, B:0.75};
function judge(t, mg, tg, quick){
  const dm = Object.assign({}, DEPTH[ME]), dt = Object.assign({}, DEPTH[t.id]);
  for(const id of mg){ const p = P[id]; if(p.ok){ dm[p.pos]--; dt[p.pos]++; } }
  for(const id of tg){ const p = P[id]; if(p.ok){ dt[p.pos]--; dm[p.pos]++; } }
  const holes = (after, before) => SKILL.filter(pos => after[pos] < before[pos] && after[pos] < spots(pos));
  const holesThem = holes(dt, DEPTH[t.id]), holesMe = holes(dm, DEPTH[ME]);
  if(quick && (holesThem.length || holesMe.length)) return null;
  const giveV = mg.reduce((s,id) => s + val(P[id]), 0), getV = tg.reduce((s,id) => s + val(P[id]), 0);
  if(quick && (giveV < 0.7 * getV || giveV > 1.7 * getV)) return null;       // nowhere near, either way
  const G = new Set(mg), R = new Set(tg), mine = TEAMS[ME].players;
  const mineAfter = swap(mine, G, R);
  const me = delta(W0[ME], worth(mineAfter));
  if(quick && me.score < 3) return null;
  const theirsAfter = swap(t.players, R, G);
  const them = delta(W0[t.id], worth(theirsAfter));
  const ra = rolesOf(theirsAfter), rm = rolesOf(mineAfter);
  const inV = mg.reduce((s,id) => s + val(P[id]) * (USE[ra[id]] || 0.45), 0);
  const outV = tg.reduce((s,id) => s + val(P[id]) * (KEEP[ROLE0[id]] || 0.75), 0);
  const ratio = outV ? inV / outV : 9;
  let will = "no";
  if(!holesThem.length){
    if(ratio >= 1.08 && them.score >= 1 && them.reg >= -0.5 && them.po >= -0.5) will = "likely";
    else if(ratio >= 0.88 && them.score >= 0 && them.reg >= -0.75 && them.po >= -0.75) will = "maybe";
  }
  if(quick && will === "no") return null;
  return {team:t.id, give:mg, get:tg, me, them, holesThem, holesMe, dm, dt, inV, outV, ratio, will, ra, rm, mineAfter, theirsAfter,
          rank:me.score * (will === "likely" ? 1 : 0.8)};
}
function sets(ids){
  const out = ids.map(a => [a]);
  for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++) out.push([ids[i], ids[j]]);
  return out;
}
// every 1-for-1 up to 2-for-2 with every team; `only` narrows it to deals that bring one player back
function findPackages(only){
  const tradeable = t => t.players.filter(id => SKILL.includes(P[id].pos) && P[id].base >= 5);
  const mySets = sets(tradeable(TEAMS[ME])), found = [];
  for(const t of D.teams){
    if(t.id === ME || (only && P[only].t !== t.id)) continue;
    let theirs = sets(tradeable(t));
    if(only) theirs = theirs.filter(s => s.includes(only));
    const best = [];
    for(const tg of theirs) for(const mg of mySets){ const j = judge(t, mg, tg, true); if(j) best.push(j); }
    best.sort((a,b) => b.rank - a.rank);
    // up to eight a team, and no headline player more than twice
    const seen = {}; let n = 0;
    for(const b of best){
      const head = b.get.slice().sort((x,y) => val(P[y]) - val(P[x]))[0];
      if(!only && (seen[head] = (seen[head] || 0) + 1) > 2) continue;
      found.push(b);
      if(++n === (only ? 12 : 8)) break;
    }
  }
  return found;
}
function pkChips(pk){
  const t = TEAMS[pk.team], ab = t.abbrev || "They", out = [], seen = new Set();
  const add = (txt, k) => { if(!seen.has(txt)){ seen.add(txt); out.push([txt, k]); } };
  for(const id of pk.give){ const p = P[id];
    if(p.ok && DEPTH[t.id][p.pos] < spots(p.pos)) add(`Fills ${ab}'s ${p.pos} hole`, "g");
    else if(pk.ra[id] === "S") add(`${short(p)} starts for ${ab}`, "g");
  }
  for(const id of pk.get){ const pos = P[id].pos; if(DEPTH[t.id][pos] > spots(pos)) add(`${ab} deep at ${pos}`, "g"); }
  for(const id of pk.get){ const p = P[id], l = p.sg && p.sg.E >= 0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, "b"); }
  for(const id of pk.give){ const p = P[id], l = p.sg && p.sg.E <= -0.8 ? tagLine(p) : ""; if(l) add(`${short(p)}: ${l}`, ""); }
  return out.slice(0, 5);
}

function renderDeal(partner){
  const chip = (id, set) => { const p = P[id]; return `<button class="dchip" data-id="${id}" data-set="${set}"><span class="nm" title="${esc(p.n)}">${esc(initial(p))}</span><span class="pos ${p.pos}">${p.pos}</span><span class="x">×</span></button>`; };
  const names = set => [...set].map(id => short(P[id])).join(", ");
  const ab = esc(partner.abbrev || "They");
  let full = `<div class="dsides">
    <div class="dside"><div class="lab">I give</div><div class="dchips">${[...give].map(id => chip(id, "give")).join("")}</div></div>
    <div class="dside"><div class="lab">I get</div><div class="dchips">${[...get].map(id => chip(id, "get")).join("")}</div></div></div>`;
  let sumWho = give.size || get.size ? `${esc(names(give)) || "…"} ⇄ ${esc(names(get)) || "…"}` : "No players picked", sumV = "Pick players on both sides";
  if(!give.size || !get.size) full += `<div class="dempty">Pick players on both sides</div>`;
  else {
    const j = judge(partner, [...give], [...get], false);
    let call, color;
    if(j.me.score >= 3 && j.will === "likely"){ call = "Send it"; color = "var(--good)"; }
    else if(j.me.score >= 3 && j.will === "maybe"){ call = "Worth asking"; color = "var(--warn)"; }
    else if(j.me.score >= 3){ call = "Good for me, they say no"; color = "var(--warn)"; }
    else if(j.me.score > -3){ call = "A wash"; color = "var(--dim)"; }
    else { call = "Pass"; color = "var(--bad)"; }
    // why: each roster after the deal
    const fl = [], line = (k, t) => fl.push(`<div class="sg ${k}"><i></i><span>${t}</span></div>`);
    for(const pos of j.holesThem) line("r", `Leaves ${ab} short at ${pos}: ${j.dt[pos]} startable for ${plural(spots(pos), "spot")}`);
    for(const pos of j.holesMe) line("r", `Leaves me short at ${pos}: ${j.dm[pos]} startable for ${plural(spots(pos), "spot")}`);
    for(const id of give){ const p = P[id], r = j.ra[id];
      if(p.ok && DEPTH[partner.id][p.pos] < spots(p.pos)) line("", `${esc(short(p))} fills a hole for ${ab} at ${p.pos}`);
      else if(r === "S") line("", `${esc(short(p))} starts for ${ab}`);
      else if(r === "F") line("a", `${esc(short(p))} would be ${ab}'s flex`);
      else line("r", `${esc(short(p))} would sit on ${ab}'s bench, they don't need him`); }
    for(const id of get){ const p = P[id], r = j.rm[id];
      line(r === "S" ? "" : "a", `${esc(short(p))} ${r === "S" ? "starts for me" : r === "F" ? "would be my flex" : "would sit on my bench"}`); }
    const after = posRanks({[ME]:j.mineAfter, [partner.id]:j.theirsAfter});
    const card = (name, d) => `<div class="dcard"><div class="lab" title="${esc(name)}">${esc(name)}</div>
      ${REG.length ? `<div class="dnum"><b class="${cls(d.reg)}">${sgn(d.reg)}</b><span>wk ${wkSpan(REG)}</span></div>` : ""}
      ${PO.length ? `<div class="dnum"><b class="${cls(d.po)}">${sgn(d.po)}</b><span>wk ${wkSpan(PO)}</span></div>` : ""}</div>`;
    const ranks = id => SKILL.map(pos => { const a = BASE[id][pos], b = after[id][pos];
      return `<span class="rk">${pos} ${ord(a)}${a !== b ? `<i>→</i><span class="${b < a ? "pos-n" : "neg-n"}">${ord(b)}</span>` : ""}</span>`; }).join("");
    full += `<div class="call" style="color:${color}">${call}</div>
      <div class="lab">How the rosters fit</div><div class="sig">${fl.join("")}</div>
      <div class="lab">Lineup points a week</div>
      <div class="dgrid">${card("Mine", j.me)}${card(partner.name, j.them)}</div>
      <div class="lab" style="margin-top:14px">My position ranks</div><div class="ranks">${ranks(ME)}</div>
      <div class="lab">${ab} position ranks</div><div class="ranks">${ranks(partner.id)}</div>
      <div class="lab">What it is worth to ${ab}</div>
      <div class="vbar"><i style="width:${(j.inV / ((j.inV + j.outV) || 1) * 100).toFixed(0)}%"></i></div>
      <div class="vlab"><span>they get <b>${f1(j.inV)}</b></span><span>they give <b>${f1(j.outV)}</b></span></div>`;
    sumV = `<b style="color:${color}">${call}</b>${REG.length ? `<span class="${cls(j.me.reg)}">${sgn(j.me.reg)}</span>` : ""}${PO.length ? `<span class="${cls(j.me.po)}">${sgn(j.me.po)} PO</span>` : ""}`;
  }
  if(give.size || get.size) full += `<div class="dfoot"><button class="b" id="clear">Clear</button></div>`;
  $("deal").classList.toggle("open", S.dealOpen);
  $("deal").innerHTML = `<button class="dsum" id="dsum"><div class="mid"><div class="who">${sumWho}</div><div class="v">${sumV}</div></div><span class="tog">${S.dealOpen ? "Hide" : "Details"}</span></button>
    <div class="dfull">${full}</div>`;
}

  };
  $("cards").onclick = e => {
    if(e.target.closest("#morecards")){ S.limit += 40; renderRoster(); return; }
    const b = e.target.closest("button[data-more]"); if(!b) return;
    const id = b.dataset.more, card = b.closest(".pc");
    OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
    card.classList.toggle("open", OPEN.has(id)); b.textContent = OPEN.has(id) ? "Less" : "More stats";
  };
  $("ovclr").onclick = () => { OV = {}; saveOV(); renderAll(); };
  MQ.addEventListener("change", () => { renderRoster(); });
  // packages
  $("pkFor").onclick = () => { S.pkFor = null; renderPackages(); };
  $("pkTeam").onchange = e => { S.pkTeam = e.target.value; renderPackages(); };
  $("pkPos").onchange = e => { S.pkPos = e.target.value; renderPackages(); };
  $("pkSort").onchange = e => { S.pkSort = e.target.value; renderPackages(); };
  $("pkQ").oninput = e => { S.pkQ = e.target.value.trim(); renderPackages(); };
  $("pks").onclick = e => {
    const c = e.target.closest(".pk"); if(!c) return;
    const pk = (S.pkFor && P[S.pkFor] ? FORPK : ALLPK)[+c.dataset.i];
    openBuilder(pk.team, pk.give, pk.get);
  };
  // builder
  $("partner").onchange = () => { get.clear(); $("theirs").scrollTop = 0; renderBuilder(); };
  const toggle = set => e => {
    const r = e.target.closest(".row"); if(!r) return;
    const id = r.dataset.id; set.has(id) ? set.delete(id) : set.add(id); renderBuilder();
  };
  $("mine").onclick = toggle(give); $("theirs").onclick = toggle(get);
  $("deal").onclick = e => {
    if(e.target.closest("#dsum")){ S.dealOpen = !S.dealOpen; renderBuilder(); return; }
    if(e.target.closest("#clear")){ give.clear(); get.clear(); S.dealOpen = false; renderBuilder(); return; }
    const c = e.target.closest(".dchip"); if(!c) return;
    (c.dataset.set === "give" ? give : get).delete(c.dataset.id); renderBuilder();
  };
  $("bseg").onclick = e => { const b = e.target.closest("button"); if(b) setSide(b.dataset.s); };
}

fetch("/api/trade", {cache:"no-cache"}).then(r => r.json()).then(d => {
  if(d.error) throw new Error(d.error);
  boot(d);
}).catch(e => { $("msg").textContent = "Couldn't load league data (" + e.message + ")"; console.warn(e); });
</script></body></html>
